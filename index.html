<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronos CDM 2026</title>
<style>
:root{--bg:#edf5ff;--bg2:#dbeaff;--card:#fff;--text:#102033;--muted:#5d7088;--line:#d7e4f4;--soft:#f7fbff;--green:#14c47d;--green2:#0a9d65;--gold:#c8860a;--gold2:#f5c842;--shadow:0 14px 36px rgba(30,62,100,.12);--radius:20px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,system-ui,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}
header,main{max-width:1200px;margin:auto;padding:16px}
main{padding-top:0;padding-bottom:40px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:1.3fr .9fr;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"⚽";position:absolute;right:20px;bottom:-26px;font-size:110px;opacity:.07;transform:rotate(-12deg)}
h1{margin:4px 0 6px;font-size:clamp(24px,4vw,46px);letter-spacing:-.8px}
h2{margin:0 0 12px;font-size:18px;font-weight:700}
p{line-height:1.5;color:var(--muted);margin:4px 0}
.muted{color:var(--muted)}
.tabs{position:sticky;top:0;z-index:10;background:rgba(237,245,255,.95);backdrop-filter:blur(10px);padding:8px 0;margin:10px 0 16px;display:flex;gap:6px;flex-wrap:wrap}
button,.file-label{border:1px solid #c9d9ea;background:white;color:#17304d;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(30,62,100,.07);transition:.15s}
button:hover,.file-label:hover{background:#f5faff;transform:translateY(-1px)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tab.active,.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#06160f;border-color:transparent}
.danger{background:#fff0f3;color:#a91537;border-color:#ffd1db}
.small{font-size:12px;padding:5px 11px}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat strong{font-size:26px;display:block}.stat span{color:var(--muted);font-size:12px}
input,select{width:100%;padding:9px 11px;border:1px solid #cddced;border-radius:12px;background:var(--soft);color:var(--text);font-size:13px;font-family:inherit}
input[type=checkbox]{width:auto;accent-color:var(--green)}
input[type=number]{-moz-appearance:textfield}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;border-bottom:1px solid #e1ebf7;text-align:left;vertical-align:middle}
th{background:#edf5ff;color:#314761;font-size:12px;font-weight:700}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fbff}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;background:#e9f4ff;color:#25547e;font-size:11px;font-weight:700;margin:2px;white-space:nowrap}
.paid{background:#e8fff5;color:#08784e}.warn{background:#fff5d9;color:#875700}.info{background:#edf5ff;color:#315a88}
.empty{padding:18px;border:1px dashed #c8d8eb;border-radius:14px;text-align:center;color:#61748b;background:#f8fbff;font-size:13px}
.match{background:#f8fbff;border:1px solid var(--line);border-radius:14px;padding:11px;transition:background .2s,border-color .2s}
.match.validated{background:linear-gradient(135deg,#edfff6,#d0ffe8);border-color:#7ee8b2}
.team{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.team img{width:22px;height:16px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1);flex-shrink:0}
.flag-code{font-size:10px;font-weight:800;color:#52677f;background:white;border:1px solid #bfd1e5;border-radius:999px;padding:2px 5px}
.matches-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.match-row{display:flex;align-items:center;gap:6px;margin-top:7px}
.match-row .team{flex:1;min-width:0;overflow:hidden}
.score-box{display:flex;align-items:center;gap:4px;flex-shrink:0}
.score-sm{width:40px;padding:6px 4px;text-align:center;border:1px solid #cddced;border-radius:9px;background:#fff;color:var(--text);font-size:16px;font-weight:800;font-family:inherit;-moz-appearance:textfield}
.score-box span{color:var(--muted);font-weight:800;font-size:13px}
.pred{display:grid;grid-template-columns:minmax(120px,1fr) 52px 52px auto;gap:6px;align-items:center;background:white;border:1px solid var(--line);border-radius:11px;padding:7px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);background:#102033;color:white;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;z-index:999;font-size:13px;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.player-banner{background:linear-gradient(135deg,var(--green),var(--green2));color:#06160f;border-radius:var(--radius);padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.player-banner strong{font-size:16px}
.link-box{background:#f0fff8;border:1px solid #a8e6c8;border-radius:10px;padding:7px 11px;margin-top:5px;font-size:11px;word-break:break-all;color:#0a6640}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.phase-selector{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.phase-selector label{margin:0;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.phase-selector select{width:auto;min-width:180px;flex:1}
.check-card{display:inline-flex;align-items:center;gap:5px;margin:3px;padding:6px 9px;background:var(--soft);border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:12px}

.groups-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.group-table{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.group-table-header{background:linear-gradient(135deg,#edf5ff,#dbeaff);padding:7px 12px;font-size:12px;font-weight:800;color:#314761;display:flex;align-items:center;justify-content:space-between}
.group-table-header .gc{font-size:11px;color:var(--muted)}
.group-row{display:flex;align-items:center;gap:5px;padding:5px 10px;border-top:1px solid #f0f6ff;font-size:12px;transition:background .15s}
.group-row:hover{background:#f8fbff}
.group-row.qualified{background:linear-gradient(90deg,#edfff6,transparent)}
.group-row.third{background:linear-gradient(90deg,#fff9e6,transparent)}
.group-row .gr{width:14px;text-align:center;font-weight:800;color:var(--muted);font-size:11px}
.group-row .gn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.group-row .gp{width:18px;text-align:center;font-weight:800;font-size:13px}
.group-row .gs{font-size:11px;color:var(--muted);width:32px;text-align:right}
.group-row img{width:18px;height:13px;object-fit:cover;border-radius:2px}
@media(max-width:900px){.groups-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.groups-grid{grid-template-columns:repeat(2,1fr)}}
/* BRACKET */
.bracket-wrap{margin-bottom:16px}
.bracket-finals{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px}
.bracket-finale-box{background:linear-gradient(135deg,#fffbe6,#fff3c0);border:2px solid var(--gold2);border-radius:16px;padding:12px 20px;min-width:220px;text-align:center;box-shadow:0 4px 20px rgba(200,134,10,.22)}
.bracket-finale-title{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.5px;margin-bottom:8px}
.bracket-finale-ornament{font-size:22px;display:block;margin-bottom:4px}
.bracket-third-box{background:linear-gradient(135deg,#f4f4f4,#e8e8e8);border:2px solid #b0b0b0;border-radius:14px;padding:10px 18px;min-width:200px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.bracket-third-title{font-size:11px;font-weight:800;color:#707070;letter-spacing:.5px;margin-bottom:6px}
.bracket-scroll{overflow-x:auto;padding:8px 0}
.bracket{display:flex;gap:2px;min-width:820px}
.bcol{display:flex;flex-direction:column;flex:1;min-width:100px}
.bcol-label{text-align:center;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:4px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:3px}
.bcol.sf-col{min-width:110px}
.bmatches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:3px;padding:3px 2px}
.bmatches.sf-matches{justify-content:center;gap:8px}
.bmatch{background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bteam{display:flex;align-items:center;gap:4px;padding:4px 6px;font-size:11px;font-weight:600;border-bottom:1px solid #f0f6ff;min-height:25px;transition:background .2s}
.bteam:last-child{border-bottom:none}
.bteam img{width:18px;height:13px;object-fit:cover;border-radius:2px;flex-shrink:0}
.bteam .fp{width:18px;height:13px;background:#e8eef7;border-radius:2px;flex-shrink:0}
.bteam .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bteam.winner{background:linear-gradient(90deg,#fffbe6,#fff7cc);border-left:3px solid var(--gold2)}
.bteam.winner .tn{color:var(--gold)}
.bteam.silver{background:linear-gradient(90deg,#f4f4f4,#ececec);border-left:3px solid #b0b0b0}
.bteam.silver .tn{color:#555}
.bteam.loser{opacity:.35}
.bteam.tbd .tn{color:#aab8c9;font-style:italic;font-size:10px}

@media(max-width:820px){
  header,main{padding:10px}
  .hero,.grid,.filters,.stats{grid-template-columns:1fr}
  .matches-grid{grid-template-columns:1fr}
  .pred{grid-template-columns:1fr 1fr}.pred button{grid-column:1/-1}
  table{font-size:12px}th,td{padding:7px}
}
</style>
</head>

// ═══════════════════════════════════════════
const SB_URL='https://mwmvwayvtghmrzcretev.supabase.co';

const SB_ROW_ID=1; // On stocke tout dans une seule ligne

// ── Supabase helpers ──────────────────────────────────────
async function sbGet(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/gamestate?id=eq.${SB_ROW_ID}&select=data`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    const rows=await r.json();
    if(rows&&rows[0]&&rows[0].data)return JSON.parse(rows[0].data);
  }catch(e){console.warn('sbGet error',e)}
  return null;
}
async function sbSet(state){
  try{
    // Upsert : crée ou met à jour la ligne id=1
    await fetch(`${SB_URL}/rest/v1/gamestate`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
        'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({id:SB_ROW_ID,data:JSON.stringify(state)})
    });
  }catch(e){console.warn('sbSet error',e)}
  // Toujours sauvegarder localement aussi (fallback)
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
// Polling toutes les 5 secondes pour sync temps réel
let _pollTimer=null;
function startPolling(app,onUpdate){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(async()=>{
    const remote=await sbGet();
    if(!remote)return;
    const localStr=JSON.stringify(app.state);
    const remoteStr=JSON.stringify(remote);
    if(localStr!==remoteStr){
      app.state=normalize(remote);
      onUpdate(app.state);
    }
  },5000);
}

function createToken(pid){
  const raw=`${pid}:${Math.random().toString(36).slice(2,10)}`;
  return btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
function validateToken(token){
  try{const[pid]=decodeURIComponent(escape(atob(token.replace(/-/g,'+').replace(/_/g,'/')))).split(':');return pid||null}catch{return null}
}
const buildUrl=token=>location.href.split('?')[0].split('#')[0]+'?p='+token;
const getToken=()=>new URLSearchParams(location.search).get('p')||null;
async function copyText(text){
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}}catch{}
  try{const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;top:-9999px';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');document.body.removeChild(t);return ok}catch{return false}
}

function seedMatches(){
  return MATCH_SEED.map(([date,time,group,a,b])=>({id:mid(date,group,a,b),date,time,wcGroup:group,teamA:a,teamB:b,scoreA:null,scoreB:null,preloaded:true}));
}
function blankState(){return{groups:clone(GROUPS_SEED),players:[],matches:seedMatches(),predictions:{},knockout:{},tokens:{}}}
function normalize(raw){
  const d=(raw&&typeof raw==='object')?raw:{};
  let groups=Array.isArray(d.groups)?d.groups:[];
  if(!groups.some(g=>g.id==='colleagues'))groups.unshift(clone(GROUPS_SEED[0]));
  if(!groups.some(g=>g.id==='family'))groups.push(clone(GROUPS_SEED[1]));
  const players=(Array.isArray(d.players)?d.players:[]).map(p=>({id:String(p.id||uid()),name:String(p.name||'?'),groupIds:Array.isArray(p.groupIds)?p.groupIds:['colleagues']}));
  let matches=Array.isArray(d.matches)&&d.matches.length?d.matches:seedMatches();
  matches=matches.map(m=>({...m,teamA:normalizeTeam(m.teamA),teamB:normalizeTeam(m.teamB)}));
  groups=groups.map(g=>({id:g.id,name:g.name,paid:!!g.paid}));
  return{groups,players,matches,predictions:d.predictions||{},knockout:d.knockout||{},payments:d.payments||{},tokens:d.tokens||{}};
}
async function loadState(){
  // Essayer Supabase d'abord
  const remote=await sbGet();
  if(remote)return normalize(remote);
  // Fallback localStorage
  for(const k of[STORAGE_KEY,'cdm2026v4','cdm2026v3']){try{const r=JSON.parse(localStorage.getItem(k));if(r)return normalize(r)}catch{}}
  return blankState();
}
function saveState(st){
  // Sauvegarde locale immédiate
  localStorage.setItem(STORAGE_KEY,JSON.stringify(st));
  // Sauvegarde Supabase en arrière-plan (non bloquante)
  sbSet(st).catch(e=>console.warn('sync error',e));
}
async function factoryReset(){
  [STORAGE_KEY,'cdm2026v4','cdm2026v3'].forEach(k=>localStorage.removeItem(k));
  const f=blankState();
  saveState(f);
  return f;
}
function reloadSchedule(state){
  const old=Object.fromEntries(state.matches.map(m=>[m.id,m]));
  const base=seedMatches().map(m=>old[m.id]?{...m,scoreA:old[m.id].scoreA,scoreB:old[m.id].scoreB}:m);
  return[...base,...state.matches.filter(m=>!m.preloaded)];
}

// ═══════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════
const outcome=(a,b)=>a>b?'A':a<b?'B':'N';
function calcPoints(match,prono){
  if(!prono||prono.scoreA==null||prono.scoreB==null)return null;
  if(match.scoreA===null||match.scoreB===null)return null;
  const isKo=!!(match.isKo||match.knockout);

  // Poule : score exact = 3pts, bon résultat = 1pt
  if(!isKo){
    const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
    const mA=Number(match.scoreA),mB=Number(match.scoreB);
    if(pA===mA&&pB===mB)return 3;
    return outcome(pA,pB)===outcome(mA,mB)?1:0;
  }

  // KO — règles:
  // 3pts = score 90min EXACT (le joueur a trouvé le bon score à 90min)
  // 1pt  = bon vainqueur final (même si score pas exact)
  //        Pour un nul pronostiqué (ex: 1-1), si le match va aux tab
  //        et que le joueur a aussi pronostiqué les tab -> 1pt
  // 0pt  = mauvais vainqueur
  const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
  const mA90=Number(match.scoreA),mB90=Number(match.scoreB);
  const score90Exact=pA===mA90&&pB===mB90;

  // Vainqueur final : basé sur ET si dispo, sinon 90min, puis tab
  const mAET=match.scoreAET!=null?Number(match.scoreAET):null;
  const mBET=match.scoreBET!=null?Number(match.scoreBET):null;
  const mPenA=match.penA!=null?Number(match.penA):null;
  const mPenB=match.penB!=null?Number(match.penB):null;
  let finalA=mA90,finalB=mB90;
  if(mAET!==null&&mBET!==null){finalA=mAET;finalB=mBET;}
  const finalWinner=finalA>finalB?'A':finalB>finalA?'B':
    (mPenA!==null&&mPenB!==null?(mPenA>mPenB?'A':'B'):'N');

  // Score exact à 90min = 3pts (on récompense la prédiction du score 90min)
  if(score90Exact)return 3;

  // Pas exact mais bon vainqueur ?
  // Si le joueur pronostique un nul à 90min (ex: 1-1) et que le match
  // se décide aux tab -> on considère qu'il a prévu la bonne issue = 1pt
  const pronoWinner=outcome(pA,pB);
  if(pronoWinner===finalWinner)return 1;
  // Cas nul pronostiqué + match décidé aux tab -> pronoWinner='N', finalWinner='A' ou 'B'
  // On donne 1pt si le joueur a pronostiqué nul et le match est allé aux tab
  if(pronoWinner==='N'&&(mPenA!==null||mAET!==null))return 1;
  return 0;
}
function buildRanking(state,gid,allM){
  const players=gid==='all'?state.players:state.players.filter(p=>p.groupIds.includes(gid));
  return players.map(p=>{
    let pts=0,exact=0,good=0,played=0;
    allM.forEach(m=>{const v=calcPoints(m,state.predictions[m.id]?.[p.id]);if(v!==null){pts+=v;played++;if(v===3)exact++;if(v===1)good++;}});
    return{...p,pts,exact,good,played};
  }).sort((a,b)=>b.pts-a.pts||b.exact-a.exact||a.name.localeCompare(b.name));
}
const groupBadges=(p,groups)=>p.groupIds.map(gid=>{const g=groups.find(x=>x.id===gid);return g?`<span class="badge paid">${esc(g.name)}${g.paid?' 💰':''}</span>`:''}).join('');

// ═══════════════════════════════════════════
// KNOCKOUT ENGINE
// ═══════════════════════════════════════════
function groupStandings(matches,group){
  const ms=matches.filter(m=>m.preloaded&&m.wcGroup===group);
  const ts=new Set();ms.forEach(m=>{ts.add(m.teamA);ts.add(m.teamB)});
  const rows={};ts.forEach(t=>{rows[t]={team:t,group,played:0,points:0,gf:0,ga:0}});
  let done=0;
  ms.forEach(m=>{
    if(m.scoreA===null||m.scoreB===null)return;done++;
    const a=rows[m.teamA],b=rows[m.teamB];
    if(!a||!b)return;
    a.played++;b.played++;a.gf+=m.scoreA;a.ga+=m.scoreB;b.gf+=m.scoreB;b.ga+=m.scoreA;
    if(m.scoreA>m.scoreB)a.points+=3;else if(m.scoreA<m.scoreB)b.points+=3;else{a.points++;b.points++;}
  });
  const table=Object.values(rows).map(r=>({...r,gd:r.gf-r.ga}));
  table.sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||teamName(a.team).localeCompare(teamName(b.team)));
  return{group,complete:done>0&&done===ms.length,done,total:ms.length,table};
}
function getBest8(standings){
  return standings.filter(s=>s.table.length>=3)
    .map(s=>({...s.table[2],group:s.group}))
    .sort((a,b)=>b.points-a.points||(b.gd-a.gd)||(b.gf-a.gf)||a.group.localeCompare(b.group))
    .slice(0,8);
}
function resolveSlots(r32defs,groupMap,best8){
  // Collecter tous les slots "3e place"
  const thirdSlots=[];
  r32defs.forEach((d,i)=>{
    if(d[1].startsWith('3'))thirdSlots.push({i,slot:d[1]});
    if(d[2].startsWith('3'))thirdSlots.push({i,slot:d[2]});
  });

  // Backtracking : trier par nb de candidats (plus contraint d'abord)
  const countCand=(slot)=>best8.filter(t=>slot.slice(1).includes(t.group)).length;
  const sorted=[...thirdSlots].sort((a,b)=>countCand(a.slot)-countCand(b.slot));

  const assigned={};
  function bt(idx,usedGroups){
    if(idx===sorted.length)return true;
    const{i,slot}=sorted[idx];
    const allowed=slot.slice(1).split('');
    for(const t of best8){
      if(allowed.includes(t.group)&&!usedGroups.has(t.group)){
        assigned[`${i}-${slot}`]=t.team;
        usedGroups.add(t.group);
        if(bt(idx+1,usedGroups))return true;
        delete assigned[`${i}-${slot}`];
        usedGroups.delete(t.group);
      }
    }
    return false;
  }
  bt(0,new Set());

  return(slot,idx)=>{
    if(!slot)return null;
    if(slot.length===2)return groupMap[slot]||null;
    return assigned[`${idx}-${slot}`]||null;
  };
}

const koResult=(ko,stage,idx)=>ko[`${stage}-${idx}`]||{scoreA:null,scoreB:null,scoreAET:null,scoreBET:null,penA:null,penB:null};
// scoreA/scoreB = score à 90min
// scoreAET/scoreBET = score après prolongations (si match nul à 90)
// penA/penB = tirs au but (si match nul après prolongations)
function koFinalScore(r){
  // Retourne le score "final" pour déterminer le vainqueur
  if(r.scoreAET!==null&&r.scoreBET!==null)return{a:r.scoreAET,b:r.scoreBET};
  return{a:r.scoreA,b:r.scoreB};
}
function winner(tA,tB,stage,idx,ko){
  if(!tA||!tB)return null;
  const r=koResult(ko,stage,idx);
  if(r.scoreA===null||r.scoreB===null)return null;
  const fs=koFinalScore(r);
  if(fs.a>fs.b)return tA;
  if(fs.b>fs.a)return tB;
  // Egalité après prolongations -> tirs au but
  if(r.penA!==null&&r.penB!==null&&r.penA!==r.penB)return r.penA>r.penB?tA:tB;
  return null;
}
function matchWinnerTeam(m,ko){return winner(m.teamA,m.teamB,m.stage,m.index,ko);}
function buildKO(state){
  const letters='ABCDEFGHIJKL'.split('');
  const standings=letters.map(g=>groupStandings(state.matches,g));
  const allComplete=standings.every(s=>s.complete&&s.total>0);
  const groupMap={};
  standings.forEach(s=>{if(s.table[0])groupMap['1'+s.group]=s.table[0].team;if(s.table[1])groupMap['2'+s.group]=s.table[1].team;});
  const best8=getBest8(standings);
  const resolve=resolveSlots(R32_DEFS,groupMap,best8);
  const r32=R32_DEFS.map(([matchNo,slotA,slotB,date],i)=>({stage:'r32',index:i,matchNo,date,slotA,slotB,teamA:resolve(slotA,i)||null,teamB:resolve(slotB,i)||null,scoreA:koResult(state.knockout,'r32',i).scoreA,scoreB:koResult(state.knockout,'r32',i).scoreB}));
  const r16=R16_PAIRS.map(([x,y],i)=>({stage:'r16',index:i,matchNo:89+i,teamA:winner(r32[x].teamA,r32[x].teamB,'r32',x,state.knockout),teamB:winner(r32[y].teamA,r32[y].teamB,'r32',y,state.knockout),slotA:`W.M${r32[x].matchNo||73+x}`,slotB:`W.M${r32[y].matchNo||73+y}`,...koResult(state.knockout,'r16',i)}));
  const qf=QF_PAIRS.map(([x,y],i)=>({stage:'qf',index:i,matchNo:97+i,teamA:winner(r16[x].teamA,r16[x].teamB,'r16',x,state.knockout),teamB:winner(r16[y].teamA,r16[y].teamB,'r16',y,state.knockout),slotA:`V.16e-${x+1}`,slotB:`V.16e-${y+1}`,...koResult(state.knockout,'qf',i)}));
  const sf=[0,1].map(i=>({stage:'sf',index:i,matchNo:101+i,teamA:winner(qf[i*2].teamA,qf[i*2].teamB,'qf',i*2,state.knockout),teamB:winner(qf[i*2+1].teamA,qf[i*2+1].teamB,'qf',i*2+1,state.knockout),...koResult(state.knockout,'sf',i)}));
  // Loser helper
  function loser(tA,tB,stage,idx){
    const w=winner(tA,tB,stage,idx,state.knockout);
    if(!w||(!tA&&!tB))return null;
    return w===tA?tB:tA;
  }
  const thirdTeamA=loser(sf[0].teamA,sf[0].teamB,'sf',0);
  const thirdTeamB=loser(sf[1].teamA,sf[1].teamB,'sf',1);
  const third=[{stage:'third',index:0,matchNo:103,teamA:thirdTeamA,teamB:thirdTeamB,...koResult(state.knockout,'third',0)}];
  const finale=[{stage:'final',index:0,matchNo:104,teamA:winner(sf[0].teamA,sf[0].teamB,'sf',0,state.knockout),teamB:winner(sf[1].teamA,sf[1].teamB,'sf',1,state.knockout),...koResult(state.knockout,'final',0)}];
  return{allComplete,standings,best8,rounds:[r32,r16,qf,sf,third,finale]};
}
function allKoMatches(state){
  const built=buildKO(state);
  if(!built.allComplete)return[];
  const labels=KO_STAGES.map(s=>s[1]);
  return built.rounds.flatMap((round,si)=>round.filter(m=>m.teamA&&m.teamB).map(m=>{
    const r=koResult(state.knockout,m.stage,m.index);
    return{id:`ko-${m.stage}-${m.index}`,date:m.date||'',wcGroup:labels[si],phase:m.stage,teamA:m.teamA,teamB:m.teamB,scoreA:r.scoreA,scoreB:r.scoreB,scoreAET:r.scoreAET,scoreBET:r.scoreBET,penA:r.penA,penB:r.penB,isKo:true};
  }));
}
function allMatches(state){return[...state.matches,...allKoMatches(state)]}

// PHASE SELECTOR
// ═══════════════════════════════════════════
function getPhaseOpts(state){
  const opts=[{value:'groups',label:'Phase de groupes'}];
  const built=buildKO(state);
  if(built.allComplete){KO_STAGES.forEach(([key,label],si)=>{const r=built.rounds[si];if(r&&r.some(m=>m.teamA&&m.teamB))opts.push({value:key,label});})}
  return opts;
}
function phaseSelector(state,selectId,cur){
  const opts=getPhaseOpts(state);const c=cur||opts[0].value;
  return`<div class="phase-selector"><label for="${selectId}">Phase :</label><select id="${selectId}">${opts.map(o=>`<option value="${o.value}" ${o.value===c?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
}
function matchesForPhase(state,phase){
  if(!phase||phase==='groups')return state.matches;
  const built=buildKO(state);if(!built.allComplete)return[];
  const si=KO_STAGES.findIndex(s=>s[0]===phase);if(si<0)return[];
  const labels=KO_STAGES.map(s=>s[1]);
  return built.rounds[si].filter(m=>m.teamA&&m.teamB).map(m=>{
    const r=koResult(state.knockout,m.stage,m.index);
    return{id:`ko-${m.stage}-${m.index}`,date:m.date||'',time:m.time||'',wcGroup:labels[si],
      phase:m.stage,teamA:m.teamA,teamB:m.teamB,
      scoreA:r.scoreA,scoreB:r.scoreB,
      scoreAET:r.scoreAET||null,scoreBET:r.scoreBET||null,
      penA:r.penA||null,penB:r.penB||null,
      isKo:true};
  });
}

function renderGroupTables(state,containerId){
  const el=$(containerId);if(!el)return;
  const letters='ABCDEFGHIJKL'.split('');
  const standings=letters.map(g=>groupStandings(state.matches,g));
  const best8teams=new Set(getBest8(standings).map(t=>t.team));
  el.innerHTML='<div class="groups-grid">'+standings.map(s=>{
    const {group,table,done,total}=s;
    const rows=table.map((r,i)=>{
      const url=teamFlag(r.team);
      const img=url?`<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
      const cls=i<2?'group-row qualified':best8teams.has(r.team)?'group-row third':'group-row';
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      return`<div class="${cls}">
        <span class="gr">${medal||i+1}</span>
        ${img}
        <span class="gn">${esc(teamName(r.team))}</span>
        <span class="gp">${r.points}</span>
        <span class="gs">${r.played?r.gf+'-'+r.ga:'-'}</span>
      </div>`;
    }).join('');
    return`<div class="group-table">
      <div class="group-table-header"><span>Groupe ${group}</span><span class="gc">${done}/${total} matchs</span></div>
      ${rows}
    </div>`;
  }).join('')+'</div>';
}

function renderBracket(state,containerId){
  const el=$(containerId);if(!el)return;
  const built=buildKO(state);
  const[r32,r16,qf,sf,third,finale]=built.rounds;
  const ko=state.knockout;

  // ── helpers ──────────────────────────────────────────────
  function slotLabel(slot){
    if(!slot)return'?';
    if(slot.length===2){
      return(slot[0]==='1'?'1er':slot[0]==='2'?'2e':'3e')+' Grp '+slot[1];
    }
    if(slot.startsWith('W.'))return slot;
    if(slot.startsWith('V.'))return slot;
    return'3e Grp '+slot.slice(1).split('').join('/');
  }
  function teamRow(code,slot,win,lose,silver){
    const cls='bteam'+(win?(silver?' silver':' winner'):lose?' loser':code?'':' tbd');
    const url=code?teamFlag(code):'';
    const img=url?`<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`:'<div class="fp"></div>';
    const label=code?esc(teamName(code)):esc(slotLabel(slot));
    return`<div class="${cls}">${img}<span class="tn">${label}</span></div>`;
  }
  function bMatch(m,silver){
    const r=koResult(ko,m.stage,m.index);
    const fs=koFinalScore(r);
    const has=r.scoreA!==null&&r.scoreB!==null;
    const wA=has&&(fs.a>fs.b||(fs.a===fs.b&&r.penA!=null&&r.penA>r.penB));
    const wB=has&&(fs.b>fs.a||(fs.a===fs.b&&r.penB!=null&&r.penB>r.penA));
    return`<div class="bmatch">${teamRow(m.teamA,m.slotA,wA,has&&!wA&&wB,silver)}${teamRow(m.teamB,m.slotB,wB,has&&!wB&&wA,silver)}</div>`;
  }
  function col(label,matches,sfcol,silver){
    return`<div class="bcol${sfcol?' sf-col':''}"><div class="bcol-label">${label}</div><div class="bmatches${sfcol?' sf-matches':''}">${matches.map(m=>bMatch(m,silver||false)).join('')}</div></div>`;
  }

  // ── Finale + petite finale (en haut) ─────────────────────
  function finBox(m,gold){
    const r=koResult(ko,m.stage,m.index);
    const fs=koFinalScore(r);
    const has=r.scoreA!==null&&r.scoreB!==null;
    const wA=has&&(fs.a>fs.b||(fs.a===fs.b&&r.penA!=null&&r.penA>r.penB));
    const wB=has&&(fs.b>fs.a||(fs.a===fs.b&&r.penB!=null&&r.penB>r.penA));
    function side(code,slot,win,lose){
      const url=code?teamFlag(code):'';
      const img=url?`<img src="${url}" alt="" style="width:22px;height:16px;object-fit:cover;border-radius:3px" onerror="this.style.display='none'">`:
        `<div style="width:22px;height:16px;background:#e8eef7;border-radius:3px;flex-shrink:0"></div>`;
      const nameColor=win?(gold?'#c8860a':'#555'):lose?'#aab8c9':'inherit';
      const op=lose?';opacity:.45':'';
      const label=code?esc(teamName(code)):esc(slotLabel(slot));
      return`<div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px${op}">
        ${img}<span style="color:${nameColor}">${label}</span>
      </div>`;
    }
    let scoreStr='';
    if(has){
      scoreStr=`${r.scoreA}-${r.scoreB}`;
      if(r.scoreAET!=null)scoreStr+=` (${r.scoreAET}-${r.scoreBET} ap)`;
      if(r.penA!=null)scoreStr+=` (${r.penA}-${r.penB} tab)`;
    }
    const boxStyle=gold
      ?'background:linear-gradient(135deg,#fffbe6,#fff3c0);border:2px solid #f5c842;border-radius:16px;padding:12px 20px;min-width:230px;text-align:center;box-shadow:0 4px 20px rgba(200,134,10,.22)'
      :'background:linear-gradient(135deg,#f4f4f4,#e8e8e8);border:2px solid #b0b0b0;border-radius:14px;padding:10px 18px;min-width:210px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)';
    const titleColor=gold?'#c8860a':'#707070';
    const title=gold?'🏆 FINALE — Match 104':'🥉 PETITE FINALE — Match 103';
    return`<div style="${boxStyle}">
      <div style="font-size:12px;font-weight:800;color:${titleColor};letter-spacing:.4px;margin-bottom:8px">${title}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px">
        ${side(m.teamA,m.slotA||'?',wA,has&&wB&&!wA)}
        <span style="font-size:11px;color:${titleColor};font-weight:800">VS</span>
        ${side(m.teamB,m.slotB||'?',wB,has&&wA&&!wB)}
      </div>
      ${has?`<div style="font-size:13px;font-weight:800;color:${gold?'#c8860a':'#666'};margin-top:6px">${scoreStr}</div>`:''}
    </div>`;
  }

  // ── Ordre visuel corrigé ──────────────────────────────────
  // Les paires R32 qui se rencontrent au R16 sont adjacentes
  const lR32=[r32[0],r32[2],r32[1],r32[4],r32[3],r32[5],r32[6],r32[7]];
  const rR32=[r32[8],r32[10],r32[9],r32[11],r32[12],r32[14],r32[13],r32[15]];

  el.innerHTML=
    `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px">
      ${finBox(finale[0],true)}
      ${finBox(third[0],false)}
    </div>`+
    `<div class="bracket-scroll"><div class="bracket">
      ${col('32es de finale',lR32,false,false)}
      ${col('16es de finale',r16.slice(0,4),false,false)}
      ${col('Quarts',qf.slice(0,2),false,false)}
      ${col('Demies',sf.slice(0,1),true,false)}
      ${col('Demies',sf.slice(1,2),true,false)}
      ${col('Quarts',qf.slice(2,4),false,false)}
      ${col('16es de finale',r16.slice(4,8),false,false)}
      ${col('32es de finale',rR32,false,false)}
    </div></div>`;
}


function renderLeaderboard(state,containerId,groupFilterId){
  const gid=$(groupFilterId)?.value||'all';
  const rows=buildRanking(state,gid,allMatches(state));
  const el=$(containerId);if(!el)return;
  if(!rows.length){el.innerHTML='<div class="empty">Aucun joueur.</div>';return}
  const medal=i=>['🥇','🥈','🥉'][i]??`${i+1}.`;
  el.innerHTML=`<table><thead><tr><th>#</th><th>Joueur</th><th>Groupes</th><th>Pts</th><th>Exact</th><th>Bon</th><th>Joués</th></tr></thead><tbody>${
    rows.map((p,i)=>`<tr><td>${medal(i)}</td><td><b>${esc(p.name)}</b></td><td>${groupBadges(p,state.groups)}</td><td><b>${p.pts}</b></td><td>${p.exact}</td><td>${p.good}</td><td>${p.played}</td></tr>`).join('')
  }</tbody></table>`;
}

function renderPredBlock(state,match,player){
  const prono=state.predictions[match.id]?.[player.id];
  const pts=calcPoints(match,prono);
  const locked=match.scoreA!==null;
  const hasPred=prono!=null&&prono.scoreA!=null&&prono.scoreB!=null;
  const isKo=!!(match.isKo||match.knockout);
  const v=x=>x!=null?x:'';
  const mid=match.id,pid=player.id;

  // ── Couleur fond selon état ──────────────────────────────
  let bgStyle,statusBadge;
  if(locked&&hasPred){
    // Score officiel connu : colorier selon résultat
    if(pts===3){
      // Score exact → vert foncé
      bgStyle='background:linear-gradient(135deg,#c6f6d5,#9ae6b4);border:1.5px solid #38a169;border-radius:12px;padding:8px;margin-top:6px';
      statusBadge=`<span style="font-size:11px;font-weight:800;background:#276749;color:#fff;padding:2px 9px;border-radius:999px">🎯 Exact — 3pts</span>`;
    } else if(pts===1){
      // Bon résultat pas exact → vert clair
      bgStyle='background:linear-gradient(135deg,#edfff6,#d0fde6);border:1.5px solid #7ee8b2;border-radius:12px;padding:8px;margin-top:6px';
      statusBadge=`<span style="font-size:11px;font-weight:800;background:#08784e;color:#fff;padding:2px 9px;border-radius:999px">✓ Bon résultat — 1pt</span>`;
    } else {
      // Mauvais prono → rouge
      bgStyle='background:linear-gradient(135deg,#fff5f5,#fed7d7);border:1.5px solid #fc8181;border-radius:12px;padding:8px;margin-top:6px';
      statusBadge=`<span style="font-size:11px;font-weight:800;background:#c53030;color:#fff;padding:2px 9px;border-radius:999px">✗ Raté — 0pt</span>`;
    }
  } else if(locked&&!hasPred){
    // Score officiel mais pas de prono → gris
    bgStyle='background:#f0f0f0;border:1px solid #d0d0d0;border-radius:12px;padding:8px;margin-top:6px;opacity:.7';
    statusBadge=`<span style="font-size:11px;color:#888;padding:2px 8px">— Pas de prono</span>`;
  } else if(!locked&&hasPred){
    // Prono saisi, match pas encore joué → vert clair neutre
    bgStyle='background:linear-gradient(135deg,#edfff6,#d8ffe9);border:1px solid #7ee8b2;border-radius:12px;padding:8px;margin-top:6px';
    statusBadge=`<span style="font-size:11px;font-weight:700;background:#e8fff5;color:#08784e;padding:2px 8px;border-radius:999px">✓ Saisi</span>`;
  } else {
    // Pas de prono, match pas joué → blanc/gris
    bgStyle='background:#f8fbff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:6px';
    statusBadge=`<span style="font-size:11px;color:#aab8c9;padding:2px 8px">En attente</span>`;
  }

  const ro=locked?'readonly':'';
  const lockedStyle=locked?';opacity:.55;cursor:not-allowed':'';

  const row90=`<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
    <b style="font-size:12px;flex:1;min-width:80px">${esc(player.name)}</b>
    ${statusBadge}
    <input type="number" min="0" class="score-sm" id="pa-${mid}-${pid}" value="${v(prono?.scoreA)}" placeholder="0" ${ro} style="${locked?'opacity:.55;cursor:not-allowed':''}">
    <span style="color:var(--muted);font-weight:800">-</span>
    <input type="number" min="0" class="score-sm" id="pb-${mid}-${pid}" value="${v(prono?.scoreB)}" placeholder="0" ${ro} style="${locked?'opacity:.55;cursor:not-allowed':''}">
    ${locked?`<span style="font-size:13px">🔒</span>`:`<button class="primary small" type="button" data-action="set-pred" data-match="${mid}" data-player="${pid}">OK</button>`}
  </div>`;

  if(!isKo)return`<div style="${bgStyle}">${row90}</div>`;

  const rowET=`<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px">
    <span style="font-size:10px;color:var(--muted);min-width:80px">Prolong. :</span>
    <input type="number" min="0" class="score-sm" style="background:#eef5ff;border-color:#bdd3f0${lockedStyle}" id="pet-a-${mid}-${pid}" value="${v(prono?.scoreAET)}" placeholder="-" ${ro}>
    <span style="color:var(--muted);font-weight:800">-</span>
    <input type="number" min="0" class="score-sm" style="background:#eef5ff;border-color:#bdd3f0${lockedStyle}" id="pet-b-${mid}-${pid}" value="${v(prono?.scoreBET)}" placeholder="-" ${ro}>
    <span style="font-size:10px;color:var(--muted)">(si nul à 90)</span>
  </div>`;

  const rowPen=`<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px">
    <span style="font-size:10px;color:var(--muted);min-width:80px">Tirs au but :</span>
    <input type="number" min="0" class="score-sm" style="width:38px;background:#fff9e6;border-color:#e8d98b${lockedStyle}" id="ppa-${mid}-${pid}" value="${v(prono?.penA)}" placeholder="-" ${ro}>
    <span style="color:var(--muted);font-weight:800">-</span>
    <input type="number" min="0" class="score-sm" style="width:38px;background:#fff9e6;border-color:#e8d98b${lockedStyle}" id="ppb-${mid}-${pid}" value="${v(prono?.penB)}" placeholder="-" ${ro}>
    <span style="font-size:10px;color:var(--muted)">(si nul en prolong.)</span>
  </div>`;

  return`<div style="${bgStyle}">${row90}${rowET}${rowPen}</div>`;
}




function renderMatchCard(state,m,editable){
  const isKo=!!m.isKo;
  const idx=isKo?parseInt(m.id.split('-').pop()||0):null;
  const r=isKo?koResult(state.knockout,m.phase,idx):{scoreA:m.scoreA,scoreB:m.scoreB,scoreAET:null,scoreBET:null,penA:null,penB:null};
  const validated=r.scoreA!==null&&r.scoreB!==null;
  const hasET=isKo&&r.scoreAET!==null&&r.scoreBET!==null;
  const hasPen=isKo&&r.penA!==null&&r.penB!==null;
  let summary='';
  if(validated){
    summary=`${r.scoreA}-${r.scoreB}`;
    if(hasET)summary+=` (${r.scoreAET}-${r.scoreBET} ap)`;
    if(hasPen)summary+=` (${r.penA}-${r.penB} tab)`;
  }
  const badge=validated?`<span style="color:#08784e;font-size:11px;font-weight:700">&#10003; ${summary}</span>`:'';
  const saId=isKo?`koa-${m.phase}-${idx}`:`ra-${m.id}`;
  const sbId=isKo?`kob-${m.phase}-${idx}`:`rb-${m.id}`;

  if(!editable){
    return`<div class="match${validated?' validated':''}">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="font-size:11px;color:var(--muted)">${m.time||''} ${dateFr(m.date)}${m.wcGroup?' · '+esc(m.wcGroup):''}</span>${badge}
      </div>
      <div class="match-row">${teamHtml(m.teamA)}<div style="padding:0 8px;font-weight:800">${validated?summary:'?-?'}</div>${teamHtml(m.teamB)}</div>
    </div>`;
  }

  const koBlock=isKo?`
    <div style="margin-top:7px;background:#f8fbff;border-radius:10px;padding:8px 10px;border:1px solid #e1ebf7">
      <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin-bottom:5px">
        <span style="font-size:11px;color:var(--muted);font-weight:600">90 min</span>
        <div style="display:flex;align-items:center;gap:5px">
          <input type="number" min="0" class="score-sm" id="${saId}" value="${r.scoreA!=null?r.scoreA:''}" placeholder="-">
          <span style="color:var(--muted);font-weight:800">-</span>
          <input type="number" min="0" class="score-sm" id="${sbId}" value="${r.scoreB!=null?r.scoreB:''}" placeholder="-">
          <span style="font-size:10px;color:var(--muted)">(si nul → prolong.)</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin-bottom:5px">
        <span style="font-size:11px;color:var(--muted);font-weight:600">Prolongations</span>
        <div style="display:flex;align-items:center;gap:5px">
          <input type="number" min="0" class="score-sm" style="background:#eef5ff;border-color:#bdd3f0" id="koaet-${m.phase}-${idx}" value="${r.scoreAET!=null?r.scoreAET:''}" placeholder="-">
          <span style="color:var(--muted);font-weight:800">-</span>
          <input type="number" min="0" class="score-sm" style="background:#eef5ff;border-color:#bdd3f0" id="kobet-${m.phase}-${idx}" value="${r.scoreBET!=null?r.scoreBET:''}" placeholder="-">
          <span style="font-size:10px;color:var(--muted)">(si nul → tab)</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--muted);font-weight:600">Tirs au but</span>
        <div style="display:flex;align-items:center;gap:5px">
          <input type="number" min="0" class="score-sm" style="width:38px;background:#fff9e6;border-color:#e8d98b" id="kopa-${m.phase}-${idx}" value="${r.penA!=null?r.penA:''}" placeholder="-">
          <span style="color:var(--muted);font-weight:800">-</span>
          <input type="number" min="0" class="score-sm" style="width:38px;background:#fff9e6;border-color:#e8d98b" id="kopb-${m.phase}-${idx}" value="${r.penB!=null?r.penB:''}" placeholder="-">
        </div>
      </div>
    </div>
    <div style="margin-top:7px;display:flex;justify-content:flex-end">
      <button class="primary small" type="button" data-action="set-ko" data-stage="${m.phase}" data-index="${idx}">Valider</button>
    </div>`
  :`<div class="match-row" style="margin-top:6px">
      <div class="team" style="flex:1;min-width:0">${teamHtml(m.teamA)}</div>
      <div class="score-box">
        <input type="number" min="0" class="score-sm" id="${saId}" value="${r.scoreA!=null?r.scoreA:''}" placeholder="-">
        <span>-</span>
        <input type="number" min="0" class="score-sm" id="${sbId}" value="${r.scoreB!=null?r.scoreB:''}" placeholder="-">
        <button class="primary small" type="button" data-action="update-result" data-id="${m.id}">OK</button>
      </div>
      <div class="team" style="flex:1;min-width:0;justify-content:flex-end">${teamHtml(m.teamB)}</div>
    </div>`;

  return`<div class="match${validated?' validated':''}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;color:var(--muted)">${m.time||''} ${dateFr(m.date)}${m.wcGroup?' · '+esc(m.wcGroup):''}</span>${badge}
    </div>
    ${isKo?`<div class="match-row" style="margin-bottom:4px">${teamHtml(m.teamA)}<span style="flex:1"></span>${teamHtml(m.teamB)}</div>${koBlock}`:koBlock}
  </div>`;
}

function renderMatchSection(state,opts,isAdmin){
  const mps=$('matchPhaseSelector');if(!mps)return;
  const curPhase=opts.matchPhase||mps.querySelector('select')?.value||'groups';
  mps.innerHTML=phaseSelector(state,'matchPhaseSelect',curPhase);
  const phase=$('matchPhaseSelect')?.value||'groups';
  const ml=$('matchesList');if(!ml)return;
  const matches=matchesForPhase(state,phase);
  if(!matches.length){ml.innerHTML='<div class="empty">Aucun match disponible.</div>';return}
  const bulk=isAdmin?`<div style="margin-bottom:10px;display:flex;justify-content:flex-end;gap:8px">
    <button class="btn-sim small" type="button" data-action="gen-fake-scores" data-phase="${phase}" style="border:1px dashed #c9d9ea;background:#fffbe6;color:#875700;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">🎲 Générer faux scores</button>
    <button class="primary small" type="button" data-action="validate-all" data-phase="${phase}">&#10003; Valider tous</button>
  </div>`:'';
  ml.innerHTML=bulk+'<div class="matches-grid">'+matches.map(m=>renderMatchCard(state,m,isAdmin)).join('')+'</div>';
}

function renderPronos(state,opts,players,isAdmin){
  const pps=$('pronosPhaseSelector');if(!pps)return;
  const curPhase=opts.pronosPhase||pps.querySelector('select')?.value||'groups';
  pps.innerHTML=phaseSelector(state,'pronosPhaseSelect',curPhase);
  const phase=$('pronosPhaseSelect')?.value||'groups';
  const matchList=matchesForPhase(state,phase);
  const editor=$('predEditor');if(!editor)return;
  if(!matchList.length){editor.innerHTML='<div class="empty">Aucun match disponible.</div>';return}
  editor.innerHTML=matchList.map(m=>{
    const officialIn=m.scoreA!==null;
    // Vérifier si TOUS les joueurs ont un prono sur ce match
    const allDone=players.length>0&&players.every(p=>{
      const pr=state.predictions[m.id]?.[p.id];
      return pr!=null&&pr.scoreA!=null&&pr.scoreB!=null;
    });
    const matchBg=officialIn
      ?'background:#f8fbff;border:1px solid #d7e4f4'
      :allDone
        ?'background:linear-gradient(135deg,#edfff6,#e0fded);border:1px solid #7ee8b2'
        :'background:#f8fbff;border:1px solid #d7e4f4';
    return`<div style="${matchBg};border-radius:14px;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px">
        <span style="font-size:11px;color:var(--muted)">${m.time||''} ${dateFr(m.date)} · ${esc(m.wcGroup)}</span>
        ${officialIn?`<span class="badge paid">Résultat : ${m.scoreA}-${m.scoreB}</span>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
        ${teamHtml(m.teamA)}<span class="muted" style="font-size:13px">vs</span>${teamHtml(m.teamB)}
      </div>
      ${players.map(p=>renderPredBlock(state,m,p)).join('')}
    </div>`;
  }).join('');
}

function renderAdmin(state,opts={}){
  const sp=$('sP');if(sp)sp.textContent=state.players.length;
  const sm=$('sM');if(sm)sm.textContent=state.matches.length;
  const sg=$('sG');if(sg)sg.textContent=state.groups.length;

  ['lgGroup','playersFilter','predGroup'].forEach(id=>{const el=$(id);if(el){const c=el.value||'all';el.innerHTML=groupOpts(c)}});
  const pg=$('playerGroups');
  if(pg)pg.innerHTML=state.groups.map(g=>`<label class="check-card"><input class="npg" type="checkbox" value="${esc(g.id)}" ${g.id==='colleagues'?'checked':''}>${esc(g.name)}${g.paid?` <span style="font-size:10px;background:#fff5d9;color:#875700;padding:1px 6px;border-radius:999px">💰</span>`:''}</label>`).join('');
  // Rendu liste des groupes
  const gl=$('groupsList');
  if(gl){
    if(!state.groups.length){gl.innerHTML='<div class="empty">Aucun groupe.</div>';}
    else gl.innerHTML=`<table><thead><tr><th>Groupe</th><th>Type</th><th>Joueurs</th><th></th></tr></thead><tbody>${
      state.groups.map(g=>{
        const members=state.players.filter(p=>p.groupIds.includes(g.id));
        return`<tr>
          <td><b>${esc(g.name)}</b></td>
          <td>${g.paid?'<span class="badge warn">💰 Payant</span>':'<span class="badge info">Gratuit</span>'}</td>
          <td>${members.length}</td>
          <td><button class="danger small" type="button" data-action="delete-group" data-id="${g.id}">✕</button></td>
        </tr>`;
      }).join('')
    }</tbody></table>`;
  }
  renderLeaderboard(state,'leaderboard','lgGroup');
  // Joueurs
  const pl=$('playersList'),pf=$('playersFilter');
  if(pl){
    const gid=pf?.value||'all';
    const arr=gid==='all'?state.players:state.players.filter(p=>p.groupIds.includes(gid));
    const hasPaidGroup=state.groups.some(g=>g.paid);
    if(!arr.length){pl.innerHTML='<div class="empty">Aucun joueur.</div>';}
    else pl.innerHTML=`<table><thead><tr><th>Nom</th><th>Groupes</th>${hasPaidGroup?'<th>💰 Payé</th>':''}<th>Lien</th><th></th></tr></thead><tbody>${
      arr.map(p=>{
        const token=state.tokens?.[p.id];const url=token?buildUrl(token):'';
        const paidGroups=p.groupIds.map(gid=>state.groups.find(g=>g.id===gid)).filter(g=>g?.paid);
        const paidCell=hasPaidGroup?`<td style="text-align:center">${paidGroups.length?`<label style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px">
          <input type="checkbox" class="pay-check" data-player="${p.id}" ${(state.payments||{})[p.id]?'checked':''} style="accent-color:var(--green);transform:scale(1.2)">
          <span style="color:${(state.payments||{})[p.id]?'#08784e':'#a91537'};font-weight:700">${(state.payments||{})[p.id]?'✓ Payé':'En attente'}</span>
        </label>`:'—'}</td>`:'';
        return`<tr>
          <td><b>${esc(p.name)}</b></td>
          <td>${groupBadges(p,state.groups)}</td>
          ${paidCell}
          <td><button class="small" type="button" data-action="copy-link" data-id="${p.id}">📋 Copier</button>${url?`<div class="link-box">${esc(url)}</div>`:''}</td>
          <td><button class="danger small" type="button" data-action="delete-player" data-id="${p.id}">✕</button></td>
        </tr>`;
      }).join('')
    }</tbody></table>`;
  }
  renderMatchSection(state,opts,true);
  // Pronos
  const gid=$('predGroup')?.value||'all';
  const players=gid==='all'?state.players:state.players.filter(p=>p.groupIds.includes(gid));
  renderPronos(state,opts,players,true);
  // Bracket
  renderGroupTables(state,'groupTablesViz');
  const bs=$('bracketSummary');
  if(bs){
    const built=buildKO(state);
    bs.innerHTML=built.best8.length?`<div style="margin-bottom:8px;font-size:12px;font-weight:600;color:var(--muted)">8 meilleurs 3es :</div><div style="display:flex;flex-wrap:wrap;gap:4px">${built.best8.map((t,i)=>`<span class="badge info">${i+1}. ${esc(teamName(t.team))} (${t.group}·${t.points}pts)</span>`).join('')}</div>`:'';
  }
  renderBracket(state,'bracketViz');
}

// ═══════════════════════════════════════════
// RENDER PLAYER
// ═══════════════════════════════════════════
function buildPlayerShell(player){
  $('app').innerHTML=`
  <header><div class="hero"><div>
    <span class="badge warn">🏆 CDM 2026</span><h1>Mes pronos</h1>
    <div class="player-banner"><span>👤</span><strong>${esc(player.name)}</strong></div>
  </div>
  <div class="stats">
    <div class="stat"><strong id="sP2">0</strong><span>points</span></div>
    <div class="stat"><strong id="sE">0</strong><span>exacts</span></div>
    <div class="stat"><strong id="sPl">0</strong><span>joués</span></div>
  </div></div></header>
  <main>
    <nav class="tabs">
      <button type="button" class="tab active" data-tab="dashboard">🏆 Classement</button>
      <button type="button" class="tab" data-tab="mypronos">✍️ Mes pronos</button>
      <button type="button" class="tab" data-tab="bracket">🏟️ Tableau final</button>
    </nav>
    <section id="dashboard" class="section active">
      <div class="card"><h2>🏆 Classement</h2>
        <div style="margin-bottom:10px"><select id="lgGroup"></select></div>
        <div id="leaderboard"></div>
      </div>
    </section>
    <section id="mypronos" class="section">
      <div id="pronosPhaseSelector"></div>
      <div class="card"><h2>✍️ Mes pronostics</h2><div id="predEditor"></div></div>
    </section>
    <section id="bracket" class="section">
      <div class="card"><h2>📊 Classements de poule</h2>
        <div id="groupTablesViz"></div>
      </div>
      <div class="card"><h2>🏟️ Bracket KO</h2><div id="bracketSummary"></div></div>
      <div id="bracketViz"></div>
    </section>
  </main>`;
}
function renderPlayer(state,player,opts={}){
  let pts=0,exact=0,played=0;
  allMatches(state).forEach(m=>{const p=state.predictions[m.id]?.[player.id];if(!p||m.scoreA===null)return;played++;if(p.scoreA===m.scoreA&&p.scoreB===m.scoreB){pts+=3;exact++;}else if(Math.sign(p.scoreA-p.scoreB)===Math.sign(m.scoreA-m.scoreB))pts++;});
  const sp=$('sP2');if(sp)sp.textContent=pts;
  const se=$('sE');if(se)se.textContent=exact;
  const sl=$('sPl');if(sl)sl.textContent=played;
  const lgEl=$('lgGroup');
  if(lgEl){const c=lgEl.value||'all';lgEl.innerHTML=`<option value="all" ${c==='all'?'selected':''}>Tous</option>`+state.groups.map(g=>`<option value="${esc(g.id)}" ${c===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}
  renderLeaderboard(state,'leaderboard','lgGroup');
  renderPronos(state,opts,[player],false);
  renderGroupTables(state,'groupTablesViz');
  const bs=$('bracketSummary');
  if(bs){const built=buildKO(state);bs.innerHTML=built.best8.length?`<div style="display:flex;flex-wrap:wrap;gap:4px">${built.best8.map((t,i)=>`<span class="badge info">${i+1}. ${esc(teamName(t.team))} (${t.group})</span>`).join('')}</div>`:'<p>Disponible après la phase de groupes.</p>';}
  renderBracket(state,'bracketViz');
}

// ═══════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════
function handleTabs(e){
  const tab=e.target.closest('.tab');if(!tab)return false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  tab.classList.add('active');const sec=$(tab.dataset.tab);if(sec)sec.classList.add('active');
  return true;
}
function initAdminEvents(app){
  document.addEventListener('click',async e=>{
    if(handleTabs(e))return;
    const btn=e.target.closest('button[data-action]');if(!btn)return;
    const st=app.state,a=btn.dataset.action;
    if(a==='reset-scores'){
      // Remet à zéro tous les scores (matchs groupe + KO) mais garde joueurs et pronos
      st.matches=st.matches.map(m=>({...m,scoreA:null,scoreB:null}));
      st.knockout={};
      saveState(st);renderAdmin(st);toast('Scores réinitialisés');return;
    }
    if(a==='factory-reset'){app.state=factoryReset();buildAdminShell();renderAdmin(app.state);initAdminEvents(app);toast('Réinitialisé');return}
    if(a==='reset'){app.state=blankState();saveState(app.state);buildAdminShell();renderAdmin(app.state);initAdminEvents(app);toast('Remis à zéro');return}
    if(a==='add-group'){
      const nameEl=$('groupName');
      if(!nameEl?.value?.trim()){toast('Nom du groupe manquant');return}
      const name=nameEl.value.trim();
      if(st.groups.some(g=>g.name.toLowerCase()===name.toLowerCase())){toast('Ce groupe existe déjà');return}
      const paid=!!$('groupPaid')?.checked;
      st.groups.push({id:uid(),name,paid});
      nameEl.value='';if($('groupPaid'))$('groupPaid').checked=false;
      saveState(st);renderAdmin(st);toast(`Groupe "${name}" créé`);return;
    }
    if(a==='delete-group'){
      const gid=btn.dataset.id;
      const g=st.groups.find(x=>x.id===gid);
      if(!g){return}
      // Retirer ce groupe de tous les joueurs
      st.players.forEach(p=>{p.groupIds=p.groupIds.filter(x=>x!==gid);if(!p.groupIds.length)p.groupIds=['colleagues']});
      st.groups=st.groups.filter(x=>x.id!==gid);
      saveState(st);renderAdmin(st);toast(`Groupe supprimé`);return;
    }
    if(a==='add-player'){
      const nEl=$('playerName');if(!nEl?.value?.trim()){toast('Nom manquant');return}
      const gs=[...document.querySelectorAll('.npg:checked')].map(x=>x.value);
      if(!gs.length){toast('Coche au moins un groupe');return}
      const name=nEl.value.trim();const ex=st.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
      if(ex)gs.forEach(g=>{if(!ex.groupIds.includes(g))ex.groupIds.push(g)});
      else st.players.push({id:uid(),name,groupIds:gs});
      nEl.value='';
      localStorage.setItem(STORAGE_KEY,JSON.stringify(st));
      await sbSet(st);
      renderAdmin(st);toast('Joueur enregistré');return;
    }
    if(a==='delete-player'){const pid=btn.dataset.id;st.players=st.players.filter(p=>p.id!==pid);Object.values(st.predictions).forEach(m=>delete m[pid]);saveState(st);renderAdmin(st);toast('Supprimé');return}
    if(a==='delete-all-players'){st.players=[];st.predictions={};saveState(st);renderAdmin(st);toast('Tous supprimés');return}
    if(a==='copy-link'){
      const pid=btn.dataset.id;const player=st.players.find(p=>p.id===pid);if(!player)return;
      if(!st.tokens)st.tokens={};if(!st.tokens[pid])st.tokens[pid]=createToken(pid);
      // Attendre que Supabase confirme la sauvegarde avant de copier le lien
      localStorage.setItem(STORAGE_KEY,JSON.stringify(st));
      await sbSet(st); // synchrone ici - on attend la confirmation
      const url=buildUrl(st.tokens[pid]);
      const ok=await copyText(url);
      toast(ok?`✅ Lien copié — ${player.name}`:'Lien généré (voir ci-dessous)');
      renderAdmin(st);return;
    }
    if(a==='update-result'){
      const m=st.matches.find(x=>x.id===btn.dataset.id);if(!m)return;
      const ra=$(`ra-${m.id}`),rb=$(`rb-${m.id}`);
      m.scoreA=ra?.value===''?null:Number(ra.value);m.scoreB=rb?.value===''?null:Number(rb.value);
      saveState(st);renderAdmin(st);toast('Score enregistré');return;
    }
    if(a==='set-ko'){
      const stage=btn.dataset.stage,idx=Number(btn.dataset.index);
      const ka=$(`koa-${stage}-${idx}`),kb=$(`kob-${stage}-${idx}`);
      const kaet=$(`koaet-${stage}-${idx}`),kbet=$(`kobet-${stage}-${idx}`);
      const kpa=$(`kopa-${stage}-${idx}`),kpb=$(`kopb-${stage}-${idx}`);
      const v=x=>x?.value===''||x?.value==null?null:Number(x.value);
      st.knockout[`${stage}-${idx}`]={scoreA:v(ka),scoreB:v(kb),scoreAET:v(kaet),scoreBET:v(kbet),penA:v(kpa),penB:v(kpb)};
      saveState(st);renderAdmin(st);toast('Score KO enregistré ✅');return;
    }
    if(a==='gen-fake-scores'){
      const phase=btn.dataset.phase||'groups';
      const matches=matchesForPhase(st,phase);
      const rnd=(n)=>Math.floor(Math.random()*n);
      const scores=[[0,0],[1,0],[2,0],[2,1],[3,0],[3,1],[3,2],[1,1],[2,2],[0,1],[0,2],[1,2],[0,3],[1,3],[2,3]];
      matches.forEach(m=>{
        const sc=scores[rnd(scores.length)];
        if(m.isKo){
          const idx=parseInt(m.id.split('-').pop()||0);
          const sA=sc[0],sB=sc[1];
          let etA=null,etB=null,penA=null,penB=null;
          if(sA===sB){
            // Prolongations : 50% chance nul aussi
            const etDiff=rnd(3)-1;// -1, 0, 1
            etA=sA+(etDiff>0?1:0);etB=sB+(etDiff<0?1:0);
            if(etA===etB){
              // Tab
              do{penA=3+rnd(5);penB=3+rnd(5);}while(penA===penB);
            }
          }
          st.knockout[`${m.phase}-${idx}`]={scoreA:sA,scoreB:sB,scoreAET:etA,scoreBET:etB,penA,penB};
        } else {
          const match=st.matches.find(x=>x.id===m.id);
          if(match){match.scoreA=sc[0];match.scoreB=sc[1];}
        }
      });
      saveState(st);renderAdmin(st,{matchPhase:phase});toast(`🎲 Faux scores générés pour ${matches.length} matchs`);return;
    }
    if(a==='validate-all'){
      const phase=btn.dataset.phase||'groups';const matches=matchesForPhase(st,phase);let count=0;
      matches.forEach(m=>{
        if(m.isKo){
          const idx=parseInt(m.id.split('-').pop()||0);
          const ka=$(`koa-${m.phase}-${idx}`),kb=$(`kob-${m.phase}-${idx}`);
          const kaet=$(`koaet-${m.phase}-${idx}`),kbet=$(`kobet-${m.phase}-${idx}`);
          const kpa=$(`kopa-${m.phase}-${idx}`),kpb=$(`kopb-${m.phase}-${idx}`);
          const v2=x=>x?.value===''||x?.value==null?null:Number(x.value);
          if(ka&&kb&&ka.value!==''&&kb.value!==''){
            st.knockout[`${m.phase}-${idx}`]={scoreA:v2(ka),scoreB:v2(kb),scoreAET:v2(kaet),scoreBET:v2(kbet),penA:v2(kpa),penB:v2(kpb)};count++;
          }
        }else{
          const ra=$(`ra-${m.id}`),rb=$(`rb-${m.id}`);
          if(ra&&rb&&ra.value!==''&&rb.value!==''){const match=st.matches.find(x=>x.id===m.id);if(match){match.scoreA=Number(ra.value);match.scoreB=Number(rb.value);count++;}}
        }
      });
      saveState(st);renderAdmin(st,{matchPhase:phase});toast(`${count} score${count>1?'s':''} enregistré${count>1?'s':''}`);return;
    }
    if(a==='set-pred'){
      const mid=btn.dataset.match,pid=btn.dataset.player;
      if(!st.predictions[mid])st.predictions[mid]={};
      const pa=$(`pa-${mid}-${pid}`),pb=$(`pb-${mid}-${pid}`);
      const ppa=$(`ppa-${mid}-${pid}`),ppb=$(`ppb-${mid}-${pid}`);
      const petA=$(`pet-a-${mid}-${pid}`),petB=$(`pet-b-${mid}-${pid}`);
      const v2=x=>x?.value!==''&&x?.value!=null?Number(x.value):null;
      if(!pa||!pb||pa.value===''||pb.value==='')delete st.predictions[mid][pid];
      else st.predictions[mid][pid]={
        scoreA:Number(pa.value),scoreB:Number(pb.value),
        scoreAET:v2(petA),scoreBET:v2(petB),
        penA:v2(ppa),penB:v2(ppb)
      };
      saveState(st);renderAdmin(st);toast('Prono enregistré ✅');return;
    }
    if(a==='export'){const b=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='pronos-cdm-2026.json';l.click();return}
  });
  document.addEventListener('change',e=>{
    const x=e.target;if(!x)return;
    if(x.id==='importFile'){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{app.state=normalize(JSON.parse(r.result));saveState(app.state);renderAdmin(app.state);toast('Import réussi')}catch{toast('Fichier invalide')}};r.readAsText(f);e.target.value='';return}
    // Toggle paiement
    if(x.classList.contains('pay-check')){
      const pid=x.dataset.player;
      if(!app.state.payments)app.state.payments={};
      app.state.payments[pid]=x.checked;
      saveState(app.state);
      // Mettre à jour juste le label sans re-render complet
      const span=x.nextElementSibling;
      if(span){span.textContent=x.checked?'✓ Payé':'En attente';span.style.color=x.checked?'#08784e':'#a91537';}
      toast(x.checked?'Paiement confirmé ✅':'Paiement annulé');
      return;
    }
    if(['lgGroup','playersFilter','predGroup'].includes(x.id))renderAdmin(app.state);
    if(x.id==='matchPhaseSelect')renderAdmin(app.state,{matchPhase:x.value});
    if(x.id==='pronosPhaseSelect')renderAdmin(app.state,{pronosPhase:x.value});
  });
}
function initPlayerEvents(app,player){
  document.addEventListener('click',e=>{
    if(handleTabs(e))return;
    const btn=e.target.closest('button[data-action]');if(!btn)return;
    if(btn.dataset.action==='set-pred'){
      const mid=btn.dataset.match,pid=btn.dataset.player;if(pid!==player.id){toast('Action non autorisée');return}
      const st=app.state;if(!st.predictions[mid])st.predictions[mid]={};
      const pa=$(`pa-${mid}-${pid}`),pb=$(`pb-${mid}-${pid}`);
      const ppa=$(`ppa-${mid}-${pid}`),ppb=$(`ppb-${mid}-${pid}`);
      const petA=$(`pet-a-${mid}-${pid}`),petB=$(`pet-b-${mid}-${pid}`);
      const v2=x=>x?.value!==''&&x?.value!=null?Number(x.value):null;
      if(!pa||!pb||pa.value===''||pb.value==='')delete st.predictions[mid][pid];
      else st.predictions[mid][pid]={
        scoreA:Number(pa.value),scoreB:Number(pb.value),
        scoreAET:v2(petA),scoreBET:v2(petB),
        penA:v2(ppa),penB:v2(ppb)
      };
      saveState(st);renderPlayer(st,player);toast('Prono enregistré ✅');
    }
  });
  document.addEventListener('change',e=>{
    const x=e.target;if(!x)return;
    if(x.id==='lgGroup')renderPlayer(app.state,player);
    if(x.id==='pronosPhaseSelect')renderPlayer(app.state,player,{pronosPhase:x.value});
  });
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
(async function(){
  // Loader pendant la connexion à Supabase
  $('app').innerHTML=`<div style="text-align:center;padding:80px;color:#5d7088">
    <div style="font-size:32px;margin-bottom:12px">⚽</div>
    <div style="font-size:16px;font-weight:600">Chargement des données…</div>
    <div style="font-size:13px;margin-top:6px;color:#aab8c9">Connexion à la base de données</div>
  </div>`;

  const app={state: await loadState()};
  const token=getToken();

  if(token){
    const pid=validateToken(token);
    const player=app.state.players.find(p=>p.id===pid);
    if(!player){
      $('app').innerHTML=`<div style="max-width:500px;margin:80px auto;padding:20px"><div class="card"><h2>🔒 Lien invalide</h2><p>Contacte l'administrateur pour un nouveau lien.</p></div></div>`;
      return;
    }
    buildPlayerShell(player);
    renderPlayer(app.state,player);
    initPlayerEvents(app,player);
    // Polling pour sync temps réel côté joueur
    startPolling(app,(newState)=>{
      app.state=newState;
      const updatedPlayer=newState.players.find(p=>p.id===pid);
      if(updatedPlayer)renderPlayer(newState,updatedPlayer);
    });
  }else{
    buildAdminShell();
    renderAdmin(app.state);
    initAdminEvents(app);
    // Badge sync
    const sb=$('syncBadge');if(sb)sb.innerHTML='🟢 Synchronisé';
    // Polling pour sync côté admin aussi
    startPolling(app,(newState)=>{
      app.state=newState;
      renderAdmin(newState);
      const sb2=$('syncBadge');if(sb2)sb2.innerHTML='🟢 Synchronisé';
    });
  }
})();
</script>

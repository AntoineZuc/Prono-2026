<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pronos CDM 2026</title>
<style>
:root{--bg:#0a0e1a;--bg2:#0d1628;--card:rgba(255,255,255,.06);--card-solid:#111b2e;--text:#e8f0fe;--muted:#7a95b8;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.04);--green:#14c47d;--green2:#0a9d65;--gold:#f5c842;--gold2:#ffdb4d;--shadow:0 8px 32px rgba(0,0,0,.4);--radius:18px;--accent:#1e6fff}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:Inter,Arial,system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(30,111,255,.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(20,196,125,.12) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 60% 30%, rgba(245,200,66,.07) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
header,main{max-width:1200px;margin:auto;padding:16px}
main{padding-top:0;padding-bottom:40px}
.hero,.card{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);padding:20px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:1.3fr .9fr;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"⚽";position:absolute;right:20px;bottom:-26px;font-size:110px;opacity:.06;transform:rotate(-12deg)}
h1{margin:4px 0 6px;font-size:clamp(24px,4vw,46px);letter-spacing:-.8px;background:linear-gradient(135deg,#fff 30%,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{margin:0 0 12px;font-size:18px;font-weight:700;color:var(--text)}
p{line-height:1.5;color:var(--muted);margin:4px 0}
.muted{color:var(--muted)}
.tabs{position:sticky;top:0;z-index:10;background:rgba(15,20,35,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:8px 0 10px;margin:10px 0 16px;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid rgba(255,255,255,.07);scrollbar-width:none;-ms-overflow-style:none}
button,.file-label{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:.15s;backdrop-filter:blur(8px)}
button:hover,.file-label:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tab.active,.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#06160f;border-color:transparent}
.danger{background:#fff0f3;color:#a91537;border-color:#ffd1db}
.small{font-size:12px;padding:5px 11px}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px}
.stat strong{font-size:26px;display:block;color:var(--green)}.stat span{color:var(--muted);font-size:12px}
input,select{width:100%;padding:9px 11px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-family:inherit}
input::placeholder{color:rgba(255,255,255,.35)}
input:focus,select:focus{outline:2px solid rgba(30,111,255,.5);outline-offset:1px;background:rgba(255,255,255,.15)}
select option{background:#1a2640;color:#fff}
input[type=checkbox]{width:auto;accent-color:var(--green)}
input[type=number]{-moz-appearance:textfield}
input:disabled{opacity:.5}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:middle}
th{background:rgba(255,255,255,.08);color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.04)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;background:rgba(30,111,255,.2);color:#7eb8ff;font-size:11px;font-weight:700;margin:2px;white-space:nowrap;border:1px solid rgba(30,111,255,.25)}
.paid{background:rgba(20,196,125,.18);color:#4de8a8;border-color:rgba(20,196,125,.3)}.warn{background:rgba(245,200,66,.15);color:#f5d442;border-color:rgba(245,200,66,.25)}.info{background:rgba(30,111,255,.15);color:#7eb8ff;border-color:rgba(30,111,255,.2)}
.empty{padding:18px;border:1px dashed rgba(255,255,255,.15);border-radius:14px;text-align:center;color:var(--muted);background:rgba(255,255,255,.03);font-size:13px}
.match{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px;transition:background .2s,border-color .2s;height:100%;box-sizing:border-box}
.match.validated{background:rgba(20,196,125,.12);border-color:rgba(20,196,125,.4)}
.team{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.team img{width:22px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.1);flex-shrink:0}
.matches-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pronos-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;min-width:0}.pronos-grid>*{min-width:0}
.match-row{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.score-box{display:flex;align-items:center;gap:4px;flex-shrink:0}
.score-sm{width:40px;padding:6px 4px;text-align:center;border:1px solid rgba(255,255,255,.3);border-radius:9px;background:rgba(255,255,255,.15);color:#fff;font-size:16px;font-weight:800;font-family:inherit;-moz-appearance:textfield}
.score-sm::placeholder{color:rgba(255,255,255,.35)}
.score-box span{color:var(--muted);font-weight:800;font-size:13px}
.pred{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-top:4px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.phase-selector{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 13px;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.phase-selector label{margin:0;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.phase-selector select{width:auto;min-width:180px;flex:1}
.check-card{display:inline-flex;align-items:center;gap:5px;margin:3px;padding:6px 9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-weight:700;font-size:12px;color:var(--text)}
.link-box{background:rgba(20,196,125,.12);border:1px solid rgba(20,196,125,.3);border-radius:10px;padding:7px 11px;margin-top:5px;font-size:11px;word-break:break-all;color:#4de8a8}
.player-banner{background:linear-gradient(135deg,rgba(20,196,125,.3),rgba(10,157,101,.3));border:1px solid rgba(20,196,125,.4);border-radius:var(--radius);padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.player-banner strong{font-size:16px;color:#4de8a8}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);background:#102033;color:white;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;z-index:999;font-size:13px;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* BRACKET */
.bracket-scroll{overflow-x:auto;padding:8px 0}
.bracket{display:flex;gap:2px;min-width:820px}
.bcol{display:flex;flex-direction:column;flex:1;min-width:100px}
.bcol-label{text-align:center;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:4px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:3px}
.bmatches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:3px;padding:3px 2px}
.bmatches.sf-m{justify-content:center;gap:8px}
.bmatch{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:7px;overflow:hidden}
.bteam{display:flex;align-items:center;gap:4px;padding:4px 6px;font-size:11px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.06);min-height:25px;transition:background .2s;color:var(--text)}
.bteam:last-child{border-bottom:none}
.bteam img{width:18px;height:13px;object-fit:cover;border-radius:2px;flex-shrink:0}
.bteam .fp{width:18px;height:13px;background:rgba(255,255,255,.15);border-radius:2px;flex-shrink:0}
.bteam .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bteam.winner{background:linear-gradient(90deg,rgba(245,200,66,.2),transparent);border-left:3px solid var(--gold2)}
.bteam.winner .tn{color:var(--gold2)}
.bteam.silver{background:linear-gradient(90deg,rgba(180,180,180,.15),transparent);border-left:3px solid #aaa}
.bteam.silver .tn{color:#ccc}
.bteam.loser{opacity:.35}
.bteam.tbd .tn{color:#aab8c9;font-style:italic;font-size:10px}
/* GROUPES POULE */
.groups-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.group-table{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;backdrop-filter:blur(8px)}
.group-table-hdr{background:linear-gradient(135deg,rgba(30,111,255,.25),rgba(20,196,125,.15));padding:7px 12px;font-size:12px;font-weight:800;color:var(--text);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1)}
.group-row{display:flex;align-items:center;gap:5px;padding:5px 10px;border-top:1px solid rgba(255,255,255,.05);font-size:12px}
.group-row.q1,.group-row.q2{background:linear-gradient(90deg,rgba(20,196,125,.15),transparent)}
.group-row.q3{background:linear-gradient(90deg,rgba(245,200,66,.1),transparent)}
.group-row img{width:18px;height:13px;object-fit:cover;border-radius:2px}
.group-row .gr{width:14px;text-align:center;font-weight:800;color:var(--muted);font-size:11px}
.group-row .gn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.group-row .gp{width:18px;text-align:center;font-weight:800;font-size:13px}
.group-row .gs{font-size:11px;color:var(--muted);width:32px;text-align:right}
@media(max-width:820px){
  header,main{padding:10px}
  .hero,.grid,.stats{grid-template-columns:1fr}
  .matches-grid,.pronos-grid{grid-template-columns:1fr;width:100%}
  table{font-size:12px}th,td{padding:7px}
  .groups-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  /* Tabs: 2 par ligne sur mobile */
  .tabs{flex-wrap:wrap!important;overflow-x:visible!important;padding-bottom:6px}
  .tab{flex:0 0 calc(50% - 3px)!important;text-align:center;justify-content:center;white-space:normal!important;font-size:12px!important;padding:8px 4px!important}
  /* Match spécial: score + stats en colonne sur mobile */
  #specialmatchContent .sm-grid,
  #testmatchContent .sm-grid{grid-template-columns:1fr!important}
  /* Formulaire création match spécial: 1 colonne sur mobile */
  #testmatchContent div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}
  /* Inputs et selects dans le formulaire SM: 100% largeur (sauf score-sm) */
  #testmatchContent input:not(.score-sm):not([type=checkbox]), #testmatchContent select{width:100%!important;min-width:0!important;box-sizing:border-box!important;font-size:13px!important;padding:8px 10px!important;height:42px!important;-webkit-appearance:none!important;appearance:none!important}
  /* Lignes SM: colonnes adaptées mobile */
  .sm-row{grid-template-columns:55px 1fr 80px!important;gap:4px!important;padding:7px 6px!important;min-height:48px!important}
  .sm-row span:first-child{font-size:10px!important}
  /* Live score: taille uniforme mobile */
  .sm-row span[style*="font-size"]{font-size:13px!important}
  /* Match spécial: supprimer height:100% sur mobile */
  #specialmatchContent .card > div, #testmatchContent .card > div{height:auto!important}
  #specialmatchContent [style*="height:100%"], #testmatchContent [style*="height:100%"]{height:auto!important}
  /* Tabs scrollables */
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tab{white-space:nowrap;flex-shrink:0}.tabs::-webkit-scrollbar{display:none}
  /* Cards padding réduit */
  .card{padding:14px 12px}
  /* Score inputs: garder la taille standard sur mobile */
  .score-sm{width:40px!important;font-size:16px!important;padding:6px 4px!important}
  /* Tables scroll horizontal */
  table{display:block;overflow-x:auto}
  /* Header boutons en colonne */
  .admin-actions{flex-direction:column}
}
#predEditor{width:100%;box-sizing:border-box}
</style>
</head>

// Compression des pronos pour BIN2 (90chars -> 3chars)
function encodePred(p){
  if(!p||p.scoreA==null||p.scoreB==null)return'';
  let s=p.scoreA+','+p.scoreB;
  if(p.scoreAET!=null)s+=','+p.scoreAET+','+p.scoreBET;
  if(p.penA!=null)s+=','+p.penA+','+p.penB;
  return s;
}
function decodePred(s){
  if(!s)return null;
  const p=s.split(',').map(Number);
  return{scoreA:p[0],scoreB:p[1],scoreAET:p[2]!=null?p[2]:null,scoreBET:p[3]!=null?p[3]:null,penA:p[4]!=null?p[4]:null,penB:p[5]!=null?p[5]:null};
}
function compressPreds(preds){
  const r={};
  for(const[mid,byPlayer] of Object.entries(preds||{})){
    const mp={};
    for(const[pid,prono] of Object.entries(byPlayer||{})){
      const enc=encodePred(prono);
      if(enc)mp[pid]=enc;
    }
    if(Object.keys(mp).length)r[mid]=mp;
  }
  return r;
}
function decompressPreds(compressed){
  const r={};
  for(const[mid,byPlayer] of Object.entries(compressed||{})){
    r[mid]={};
    for(const[pid,enc] of Object.entries(byPlayer||{})){
      const dec=decodePred(enc);
      if(dec)r[mid][pid]=dec;
    }
  }
  return r;
}

    // MAIS prendre specialMatch/specialPronos depuis remote (l'admin les met à jour)

    // Pour le joueur: prendre players depuis remote (mise à jour par admin)
    const isAdmin=getSession()?.role==='admin';
    if(isAdmin){
      // Garder les groupes locaux mais MERGER les players avec remote
      // pour avoir favoriteTeam et autres updates des joueurs
      merged.groups=app.state.groups;
      // Merger players: prendre remote comme base, mais garder groupIds locaux
      const localPlayers=app.state.players;
      merged.players=merged.players.map(rp=>{
        const lp=localPlayers.find(x=>x.id===rp.id);
        return lp?{...rp,groupIds:lp.groupIds}:rp;
      });
      // Ajouter les joueurs locaux qui ne sont pas encore dans remote
      localPlayers.forEach(lp=>{
        if(!merged.players.find(x=>x.id===lp.id))merged.players.push(lp);
      });
    }
    // specialMatch toujours depuis remote
    // specialMatch vient toujours de remote (mis à jour par l'admin)
    // Conserver pronos locaux
    const lp=app.state.predictions||{};
    const rp=merged.predictions||{};
    Object.keys(lp).forEach(mid=>{
      Object.keys(lp[mid]||{}).forEach(pid=>{
        if(lp[mid][pid]!=null){if(!rp[mid])rp[mid]={};rp[mid][pid]=lp[mid][pid];}
      });
    });
    merged.predictions=rp;
    // Fusionner specialPronos locaux
    const lsp=app.state.specialPronos||{};
    const rsp=merged.specialPronos||{};
    Object.keys(lsp).forEach(pid=>{if(lsp[pid])rsp[pid]=lsp[pid];});
    merged.specialPronos=rsp;
    if(JSON.stringify(app.state)!==JSON.stringify(merged)){app.state=merged;onUpdate(merged);}
  },8000);
}

const outcome=(a,b)=>a>b?'A':a<b?'B':'N';
function isMatchLocked(m){
  if(m.scoreA!==null)return true;
  if(!m.date)return false;
  try{
    const nowParis=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
    const todayStr=nowParis.getFullYear()+'-'+String(nowParis.getMonth()+1).padStart(2,'0')+'-'+String(nowParis.getDate()).padStart(2,'0');
    // Si pas d'heure: bloquer dès le début du jour du match (minuit Paris)
    if(!m.time){
      return m.date<=todayStr;
    }
    const[h,mn]=m.time.split(':').map(Number);
    const parisStr=`${m.date}T${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:00`;
    const koLocal=new Date(parisStr);
    const nowLocal=new Date();
    const offset=nowLocal-nowParis;
    const koParis=new Date(koLocal.getTime()+offset);
    return(koParis-nowLocal)<3600000; // 1h avant le match
  }catch{return false;}
}

function isSpecialMatchLocked(sm){
  // Verrouille exactement à l'heure du match spécial (pas 1h avant)
  if(sm.ended)return true;
  if(!sm.date||!sm.time)return false;
  try{
    const[h,mn]=sm.time.split(':').map(Number);
    const parisStr=`${sm.date}T${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:00`;
    const koLocal=new Date(parisStr);
    const nowParis=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
    const nowLocal=new Date();
    const offset=nowLocal-nowParis;
    const koParis=new Date(koLocal.getTime()+offset);
    return(koParis-nowLocal)<300000; // verrouille 5min avant
  }catch{return false;}
}
function isMatchPast(m){
  if(m.scoreA!==null)return true;
  if(!m.date||!m.time)return false;
  try{
    const[h,mn]=m.time.split(':').map(Number);
    const parisStr=`${m.date}T${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:00`;
    const koLocal=new Date(parisStr);
    const nowParis=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
    const nowLocal=new Date();
    const offset=nowLocal-nowParis;
    const koParis=new Date(koLocal.getTime()+offset);
    return nowLocal>koParis;
  }catch{return false;}
}
function koFinalScore(r){
  if(r.scoreAET!=null&&r.scoreBET!=null)return{a:r.scoreAET,b:r.scoreBET};
  return{a:r.scoreA,b:r.scoreB};
}
function calcPoints(match,prono){
  if(!prono||prono.scoreA==null||prono.scoreB==null)return null;
  if(match.scoreA===null||match.scoreB===null)return null;
  const isKo=!!(match.isKo||match.knockout);
  const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
  const mA=Number(match.scoreA),mB=Number(match.scoreB);

  // ── POULE ──────────────────────────────────────
  if(!isKo){
    if(pA===mA&&pB===mB)return 3;
    return outcome(pA,pB)===outcome(mA,mB)?1:0;
  }

  // ── KO ─────────────────────────────────────────
  // ÉTAPE 1 — Score 90min
  // 3pts si exact, 1pt si bon résultat, 0 sinon
  let pts=0;
  if(pA===mA&&pB===mB) pts=3;
  else if(outcome(pA,pB)===outcome(mA,mB)) pts=1;
  else return 0;

  // ÉTAPE 2 — Bonus prolongations
  // Conditions: le match a eu des ET ET le joueur avait prévu nul à 90min (pA===pB)
  const hasET=match.scoreAET!=null&&match.scoreBET!=null;
  const pronoPrevuNul90=pA===pB;
  if(hasET&&pronoPrevuNul90&&prono.scoreAET!=null&&prono.scoreBET!=null){
    const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET);
    const mET_A=Number(match.scoreAET),mET_B=Number(match.scoreBET);
    if(pET_A===mET_A&&pET_B===mET_B){
      pts+=3; // score ET exact: +1 (base) +2 (exact) = +3 bonus
    } else {
      pts+=1; // a prévu le nul -> match allé en ET: +1 bonus de base
    }
  }

  // ÉTAPE 3 — Bonus tirs au but
  // Conditions: le match a eu des TAB ET le joueur avait prévu nul en ET (pET_A===pET_B)
  const hasPen=match.penA!=null&&match.penB!=null;
  const pET_A=prono.scoreAET!=null?Number(prono.scoreAET):null;
  const pET_B=prono.scoreBET!=null?Number(prono.scoreBET):null;
  const pronoPrevuNulET=pET_A!==null&&pET_B!==null&&pET_A===pET_B;
  if(hasPen&&pronoPrevuNulET&&prono.penA!=null&&prono.penB!=null){
    const pP_A=Number(prono.penA),pP_B=Number(prono.penB);
    const mP_A=Number(match.penA),mP_B=Number(match.penB);
    if(pP_A===mP_A&&pP_B===mP_B){
      pts+=3; // score TAB exact: +1 (base) +2 (exact) = +3 bonus
    } else {
      pts+=1; // a prévu le nul en ET -> match allé aux TAB: +1 bonus de base
    }
  }

  return pts;
}
function buildRanking(state,gid,allM,restrict){
  let players;
  if(gid==='all'&&restrict&&restrict.length)players=state.players.filter(p=>p.groupIds.some(g=>restrict.includes(g)));
  else if(gid==='all')players=state.players;
  else players=state.players.filter(p=>p.groupIds.includes(gid));
  // Calculer les résultats du tournoi pour les bonus équipe favorite
  let champTeam=null,finalistTeam=null,thirdTeam=null;
  try{
    const ko=buildKO(state);
    const fin=ko.rounds[5]?.[0]; // finale
    const third=ko.rounds[4]?.[0]; // petite finale
    if(fin&&fin.scoreA!==null){
      champTeam=winner(fin.teamA,fin.teamB,'final',0,state.knockout);
      finalistTeam=champTeam===fin.teamA?fin.teamB:fin.teamA;
    }
    if(third&&third.scoreA!==null){
      thirdTeam=winner(third.teamA,third.teamB,'third',0,state.knockout);
    }
  }catch(e){}

  return players.map(p=>{
    let pts=0,exact=0,good=0,played=0;
    allM.forEach(m=>{const v=calcPoints(m,state.predictions[m.id]?.[p.id]);if(v!==null){pts+=v;played++;if(v>=3)exact++;else if(v>=1)good++;}});
    // Bonus équipe favorite

      if(champTeam&&p.favoriteTeam===champTeam)favBonus=10;
      else if(finalistTeam&&p.favoriteTeam===finalistTeam)favBonus=7;
      else if(thirdTeam&&p.favoriteTeam===thirdTeam)favBonus=5;
    }
    pts+=favBonus;
    // Easter egg bonus
    if(p.easterEggPts)pts+=p.easterEggPts;
    return{...p,pts,exact,good,played,favoriteTeam:p.favoriteTeam||null,favBonus,easterEggPts:p.easterEggPts||0};
  }).sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.exact!==a.exact) return b.exact-a.exact;
    // Départage par progression équipe favorite
    const favProgress=p=>{
      try{
        if(!p.favoriteTeam) return 0;
        const team=p.favoriteTeam;
        const ko=state.knockout||{};
        const built=buildKO(state);
        if(!built||!built.allComplete||!built.rounds) return 0;
        const stageRank={'r32':1,'r16':2,'qf':3,'sf':4,'third':5,'final':6};
        let maxRank=0;
        built.rounds.forEach(round=>{
          if(!Array.isArray(round))return;
          round.forEach(m=>{
            if(!m||!m.stage)return;
            const r=koResult(ko,m.stage,m.index)||{};
            if(r.scoreA==null) return;
            if(m.teamA===team||m.teamB===team){
              const rank=stageRank[m.stage]||0;
              if(rank>maxRank) maxRank=rank;
            }
          });
        });
        return maxRank;
      }catch(e){return 0;}
    };
    const fa=favProgress(a),fb=favProgress(b);
    if(fb!==fa) return fb-fa;
    return a.name.localeCompare(b.name);
  });
}

function groupStandings(matches,group){
  const ms=matches.filter(m=>m.preloaded&&m.wcGroup===group);
  const ts=new Set();ms.forEach(m=>{ts.add(m.teamA);ts.add(m.teamB)});
  const rows={};ts.forEach(t=>{rows[t]={team:t,group,played:0,points:0,gf:0,ga:0}});
  let done=0;
  ms.forEach(m=>{
    if(m.scoreA===null||m.scoreB===null)return;done++;
    const a=rows[m.teamA],b=rows[m.teamB];if(!a||!b)return;
    a.played++;b.played++;a.gf+=m.scoreA;a.ga+=m.scoreB;b.gf+=m.scoreB;b.ga+=m.scoreA;
    if(m.scoreA>m.scoreB)a.points+=3;else if(m.scoreA<m.scoreB)b.points+=3;else{a.points++;b.points++;}
  });
  const table=Object.values(rows).map(r=>({...r,gd:r.gf-r.ga}));
  table.sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||teamName(a.team).localeCompare(teamName(b.team)));
  return{group,complete:done>0&&done===ms.length,done,total:ms.length,table};
}
function getBest8(standings){
  return standings.filter(s=>s.table.length>=3).map(s=>({...s.table[2],group:s.group}))
    .sort((a,b)=>b.points-a.points||(b.gd-a.gd)||(b.gf-a.gf)||a.group.localeCompare(b.group)).slice(0,8);
}

const koResult=(ko,stage,idx)=>ko[`${stage}-${idx}`]||{scoreA:null,scoreB:null,scoreAET:null,scoreBET:null,penA:null,penB:null};
function winner(tA,tB,stage,idx,ko){
  if(!tA||!tB)return null;
  const r=koResult(ko,stage,idx);
  if(r.scoreA===null||r.scoreB===null)return null;
  const fs=koFinalScore(r);
  if(fs.a>fs.b)return tA;if(fs.b>fs.a)return tB;
  if(r.penA!=null&&r.penB!=null&&r.penA!==r.penB)return r.penA>r.penB?tA:tB;
  return null;
}
// Cache buildKO pour éviter les recalculs multiples par rendu
let _koCache=null, _koCacheKey=null;
function buildKO(state){
  const key=(state.knockout?Object.keys(state.knockout).length:0)+"|"+(state.matchScores?Object.keys(state.matchScores).length:0)+"|"+(state.groupOverrides?JSON.stringify(state.groupOverrides):"");
  if(_koCache&&_koCacheKey===key)return _koCache;
  _koCacheKey=key;
  const letters='ABCDEFGHIJKL'.split('');
  const standings=letters.map(g=>groupStandings(state.matches,g));
  const allComplete=standings.every(s=>s.complete&&s.total>0);
  const groupMap={};standings.forEach(s=>{if(s.table[0])groupMap['1'+s.group]=s.table[0].team;if(s.table[1])groupMap['2'+s.group]=s.table[1].team;});
  // Appliquer les overrides manuels (corrections admin)
  const overrides=state.groupOverrides||{};
  Object.entries(overrides).forEach(([slot,team])=>{if(team&&slot)groupMap[slot]=team;});
  const best8=getBest8(standings);
  const resolve=resolveSlots(R32_DEFS,groupMap,best8);
  const r32=R32_DEFS.map(([mn,sA,sB,date],i)=>{const kt=KO_TIMES[mn]||{};return{stage:'r32',index:i,matchNo:mn,date:kt.date||date,time:kt.time||null,slotA:sA,slotB:sB,teamA:resolve(sA,i),teamB:resolve(sB,i),...koResult(state.knockout,'r32',i)};});
  const r16=R16_PAIRS.map(([x,y],i)=>({stage:'r16',index:i,matchNo:89+i,...(KO_TIMES[89+i]||{}),teamA:winner(r32[x].teamA,r32[x].teamB,'r32',x,state.knockout),teamB:winner(r32[y].teamA,r32[y].teamB,'r32',y,state.knockout),slotA:`W.M${r32[x].matchNo}`,slotB:`W.M${r32[y].matchNo}`,...koResult(state.knockout,'r16',i)}));
  const qf=QF_PAIRS.map(([x,y],i)=>({stage:'qf',index:i,matchNo:97+i,...(KO_TIMES[97+i]||{}),teamA:winner(r16[x].teamA,r16[x].teamB,'r16',x,state.knockout),teamB:winner(r16[y].teamA,r16[y].teamB,'r16',y,state.knockout),...koResult(state.knockout,'qf',i)}));
  const sf=[0,1].map(i=>({stage:'sf',index:i,matchNo:101+i,...(KO_TIMES[101+i]||{}),teamA:winner(qf[i*2].teamA,qf[i*2].teamB,'qf',i*2,state.knockout),teamB:winner(qf[i*2+1].teamA,qf[i*2+1].teamB,'qf',i*2+1,state.knockout),...koResult(state.knockout,'sf',i)}));
  function loser(tA,tB,stage,idx){const w=winner(tA,tB,stage,idx,state.knockout);if(!w||(!tA&&!tB))return null;return w===tA?tB:tA;}
  const third=[{stage:'third',index:0,matchNo:103,...(KO_TIMES[103]||{}),teamA:loser(sf[0].teamA,sf[0].teamB,'sf',0),teamB:loser(sf[1].teamA,sf[1].teamB,'sf',1),...koResult(state.knockout,'third',0)}];
  const finale=[{stage:'final',index:0,matchNo:104,...(KO_TIMES[104]||{}),teamA:winner(sf[0].teamA,sf[0].teamB,'sf',0,state.knockout),teamB:winner(sf[1].teamA,sf[1].teamB,'sf',1,state.knockout),...koResult(state.knockout,'final',0)}];
  _koCache={allComplete,standings,best8,rounds:[r32,r16,qf,sf,third,finale]};return _koCache;
}
function allKoMatches(state){
  const built=buildKO(state);if(!built.allComplete)return[];
  const labels=KO_STAGES.map(s=>s[1]);
  return built.rounds.flatMap((round,si)=>round.filter(m=>m.teamA&&m.teamB).map(m=>{
    const r=koResult(state.knockout,m.stage,m.index);
    return{id:`ko-${m.stage}-${m.index}`,matchNo:m.matchNo||null,date:m.date||'',time:m.time||'',wcGroup:labels[si],phase:m.stage,teamA:m.teamA,teamB:m.teamB,scoreA:r.scoreA,scoreB:r.scoreB,scoreAET:r.scoreAET,scoreBET:r.scoreBET,penA:r.penA,penB:r.penB,isKo:true};
  }));
}
function allMatches(state){return[...state.matches,...allKoMatches(state)];}

function getPhaseOpts(state){
  const opts=[{value:'groups',label:'Phase de groupes'}];
  const built=buildKO(state);
  if(built.allComplete)KO_STAGES.forEach(([key,label],si)=>{const r=built.rounds[si];if(r&&r.some(m=>m.teamA&&m.teamB))opts.push({value:key,label});});
  return opts;
}
function phaseSelector(state,selectId,cur){
  const opts=getPhaseOpts(state);const c=cur||opts[0].value;
  return`<div class="phase-selector"><label for="${selectId}">Phase :</label><select id="${selectId}">${opts.map(o=>`<option value="${o.value}" ${o.value===c?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
}
function matchesForPhase(state,phase){
  if(!phase||phase==='groups')return state.matches;
  const built=buildKO(state);if(!built.allComplete)return[];
  const si=KO_STAGES.findIndex(s=>s[0]===phase);if(si<0)return[];
  const labels=KO_STAGES.map(s=>s[1]);
  return built.rounds[si].filter(m=>m.teamA&&m.teamB).map(m=>{
    const r=koResult(state.knockout,m.stage,m.index);
    return{id:`ko-${m.stage}-${m.index}`,matchNo:m.matchNo||null,date:m.date||'',time:m.time||'',wcGroup:labels[si],phase:m.stage,teamA:m.teamA,teamB:m.teamB,scoreA:r.scoreA,scoreB:r.scoreB,scoreAET:r.scoreAET,scoreBET:r.scoreBET,penA:r.penA,penB:r.penB,isKo:true};
  });
}

// RENDER — Classements de poule
// ══════════════════════════════════════════════
function renderGroupTables(state,containerId){
  const el=$(containerId);if(!el)return;
  const letters='ABCDEFGHIJKL'.split('');
  const standings=letters.map(g=>groupStandings(state.matches,g));
  const best8teams=new Set(getBest8(standings).map(t=>t.team));
  el.innerHTML='<div class="groups-grid">'+standings.map(s=>{
    const{group,table,done,total}=s;
    const rows=table.map((r,i)=>{
      const url=teamFlag(r.team);
      const img=url?`<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
      const cls=i===0?'group-row q1':i===1?'group-row q2':best8teams.has(r.team)?'group-row q3':'group-row';
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      return`<div class="${cls}"><span class="gr">${medal||i+1}</span>${img}<span class="gn">${esc(teamName(r.team))}</span><span class="gp">${r.points}</span><span class="gs">${r.played?r.gf+'-'+r.ga:'-'}</span></div>`;
    }).join('');
    return`<div class="group-table"><div class="group-table-hdr"><span>Groupe ${group}</span><span style="font-size:11px;color:var(--muted)">${done}/${total}</span></div>${rows}</div>`;
  }).join('')+'</div>';
}

    if(!slot)return'?';
    if(slot.length===2)return(slot[0]==='1'?'1er':slot[0]==='2'?'2e':'3e')+' Grp '+slot[1];
    if(slot.startsWith('W.'))return slot;
    return'3e Grp '+slot.slice(1).split('').join('/');
  }
  function bTeam(code,slot,win,lose,silver){
    const url=teamFlag(code);
    const img=url?`<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<div class="fp"></div>`;
    const cls='bteam'+(win?(silver?' silver':' winner'):lose?' loser':code?'':' tbd');
    return`<div class="${cls}">${img}<span class="tn">${esc(code?teamName(code):slotLabel(slot))}</span></div>`;
  }
  function bMatch(m,silver){
    const r=koResult(ko,m.stage,m.index);const fs=koFinalScore(r);
    const has=r.scoreA!==null&&r.scoreB!==null;
    const wA=has&&(fs.a>fs.b||(fs.a===fs.b&&r.penA!=null&&r.penA>r.penB));
    const wB=has&&(fs.b>fs.a||(fs.a===fs.b&&r.penB!=null&&r.penB>r.penA));
    return`<div class="bmatch">${bTeam(m.teamA,m.slotA,wA,has&&!wA&&wB,silver)}${bTeam(m.teamB,m.slotB,wB,has&&!wB&&wA,silver)}</div>`;
  }
  function col(label,matches,sfcol,silver){
    return`<div class="bcol"><div class="bcol-label">${label}</div><div class="bmatches${sfcol?' sf-m':''}">${matches.map(m=>bMatch(m,silver||false)).join('')}</div></div>`;
  }
  // Finale + petite finale en haut
  function finBox(m,gold){
    const r=koResult(ko,m.stage,m.index);const fs=koFinalScore(r);
    const has=r.scoreA!==null&&r.scoreB!==null;
    const wA=has&&(fs.a>fs.b||(fs.a===fs.b&&r.penA!=null&&r.penA>r.penB));
    const wB=has&&(fs.b>fs.a||(fs.a===fs.b&&r.penB!=null&&r.penB>r.penA));
    function side(code,slot,win,lose){
      const url=code?teamFlag(code):'';
      const img=url?`<img src="${url}" alt="" style="width:22px;height:16px;object-fit:cover;border-radius:3px">`:`<div style="width:22px;height:16px;background:#e8eef7;border-radius:3px;flex-shrink:0"></div>`;
      return`<div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;${lose?'opacity:.4':''}"><span style="color:${win?(gold?'#c8860a':'#555'):'inherit'}">${img}${esc(code?teamName(code):slotLabel(slot))}</span></div>`;
    }
    let scoreStr='';
    if(has){scoreStr=`${r.scoreA}-${r.scoreB}`;if(r.scoreAET!=null)scoreStr+=` (${r.scoreAET}-${r.scoreBET} ap)`;if(r.penA!=null)scoreStr+=` (${r.penA}-${r.penB} tab)`;}
    const boxStyle=gold?'background:linear-gradient(135deg,rgba(245,200,66,.15),rgba(245,200,66,.08));border:2px solid rgba(245,200,66,.5);border-radius:16px;padding:12px 20px;min-width:230px;text-align:center;box-shadow:0 4px 20px rgba(200,134,10,.22)'
      :'background:rgba(120,120,140,.2);border:2px solid rgba(160,160,180,.4);border-radius:14px;padding:10px 18px;min-width:210px;text-align:center';
    return`<div style="${boxStyle}"><div style="font-size:12px;font-weight:800;color:${gold?'#c8860a':'#707070'};margin-bottom:8px">${gold?'🏆 FINALE — M104':'🥉 PETITE FINALE — M103'}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px">${side(m.teamA,m.slotA||'?',wA,has&&wB&&!wA)}<span style="font-size:11px;font-weight:800;color:${gold?'#c8860a':'#888'}">VS</span>${side(m.teamB,m.slotB||'?',wB,has&&wA&&!wB)}</div>
      ${has?`<div style="font-size:13px;font-weight:800;color:${gold?'#c8860a':'#666'};margin-top:6px">${scoreStr}</div>`:''}</div>`;
  }
  const lR32=[r32[1],r32[4],r32[0],r32[2],r32[10],r32[11],r32[8],r32[9]];
  const rR32=[r32[3],r32[5],r32[6],r32[7],r32[13],r32[15],r32[12],r32[14]];
  el.innerHTML=
    `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px">${finBox(finale[0],true)}${finBox(third[0],false)}</div>`+
    `<div class="bracket-scroll"><div class="bracket">${col('16es',lR32,false)}${col('8es',[r16[0],r16[1],r16[4],r16[5]],false)}${col('QF',qf.slice(0,2),false)}${col('SF',sf.slice(0,1),true)}${col('SF',sf.slice(1,2),true)}${col('QF',qf.slice(2,4),false)}${col('8es',[r16[2],r16[3],r16[6],r16[7]],false)}${col('16es',rR32,false)}</div></div>`;
}

// ══════════════════════════════════════════════
// RENDER — Prono block
// ══════════════════════════════════════════════
function renderPredBlock(state,match,player){
  if(!match||!player||!match.id||!player.id)return '';
  try{
  const prono=state.predictions[match.id]?.[player.id];
  const pts=calcPoints(match,prono);
  const locked=isMatchLocked(match);
  const hasPred=prono!=null&&prono.scoreA!=null&&prono.scoreB!=null;
  const isKo=!!(match.isKo||match.knockout);
  const v=x=>x!=null?x:'';
  const mid=match.id,pid=player.id;
  let bgStyle,statusBadge;
  if(locked&&hasPred){
    // Calcul détaillé ligne par ligne
    const pA2=Number(prono.scoreA),pB2=Number(prono.scoreB);
    const mA2=Number(match.scoreA),mB2=Number(match.scoreB);
    let detail='',pts90=0,ptsET=0,ptsTAB=0;

    // 90min
    if(pA2===mA2&&pB2===mB2){pts90=3;detail+=`<div style="font-size:11px;color:rgba(20,196,125,.9);margin-top:4px">⚽ 90min <b>${pA2}-${pB2}</b> exact → <b>3pts</b></div>`;}
    else if(outcome(pA2,pB2)===outcome(mA2,mB2)){pts90=1;detail+=`<div style="font-size:11px;color:rgba(100,200,140,.8);margin-top:4px">⚽ 90min bon résultat → <b>1pt</b></div>`;}
    else{detail+=`<div style="font-size:11px;color:rgba(252,129,129,.8);margin-top:4px">⚽ 90min mauvais résultat → <b>0pt</b></div>`;}

    // ET
    if(isKo&&match.scoreAET!=null&&pA2===pB2&&prono.scoreAET!=null){
      const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET);
      const mET_A=Number(match.scoreAET),mET_B=Number(match.scoreBET);
      if(pET_A===mET_A&&pET_B===mET_B){ptsET=3;detail+=`<div style="font-size:11px;color:rgba(100,160,255,.9);margin-top:2px">🔵 Prolong. <b>${pET_A}-${pET_B}</b> exact → <b>+3 bonus</b></div>`;}
      else{ptsET=1;detail+=`<div style="font-size:11px;color:rgba(100,160,255,.7);margin-top:2px">🔵 Prolong. prévu (nul à 90) → <b>+1 bonus</b></div>`;}
    } else if(isKo&&match.scoreAET!=null&&pA2===pB2&&prono.scoreAET==null){
      ptsET=1;detail+=`<div style="font-size:11px;color:rgba(100,160,255,.7);margin-top:2px">🔵 Prolong. prévu (nul à 90) → <b>+1 bonus</b></div>`;
    }

    // TAB
    if(isKo&&match.penA!=null){
      const pET_A2=prono.scoreAET!=null?Number(prono.scoreAET):null;
      const pET_B2=prono.scoreBET!=null?Number(prono.scoreBET):null;
      if(pET_A2!==null&&pET_A2===pET_B2&&prono.penA!=null){
        const pP_A=Number(prono.penA),pP_B=Number(prono.penB);
        const mP_A=Number(match.penA),mP_B=Number(match.penB);
        if(pP_A===mP_A&&pP_B===mP_B){ptsTAB=3;detail+=`<div style="font-size:11px;color:rgba(245,200,66,.9);margin-top:2px">🟡 Tirs au but <b>${pP_A}-${pP_B}</b> exact → <b>+3 bonus</b></div>`;}
        else{ptsTAB=1;detail+=`<div style="font-size:11px;color:rgba(245,200,66,.7);margin-top:2px">🟡 Tirs au but prévu (nul en prolong.) → <b>+1 bonus</b></div>`;}
      }
    }

    const total=pts90+ptsET+ptsTAB;
    if(total>=3){
      bgStyle='background:linear-gradient(135deg,rgba(20,196,125,.25),rgba(10,157,101,.2));border:1.5px solid rgba(20,196,125,.6);border-radius:10px;padding:6px 8px;margin-top:4px';
      statusBadge=`<span style="font-size:11px;font-weight:800;background:#276749;color:#fff;padding:1px 8px;border-radius:999px">🎯 ${total}pts</span>`;
    } else if(total>=1){
      bgStyle='background:rgba(20,196,125,.12);border:1.5px solid rgba(20,196,125,.35);border-radius:10px;padding:6px 8px;margin-top:4px';
      statusBadge=`<span style="font-size:11px;font-weight:800;background:#08784e;color:#fff;padding:1px 8px;border-radius:999px">✓ ${total}pt${total>1?'s':''}</span>`;
    } else {
      bgStyle='background:rgba(168,21,55,.2);border:1.5px solid rgba(252,129,129,.4);border-radius:10px;padding:6px 8px;margin-top:4px';
      statusBadge='<span style="font-size:11px;font-weight:800;background:#c53030;color:#fff;padding:1px 8px;border-radius:999px">✗ Raté 0pt</span>';
      detail=''; // pas besoin de détail si raté
    }
    // Ajouter le détail dans statusBadge
    statusBadge+=detail;
  }else if(locked&&!hasPred){bgStyle='background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 8px;margin-top:4px';statusBadge='<span style="font-size:11px;color:rgba(255,255,255,.4)">— Pas de prono</span>';}
  else if(!locked&&hasPred){bgStyle='background:rgba(20,196,125,.1);border:1px solid rgba(20,196,125,.3);border-radius:10px;padding:6px 8px;margin-top:4px';statusBadge='<span style="font-size:11px;font-weight:700;background:rgba(20,196,125,.25);color:#4de8a8;padding:1px 8px;border-radius:999px">✓ Saisi</span>';}
  else{bgStyle='background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 8px;margin-top:4px';statusBadge='<span style="font-size:11px;color:rgba(255,255,255,.35)">En attente</span>';}
  const ro=locked?'readonly':'';
  // Bloquer ET si score 90min non nul, TAB si ET non nul
  const _sA=prono?.scoreA!=null?Number(prono.scoreA):null;
  const _sB=prono?.scoreB!=null?Number(prono.scoreB):null;
  const _etA=prono?.scoreAET!=null?Number(prono.scoreAET):null;
  const _etB=prono?.scoreBET!=null?Number(prono.scoreBET):null;
  const etRo=(!locked&&_sA!=null&&_sA!==_sB)?'disabled':ro;
  const penRo=(!locked&&(_sA!=null&&_sA!==_sB||(_etA!=null&&_etA!==_etB)))?'disabled':ro;const op=locked?';opacity:.55;cursor:not-allowed':'';
  const inputStyle='background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:800';
  const inputStyleLocked='background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.45);font-weight:800;cursor:not-allowed';
  const row90=`<div style="display:grid;grid-template-columns:100px 1fr 50px;align-items:center;gap:6px"><div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(player.name)}</b>${statusBadge}</div><div style="display:flex;align-items:center;justify-content:center;gap:5px"><input type="number" inputmode="numeric" min="0" class="score-sm" id="pa-${mid}-${pid}" value="${prono?.scoreA!=null?prono.scoreA:0}" placeholder="0" ${ro} style="${locked?inputStyleLocked:inputStyle}"><span style="color:rgba(255,255,255,.4);font-weight:800">-</span><input type="number" inputmode="numeric" min="0" class="score-sm" id="pb-${mid}-${pid}" value="${prono?.scoreB!=null?prono.scoreB:0}" placeholder="0" ${ro} style="${locked?inputStyleLocked:inputStyle}"></div>${locked?'<span style="font-size:13px">🔒</span>':`<button class="primary small" type="button" data-action="set-pred" data-match="${mid}" data-player="${pid}" translate="no">OK</button>`}</div>`;
  if(!isKo)return`<div style="${bgStyle}">${row90}</div>`;
  // KO: toujours afficher ET et TAB (pour que le joueur puisse tout saisir d'un coup)
  const _koHint=locked?'':
    `<div style="font-size:10px;color:rgba(255,255,255,.35);margin-top:4px;padding-left:2px">ℹ️ Remplis Prolong. si nul · Tirs au but si nul en prolong.</div>`;
  const etStyle='background:rgba(100,160,255,.2);border:1px solid rgba(100,160,255,.4);color:#fff;font-weight:800';
  const penStyle='background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.35);color:#fff;font-weight:800';
  // Désactiver ET si score non nul à 90min (pas encore saisi ou différent)
  const curA=prono?.scoreA!=null?Number(prono.scoreA):null;
  const curB=prono?.scoreB!=null?Number(prono.scoreB):null;
  const isNul90=curA!=null&&curA===curB;
  const etDisabled=(!locked&&curA!=null&&!isNul90)?'disabled':'';
  const tabDisabled=(!locked&&(curA!=null&&!isNul90||prono?.scoreAET!=null&&prono?.scoreBET!=null&&Number(prono.scoreAET)!==Number(prono.scoreBET)))?'disabled':'';
  const rowET=`<div style="display:grid;grid-template-columns:100px 1fr 50px;align-items:center;gap:5px;margin-top:4px"><span style="font-size:10px;color:rgba(100,160,255,.9);font-weight:600;white-space:nowrap">Prolong. :</span><div style="display:flex;align-items:center;justify-content:center;gap:5px"><input type="number" inputmode="numeric" min="0" class="score-sm" style="${locked||etDisabled?inputStyleLocked:etStyle}" id="pet-a-${mid}-${pid}" value="${etDisabled?'':(prono?.scoreAET!=null?prono.scoreAET:'')}" placeholder="-" ${ro} ${etDisabled}><span style="color:rgba(255,255,255,.5);font-weight:800">-</span><input type="number" inputmode="numeric" min="0" class="score-sm" style="${locked||etDisabled?inputStyleLocked:etStyle}" id="pet-b-${mid}-${pid}" value="${etDisabled?'':(prono?.scoreBET!=null?prono.scoreBET:'')}" placeholder="-" ${ro} ${etDisabled}></div><span style="font-size:10px;color:rgba(255,255,255,.4);white-space:nowrap">(si nul)</span></div>`;
  const rowPen=`<div style="display:grid;grid-template-columns:100px 1fr 50px;align-items:center;gap:5px;margin-top:4px"><span style="font-size:10px;color:rgba(245,200,66,.9);font-weight:600;white-space:nowrap">Tirs au but :</span><div style="display:flex;align-items:center;justify-content:center;gap:5px"><input type="number" inputmode="numeric" min="0" class="score-sm" style="${locked||tabDisabled?inputStyleLocked:penStyle}${tabDisabled?';opacity:.4':''}" id="ppa-${mid}-${pid}" ${tabDisabled} value="${prono?.penA!=null?prono.penA:''}" placeholder="-" ${ro}><span style="color:rgba(255,255,255,.5);font-weight:800">-</span><input type="number" inputmode="numeric" min="0" class="score-sm" style="${locked?inputStyleLocked:penStyle}" id="ppb-${mid}-${pid}" value="${prono?.penB!=null?prono.penB:''}" placeholder="-" ${ro} ${tabDisabled}></div><span></span></div>`;
  return`<div style="${bgStyle}">${row90}${rowET}${rowPen}${_koHint}</div>`;
  }catch(_rpe){console.error('renderPredBlock crash:',_rpe,'match:',match?.id,'player:',player?.id,'line:',_rpe.stack?.split('\n')[1]?.trim());return '';}
}

// ══════════════════════════════════════════════
// RENDER — Match card
// ══════════════════════════════════════════════
function renderMatchCard(state,m,editable){
  const isKo=!!m.isKo;
  const idx=isKo?parseInt(m.id.split('-').pop()||0):null;
  const r=isKo?koResult(state.knockout,m.phase,idx):{scoreA:m.scoreA,scoreB:m.scoreB,scoreAET:null,scoreBET:null,penA:null,penB:null};
  const validated=r.scoreA!==null&&r.scoreB!==null;
  if(validated)editable=false; // Score validé = non modifiable
  const hasET=isKo&&r.scoreAET!==null&&r.scoreBET!==null;
  const hasPen=isKo&&r.penA!==null&&r.penB!==null;
  let summary='';if(validated){summary=`${r.scoreA}-${r.scoreB}`;if(hasET)summary+=` (${r.scoreAET}-${r.scoreBET} ap)`;if(hasPen)summary+=` (${r.penA}-${r.penB} tab)`;}
  const badge=validated?`<span style="color:#08784e;font-size:11px;font-weight:700">✓ ${summary}</span>`:'';
  const saId=isKo?`koa-${m.phase}-${idx}`:`ra-${m.id}`;
  const sbId=isKo?`kob-${m.phase}-${idx}`:`rb-${m.id}`;
  if(!editable){return`<div class="match${validated?' validated':''}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><span style="font-size:11px;color:var(--muted)">${m.matchNo?'M'+m.matchNo+' · ':(m.id&&m.id.startsWith('M')?m.id+' · ':'')}${m.time||''} ${dateFr(m.date)}${m.wcGroup?' · '+esc(m.wcGroup):''} </span><div style="display:flex;align-items:center;gap:6px">${badge}${validated?`<button type="button" title="Modifier ce score" data-action="unlock-score" data-mid="${m.id}" data-stage="${m.phase||''}" data-index="${m.isKo?m.id.split('-').pop():''}" style="background:none;border:none;cursor:pointer;font-size:13px;opacity:.5;padding:2px 4px" title="Modifier le score">🔓</button>`:''}</div></div><div class="match-row">${teamHtml(m.teamA)}<div style="padding:0 8px;font-weight:800">${validated?summary:'?-?'}</div>${teamHtml(m.teamB)}</div></div>`;}
  const koBlock=isKo?`<div style="margin-top:7px;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.15)">
    <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin-bottom:5px"><span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:600">90 min</span><div style="display:flex;align-items:center;gap:5px"><input type="number" inputmode="numeric" min="0" class="score-sm" id="${saId}" value="${r.scoreA!=null?r.scoreA:0}" placeholder="0"><span style="color:var(--muted);font-weight:800">-</span><input type="number" inputmode="numeric" min="0" class="score-sm" id="${sbId}" value="${r.scoreB!=null?r.scoreB:0}" placeholder="0"><span style="font-size:10px;color:rgba(255,255,255,.35)">(si nul→prolong.)</span></div></div>
    <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin-bottom:5px"><span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:600">Prolongations</span><div style="display:flex;align-items:center;gap:5px"><input type="number" inputmode="numeric" min="0" class="score-sm" id="koaet-${m.phase}-${idx}" value="${r.scoreAET!=null?r.scoreAET:''}" placeholder="-"><span style="color:var(--muted);font-weight:800">-</span><input type="number" inputmode="numeric" min="0" class="score-sm" id="kobet-${m.phase}-${idx}" value="${r.scoreBET!=null?r.scoreBET:''}" placeholder="-"><span style="font-size:10px;color:rgba(255,255,255,.35)">(si nul→tab)</span></div></div>
    <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center"><span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:600">Tirs au but</span><div style="display:flex;align-items:center;gap:5px"><input type="number" inputmode="numeric" min="0" class="score-sm" id="kopa-${m.phase}-${idx}" value="${r.penA!=null?r.penA:''}" placeholder="-"><span style="color:var(--muted);font-weight:800">-</span><input type="number" inputmode="numeric" min="0" class="score-sm" id="kopb-${m.phase}-${idx}" value="${r.penB!=null?r.penB:''}" placeholder="-"></div></div>
  </div><div style="margin-top:7px;display:flex;justify-content:flex-end"><button class="primary small" type="button" data-action="set-ko" data-stage="${m.phase}" data-index="${idx}">Valider</button></div>`
  :`<div class="match-row" style="margin-top:6px"><div class="team" style="flex:1;min-width:0">${teamHtml(m.teamA)}</div><div class="score-box"><input type="number" inputmode="numeric" min="0" class="score-sm" id="${saId}" value="${r.scoreA!=null?r.scoreA:0}" placeholder="0"><span>-</span><input type="number" inputmode="numeric" min="0" class="score-sm" id="${sbId}" value="${r.scoreB!=null?r.scoreB:0}" placeholder="0"><button class="primary small" type="button" data-action="update-result" data-id="${m.id}" translate="no">OK</button></div><div class="team" style="flex:1;min-width:0;justify-content:flex-end">${teamHtml(m.teamB)}</div></div>`;
  return`<div class="match${validated?' validated':''}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:11px;color:var(--muted)">${m.matchNo?'M'+m.matchNo+' · ':(m.id&&m.id.startsWith('M')?m.id+' · ':'')}${m.time||''} ${dateFr(m.date)}${m.wcGroup?' · '+esc(m.wcGroup):''} </span>${badge}</div>${isKo?`<div class="match-row" style="margin-bottom:4px">${teamHtml(m.teamA)}<span style="flex:1"></span>${teamHtml(m.teamB)}</div>${koBlock}`:koBlock}</div>`;
}

function renderMatchSection(state,opts,isAdmin){
  const mps=$('matchPhaseSelector');if(!mps)return;
  const curPhase=opts.matchPhase||mps.querySelector('select')?.value||'groups';
  mps.innerHTML=phaseSelector(state,'matchPhaseSelect',curPhase);
  const phase=$('matchPhaseSelect')?.value||'groups';
  const ml=$('matchesList');if(!ml)return;
  let matches=matchesForPhase(state,phase);
  // Toggle passés
  const tb=$('togglePastMatchBtn');
  const showPast=tb?tb.dataset.showPast==='1':true;
  if(!showPast)matches=matches.filter(m=>!isMatchPast(m));
  if(!matches.length){ml.innerHTML='<div class="empty">Aucun match.</div>';return}
  const bulk=isAdmin?`<div style="margin-bottom:10px;display:flex;justify-content:flex-end;gap:8px">
    <button style="border:1px dashed #c9d9ea;background:#fffbe6;color:#875700;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit" type="button" data-action="gen-fake" data-phase="${phase}">🎲 Faux scores</button>
    <button class="primary small" type="button" data-action="validate-all" data-phase="${phase}">✓ Valider tous</button>
  </div>`:'';
  ml.innerHTML=bulk+`<div class="matches-grid">${matches.map(m=>renderMatchCard(state,m,isAdmin)).join('')}</div>`;
}

function renderPronos(state,opts,players,isAdmin){
  const pps=$('pronosPhaseSelector');if(!pps)return;
  const curPhase=opts.pronosPhase||pps.querySelector('select')?.value||'groups';
  pps.innerHTML=phaseSelector(state,'pronosPhaseSelect',curPhase);
  const phase=$('pronosPhaseSelect')?.value||'groups';
  const poolEl=$('pronosPoolFilter');const poolFilter=poolEl?poolEl.value||'all':'all';
  const pfEl=$('pronosPlayerFilter');
  // Remplir le select joueurs dynamiquement
  if(pfEl&&isAdmin){
    const curPF=pfEl.value||'all';
    pfEl.innerHTML='<option value="all">Tous les joueurs</option>'+
      state.players.filter(p=>p.groupIds.some(g=>g!=='matchunique')||p.groupIds.length===0)
        .map(p=>'<option value="'+p.id+'"'+(p.id===curPF?' selected':'')+'>'+esc(p.name)+'</option>').join('');
  }
  const playerFilter=pfEl?pfEl.value||'all':'all';
  const filteredPlayers=(playerFilter!=='all'?players.filter(p=>p.id===playerFilter):players).filter(p=>p&&p.id);
  const tb=$('togglePastBtn');const showPast=tb?tb.dataset.showPast==='1':true;
  let matchList=matchesForPhase(state,phase);
  if(poolFilter!=='all'&&phase==='groups')matchList=matchList.filter(m=>m.wcGroup===poolFilter);
  if(!showPast)matchList=matchList.filter(m=>!isMatchPast(m));
  const editor=$('predEditor');if(!editor)return;
  if(!matchList.length){editor.innerHTML='<div class="empty">Aucun match.</div>';return}
  const cards=matchList.map(m=>{ try {
    const locked=isMatchLocked(m);const officialIn=m.scoreA!==null;
    const allDone=filteredPlayers.length>0&&filteredPlayers.every(p=>{const pr=state.predictions[m.id]?.[p.id];return pr!=null&&pr.scoreA!=null;});
    const bg=locked&&officialIn?'background:rgba(20,196,125,.1);border:1px solid rgba(20,196,125,.25)':locked?'background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)':allDone?'background:rgba(20,196,125,.12);border:1px solid rgba(20,196,125,.3)':'background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)';
    const lockBadge=locked&&!officialIn?`<span style="font-size:11px;background:rgba(245,200,66,.15);color:#f5d442;border:1px solid rgba(245,200,66,.25);padding:2px 8px;border-radius:999px">🔒 Fermé</span>`:'';
    return`<div style="${bg};border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px)"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px"><span style="font-size:11px;color:var(--muted)">${m.matchNo?'M'+m.matchNo+' · ':(m.id&&m.id.startsWith('M')?m.id+' · ':'')}${m.time||''} ${dateFr(m.date)} · ${esc(m.wcGroup)}</span>${officialIn?`<span class="badge paid">${m.scoreA}-${m.scoreB}</span>`:lockBadge}</div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">${teamHtml(m.teamA)}<span style="font-size:13px;color:rgba(255,255,255,.4)">vs</span>${teamHtml(m.teamB)}</div>${filteredPlayers.map(p=>{try{return renderPredBlock(state,m,p);}catch(e){return '';}}).join('')}</div>`;
  } catch(_ce){console.error('card error:',_ce.message,'match:',m?.id,'stack:',_ce.stack?.split('\n')[1]);return '';}
  }).join('');
  editor.innerHTML=`<div class="pronos-grid">${cards}</div>`;
}

function calcSpecialPoints(match, prono) {
  if(!prono||!match)return null;
  if(!match.ended)return null; // match pas terminé
  let pts = 0;
  const detail = [];

  // Score (même barème KO)
  if(prono.scoreA!=null&&prono.scoreB!=null&&match.scoreA!=null&&match.scoreB!=null){
    const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
    const mA=Number(match.scoreA),mB=Number(match.scoreB);
    const s90 = pA===mA&&pB===mB?3:(outcome(pA,pB)===outcome(mA,mB)?1:0);
    pts+=s90;
    if(s90===3)detail.push({icon:'⚽',text:`Score ${mA}-${mB} exact`,pts:3,color:'rgba(20,196,125,.9)'});
    else if(s90===1)detail.push({icon:'⚽',text:'Bon résultat',pts:1,color:'rgba(100,200,140,.8)'});
    else detail.push({icon:'⚽',text:'Mauvais résultat',pts:0,color:'rgba(252,129,129,.8)'});
    // Bonus ET/TAB si applicable
    if(match.canET){
      const prevuNul=(pA===pB);
      if(match.scoreAET!=null&&prevuNul&&prono.scoreAET!=null){
        const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET);
        const mET_A=Number(match.scoreAET),mET_B=Number(match.scoreBET);
        const bET=pET_A===mET_A&&pET_B===mET_B?3:1;
        pts+=bET;
        detail.push({icon:'🔵',text:bET===3?`Prolong. ${mET_A}-${mET_B} exact`:'Prolong. prévu',pts:bET,color:'rgba(100,160,255,.9)'});
      }
      if(match.penA!=null){
        const pET_A2=prono.scoreAET!=null?Number(prono.scoreAET):null;
        const pET_B2=prono.scoreBET!=null?Number(prono.scoreBET):null;
        if(pET_A2!==null&&pET_A2===pET_B2&&prono.penA!=null){
          const pP_A=Number(prono.penA),pP_B=Number(prono.penB);
          const mP_A=Number(match.penA),mP_B=Number(match.penB);
          const bT=pP_A===mP_A&&pP_B===mP_B?3:1;
          pts+=bT;
          detail.push({icon:'🟡',text:bT===3?`Tab ${mP_A}-${mP_B} exact`:'Tab prévu',pts:bT,color:'rgba(245,200,66,.9)'});
        }
      }
    }
  }

  // Buteurs (1pt par buteur correct, en tenant compte des doublons)
  if(prono.scorers&&match.scorers){
    const pronoList=(prono.scorers||'').split('\n').map(s=>s.trim().toLowerCase()).filter(Boolean);
    const matchList=(match.scorers||[]).map(s=>s.toLowerCase());
    // Compter occurrences dans match
    const matchCount={};
    matchList.forEach(s=>{matchCount[s]=(matchCount[s]||0)+1;});
    const pronoCount={};
    pronoList.forEach(s=>{pronoCount[s]=(pronoCount[s]||0)+1;});
    let scorerPts=0;
    Object.keys(pronoCount).forEach(name=>{
      const got=Math.min(pronoCount[name],matchCount[name]||0);
      scorerPts+=got;
    });
    pts+=scorerPts;
    if(scorerPts>0)detail.push({icon:'👟',text:`${scorerPts} buteur${scorerPts>1?'s':''} correct${scorerPts>1?'s':''}`,pts:scorerPts,color:'rgba(100,220,180,.9)'});
  }

  // Cartons jaunes (1pt si nb exact)
  if(prono.yellowCards!=null&&match.yellowCards!=null){
    const ok=Number(prono.yellowCards)===Number(match.yellowCards);
    if(ok){pts+=1;detail.push({icon:'🟨',text:`${match.yellowCards} carton${match.yellowCards>1?'s':''} jaune${match.yellowCards>1?'s':''} correct`,pts:1,color:'rgba(245,200,66,.9)'});}
  }

  // Cartons rouges (1pt si nb exact)
  if(prono.redCards!=null&&match.redCards!=null){
    const ok=Number(prono.redCards)===Number(match.redCards);
    if(ok){pts+=1;detail.push({icon:'🟥',text:`${match.redCards} carton${match.redCards>1?'s':''} rouge${match.redCards>1?'s':''} correct`,pts:1,color:'rgba(220,80,80,.9)'});}
  }

  // Penalty (1pt si nombre exact, ou 1pt si présence correct)
  const mPenNb = match.penaltyCount!=null?Number(match.penaltyCount):(match.hasPenalty?1:0);
  const pPenNb = prono.penaltyCount!=null?Number(prono.penaltyCount):(prono.hasPenalty?1:0);
  if(prono.penaltyCount!=null||prono.hasPenalty!=null){
    const ok = pPenNb===mPenNb;
    if(ok){pts+=1;detail.push({icon:'🎯',text:'Penalty(s) correct ('+mPenNb+')',pts:1,color:'rgba(200,134,10,.9)'});}
  }

  // Fait rare (2pts si validé par admin)
  if(prono.rareEvent&&match.rareEventWinners&&match.rareEventWinners[prono.playerId]){
    pts+=2;detail.push({icon:'✨',text:'Fait rare validé',pts:2,color:'rgba(245,200,66,.9)'});
  }

  return{pts,detail};
}

function smBg2(pA,pB,mA,mB){

      '<button class="primary small" type="button" data-action="add-sm-scorer">+ Ajouter</button>'+

          esc(s)+

        '</span>').join('')+

  );

  // Faits rares
  const raresHtml=smCard('✨ Faits rares','rgba(255,255,255,.07)','rgba(255,255,255,.11)',

        '<b style="min-width:80px;font-size:13px">'+esc(p.name)+'</b>'+

          (hasR?esc(pr.rareEvent):'—')+
        '</span>'+
        (hasR?
          '<div style="display:flex;align-items:center;gap:6px">'+
            '<label style="cursor:pointer;display:flex;align-items:center;gap:5px;font-size:13px;color:rgba(255,255,255,.6)">'+
              '<input type="checkbox" class="sm-rare-check" data-pid="'+p.id+'" '+(val===true?'checked':'')+' style="width:auto;accent-color:var(--green)">'+
              'Valider'+

        :'')+

    }).join(''):'<span style="font-size:13px;color:rgba(255,255,255,.3)">Aucun joueur dans Match unique</span>'
  );

  el.innerHTML='<div class="card">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">'+
      '<h2 style="margin:0;font-size:18px">⚡ '+esc(sm.teamA)+' vs '+esc(sm.teamB)+'</h2>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        (sm.ended?'<span class="badge paid">✓ Terminé</span>':'<button class="primary small" type="button" data-action="end-special-match">Terminer</button>')+
        '<button class="danger small" type="button" data-action="delete-special-match">Supprimer</button>'+
      '</div>'+
    '</div>'+
    '<p style="color:var(--muted);font-size:12px;margin-bottom:14px">'+dateFr(sm.date)+' · '+esc(sm.time||'')+'</p>'+
    '<div class="sm-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:stretch">'+scoreHtml+statsHtml+'</div>'+
    scorersHtml+
    '<div style="margin-top:10px">'+raresHtml+'</div>'+
    '<div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;margin-top:10px">'+
      '<div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">🏆 Classement en direct</div>'+
      renderSpecialLeaderboard(state)+
    '</div>'+
  '</div>';
}

function renderSpecialMatchPlayer(state, pid, el){
  if(!el) return;
  const sm=state.specialMatch;
  console.log('[SM] renderSpecialMatchPlayer called, sm:', sm?'exists ('+sm.teamA+' vs '+sm.teamB+')':'NULL', 'pid:', pid);
  const playerObj=state.players.find(p=>p.id===pid);
  // Tous les joueurs peuvent voir et pronostiquer le match spécial
  if(!sm){
    el.innerHTML='<div class="card"><h2>⚡ Match spécial</h2><div class="empty">⏳ Aucun match pour le moment.</div></div>';
    return;
  }

  const locked=isSpecialMatchLocked(sm);
  const prono=(state.specialPronos&&state.specialPronos[pid])||{};
  const ro=locked?'readonly':'';
  const _sA=prono.scoreA!=null?Number(prono.scoreA):null;
  const _sB=prono.scoreB!=null?Number(prono.scoreB):null;
  const _etA=prono.scoreAET!=null?Number(prono.scoreAET):null;
  const _etB=prono.scoreBET!=null?Number(prono.scoreBET):null;
  const etRo=(!locked&&_sA!=null&&_sA!==_sB)?'disabled':ro;
  const penRo=(!locked&&(_sA!=null&&_sA!==_sB||(_etA!=null&&_etA!==_etB)))?'disabled':ro;
  // Vérifier si le match a commencé (heure actuelle >= heure du match)
  const _matchStarted=(()=>{
    if(!sm.date||!sm.time)return false;
    try{
      const[h,mn]=sm.time.split(':').map(Number);
      const parisStr=`${sm.date}T${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:00`;
      const koLocal=new Date(parisStr);
      const nowParis=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
      const nowLocal=new Date();
      const offset=nowLocal-nowParis;
      const koParis=new Date(koLocal.getTime()+offset);
      return (nowLocal-koParis)>=0; // >= 0 = match commencé
    }catch{return false;}
  })();
  // Si match commencé mais score pas encore saisi -> afficher 0-0 par défaut
  const _liveScoreA=_matchStarted?(sm.scoreA!=null?sm.scoreA:0):null;
  const _liveScoreB=_matchStarted?(sm.scoreB!=null?sm.scoreB:0):null;
  const hasAdmin=_matchStarted&&(_liveScoreA!=null);
  const lr=(hasAdmin&&prono.scoreA!=null)?calcSpecialPointsLive(sm,Object.assign({},prono,{playerId:pid})):null;

  // Couleurs lignes score
  const s90=smBg2(prono.scoreA,prono.scoreB,sm.scoreA!=null?sm.scoreA:null,sm.scoreB!=null?sm.scoreB:null);
  const sET=smBg2(prono.scoreAET,prono.scoreBET,sm.scoreAET,sm.scoreBET);
  const sTAB=smBg2(prono.penA,prono.penB,sm.penA,sm.penB);

  // Score
  const scoreHtml=smCard('Score','rgba(255,255,255,.07)','rgba(255,255,255,.11)',
    '<div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;gap:6px">'+
    scoreLinePlayer('90 min','rgba(255,255,255,.8)','sp-scoreA',prono.scoreA,'sp-scoreB',prono.scoreB,_liveScoreA,_liveScoreB,s90.bg,s90.bd,false,ro,!locked&&prono.scoreA!=null)+
    (sm.canET?
      scoreLinePlayer('Prolong.','rgba(100,160,255,.8)','sp-scoreAET',prono.scoreAET,'sp-scoreBET',prono.scoreBET,sm.scoreAET,sm.scoreBET,sET.bg,sET.bd,true,etRo)+
      scoreLinePlayer('Tirs au but','rgba(245,200,66,.75)','sp-penA',prono.penA,'sp-penB',prono.penB,sm.penA,sm.penB,sTAB.bg,sTAB.bd,true,penRo)
    :'')+
    '</div>'
  );

  // Stats
  // Dès que le match commence (score admin rentré), afficher 0 pour les stats non encore saisies
  const smYellowLive = hasAdmin ? (sm.yellowCards!=null ? sm.yellowCards : 0) : sm.yellowCards;
  const smRedLive = hasAdmin ? (sm.redCards!=null ? sm.redCards : 0) : sm.redCards;
  const smPenLive = hasAdmin ? (sm.penaltyCount!=null ? sm.penaltyCount : 0) : sm.penaltyCount;
  const statsHtml=smCard('Stats','rgba(255,255,255,.07)','rgba(255,255,255,.11)',
    smStatLine('Jaune(s)','rgba(245,200,66,.9)','sp-yellow',prono.yellowCards,smYellowLive,ro,!locked&&prono.yellowCards!=null)+
    smStatLine('Rouge(s)','rgba(220,60,60,.9)','sp-red',prono.redCards,smRedLive,ro,!locked&&prono.redCards!=null)+
    smStatLine('Pénalty(s)','rgba(200,134,10,.9)','sp-penalty-nb',prono.penaltyCount,smPenLive,ro,!locked&&prono.penaltyCount!=null)
  );

  // Buteurs
  const initSA=prono.scoreAET!=null?Number(prono.scoreAET):(prono.scoreA!=null?Number(prono.scoreA):0);
  const initSB=prono.scoreBET!=null?Number(prono.scoreBET):(prono.scoreB!=null?Number(prono.scoreB):0);
  const saved=(prono.scorers||'').split('\n');
  const adm=(sm.scorers||[]).map(s=>s.toLowerCase());

  function buildLines(sA,sB,sv){
    const tot=(sA||0)+(sB||0);
    if(tot===0) return '<p style="font-size:13px;color:rgba(255,255,255,.35);margin:6px 0">Entre le score pour voir les lignes de buteurs.</p>';
    const s90A=prono.scoreA!=null?Number(prono.scoreA):sA;
    const s90B=prono.scoreB!=null?Number(prono.scoreB):sB;
    const admCount={};adm.forEach(n=>{admCount[n]=(admCount[n]||0)+1;});
    const usedCount={};
    let h='';
    for(let i=0;i<tot;i++){
      const nm=(sv[i]||'').trim().toLowerCase();
      let match=null;
      if(nm&&hasAdmin){
        const avail=(admCount[nm]||0)-(usedCount[nm]||0);
        if(avail>0){match=true;usedCount[nm]=(usedCount[nm]||0)+1;}
        else match=false;
      }
      const isProlA=i>=s90A&&i<sA;
      const isProlB=i>=sA&&(i-sA)>=s90B;
      const isProlong=isProlA||isProlB;
      const prolTag=isProlong?' <span style="font-size:10px;color:rgba(100,160,255,.7);font-style:italic">(Prolong.)</span>':'';
      const lbl=i<sA?esc(sm.teamA)+' '+(i+1)+prolTag:esc(sm.teamB)+' '+(i-sA+1)+prolTag;
      const _savedVal=(saved[i]||'').trim();
      const _isSaved=!!(_savedVal&&(sv[i]||'').trim().toLowerCase()===_savedVal.toLowerCase());
      h+=smScorerLine(i,lbl,sv[i],hasAdmin?match:null,false,ro,_isSaved);
    }
    return h;
  }

  const scorersHint=locked?'':'<p style="font-size:12px;color:rgba(255,255,255,.35);margin:0 0 8px;line-height:1.5">Un nom par ligne. Pour un doublé, écris le nom deux fois.</p>';
  const scorersHtml=smCard('Buteurs','rgba(255,255,255,.07)','rgba(255,255,255,.11)',
    scorersHint+'<div id="sp-scorers-wrap">'+buildLines(initSA,initSB,saved)+'</div>'
  );

  // Fait rare
  const rv=sm.rareEventWinners&&sm.rareEventWinners[pid];
  const _rareSaved=!locked&&rv==null&&!!(prono.rareEvent&&prono.rareEvent.trim());
  const rareBg=rv===true?'rgba(20,196,125,.18)':rv===false?'rgba(168,21,55,.18)':_rareSaved?'rgba(245,160,30,.08)':'rgba(255,255,255,.07)';
  const rareBd=rv===true?'rgba(20,196,125,.4)':rv===false?'rgba(252,129,129,.35)':_rareSaved?'rgba(245,160,30,.25)':'rgba(255,255,255,.11)';
  const rareBadge=rv===true
    ?'<span style="font-size:11px;background:rgba(20,196,125,.25);color:#4de8a8;padding:2px 10px;border-radius:999px;margin-bottom:8px;display:inline-block">✓ Validé +2pts</span><br>'
    :rv===false
    ?'<span style="font-size:11px;background:rgba(168,21,55,.25);color:#ff8fa3;padding:2px 10px;border-radius:999px;margin-bottom:8px;display:inline-block">✕ Non validé</span><br>'
    :'';
  const rareHtml=smCard('✨ Fait de jeu rare',rareBg,rareBd,
    rareBadge+
    '<textarea id="sp-rare" placeholder="Ex: penalty raté, but CSC…" rows="2" '+ro+' style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.15);color:#fff;padding:4px 0;font-size:13px;resize:none;font-family:inherit;outline:none">'+esc(prono.rareEvent||'')+'</textarea>'+
    (_rareSaved?'<div style="text-align:right;margin-top:4px"><span style="font-size:11px;color:rgba(245,160,30,.85)">✓ enregistré</span></div>':'')
  );

  // Résultat final
  let resultBanner='';
  if(sm.ended&&lr){
    const bg=lr.pts>=5?'rgba(20,196,125,.22)':lr.pts>=1?'rgba(20,196,125,.1)':'rgba(168,21,55,.15)';
    const bd=lr.pts>=1?'rgba(20,196,125,.4)':'rgba(252,129,129,.3)';
    resultBanner='<div style="background:'+bg+';border:1.5px solid '+bd+';border-radius:11px;padding:12px 14px;margin-bottom:12px">'+
      '<b style="font-size:15px">🏆 '+lr.pts+' point'+(lr.pts>1?'s':'')+'</b>'+
      (lr.detail||[]).map(d=>'<div style="font-size:12px;color:'+d.color+';margin-top:3px">'+d.icon+' '+esc(d.text)+' → <b>+'+d.pts+'pt'+(d.pts>1?'s':'')+'</b></div>').join('')+
    '</div>';
  }

  const saveBtn=locked?'':'<button class="primary" type="button" data-action="save-special-prono" style="width:100%;padding:13px;font-size:14px;margin-top:12px">✓ Enregistrer mon prono</button>';

  el.innerHTML='<div class="card">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">'+
      '<h2 style="margin:0;font-size:18px">⚡ '+esc(sm.teamA)+' vs '+esc(sm.teamB)+'</h2>'+
      '<span class="badge '+(locked?'warn':'paid')+'">'+(locked?'🔒 Fermé':'✍️ Ouvert')+'</span>'+
    '</div>'+
    '<p style="color:var(--muted);font-size:12px;margin-bottom:12px">'+dateFr(sm.date)+' · '+esc(sm.time||'')+'</p>'+
    resultBanner+
    '<div class="sm-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:stretch">'+scoreHtml+statsHtml+'</div>'+
    scorersHtml+
    '<div style="margin-top:10px">'+rareHtml+'</div>'+
    saveBtn+
    '<div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;margin-top:12px">'+
      '<div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">🏆 Classement en direct</div>'+
      renderSpecialLeaderboard(state)+
    '</div>'+
  '</div>';

  if(!locked){
    function refreshScorers(){
      const w=document.getElementById('sp-scorers-wrap'); if(!w) return;
      const inA=document.getElementById('sp-scoreA');
      const inB=document.getElementById('sp-scoreB');
      const inAET=(!document.getElementById('sp-scoreAET')||document.getElementById('sp-scoreAET').disabled)?null:document.getElementById('sp-scoreAET');
      const inBET=(!document.getElementById('sp-scoreBET')||document.getElementById('sp-scoreBET').disabled)?null:document.getElementById('sp-scoreBET');
      const sA=inA?Number(inA.value||0):0;
      const sB=inB?Number(inB.value||0):0;
      const etA=inAET?.value;
      const etB=inBET?.value;
      const sA2=etA&&etA!==''?Number(etA):sA;
      const sB2=etB&&etB!==''?Number(etB):sB;
      const tot=sA2+sB2;
      const showScorers=(sA+sB)>0||tot>0;
      if(!showScorers){
        w.innerHTML='<p style="font-size:12px;color:rgba(255,255,255,.35);margin:4px 0">Les buteurs apparaissent si le score change en prolongations.</p>';
        return;
      }
      // Récupérer les valeurs actuelles des inputs existants
      const existing=[...w.querySelectorAll('.sp-scorer-input')];
      const exVals=existing.map(x=>x.value);
      const hasSaved=saved.some(s=>s.trim());
      const allEmpty=exVals.every(v=>!v||!v.trim());
      const svFinal=(hasSaved&&allEmpty)?saved.map(s=>s.trim()):exVals;
      // Si le nombre de lignes n'a pas changé: mettre à jour sans recréer les inputs
      if(existing.length===tot){
        // Mettre à jour uniquement les couleurs/styles sans toucher au focus
        existing.forEach((inp,i)=>{
          const nm=(inp.value||'').trim().toLowerCase();
          const _savedVal=(saved[i]||'').trim();
          const _isSaved=!!(_savedVal&&inp.value.trim().toLowerCase()===_savedVal.toLowerCase());
          let match=null;
          if(nm&&hasAdmin){
            const admCount={};adm.forEach(n=>{admCount[n]=(admCount[n]||0)+1;});
            const usedBefore={};
            for(let j=0;j<i;j++){const n2=(existing[j]?.value||'').trim().toLowerCase();if(n2)usedBefore[n2]=(usedBefore[n2]||0)+1;}
            const avail=(admCount[nm]||0)-(usedBefore[nm]||0);
            match=avail>0?true:false;
          }
          // Couleur fond
          const bg=_isSaved?'rgba(245,160,30,.15)':
            (match===true?'rgba(20,196,125,.15)':match===false?'rgba(168,21,55,.12)':'rgba(255,255,255,.05)');
          const bdr=_isSaved?'rgba(245,160,30,.5)':
            (match===true?'rgba(20,196,125,.4)':match===false?'rgba(252,129,129,.35)':'rgba(255,255,255,.15)');
          inp.style.color=_isSaved?'rgba(245,160,30,.95)':'#fff';
          inp.style.borderBottomColor=bdr;
          inp.closest('div').style.background=bg;
        });
        return;
      }
      // Nombre de lignes différent: recréer avec focus préservé
      const focusIdx=existing.findIndex(x=>x===document.activeElement);
      const focusPos=focusIdx>=0?document.activeElement.selectionStart:null;
      w.innerHTML=buildLines(sA2,sB2,svFinal);
      const newInputs=[...w.querySelectorAll('.sp-scorer-input')];
      newInputs.forEach(inp=>inp.addEventListener('input',refreshScorers));
      // Restaurer le focus
      if(focusIdx>=0&&newInputs[focusIdx]){
        newInputs[focusIdx].focus();
        if(focusPos!=null)try{newInputs[focusIdx].setSelectionRange(focusPos,focusPos);}catch{}
      }
    }
    ['sp-scoreA','sp-scoreB','sp-scoreAET','sp-scoreBET'].forEach(id=>{
      const el2=document.getElementById(id);
      if(el2) el2.addEventListener('input',refreshScorers);
    });

    // Bloquer ET/TAB en temps réel si score 90min non nul
    function updateETLock(){
      const iA=document.getElementById('sp-scoreA');
      const iB=document.getElementById('sp-scoreB');
      if(!iA||!iB)return;
      const vA=iA.value!==''?Number(iA.value):null;
      const vB=iB.value!==''?Number(iB.value):null;
      const nonNul=vA!=null&&vB!=null&&vA!==vB;
      const etA=document.getElementById('sp-scoreAET');
      const etB=document.getElementById('sp-scoreBET');
      const pA=document.getElementById('sp-penA');
      const pB=document.getElementById('sp-penB');
      [etA,etB].forEach(el2=>{
        if(!el2)return;
        if(nonNul){
          el2.disabled=true;el2.value='';
          el2.style.opacity='0.4';el2.style.cursor='not-allowed';
          // Message d'erreur si l'utilisateur essaie de taper
          el2.title='Score non nul à 90min : pas de prolongations possibles';
        } else {
          el2.disabled=false;el2.style.opacity='1';el2.style.cursor='';el2.title='';
        }
      });
      if(nonNul){
        [pA,pB].forEach(el2=>{if(el2){el2.disabled=true;el2.value='';el2.style.opacity='0.4';}});
      } else {
        [pA,pB].forEach(el2=>{if(el2){el2.disabled=false;el2.style.opacity='1';}});
      }
    }
    ['sp-scoreA','sp-scoreB'].forEach(id=>{
      const el2=document.getElementById(id);
      if(el2) el2.addEventListener('input',updateETLock);
    });
    // Déclencher une fois pour init
    setTimeout(()=>{refreshScorers();updateETLock();},0);
  }
}

<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--bg2:#0d1628;--card:rgba(255,255,255,.06);--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--gold:#f5c842;--radius:18px;--shadow:0 8px 32px rgba(0,0,0,.4)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,'Segoe UI Emoji','Apple Color Emoji',system-ui,sans-serif;color:var(--text);min-height:100vh;background:var(--bg);
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(30,111,255,.18) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(20,196,125,.12) 0%,transparent 55%);}
    input{width:100%;padding:10px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:15px;outline:none;margin-bottom:0;transition:border-color .2s}
    input:focus{border-color:rgba(20,196,125,.6)}
    label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
    button.primary{background:linear-gradient(135deg,#14c47d,#0a9d65);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:12px;transition:opacity .15s}
    button.primary:hover{opacity:.88}
    .card{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .comp-card{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;transition:all .15s}
    .comp-card.active{cursor:pointer}
    .comp-card.active:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
    .badge{font-size:10px;border-radius:999px;padding:3px 9px;font-weight:700;white-space:nowrap}
    .badge-soon{background:rgba(255,255,255,.07);color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.1)}
    .badge-wip{background:rgba(255,112,67,.2);color:#ff7043;border:1px solid rgba(255,112,67,.4)}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script src="shared.js"></script>
<script>
// ══════════════════════════════════════════════
// LE SUPER SITE DU ZUC — PORTAIL
// ══════════════════════════════════════════════

const COMPETITIONS = [
  {id:'cdm',  icon:'⚽', label:'Coupe du Monde / Euro', sub:'CDM 2026 — USA / Canada / Mexique', color:'#14c47d', active:true,  file:'cdm.html'},
  {id:'ldc',  icon:'⭐', label:'Ligue des Champions',    sub:'Prochaine saison à venir',           color:'#f5c842', active:false, soon:true},
  {id:'missf',icon:'👑', label:'Miss France',            sub:'Prochaine élection : déc. 2025',     color:'#e040fb', active:false, soon:true},
  {id:'jeux', icon:'🎲', label:'Jeux de société',        sub:'Comptage de points entre amis',      color:'#ff7043', active:false, wip:true},
];

function buildPortal(playerName){
  $('app').innerHTML = `
    <div style="min-height:100vh;padding:24px 16px 40px">
      <div style="max-width:460px;margin:0 auto">

        <!-- Header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px">
          <div>
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">Bienvenue</div>
            <div style="font-size:20px;font-weight:800">${esc(playerName)} 👋</div>
          </div>
          <button id="logoutBtn" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);border-radius:10px;padding:7px 14px;font-size:12px;cursor:pointer">Déconnexion</button>
        </div>

        <!-- Logo -->
        <div style="text-align:center;margin-bottom:32px">
          <div style="font-size:52px;margin-bottom:8px">🏆</div>
          <div style="font-size:24px;font-weight:900;letter-spacing:-.5px">Le Super Site du Zuc</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">Choisis ta compétition</div>
        </div>

        <!-- Compétitions -->
        <div style="display:flex;flex-direction:column;gap:10px">
          ${COMPETITIONS.map(c => `
            <div class="comp-card ${c.active?'active':''}" id="comp-${c.id}"
              style="border-color:${c.active ? c.color+'55' : 'rgba(255,255,255,.08)'};opacity:${c.wip?.6:1}">
              <div style="font-size:34px;flex-shrink:0">${c.icon}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:15px;font-weight:800;color:${c.active?'#fff':'rgba(255,255,255,.45)'}">${c.label}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">${c.sub}</div>
              </div>
              <div style="flex-shrink:0">
                ${c.active
                  ? `<span style="font-size:20px;color:${c.color}">›</span>`
                  : c.wip
                    ? `<span class="badge badge-wip">🚧 En travaux</span>`
                    : `<span class="badge badge-soon">À venir</span>`
                }
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Profil -->
        <div style="margin-top:24px;text-align:center">
          <button id="profileBtn" style="background:none;border:none;color:rgba(255,255,255,.3);font-size:12px;cursor:pointer;text-decoration:underline">
            📊 Mon profil &amp; historique
          </button>
        </div>

      </div>
    </div>`;

  // Handlers
  document.getElementById('logoutBtn').addEventListener('click', () => {
    clearSession(); location.reload();
  });
  document.getElementById('profileBtn').addEventListener('click', () => {
    toast('Profil & historique — bientôt disponible 📊');
  });
  COMPETITIONS.filter(c => c.active).forEach(c => {
    document.getElementById('comp-'+c.id)?.addEventListener('click', () => {
      window.location.href = c.file;
    });
  });
}

function buildLogin(){
  $('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="width:100%;max-width:360px">
        <div class="card" style="text-align:center">
          <div style="font-size:52px;margin-bottom:10px">🏆</div>
          <h1 style="font-size:22px;margin:0 0 24px;font-weight:900">Le Super Site du Zuc</h1>
          <div id="loginError" style="display:none;background:#fff0f3;color:#a91537;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px"></div>
          <div style="margin-bottom:12px;text-align:left">
            <label for="loginName">Pseudo</label>
            <input id="loginName" placeholder="Ton pseudo" autocomplete="username">
          </div>
          <div style="margin-bottom:20px;text-align:left">
            <label for="loginPwd">Mot de passe</label>
            <div style="position:relative">
              <input id="loginPwd" type="password" placeholder="••••••" autocomplete="current-password" style="padding-right:40px">
              <button type="button" onclick="const i=document.getElementById('loginPwd');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:rgba(255,255,255,.5)">👁</button>
            </div>
          </div>
          <button class="primary" id="loginBtn" style="width:100%">Se connecter</button>
          <p style="margin-top:12px;font-size:12px;color:var(--muted)">Tes identifiants sont fournis par l'administrateur</p>
          <div style="margin-top:14px;background:rgba(255,160,50,.1);border:1px solid rgba(255,160,50,.3);border-radius:12px;padding:12px">
            <p style="font-size:12px;color:rgba(255,200,80,.9);font-weight:700;margin:0 0 6px">⚠️ Première connexion ou nouvel appareil ?</p>
            <button type="button" onclick="if(confirm('Vider le cache ?')){localStorage.clear();sessionStorage.clear();location.reload();}"
              style="width:100%;background:rgba(255,160,50,.2);border:1px solid rgba(255,160,50,.5);color:rgba(255,200,80,.9);border-radius:8px;padding:8px;font-size:13px;font-weight:700;cursor:pointer">
              🧹 Vider le cache
            </button>
          </div>
        </div>
      </div>
    </div>`;

  const doLogin = () => {
    const name = ($('loginName')?.value||'').trim();
    const pwd  = ($('loginPwd')?.value||'').trim();
    const err  = $('loginError');
    if(!name||!pwd){if(err){err.textContent='Remplis tous les champs.';err.style.display='block';}return;}
    // Admin
    if(name.toLowerCase()==='admin' && pwd===(_appState.adminPwd||'admin')){
      setSession({role:'admin'});
      window.location.href='cdm.html';
      return;
    }
    // Joueur
    const player = _appState.players.find(p => p.name.toLowerCase()===name.toLowerCase());
    if(player){
      const ok = player.pwdClear ? pwd===player.pwdClear : hashPwd(pwd)===player.pwdHash;
      if(ok){
        setSession({role:'player', pid:player.id});
        buildPortal(player.name);
        return;
      }
    }
    if(err){err.textContent='Pseudo ou mot de passe incorrect.';err.style.display='block';}
  };

  $('loginBtn').addEventListener('click', doLogin);
  [$('loginName'),$('loginPwd')].forEach(el => el?.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); }));
}

// ── Init ────────────────────────────────────────
let _appState = null;

(async function(){
  const _APP_VERSION = '2026-v7';
  if(localStorage.getItem('app_version')!==_APP_VERSION){
    sessionStorage.clear();
    localStorage.removeItem('cdm2026v6');
    localStorage.removeItem('cdm2026v7');
    localStorage.setItem('app_version', _APP_VERSION);
  }

  $('app').innerHTML = '<div style="text-align:center;padding:80px;color:#5d7088"><div style="font-size:32px;margin-bottom:12px">🏆</div><div style="font-size:16px;font-weight:600">Chargement…</div></div>';

  _appState = await loadState();

  const session = getSession();
  if(session){
    if(session.role==='admin'){
      window.location.href = 'cdm.html';
      return;
    }
    if(session.role==='player'){
      const player = _appState.players.find(p => p.id===session.pid);
      if(player){
        buildPortal(player.name);
        return;
      }
    }
    clearSession();
  }

  buildLogin();
})();
</script>
</body>
</html>

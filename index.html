<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--radius:18px;--shadow:0 8px 32px rgba(0,0,0,.4)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,'Segoe UI Emoji',system-ui,sans-serif;color:var(--text);min-height:100vh;background:var(--bg);
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(30,111,255,.18) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(20,196,125,.12) 0%,transparent 55%);}
    input{width:100%;padding:10px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:15px;outline:none;transition:border-color .2s}
    input:focus{border-color:rgba(20,196,125,.6)}
    label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
    button.primary{background:linear-gradient(135deg,#14c47d,#0a9d65);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:12px;transition:opacity .15s;width:100%}
    button.primary:hover{opacity:.88}
    .card{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
    .comp-card{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;transition:all .15s}
    .comp-card.active{cursor:pointer}
    .comp-card.active:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
    .badge{font-size:10px;border-radius:999px;padding:3px 9px;font-weight:700;white-space:nowrap;border:1px solid}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* Modal accès */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:#0d1628;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .toggle{position:relative;width:40px;height:22px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:999px;cursor:pointer;transition:.2s}
    .slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
    input:checked+.slider{background:var(--green)}
    input:checked+.slider:before{transform:translateX(18px)}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const FB_URL='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const STORAGE_KEY='cdm2026v7';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _tt;
const toast=msg=>{const el=$('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2400);};
function getSession(){try{const s=sessionStorage.getItem('cdm2026session');return s?JSON.parse(s):null;}catch(e){return null;}}
function setSession(d){try{sessionStorage.setItem('cdm2026session',JSON.stringify(d));}catch(e){}}
function clearSession(){try{sessionStorage.removeItem('cdm2026session');}catch(e){}}
function hashPwd(pwd){let h=0;for(let i=0;i<pwd.length;i++){h=Math.imul(31,h)+pwd.charCodeAt(i)|0;}return h.toString(36);}

const COMPETITIONS=[
  {id:'cdm',  icon:'⚽',label:'Coupe du Monde / Euro',sub:'CDM 2026 — USA / Canada / Mexique',color:'#14c47d',file:'cdm.html',live:true},
  {id:'ldc',  icon:'⭐',label:'Ligue des Champions',  sub:'Prochaine saison à venir',          color:'#f5c842',file:'ldc.html', live:false,soon:true},
  {id:'missf',icon:'👑',label:'Miss France',           sub:'Élection Miss France',              color:'#e040fb',file:'missf.html',live:true},
  {id:'jeux', icon:'🎲',label:'Jeux de société',       sub:'Comptage de points entre amis',     color:'#ff7043',file:'jeux.html', live:false,wip:true},
];

async function loadData(){
  try{
    const local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    if(local.players?.length) return{players:local.players,adminPwd:local.adminPwd||'admin'};
  }catch(e){}
  try{
    const r=await fetch(FB_URL+'/state.json',{cache:'no-store'});
    if(r.ok){const d=await r.json();if(d?.players) return{players:d.players,adminPwd:d.adminPwd||'admin'};}
  }catch(e){}
  return{players:[],adminPwd:'admin'};
}

async function savePlayerAccess(pid,competitionIds){
  // Patch uniquement le champ competitionIds du joueur dans Firebase
  try{
    const r=await fetch(FB_URL+'/state.json',{cache:'no-store'});
    if(!r.ok)return false;
    const state=await r.json();
    const idx=(state.players||[]).findIndex(p=>p.id===pid);
    if(idx<0)return false;
    state.players[idx].competitionIds=competitionIds;
    // Mettre à jour cache local aussi
    try{const loc=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');if(loc.players){const li=loc.players.findIndex(p=>p.id===pid);if(li>=0){loc.players[li].competitionIds=competitionIds;localStorage.setItem(STORAGE_KEY,JSON.stringify(loc));}}}catch(e2){}
    await fetch(FB_URL+'/state.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    return true;
  }catch(e){return false;}
}

// ── PORTAIL ──────────────────────────────────
function buildPortal(displayName,role,players){
  const isAdmin=role==='admin';
  const session=getSession();
  // Pour un joueur : filtrer les compétitions selon ses accès
  // Par défaut (pas de competitionIds) -> accès à CDM seulement pour les anciens joueurs
  let playerComps=COMPETITIONS;
  if(!isAdmin && session?.pid){
    const player=players?.find(p=>p.id===session.pid);
    const ids=player?.competitionIds;
    if(ids&&ids.length>0){
      playerComps=COMPETITIONS.filter(c=>ids.includes(c.id));
    } else {
      // Anciens joueurs sans competitionIds : accès CDM par défaut
      playerComps=COMPETITIONS.filter(c=>c.id==='cdm');
    }
  }

  $('app').innerHTML=`
    <div style="min-height:100vh;padding:24px 16px 40px">
      <div style="max-width:460px;margin:0 auto">
        <!-- Header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px">
          <div>
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">${isAdmin?'⚙️ Administration':'Bienvenue'}</div>
            <div style="font-size:20px;font-weight:800">${esc(displayName)} 👋</div>
          </div>
        <div style="display:flex;gap:8px">
            ${isAdmin?`
              <button id="playersBtn" style="background:rgba(20,196,125,.15);border:1px solid rgba(20,196,125,.3);color:#14c47d;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer">👥 Joueurs</button>
              <button id="accessBtn" style="background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.3);color:#f5c842;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer">🔑 Accès</button>`:''}
            <button id="logoutBtn" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);border-radius:10px;padding:7px 14px;font-size:12px;cursor:pointer">Déconnexion</button>
          </div>
        </div>

        <!-- Logo -->
        <div style="text-align:center;margin-bottom:32px">
          <div style="font-size:52px;margin-bottom:8px">🏆</div>
          <div style="font-size:24px;font-weight:900;letter-spacing:-.5px">Le Super Site du Zuc</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">Choisis ta compétition</div>
        </div>

        <!-- Compétitions -->
        <div style="display:flex;flex-direction:column;gap:10px">
          ${(isAdmin?COMPETITIONS:playerComps).map(c=>{
            const canAccess=isAdmin?true:c.live;
            return`<div class="comp-card ${canAccess&&c.live?'active':''}" id="comp-${c.id}"
              style="border-color:${canAccess&&c.live?c.color+'55':'rgba(255,255,255,.08)'};opacity:${c.wip?.6:1}">
              <div style="font-size:34px;flex-shrink:0">${c.icon}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:15px;font-weight:800;color:${canAccess&&c.live?'#fff':'rgba(255,255,255,.45)'}">${c.label}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">${c.sub}</div>
              </div>
              <div style="flex-shrink:0">
                ${c.live?`<span style="font-size:20px;color:${c.color}">›</span>`
                  :c.wip?`<span class="badge" style="background:rgba(255,112,67,.2);color:#ff7043;border-color:rgba(255,112,67,.4)">🚧 En travaux</span>`
                  :`<span class="badge" style="background:rgba(255,255,255,.07);color:rgba(255,255,255,.35);border-color:rgba(255,255,255,.1)">À venir</span>`}
              </div>
            </div>`;
          }).join('')}
        </div>

        <div style="margin-top:24px;text-align:center">
          <button id="profileBtn" style="background:none;border:none;color:rgba(255,255,255,.3);font-size:12px;cursor:pointer;text-decoration:underline">📊 Mon profil &amp; historique</button>
        </div>
      </div>
    </div>`;

  $('logoutBtn').addEventListener('click',()=>{clearSession();location.reload();});
  $('profileBtn').addEventListener('click',()=>toast('Profil & historique — bientôt disponible 📊'));
  (isAdmin?COMPETITIONS:playerComps).filter(c=>c.live).forEach(c=>{
    $('comp-'+c.id)?.addEventListener('click',()=>{sessionStorage.setItem('from_portal','1');window.location.href=c.file;});
  });
  if(isAdmin){
    $('accessBtn')?.addEventListener('click',()=>buildAccessModal(players));
    $('playersBtn')?.addEventListener('click',()=>buildPlayersModal(players));
  }
}

// ── MODAL GESTION JOUEURS (ADMIN) ─────────────
async function buildPlayersModal(players){
  const el=document.createElement('div');
  el.className='modal-bg';el.id='playersModal';

  function renderModal(){
    const current=players.filter(p=>!(p.groupIds?.length===1&&p.groupIds[0]==='matchunique'));
    el.innerHTML=`
      <div class="modal">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <div style="font-size:16px;font-weight:800">👥 Gestion des joueurs</div>
          <button id="closePlayers" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer">✕</button>
        </div>
        <!-- Ajouter un joueur -->
        <div style="background:rgba(20,196,125,.08);border:1px solid rgba(20,196,125,.2);border-radius:12px;padding:14px;margin-bottom:16px">
          <div style="font-size:12px;font-weight:700;color:#14c47d;margin-bottom:10px">➕ Ajouter un joueur</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            <div><label style="font-size:10px;color:var(--muted);display:block;margin-bottom:3px">Pseudo</label>
            <input id="newPlayerName" placeholder="Pseudo" style="padding:7px 10px;font-size:13px"></div>
            <div><label style="font-size:10px;color:var(--muted);display:block;margin-bottom:3px">Mot de passe</label>
            <input id="newPlayerPwd" placeholder="Mot de passe" style="padding:7px 10px;font-size:13px"></div>
          </div>
          <div style="margin-bottom:8px"><label style="font-size:10px;color:var(--muted);display:block;margin-bottom:3px">Groupes (séparés par virgule)</label>
          <input id="newPlayerGroups" placeholder="HRS, Famille, Amis" style="padding:7px 10px;font-size:13px"></div>
          <button id="addPlayerBtn" style="background:linear-gradient(135deg,#14c47d,#0a9d65);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:8px 16px;width:100%">Ajouter</button>
        </div>
        <!-- Liste joueurs -->
        <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">${current.length} JOUEURS</div>
        <div id="playersList">
          ${current.map(p=>`
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
              <div>
                <div style="font-size:13px;font-weight:700">${esc(p.name)}</div>
                <div style="font-size:11px;color:var(--muted)">${(p.groupIds||[]).join(', ')||'Aucun groupe'} · mdp: ${esc(p.pwdClear||'****')}</div>
              </div>
              <button data-del="${p.id}" style="background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#ff6b6b;border-radius:8px;font-size:12px;cursor:pointer;padding:4px 10px">✕</button>
            </div>`).join('')}
        </div>
        <div id="playerStatus" style="text-align:center;margin-top:12px;font-size:12px;color:var(--muted)"></div>
      </div>`;

    $('closePlayers').addEventListener('click',()=>el.remove());
    el.addEventListener('click',e=>{if(e.target===el)el.remove();});

    // Ajouter joueur
    $('addPlayerBtn').addEventListener('click',async()=>{
      const name=($('newPlayerName')?.value||'').trim();
      const pwd=($('newPlayerPwd')?.value||'').trim();
      const groupsRaw=($('newPlayerGroups')?.value||'').trim();
      if(!name||!pwd){setStatus('Remplis le pseudo et le mot de passe.');return;}
      if(players.find(p=>p.name.toLowerCase()===name.toLowerCase())){setStatus('Ce pseudo existe déjà.');return;}
      const groupIds=groupsRaw?groupsRaw.split(',').map(s=>s.trim()).filter(Boolean):[];
      const newPlayer={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,pwdClear:pwd,pwdHash:hashPwd(pwd),pwdChanged:false,groupIds,competitionIds:['cdm'],favoriteTeam:null,easterEggDone:false,easterEggPts:0};
      players.push(newPlayer);
      const ok=await saveAllPlayers(players);
      if(ok){setStatus('✅ Joueur ajouté !');renderModal();}
      else setStatus('❌ Erreur Firebase');
    });

    // Supprimer joueur
    el.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const pid=btn.dataset.del;
        const p=players.find(x=>x.id===pid);
        if(!confirm(`Supprimer ${p?.name} ?`))return;
        const idx=players.findIndex(x=>x.id===pid);
        if(idx>=0)players.splice(idx,1);
        const ok=await saveAllPlayers(players);
        if(ok){setStatus('Joueur supprimé');renderModal();}
        else setStatus('❌ Erreur');
      });
    });
  }

  function setStatus(msg){const s=$('playerStatus');if(s)s.textContent=msg;}

  document.body.appendChild(el);
  renderModal();
}

async function saveAllPlayers(players){
  try{
    // Charger l'état complet et mettre à jour uniquement les joueurs
    const r=await fetch(`${FB_URL}/state.json`,{cache:'no-store'});
    if(!r.ok)return false;
    const state=await r.json()||{};
    state.players=players;
    // Mettre à jour cache local
    try{const loc=JSON.parse(localStorage.getItem('cdm2026v7')||'{}');loc.players=players;localStorage.setItem('cdm2026v7',JSON.stringify(loc));}catch(e2){}
    const r2=await fetch(`${FB_URL}/state.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    return r2.ok;
  }catch(e){return false;}
}

// ── MODAL GESTION DES ACCÈS (ADMIN) ──────────
function buildAccessModal(players){
  const el=document.createElement('div');
  el.className='modal-bg';
  el.id='accessModal';
  el.innerHTML=`
    <div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <div style="font-size:16px;font-weight:800">👥 Accès par joueur</div>
        <button id="closeModal" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer">✕</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:16px">Active ou désactive l'accès à chaque compétition pour chaque joueur.</div>
      <div id="accessList"></div>
      <div id="saveStatus" style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)"></div>
    </div>`;
  document.body.appendChild(el);

  const list=$('accessList');
  const regularPlayers=players.filter(p=>!(p.groupIds?.length===1&&p.groupIds[0]==='matchunique'));

  list.innerHTML=regularPlayers.map(p=>{
    const ids=p.competitionIds||['cdm']; // défaut : CDM seulement
    return`<div style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:#fff">${esc(p.name)}</div>
      ${COMPETITIONS.map(c=>`
        <div class="toggle-row">
          <div>
            <div style="font-size:13px">${c.icon} ${c.label}</div>
            ${!c.live?`<div style="font-size:10px;color:var(--muted)">Pas encore disponible</div>`:''}
          </div>
          <label class="toggle">
            <input type="checkbox" data-pid="${p.id}" data-cid="${c.id}" ${ids.includes(c.id)?'checked':''}>
            <span class="slider"></span>
          </label>
        </div>`).join('')}
    </div>`;
  }).join('<hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:12px 0">');

  // Save on toggle change
  list.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',async()=>{
      const pid=cb.dataset.pid;
      const player=regularPlayers.find(p=>p.id===pid);
      if(!player)return;
      // Recalculer les competitionIds pour ce joueur
      const checkboxes=list.querySelectorAll(`input[data-pid="${pid}"]`);
      const newIds=[...checkboxes].filter(x=>x.checked).map(x=>x.dataset.cid);
      player.competitionIds=newIds;
      const status=$('saveStatus');
      if(status){status.textContent='Sauvegarde…';status.style.color='var(--muted)';}
      const ok=await savePlayerAccess(pid,newIds);
      if(status){status.textContent=ok?'✅ Sauvegardé':'❌ Erreur';status.style.color=ok?'#14c47d':'#e53935';}
      setTimeout(()=>{if(status)status.textContent='';},2000);
    });
  });

  $('closeModal').addEventListener('click',()=>el.remove());
  el.addEventListener('click',e=>{if(e.target===el)el.remove();});
}

// ── LOGIN ─────────────────────────────────────
function buildLogin(){
  $('app').innerHTML=`
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="width:100%;max-width:360px">
        <div class="card" style="text-align:center">
          <div style="font-size:52px;margin-bottom:10px">🏆</div>
          <h1 style="font-size:22px;margin:0 0 24px;font-weight:900">Le Super Site du Zuc</h1>
          <div id="loginError" style="display:none;background:#fff0f3;color:#a91537;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;text-align:left"></div>
          <div style="margin-bottom:12px;text-align:left">
            <label for="loginName">Pseudo</label>
            <input id="loginName" placeholder="Ton pseudo" autocomplete="username">
          </div>
          <div style="margin-bottom:20px;text-align:left">
            <label for="loginPwd">Mot de passe</label>
            <div style="position:relative">
              <input id="loginPwd" type="password" placeholder="••••••" autocomplete="current-password" style="padding-right:40px">
              <button type="button" onclick="const i=document.getElementById('loginPwd');i.type=i.type==='password'?'text':'password'"
                style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:rgba(255,255,255,.5)">👁</button>
            </div>
          </div>
          <button class="primary" id="loginBtn">Se connecter</button>
          <p style="margin-top:12px;font-size:12px;color:var(--muted)">Tes identifiants sont fournis par l'administrateur</p>
          <div style="margin-top:14px;background:rgba(255,160,50,.1);border:1px solid rgba(255,160,50,.3);border-radius:12px;padding:12px">
            <p style="font-size:12px;color:rgba(255,200,80,.9);font-weight:700;margin:0 0 8px">⚠️ Première connexion ou nouvel appareil ?</p>
            <button type="button" onclick="if(confirm('Vider le cache ?')){localStorage.clear();sessionStorage.clear();location.reload();}"
              style="width:100%;background:rgba(255,160,50,.2);border:1px solid rgba(255,160,50,.5);color:rgba(255,200,80,.9);border-radius:8px;padding:8px;font-size:13px;font-weight:700;cursor:pointer">
              🧹 Vider le cache
            </button>
          </div>
        </div>
      </div>
    </div>`;

  const doLogin=async()=>{
    const name=($('loginName')?.value||'').trim();
    const pwd=($('loginPwd')?.value||'').trim();
    const err=$('loginError');
    if(!name||!pwd){if(err){err.textContent='Remplis tous les champs.';err.style.display='block';}return;}
    const {players,adminPwd}=await loadData();
    // Admin
    if(name.toLowerCase()==='admin'&&pwd===adminPwd){
      setSession({role:'admin'});
      buildPortal('Admin','admin',players);
      return;
    }
    // Joueur
    const player=players.find(p=>p.name?.toLowerCase()===name.toLowerCase());
    if(player){
      const ok=player.pwdClear?pwd===player.pwdClear:hashPwd(pwd)===player.pwdHash;
      if(ok){
        setSession({role:'player',pid:player.id,name:player.name});
        buildPortal(player.name,'player',players);
        return;
      }
    }
    if(err){err.textContent='Pseudo ou mot de passe incorrect.';err.style.display='block';}
  };

  $('loginBtn').addEventListener('click',doLogin);
  [$('loginName'),$('loginPwd')].forEach(el=>el?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();}));
}

// ── INIT ──────────────────────────────────────
(async function(){
  const session=getSession();
  if(session){
    if(session.role==='admin'){
      const {players}=await loadData();
      buildPortal('Admin','admin',players);
      return;
    }
    if(session.role==='player'&&session.name){
      const {players}=await loadData();
      buildPortal(session.name,'player',players);
      return;
    }
    clearSession();
  }
  buildLogin();
})();
</script>

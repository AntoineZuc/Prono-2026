function calcSpecialPointsLive(sm, prono){
  // Calcule les points partiels en temps réel
  if(!prono||prono.scoreA==null||prono.scoreB==null)return{pts:0,detail:[]};
  let pts=0; const detail=[];

  // Score (si admin a rentré un score)
  if(sm.scoreA!=null&&sm.scoreB!=null){
    const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
    const mA=Number(sm.scoreA),mB=Number(sm.scoreB);
    if(pA===mA&&pB===mB){
      pts+=3;detail.push({icon:'⚽',text:'Score exact '+mA+'-'+mB,pts:3,color:'rgba(20,196,125,.9)'});
    } else if(outcome(pA,pB)===outcome(mA,mB)){
      pts+=1;detail.push({icon:'⚽',text:'Bon résultat',pts:1,color:'rgba(100,200,140,.8)'});
    } else {
      detail.push({icon:'⚽',text:'Mauvais résultat',pts:0,color:'rgba(252,129,129,.8)'});
    }
    // Bonus ET si applicable
    if(sm.canET&&sm.scoreAET!=null&&prono.scoreAET!=null&&Number(prono.scoreA)===Number(prono.scoreB)){
      const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET||0);
      const mET_A=Number(sm.scoreAET),mET_B=Number(sm.scoreBET||0);
      const bET=pET_A===mET_A&&pET_B===mET_B?3:1;
      pts+=bET;detail.push({icon:'🔵',text:bET===3?'Prolong. exact':'Prolong. prévu',pts:bET,color:'rgba(100,160,255,.9)'});
    }
  }

  // Buteurs (si admin a rentré des buteurs)
  if(prono.scorers&&sm.scorers&&sm.scorers.length>0){
    const pronoList=(prono.scorers||'').split('\n').map(s=>s.trim().toLowerCase()).filter(Boolean);
    const matchList=(sm.scorers||[]).map(s=>s.toLowerCase());
    const matchCount={};matchList.forEach(s=>{matchCount[s]=(matchCount[s]||0)+1;});
    const pronoCount={};pronoList.forEach(s=>{pronoCount[s]=(pronoCount[s]||0)+1;});
    let scorerPts=0;
    Object.keys(pronoCount).forEach(name=>{scorerPts+=Math.min(pronoCount[name],matchCount[name]||0);});
    if(scorerPts>0){pts+=scorerPts;detail.push({icon:'👟',text:scorerPts+' buteur'+(scorerPts>1?'s':'')+' correct'+(scorerPts>1?'s':''),pts:scorerPts,color:'rgba(100,220,180,.9)'});}
  }

  // Cartons jaunes
  if(prono.yellowCards!=null&&sm.yellowCards!=null){
    if(Number(prono.yellowCards)===Number(sm.yellowCards)){pts+=1;detail.push({icon:'🟨',text:'Cartons jaunes corrects ('+sm.yellowCards+')',pts:1,color:'rgba(245,200,66,.9)'});}
  }

  // Cartons rouges
  if(prono.redCards!=null&&sm.redCards!=null){
    if(Number(prono.redCards)===Number(sm.redCards)){pts+=1;detail.push({icon:'🟥',text:'Cartons rouges corrects ('+sm.redCards+')',pts:1,color:'rgba(220,80,80,.9)'});}
  }

  // Penaltys
  const mPenNb=sm.penaltyCount!=null?Number(sm.penaltyCount):(sm.hasPenalty?1:0);
  const pPenNb=prono.penaltyCount!=null?Number(prono.penaltyCount):(prono.hasPenalty?1:0);
  if((prono.penaltyCount!=null||prono.hasPenalty!=null)&&sm.penaltyCount!=null){
    if(pPenNb===mPenNb){pts+=1;detail.push({icon:'🎯',text:'Penaltys corrects ('+mPenNb+')',pts:1,color:'rgba(200,134,10,.9)'});}
  }

  // Fait rare
  if(prono.rareEvent&&sm.rareEventWinners&&sm.rareEventWinners[prono.playerId]){
    pts+=2;detail.push({icon:'✨',text:'Fait rare validé !',pts:2,color:'rgba(245,200,66,.9)'});
  }

  return{pts,detail};
}

function renderSpecialLeaderboard(state){
  const sm=state.specialMatch; if(!sm) return '';
  const inGroup=pid=>state.players.find(p=>p.id===pid)?.groupIds?.includes('matchunique');
  const players=state.players.filter(p=>inGroup(p.id));
  if(!players.length) return '<span style="font-size:12px;color:rgba(255,255,255,.3)">Aucun joueur dans Match unique</span>';

  const hasScore=sm.scoreA!=null&&sm.scoreB!=null;
  const statusBadge=sm.ended
    ?'<span class="badge paid">✓ Terminé</span>'
    :hasScore
      ?'<span class="badge warn">⚽ '+sm.scoreA+'-'+sm.scoreB+' en cours</span>'
      :'<span class="badge info">⏳ En attente du score</span>';

  const rows=players.map(p=>{
    const prono=state.specialPronos&&state.specialPronos[p.id]?state.specialPronos[p.id]:null;
    const hasProno=prono&&prono.scoreA!=null;
    const r=hasProno?calcSpecialPointsLive(sm,Object.assign({},prono,{playerId:p.id})):{pts:0,detail:[]};
    return{id:p.id,name:p.name,pts:r.pts,detail:r.detail,hasProno,prono};
  }).sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));

  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':((i+1)+'.');

  // Score live admin formaté
  function adminScoreLive(){
    if(!hasScore) return '<span style="color:rgba(255,255,255,.3);font-size:12px">—</span>';
    let s='<b style="color:#fff;font-size:15px">'+sm.scoreA+'-'+sm.scoreB+'</b>';
    if(sm.scoreAET!=null) s+='<span style="font-size:11px;color:rgba(100,160,255,.8);margin-left:4px">('+sm.scoreAET+'-'+sm.scoreBET+' ap)</span>';
    if(sm.penA!=null) s+='<span style="font-size:11px;color:rgba(245,200,66,.8);margin-left:4px">('+sm.penA+'-'+sm.penB+' tab)</span>';
    return s;
  }

  // Prono détaillé déroulable
  function pronoDetail(p){
    if(!p.hasProno||!p.prono) return '';
    const pr=p.prono;
    let html='<div id="prono-detail-'+p.id+'" style="display:none;margin-top:8px;padding:8px;background:rgba(255,255,255,.04);border-radius:8px;font-size:11px">';
    // Score
    html+='<div style="margin-bottom:4px"><span style="color:rgba(255,255,255,.45)">Score pronostiqué: </span><b>'+pr.scoreA+'-'+pr.scoreB+'</b>';
    if(pr.scoreAET!=null) html+='<span style="color:rgba(100,160,255,.7);margin-left:6px">ap: '+pr.scoreAET+'-'+pr.scoreBET+'</span>';
    if(pr.penA!=null) html+='<span style="color:rgba(245,200,66,.7);margin-left:6px">tab: '+pr.penA+'-'+pr.penB+'</span>';
    html+='</div>';
    // Buteurs
    const scorers=(pr.scorers||'').split('\n').filter(Boolean);
    if(scorers.length) html+='<div style="margin-bottom:4px"><span style="color:rgba(255,255,255,.45)">Buteurs: </span>'+scorers.map(s=>esc(s)).join(', ')+'</div>';
    // Stats
    const stats=[];
    if(pr.yellowCards!=null) stats.push('<span style="color:rgba(245,200,66,.8)">'+pr.yellowCards+' jaune'+(pr.yellowCards>1?'s':'')+'</span>');
    if(pr.redCards!=null) stats.push('<span style="color:rgba(220,60,60,.8)">'+pr.redCards+' rouge'+(pr.redCards>1?'s':'')+'</span>');
    if(pr.penaltyCount!=null) stats.push('<span style="color:rgba(200,134,10,.8)">'+pr.penaltyCount+' penalty'+(pr.penaltyCount>1?'s':'')+'</span>');
    if(stats.length) html+='<div style="margin-bottom:4px"><span style="color:rgba(255,255,255,.45)">Stats: </span>'+stats.join(' · ')+'</div>';
    // Fait rare
    if(pr.rareEvent) html+='<div><span style="color:rgba(255,255,255,.45)">Fait rare: </span><i>'+esc(pr.rareEvent)+'</i></div>';
    html+='</div>';
    return html;
  }

  const rowsHtml=rows.map((r,i)=>{
    const ptCol=r.pts>0?'#4de8a8':'rgba(255,255,255,.4)';
    const hasD=r.hasProno;
    return '<div style="border-top:1px solid rgba(255,255,255,.07);padding:8px 4px">'+
      '<div style="display:flex;align-items:center;gap:8px">'+
        '<span style="min-width:24px;font-size:14px">'+medal(i)+'</span>'+
        '<b style="flex:1;font-size:13px">'+esc(r.name)+'</b>'+
        // Score live admin
        '<div style="min-width:80px;text-align:center">'+adminScoreLive()+'</div>'+
        // Points
        '<div style="min-width:36px;text-align:right"><b style="font-size:15px;color:'+ptCol+'">'+r.pts+'</b>'+(r.pts>0&&!sm.ended?'<span style="font-size:9px;color:rgba(255,255,255,.3)"> live</span>':'')+'</div>'+
        // Bouton dérouler
        (hasD?'<button data-action="toggle-prono-detail" data-pid="'+r.id+'" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;flex-shrink:0">▼</button>':'<span style="width:28px"></span>')+
      '</div>'+
      pronoDetail(r)+
    '</div>';
  }).join('');

  return '<div style="margin-bottom:8px">'+statusBadge+'</div>'+
    '<div style="display:flex;gap:8px;padding:4px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:4px">'+
      '<span style="min-width:24px;font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase">&#35;</span>'+
      '<span style="flex:1;font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase">Joueur</span>'+
      '<span style="min-width:80px;text-align:center;font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase">Score live</span>'+
      '<span style="min-width:36px;text-align:right;font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase">Pts</span>'+
      '<span style="width:28px"></span>'+
    '</div>'+
    rowsHtml;
}

function renderPlayer(state,player,opts={}){
  let pts=0,exact=0,played=0;
  allMatches(state).forEach(m=>{const p=state.predictions[m.id]?.[player.id];if(!p||m.scoreA===null)return;played++;if(p.scoreA===m.scoreA&&p.scoreB===m.scoreB){pts+=3;exact++;}else if(Math.sign(p.scoreA-p.scoreB)===Math.sign(m.scoreA-m.scoreB))pts+=1;});
  // Utiliser buildRanking pour avoir le vrai total (favBonus + easterEgg + SM)
  let lbData=[],totalPts=pts;
  try{
    lbData=buildRanking(state,'all',allMatches(state),player.groupIds);
    const lbPlayer=lbData.find(x=>x.id===player.id);
    if(lbPlayer)totalPts=lbPlayer.pts;
  }catch(e){console.warn('buildRanking error:',e);}
  const sp=$('sP2');if(sp)sp.textContent=totalPts;const se=$('sE');if(se)se.textContent=exact;const sl=$('sPl');if(sl)sl.textContent=played;
  const lgEl=$('lgGroup');
  if(lgEl){const cur=lgEl.value||'';const pg=state.groups.filter(g=>player.groupIds.includes(g.id)&&g.id!=='matchunique');const showAll=pg.length>1;lgEl.innerHTML=(showAll?`<option value="all" ${cur==='all'||!cur?'selected':''}>Tous mes groupes</option>`:'')+pg.map(g=>`<option value="${esc(g.id)}" ${cur===g.id?'selected':''}>${esc(g.name)}</option>`).join('');if(!cur&&!showAll&&pg[0])lgEl.value=pg[0].id;}
  try{renderLeaderboard(state,'leaderboard','lgGroup',player.groupIds,true);}catch(e){console.warn('leaderboard:',e);}
  try{renderPronos(state,opts,[player],false);}catch(e){console.error('renderPronos crash:',e);}
  // Special match tab
  {const spTab=$('specialmatchTab');const spEl=$('specialmatchContent');
  // Afficher le match spécial si le joueur est dans matchunique OU si un match spécial existe
  const hasSpecialMatch=!!(state.specialMatch&&(state.specialMatch.teamA||state.specialMatch.teamB));
  const inMatchUnique=player.groupIds&&player.groupIds.includes('matchunique');
  if(inMatchUnique||hasSpecialMatch){
    if(spTab)spTab.style.display='inline-block';
    if(spEl){
      try{
        renderSpecialMatchPlayer(state,player.id,spEl);
      }catch(err){
        console.error('renderSpecialMatchPlayer error:',err);
        spEl.innerHTML='<div class="card"><p style="color:red">Erreur: '+err.message+'</p></div>';
      }
    }
  }else{
    if(spTab)spTab.style.display='none';
    if(spEl)spEl.innerHTML='';
  }}
  renderGroupTables(state,'groupTablesViz');
  const bs=$('bracketSummary');if(bs){const built=buildKO(state);bs.innerHTML=built.best8.length?`<div style="display:flex;flex-wrap:wrap;gap:4px">${built.best8.map((t,i)=>`<span class="badge info">${i+1}. ${esc(teamName(t.team))} (${t.group})</span>`).join('')}</div>`:'<p>Disponible après la phase de groupes.</p>';}

  renderBracket(state,'bracketViz');
}

function handleTabs(e){
  const tab=e.target.closest('.tab');if(!tab)return false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  tab.classList.add('active');const sec=$(tab.dataset.tab);if(sec)sec.classList.add('active');
  const fv=$('floatValidate');
  if(fv)fv.style.display=(tab.dataset.tab==='mypronos')?'block':'none';
  // Scroll l'onglet actif en vue sur mobile
  try{tab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}catch(e){}
  // Re-render selon l'onglet
  if(window._appRef){
    const app=window._appRef;
    if(tab.dataset.tab==='testmatch'&&window._appRef)try{renderSpecialMatch(window._appRef.state);}catch(err){}
    if(tab.dataset.tab==='specialmatch'){
      const sess=getSession();
      if(sess?.role==='player'&&window._appRef){
        const spEl=$('specialmatchContent');
        if(spEl){
          try{
            renderSpecialMatchPlayer(window._appRef.state,sess.pid,spEl);
          }catch(err){
            console.error('renderSpecialMatchPlayer error:',err);
            spEl.innerHTML='<div class="card"><p style="color:red;font-size:13px">Erreur: '+err.message+'</p></div>';
          }
        }
      }
    }
  }
  return true;
}

function savePredFromInputs(st,mid,pid,isKo){
  if(!st.predictions[mid])st.predictions[mid]={};
  const pa=$(`pa-${mid}-${pid}`),pb=$(`pb-${mid}-${pid}`);
  const ppa=$(`ppa-${mid}-${pid}`),ppb=$(`ppb-${mid}-${pid}`);
  const petA=$(`pet-a-${mid}-${pid}`),petB=$(`pet-b-${mid}-${pid}`);
  const v=x=>x?.value!==''&&x?.value!=null?Number(x.value):null;
  if(!pa||!pb)return false;
  if(pa.value==='')pa.value='0';
  if(pb.value==='')pb.value='0';
  const sA=Number(pa.value),sB=Number(pb.value);
  // Validation KO : nul à 90min -> prolongations obligatoires
  if(isKo){
    if(sA===sB){
      const etA=v(petA),etB=v(petB);

  const etA2=sA!==sB?null:v(petA);
  const etB2=sA!==sB?null:v(petB);
  const penA2=(etA2===null||etA2!==etB2)?null:v(ppa);
  const penB2=(etA2===null||etA2!==etB2)?null:v(ppb);
  st.predictions[mid][pid]={scoreA:sA,scoreB:sB,scoreAET:etA2,scoreBET:etB2,penA:penA2,penB:penB2};
  return true;
}

    if(p1.length<4){if(msg)msg.textContent='⚠️ Minimum 4 caractères.';return;}
    app.state.adminPwd=p1;saveState(app.state);
    if(msg){msg.style.color='rgba(20,196,125,.9)';msg.textContent='✅ Mot de passe changé !';}
    if($('newAdminPwd'))$('newAdminPwd').value='';
    if($('newAdminPwd2'))$('newAdminPwd2').value='';
  });

  // ── Outil: Corriger une équipe dans le tableau ─────────────────
  function refreshOverrideFrom(){
    const sel=$('overrideFrom');if(!sel)return;
    const cur=sel.value;
    // Construire la liste des équipes actuellement dans le bracket
    const built=buildKO(app.state);
    const teams=new Set();
    if(built&&built.rounds&&built.rounds[0]){
      built.rounds[0].forEach(m=>{if(m.teamA)teams.add(m.teamA);if(m.teamB)teams.add(m.teamB);});
    }
    // Trier par nom
    const opts=[...teams].sort((a,b)=>(teamName(a)||a).localeCompare(teamName(b)||b));
    sel.innerHTML='<option value="">-- Équipe à remplacer --</option>'+
      opts.map(c2=>`<option value="${c2}"${c2===cur?' selected':''}>${esc(teamName(c2)||c2)}</option>`).join('');
  }

  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action="apply-override"]');if(!btn)return;
    const fromTeam=$('overrideFrom')?.value?.trim();
    const toTeam=$('overrideTo')?.value?.trim();
    if(!fromTeam){toast('⚠️ Choisis l\'équipe à remplacer.');return;}
    if(!toTeam){toast('⚠️ Choisis la nouvelle équipe.');return;}
    if(fromTeam===toTeam){toast('⚠️ Même équipe.');return;}
    if(!app.state.groupOverrides)app.state.groupOverrides={};
    // Trouver le slot de fromTeam dans les standings
    let foundSlot=null;
    const letters='ABCDEFGHIJKL'.split('');
    for(const g of letters){
      const st=groupStandings(app.state.matches,g);
      if(st.table[0]?.team===fromTeam)foundSlot='1'+g;
      else if(st.table[1]?.team===fromTeam)foundSlot='2'+g;
      else if(st.table[2]?.team===fromTeam)foundSlot='3'+g;
    }
    // Chercher aussi dans les overrides existants
    if(!foundSlot){
      for(const[s2,t] of Object.entries(app.state.groupOverrides)){if(t===fromTeam){foundSlot=s2;break;}}
    }
    if(!foundSlot){toast('⚠️ Équipe introuvable. Phase de groupes terminée ?');return;}
    app.state.groupOverrides[foundSlot]=toTeam;
    saveState(app.state);renderAdmin(app.state);
    toast(`✅ ${teamName(fromTeam)||fromTeam} → ${teamName(toTeam)||toTeam}`);
    renderOverridesList(app.state);
    setTimeout(refreshOverrideFrom,100);
  });

  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action="delete-override"]');if(!btn)return;
    const slot=btn.dataset.slot;
    if(app.state.groupOverrides&&slot){
      delete app.state.groupOverrides[slot];
      saveState(app.state);renderAdmin(app.state);
      toast(`🗑️ Correction ${slot} supprimée`);
      renderOverridesList(app.state);
      setTimeout(refreshOverrideFrom,100);
    }
  });

  function renderOverridesList(state){
    const el=$('overridesList');if(!el)return;
    const ov=state.groupOverrides||{};
    const entries=Object.entries(ov);
    if(!entries.length){el.innerHTML='<span style="font-size:12px;color:rgba(255,255,255,.3)">Aucune correction active.</span>';return;}
    el.innerHTML='<div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px">Corrections actives :</div>'+
      entries.map(([s2,t])=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span class="badge info" style="font-size:11px">${s2}</span>
        <span style="font-size:13px;font-weight:600">${esc(teamName(t)||t)}</span>
        <button type="button" data-action="delete-override" data-slot="${s2}" style="background:none;border:none;cursor:pointer;color:rgba(255,100,100,.7);font-size:13px">✕</button>
      </div>`).join('');
  }

  // Rafraîchir le select "équipe à remplacer" quand on ouvre l'onglet Outils
  document.querySelectorAll('.tab[data-tab="tools"]').forEach(tab=>{
    tab.addEventListener('click',()=>{setTimeout(()=>{refreshOverrideFrom();renderOverridesList(app.state);},50);});
  });
}

function initPlayerEvents(app,player){
  document.addEventListener('click',e=>{
    if(handleTabs(e))return;
    const btn=e.target.closest('button[data-action],button#togglePastBtn');if(!btn)return;
    const action=btn.dataset?.action;
    // Toggle passés
    if(btn.id==='togglePastBtn'){const tb=$('togglePastBtn');if(!tb)return;const nv=tb.dataset.showPast==='1'?'0':'1';tb.dataset.showPast=nv;tb.textContent=nv==='1'?'🙈 Masquer passés':'👁 Voir passés';renderPlayer(app.state,player);return;}
    if(!action)return;
    if(action==='set-pred'){
      const mid=btn.dataset.match,pid=btn.dataset.player;if(pid!==player.id){toast('Action non autorisée');return}
      const allM=matchesForPhase(app.state,'groups').concat(allKoMatches(app.state));
      const m=allM.find(m=>m.id===mid);
      if(m&&isMatchLocked(m)){toast('🔒 Pronos fermés pour ce match');return}
      if(!savePredFromInputs(app.state,mid,pid,!!(m&&m.isKo)))return;
      saveState(app.state);
      // Mise à jour partielle: juste le bloc de ce joueur pour ce match
      // sans re-render complet (évite de perdre les autres valeurs saisies)
      const predBlock=btn.closest('[style*="border-radius:10px"]');
      if(predBlock&&m){
        const updatedHtml=renderPredBlock(app.state,m,player);
        const tmp=document.createElement('div');tmp.innerHTML=updatedHtml;
        predBlock.replaceWith(tmp.firstElementChild);
      }
      toast('✅ Prono enregistré');return;
    }
    if(action==='toggle-prono-detail'){
      const pid3=btn.dataset.pid;
      const d=document.getElementById('prono-detail-'+pid3);
      if(d){d.style.display=d.style.display==='none'?'block':'none';
        btn.textContent=d.style.display==='none'?'▼':'▲';}
      return;
    }
        if(action==='save-special-prono'){
      if(!app.state.specialMatch){toast('Pas de match spécial');return}
      // Double vérification côté serveur: bloquer si match déjà commencé
      if(isSpecialMatchLocked(app.state.specialMatch)){
        toast('⏰ Les pronos sont fermés pour ce match !');
        renderPlayer(app.state,player);
        return;
      }
      if(!app.state.specialPronos)app.state.specialPronos={};
      const pid2=player.id;
      // Lire les inputs de buteurs dynamiques
      const scorerInputs=[...document.querySelectorAll('.sp-scorer-input')];
      const scorersVal=scorerInputs.map(i=>i.value.trim()).join('\n');
      const spA=$('sp-scoreA')?.value;const spB=$('sp-scoreB')?.value;
      // Traiter "" comme 0 (placeholder visible mais value vide = joueur n'a pas changé)
      const nA=spA!=null&&spA!==''?Number(spA):0;
      const nB=spB!=null&&spB!==''?Number(spB):0;
      // Si canET et score nul: prolongation obligatoire avec score >= 90min
      const sm2=app.state.specialMatch;
      if(sm2&&sm2.canET&&nA===nB){
        const etA=$('sp-scoreAET')?.value;const etB=$('sp-scoreBET')?.value;
        const etAN=etA!==''&&etA!=null?Number(etA):null;
        const etBN=etB!==''&&etB!=null?Number(etB):null;
        if(etAN===null||etBN===null){toast('Score nul : remplis aussi les prolongations.');return;}
        if(etAN<nA||etBN<nB){toast('Le score en prolongation ne peut pas etre inferieur aux 90min.');return;}
      }
      // Vérifier que les buteurs sont remplis si buts prévus
      const totalGoals = nA + nB;
      const scorerCount = scorerInputs.filter(i=>i.value.trim()!=='').length;
      if(totalGoals > 0 && scorerCount === 0){
        toast('⚠️ Tu as prévu '+totalGoals+' but'+(totalGoals>1?'s':'')+' — indique les buteurs !');return;
      }
      if(scorerCount > 0 && scorerCount < totalGoals){
        toast('⚠️ Il manque des buteurs ('+scorerCount+'/'+totalGoals+' renseignés).');return;
      }
      app.state.specialPronos[pid2]={
        scoreA:nA,
        scoreB:nB,
        scoreAET:$('sp-scoreAET')?.value!==''?Number($('sp-scoreAET')?.value??''):null,
        scoreBET:$('sp-scoreBET')?.value!==''?Number($('sp-scoreBET')?.value??''):null,
        penA:$('sp-penA')?.value!==''?Number($('sp-penA')?.value??''):null,
        penB:$('sp-penB')?.value!==''?Number($('sp-penB')?.value??''):null,
        scorers:scorersVal,
        yellowCards:$('sp-yellow')?.value!==''?Number($('sp-yellow').value):null,
        redCards:$('sp-red')?.value!==''?Number($('sp-red').value):null,
        hasPenalty:$('sp-penalty-nb')?.value!==''&&Number($('sp-penalty-nb')?.value)>0,
        penaltyCount:$('sp-penalty-nb')?.value!==''?Number($('sp-penalty-nb').value):0,
        rareEvent:$('sp-rare')?.value?.trim()||''
      };
      saveState(app.state);
      // Bloquer le prono après validation
      renderPlayer(app.state,player);
      toast('✅ Prono enregistré et verrouillé !');return;
    }
    if(action==='logout'){clearSession();location.reload();return;}
    if(action==='save-all-preds'){
      const phase=$('pronosPhaseSelect')?.value||'groups';const matchList=matchesForPhase(app.state,phase);let count=0;
      matchList.forEach(m=>{if(isMatchLocked(m))return;if(savePredFromInputs(app.state,m.id,player.id,!!m.isKo))count++;});
      if(count>0){saveState(app.state);renderPlayer(app.state,player);toast(`✅ ${count} prono${count>1?'s':''} enregistré${count>1?'s':''}`);}
      else toast('Aucun nouveau prono');return;
    }
    if(action==='view-pronos'){
      const pid=btn.dataset.pid;const detail=$('pronos-detail');if(!detail)return;
      if(detail.dataset.openPid===pid){detail.innerHTML='';detail.dataset.openPid='';btn.textContent='📋';}
      else{renderPlayerPronosDetail(app.state,pid,'pronos-detail');detail.dataset.openPid=pid;btn.textContent='▲';detail.scrollIntoView({behavior:'smooth',block:'nearest'});}return;
    }
    if(action==='close-pronos'){const d=$('pronos-detail');if(d){d.innerHTML='';d.dataset.openPid='';}document.querySelectorAll('[data-action="view-pronos"]').forEach(b=>b.textContent='📋');return;}
  });
  // Griser ET/TAB en temps réel si score 90min non nul
  document.addEventListener('input',e=>{
    const x=e.target;if(!x||!x.classList.contains('score-sm'))return;
    if(!x.id.startsWith('pa-')&&!x.id.startsWith('pb-'))return;
    const parts=x.id.split('-');const mid2=parts[1],pid2=parts[2];
    const pA2=document.getElementById('pa-'+mid2+'-'+pid2);
    const pB2=document.getElementById('pb-'+mid2+'-'+pid2);
    if(!pA2||!pB2)return;
    const vA=pA2.value!==''?Number(pA2.value):null;
    const vB=pB2.value!==''?Number(pB2.value):null;
    const nonNul=vA!=null&&vB!=null&&vA!==vB;
    ['pet-a-','pet-b-','ppa-','ppb-'].forEach(pref=>{
      const el=document.getElementById(pref+mid2+'-'+pid2);
      if(el){el.disabled=nonNul;el.style.opacity=nonNul?'0.4':'1';}
    });
  });
  document.addEventListener('change',e=>{
    const x=e.target;if(!x)return;
    if(x.id==='lgGroup')renderPlayer(app.state,player);
    if(x.id==='pronosPhaseSelect')renderPlayer(app.state,player,{pronosPhase:x.value});
    if(x.id==='pronosPoolFilter')renderPlayer(app.state,player);
  });
}

      q: 'Quel est son film pr&#233;f&#233;r&#233; ?',
      answers: ['The Dark Knight', 'Forrest Gump', 'The Truman Show', 'Shawshank Redemption'],
      correct: 2
    }
  ];

  let step = 0;
  let score = 0;
  let selected = null;

  function render(){
    if(step >= QUESTIONS.length){
      // Résultat final
      const perfect = score === QUESTIONS.length;
      $('app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">'+
        '<div style="width:100%;max-width:480px">'+
          '<div class="card" style="text-align:center">'+
            '<div style="font-size:52px;margin-bottom:12px">'+(perfect?'🎉':'🤔')+'</div>'+
            '<h2 style="font-size:22px;margin-bottom:8px">'+(perfect?'Parfait !':'Pas mal !')+'</h2>'+
            '<p style="color:var(--muted);margin-bottom:16px">'+
              score+' bonne'+(score>1?'s':'')+' r&#233;ponse'+(score>1?'s':'')+' sur '+QUESTIONS.length+'.<br>'+
              (perfect?'<b style="color:#f5d442">+1 pt bonus</b> ajout&#233; &#224; ton score !':'Essaie encore... ah non, c&#39;est trop tard 😄')+
            '</p>'+
            '<button type="button" id="eggReturnBtn" class="primary" onclick="window._closeEasterEgg&&window._closeEasterEgg()" style="width:100%;padding:13px;font-size:15px" disabled>Sauvegarde en cours…</button>'+
          '</div>'+
        '</div>'+
      '</div>';
      onDone(perfect ? 1 : 0);
      return;
    }

    const q = QUESTIONS[step];
    const prog = QUESTIONS.map((_,i)=>'<div style="height:3px;border-radius:999px;flex:1;background:'+(i<=step?'rgba(245,200,66,.8)':'rgba(255,255,255,.15)')+'"></div>').join('');

    $('app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">'+
      '<div style="width:100%;max-width:480px">'+
        '<div style="display:flex;gap:5px;margin-bottom:20px">'+prog+'</div>'+
        '<div class="card">'+
          '<p style="font-size:11px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">&#x1F575;&#xFE0F; Easter egg · Question '+(step+1)+'/'+QUESTIONS.length+'</p>'+
          '<h2 style="font-size:18px;margin-bottom:20px;line-height:1.4">'+q.q+'</h2>'+
          '<div style="display:flex;flex-direction:column;gap:8px" id="eggAnswers">'+
            q.answers.map((a,i)=>
              '<button type="button" id="eggA'+i+'" onclick="window._eggSelect('+i+')" style="text-align:left;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);color:#fff;font-size:14px;cursor:pointer;transition:.15s">'+a+'</button>'
            ).join('')+
          '</div>'+
          '<div style="margin-top:16px;display:flex;justify-content:flex-end">'+
            '<button type="button" id="eggNext" onclick="window._eggNext()" style="display:none;padding:11px 24px;border-radius:999px;font-size:14px;font-weight:700;background:linear-gradient(135deg,#14c47d,#0ea86b);color:#06160f;border:none;cursor:pointer">Suivant →</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';

    selected = null;

    window._eggSelect = function(idx){
      if(selected !== null) return; // déjà répondu
      selected = idx;
      const correct = q.correct;
      // Coloriser les réponses
      q.answers.forEach((_,i)=>{
        const btn = document.getElementById('eggA'+i);
        if(!btn) return;
        btn.style.cursor = 'default';
        if(i === correct){
          btn.style.background = 'rgba(20,196,125,.25)';
          btn.style.borderColor = 'rgba(20,196,125,.6)';
        } else if(i === idx && idx !== correct){
          btn.style.background = 'rgba(168,21,55,.25)';
          btn.style.borderColor = 'rgba(252,129,129,.4)';
        }
      });
      if(idx === correct) score++;
      // Afficher le bouton Suivant / Résultat
      const nextBtn = document.getElementById('eggNext');
      if(nextBtn){
        nextBtn.style.display = 'inline-block';
        nextBtn.textContent = step >= QUESTIONS.length-1 ? 'Voir le résultat →' : 'Suivant →';
      }
    };

    window._eggNext = function(){
      step++;
      render();
    };
  }

  window._closeEasterEgg = function(){
    window._openEasterEgg = null;
    window._closeEasterEgg = null;
    window._eggSelect = null;
    window._eggNext = null;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  };

  render();
}

    }
    if(err){err.textContent='Pseudo ou mot de passe incorrect.';err.style.display='block';}
  });
  // Entrée clavier
  [$('loginName'),$('loginPwd')].forEach(el=>{el?.addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn')?.click();});});
})();

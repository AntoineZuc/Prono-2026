<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronos Coupe du Monde 2026</title>

  <!-- Style inline car pas de dossier css/ sur GitHub -->
  <style>
:root {
  --bg: #edf5ff; --bg2: #dbeaff; --card: #fff; --text: #102033;
  --muted: #5d7088; --line: #d7e4f4; --soft: #f7fbff;
  --green: #14c47d; --green2: #0a9d65; --red: #d8335f;
  --yellow: #fff5d9; --shadow: 0 16px 40px rgba(30,62,100,.14); --radius: 22px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: Inter, Arial, system-ui, sans-serif; background: linear-gradient(180deg,var(--bg),var(--bg2)); color: var(--text); }
header, main { max-width: 1220px; margin: auto; padding: 20px; }
main { padding-top: 0; padding-bottom: 42px; }
.hero, .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }
.hero { display: grid; grid-template-columns: 1.35fr .85fr; gap: 16px; position: relative; overflow: hidden; }
.hero::after { content: "⚽"; position: absolute; right: 25px; bottom: -28px; font-size: 125px; opacity: .08; transform: rotate(-12deg); }
h1 { margin: 6px 0 8px; font-size: clamp(34px,5vw,56px); letter-spacing: -1.2px; }
h2 { margin: 0 0 14px; font-size: 22px; }
.muted, p, label { color: var(--muted); }
p { line-height: 1.5; }
.top-actions, .tabs, .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tabs { position: sticky; top: 0; z-index: 10; background: rgba(237,245,255,.94); backdrop-filter: blur(10px); padding: 10px 0; margin: 10px 0 18px; }
button, .file-label { border: 1px solid #c9d9ea; background: white; color: #17304d; border-radius: 999px; padding: 11px 15px; font-weight: 850; cursor: pointer; box-shadow: 0 5px 14px rgba(30,62,100,.07); transition: .15s; }
button:hover, .file-label:hover { background: #f5faff; transform: translateY(-1px); }
button:active { transform: translateY(0); }
button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.tab.active, .primary { background: linear-gradient(135deg,var(--green),var(--green2)); color: #06160f; border-color: transparent; }
.danger { background: #fff0f3; color: #a91537; border-color: #ffd1db; }
.small { font-size: 13px; padding: 7px 10px; }
.section { display: none; } .section.active { display: block; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.stat { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stat strong { font-size: 30px; display: block; } .stat span { color: var(--muted); font-size: 13px; }
input, select { width: 100%; padding: 11px; border: 1px solid #cddced; border-radius: 13px; background: var(--soft); color: var(--text); font-size: 15px; }
input[type=checkbox] { width: auto; accent-color: var(--green); transform: scale(1.12); }
label { display: block; font-size: 13px; margin: 9px 0 5px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; border-bottom: 1px solid #e1ebf7; text-align: left; vertical-align: middle; }
th { background: #edf5ff; color: #314761; font-size: 13px; }
tr:hover td { background: #f8fbff; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; background: #e9f4ff; color: #25547e; font-size: 12px; font-weight: 850; margin: 2px; white-space: nowrap; }
.paid { background: #e8fff5; color: #08784e; } .unpaid { background: #fff0f3; color: #b21f42; }
.warn { background: var(--yellow); color: #875700; } .info { background: #edf5ff; color: #315a88; }
.empty { padding: 18px; border: 1px dashed #c8d8eb; border-radius: 16px; text-align: center; color: #61748b; background: #f8fbff; }
.match { background: #f8fbff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 10px; }
.teams { font-weight: 950; font-size: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.score { display: grid; grid-template-columns: 1fr 32px 1fr; gap: 8px; align-items: end; }
.score span { align-self: center; text-align: center; font-weight: 900; color: var(--muted); }
.pred { display: grid; grid-template-columns: minmax(230px,1fr) 88px 88px auto; gap: 8px; align-items: end; background: white; border: 1px solid var(--line); border-radius: 14px; padding: 8px; margin-top: 8px; }
.team { display: inline-flex; align-items: center; gap: 7px; }
.team img { width: 28px; height: 21px; object-fit: cover; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.flag-code { font-size: 11px; font-weight: 900; color: #52677f; background: white; border: 1px solid #bfd1e5; border-radius: 999px; padding: 3px 6px; }
.check-card { display: inline-flex; align-items: center; gap: 6px; margin: 4px; padding: 8px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(15px); background: #102033; color: white; padding: 12px 16px; border-radius: 999px; opacity: 0; transition: .2s; z-index: 99; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.ko-round { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 10px; }
.player-banner { background: linear-gradient(135deg,var(--green),var(--green2)); color: #06160f; border-radius: var(--radius); padding: 16px 22px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.player-banner strong { font-size: 20px; } .player-banner .sub { opacity: .7; font-size: 14px; }
@media (max-width:850px) {
  header, main { padding: 14px; }
  .hero, .grid, .grid3, .filters, .stats { grid-template-columns: 1fr; }
  .pred { grid-template-columns: 1fr 1fr; } .pred button { grid-column: 1/-1; }
  .teams { font-size: 16px; } table { font-size: 13px; } th, td { padding: 8px; }
}
  </style>
</head>
<body>

  <div id="app">
    <div style="text-align:center;padding:80px;font-family:sans-serif;color:#5d7088">
      Chargement…
    </div>
  </div>

</body>
</html>

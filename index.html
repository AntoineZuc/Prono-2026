<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronos CDM 2026</title>
<style>
:root{--bg:#0a0e1a;--bg2:#0d1628;--card:rgba(255,255,255,.06);--card-solid:#111b2e;--text:#e8f0fe;--muted:#7a95b8;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.04);--green:#14c47d;--green2:#0a9d65;--gold:#f5c842;--gold2:#ffdb4d;--shadow:0 8px 32px rgba(0,0,0,.4);--radius:18px;--accent:#1e6fff}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:Inter,Arial,system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(30,111,255,.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(20,196,125,.12) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 60% 30%, rgba(245,200,66,.07) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
header,main{max-width:1200px;margin:auto;padding:16px}
main{padding-top:0;padding-bottom:40px}
.hero,.card{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);padding:20px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:1.3fr .9fr;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"⚽";position:absolute;right:20px;bottom:-26px;font-size:110px;opacity:.06;transform:rotate(-12deg)}
h1{margin:4px 0 6px;font-size:clamp(24px,4vw,46px);letter-spacing:-.8px;background:linear-gradient(135deg,#fff 30%,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{margin:0 0 12px;font-size:18px;font-weight:700;color:var(--text)}
p{line-height:1.5;color:var(--muted);margin:4px 0}
.muted{color:var(--muted)}
.tabs{position:sticky;top:0;z-index:10;background:rgba(10,14,26,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:8px 0;margin:10px 0 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.07)}
button,.file-label{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:.15s;backdrop-filter:blur(8px)}
button:hover,.file-label:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tab.active,.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#06160f;border-color:transparent}
.danger{background:#fff0f3;color:#a91537;border-color:#ffd1db}
.small{font-size:12px;padding:5px 11px}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px}
.stat strong{font-size:26px;display:block;color:var(--green)}.stat span{color:var(--muted);font-size:12px}
input,select{width:100%;padding:9px 11px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-family:inherit}
input::placeholder{color:rgba(255,255,255,.35)}
input:focus,select:focus{outline:2px solid rgba(30,111,255,.5);outline-offset:1px;background:rgba(255,255,255,.15)}
select option{background:#1a2640;color:#fff}
input[type=checkbox]{width:auto;accent-color:var(--green)}
input[type=number]{-moz-appearance:textfield}
input:disabled{opacity:.5}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:middle}
th{background:rgba(255,255,255,.08);color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.04)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;background:rgba(30,111,255,.2);color:#7eb8ff;font-size:11px;font-weight:700;margin:2px;white-space:nowrap;border:1px solid rgba(30,111,255,.25)}
.paid{background:rgba(20,196,125,.18);color:#4de8a8;border-color:rgba(20,196,125,.3)}.warn{background:rgba(245,200,66,.15);color:#f5d442;border-color:rgba(245,200,66,.25)}.info{background:rgba(30,111,255,.15);color:#7eb8ff;border-color:rgba(30,111,255,.2)}
.empty{padding:18px;border:1px dashed rgba(255,255,255,.15);border-radius:14px;text-align:center;color:var(--muted);background:rgba(255,255,255,.03);font-size:13px}
.match{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px;transition:background .2s,border-color .2s}
.match.validated{background:rgba(20,196,125,.12);border-color:rgba(20,196,125,.4)}
.team{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.team img{width:22px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.1);flex-shrink:0}
.matches-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pronos-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.match-row{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.score-box{display:flex;align-items:center;gap:4px;flex-shrink:0}
.score-sm{width:40px;padding:6px 4px;text-align:center;border:1px solid rgba(255,255,255,.3);border-radius:9px;background:rgba(255,255,255,.15);color:#fff;font-size:16px;font-weight:800;font-family:inherit;-moz-appearance:textfield}
.score-sm::placeholder{color:rgba(255,255,255,.35)}
.score-box span{color:var(--muted);font-weight:800;font-size:13px}
.pred{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:8px;margin-top:6px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.phase-selector{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 13px;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.phase-selector label{margin:0;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.phase-selector select{width:auto;min-width:180px;flex:1}
.check-card{display:inline-flex;align-items:center;gap:5px;margin:3px;padding:6px 9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-weight:700;font-size:12px;color:var(--text)}
.link-box{background:rgba(20,196,125,.12);border:1px solid rgba(20,196,125,.3);border-radius:10px;padding:7px 11px;margin-top:5px;font-size:11px;word-break:break-all;color:#4de8a8}
.player-banner{background:linear-gradient(135deg,rgba(20,196,125,.3),rgba(10,157,101,.3));border:1px solid rgba(20,196,125,.4);border-radius:var(--radius);padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.player-banner strong{font-size:16px;color:#4de8a8}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);background:#102033;color:white;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;z-index:999;font-size:13px;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* BRACKET */
.bracket-scroll{overflow-x:auto;padding:8px 0}
.bracket{display:flex;gap:2px;min-width:820px}
.bcol{display:flex;flex-direction:column;flex:1;min-width:100px}
.bcol-label{text-align:center;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:4px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:3px}
.bmatches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:3px;padding:3px 2px}
.bmatches.sf-m{justify-content:center;gap:8px}
.bmatch{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:7px;overflow:hidden}
.bteam{display:flex;align-items:center;gap:4px;padding:4px 6px;font-size:11px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.06);min-height:25px;transition:background .2s;color:var(--text)}
.bteam:last-child{border-bottom:none}
.bteam img{width:18px;height:13px;object-fit:cover;border-radius:2px;flex-shrink:0}
.bteam .fp{width:18px;height:13px;background:rgba(255,255,255,.15);border-radius:2px;flex-shrink:0}
.bteam .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bteam.winner{background:linear-gradient(90deg,rgba(245,200,66,.2),transparent);border-left:3px solid var(--gold2)}
.bteam.winner .tn{color:var(--gold2)}
.bteam.silver{background:linear-gradient(90deg,rgba(180,180,180,.15),transparent);border-left:3px solid #aaa}
.bteam.silver .tn{color:#ccc}
.bteam.loser{opacity:.35}
.bteam.tbd .tn{color:#aab8c9;font-style:italic;font-size:10px}
/* GROUPES POULE */
.groups-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.group-table{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;backdrop-filter:blur(8px)}
.group-table-hdr{background:linear-gradient(135deg,rgba(30,111,255,.25),rgba(20,196,125,.15));padding:7px 12px;font-size:12px;font-weight:800;color:var(--text);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1)}
.group-row{display:flex;align-items:center;gap:5px;padding:5px 10px;border-top:1px solid rgba(255,255,255,.05);font-size:12px}
.group-row.q1,.group-row.q2{background:linear-gradient(90deg,rgba(20,196,125,.15),transparent)}
.group-row.q3{background:linear-gradient(90deg,rgba(245,200,66,.1),transparent)}
.group-row img{width:18px;height:13px;object-fit:cover;border-radius:2px}
.group-row .gr{width:14px;text-align:center;font-weight:800;color:var(--muted);font-size:11px}
.group-row .gn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.group-row .gp{width:18px;text-align:center;font-weight:800;font-size:13px}
.group-row .gs{font-size:11px;color:var(--muted);width:32px;text-align:right}
@media(max-width:820px){
  header,main{padding:10px}
  .hero,.grid,.stats{grid-template-columns:1fr}
  .matches-grid,.pronos-grid{grid-template-columns:1fr}
  table{font-size:12px}th,td{padding:7px}
  .groups-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

const GROUPS_SEED=[];
const STORAGE_KEY='cdm2026v6';
const ADMIN_PWD='admin'; // Mot de passe admin par défaut

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dateFr=d=>{if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}catch{return d}};
let _tt;
const toast=msg=>{const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2200)};
const $=id=>document.getElementById(id);

// ══════════════════════════════════════════════
// TEAMS
// ══════════════════════════════════════════════
const teamName=c=>TEAMS[c]?TEAMS[c][0]:String(c||'?');
const teamFlag=c=>TEAMS[c]?`https://flagcdn.com/w40/${TEAMS[c][1]}.png`:'';
function teamHtml(code){
  const url=teamFlag(code);
  const img=url?`<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
  return`<span class="team">${img}<span>${esc(teamName(code))}</span></span>`;
}
function normalizeTeam(raw){
  const k=String(raw||'').trim();
  if(TEAMS[k])return k;
  for(const[c,d]of Object.entries(TEAMS))if(d[0].toLowerCase()===k.toLowerCase())return c;
  return k||'?';
}

// ══════════════════════════════════════════════
// SECURITY — Système login pseudo + mot de passe
// ══════════════════════════════════════════════
function hashPwd(pwd){
  let h=0;for(let i=0;i<pwd.length;i++){h=Math.imul(31,h)+pwd.charCodeAt(i)|0;}
  return h.toString(36);
}
function generatePwd(name){
  // Prenom avec majuscule + 6 chiffres aléatoires
  const first=name.trim().charAt(0).toUpperCase()+name.trim().slice(1).toLowerCase();
  const digits=String(Math.floor(100000+Math.random()*900000));
  return first+digits;
}
function getSession(){
  try{const s=sessionStorage.getItem('cdm2026session');return s?JSON.parse(s):null;}catch{return null;}

let _pollTimer=null,_lastSave=0;
function startPolling(app,onUpdate){
  if(_pollTimer)clearInterval(_pollTimer);

    // MAIS prendre specialMatch/specialPronos depuis remote (l'admin les met à jour)

    const isAdmin=getSession()?.role==='admin';
    if(isAdmin){
      // Garder les groupes locaux mais MERGER les players avec remote
      // pour avoir favoriteTeam et autres updates des joueurs
      merged.groups=app.state.groups;

      const localPlayers=app.state.players;

        const lp=localPlayers.find(x=>x.id===rp.id);
        return lp?{...rp,groupIds:lp.groupIds}:rp;
      });
      // Ajouter les joueurs locaux qui ne sont pas encore dans remote
      localPlayers.forEach(lp=>{
        if(!merged.players.find(x=>x.id===lp.id))merged.players.push(lp);
      });
    }
    // specialMatch toujours depuis remote
    // specialMatch vient toujours de remote (mis à jour par l'admin)
    // Conserver pronos locaux
    const lp=app.state.predictions||{};
    const rp=merged.predictions||{};
    Object.keys(lp).forEach(mid=>{
      Object.keys(lp[mid]||{}).forEach(pid=>{
        if(lp[mid][pid]!=null){if(!rp[mid])rp[mid]={};rp[mid][pid]=lp[mid][pid];}
      });
    });
    merged.predictions=rp;
    // Fusionner specialPronos locaux
    const lsp=app.state.specialPronos||{};
    const rsp=merged.specialPronos||{};
    Object.keys(lsp).forEach(pid=>{if(lsp[pid])rsp[pid]=lsp[pid];});

const outcome=(a,b)=>a>b?'A':a<b?'B':'N';
function isMatchLocked(m){
  if(m.scoreA!==null)return true;
  if(!m.date||!m.time)return false;
  try{
    // Les horaires sont en heure de Paris — construire la date en UTC
    const[h,mn]=m.time.split(':').map(Number);
    // Utiliser toLocaleString pour convertir Paris -> UTC
    const parisStr=`${m.date}T${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:00`;
    // Créer la date comme heure locale Paris via Intl
    const koLocal=new Date(parisStr); // interprétée en heure locale du navigateur
    // Ajuster si le navigateur n'est pas à Paris
    const nowParis=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
    const nowLocal=new Date();
    const offset=nowLocal-nowParis; // différence entre local et Paris
    const koParis=new Date(koLocal.getTime()+offset);
    return(koParis-nowLocal)<3600000;
  }catch{return false;}
}
function isMatchPast(m){
  if(m.scoreA!==null)return true;
  if(!m.date||!m.time)return false;
  try{
    const[h,mn]=m.time.split(':').map(Number);
    const parisStr=`${m.date}T${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:00`;
    const koLocal=new Date(parisStr);
    const nowParis=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
    const nowLocal=new Date();
    const offset=nowLocal-nowParis;
    const koParis=new Date(koLocal.getTime()+offset);
    return nowLocal>koParis;
  }catch{return false;}
}
function koFinalScore(r){
  if(r.scoreAET!=null&&r.scoreBET!=null)return{a:r.scoreAET,b:r.scoreBET};
  return{a:r.scoreA,b:r.scoreB};
}
function calcPoints(match,prono){
  if(!prono||prono.scoreA==null||prono.scoreB==null)return null;
  if(match.scoreA===null||match.scoreB===null)return null;
  const isKo=!!(match.isKo||match.knockout);
  const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
  const mA=Number(match.scoreA),mB=Number(match.scoreB);

  // ── POULE ──────────────────────────────────────
  if(!isKo){
    if(pA===mA&&pB===mB)return 3;
    return outcome(pA,pB)===outcome(mA,mB)?1:0;
  }

  // ── KO ─────────────────────────────────────────
  // ÉTAPE 1 — Score 90min
  // 3pts si exact, 1pt si bon résultat, 0 sinon
  let pts=0;
  if(pA===mA&&pB===mB) pts=3;
  else if(outcome(pA,pB)===outcome(mA,mB)) pts=1;
  else return 0;

  // ÉTAPE 2 — Bonus prolongations
  // Conditions: le match a eu des ET ET le joueur avait prévu nul à 90min (pA===pB)
  const hasET=match.scoreAET!=null&&match.scoreBET!=null;
  const pronoPrevuNul90=pA===pB;
  if(hasET&&pronoPrevuNul90&&prono.scoreAET!=null&&prono.scoreBET!=null){
    const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET);
    const mET_A=Number(match.scoreAET),mET_B=Number(match.scoreBET);
    if(pET_A===mET_A&&pET_B===mET_B){
      pts+=3; // score ET exact: +1 (base) +2 (exact) = +3 bonus
    } else {
      pts+=1; // a prévu le nul -> match allé en ET: +1 bonus de base
    }
  }

  // ÉTAPE 3 — Bonus tirs au but
  // Conditions: le match a eu des TAB ET le joueur avait prévu nul en ET (pET_A===pET_B)
  const hasPen=match.penA!=null&&match.penB!=null;
  const pET_A=prono.scoreAET!=null?Number(prono.scoreAET):null;
  const pET_B=prono.scoreBET!=null?Number(prono.scoreBET):null;
  const pronoPrevuNulET=pET_A!==null&&pET_B!==null&&pET_A===pET_B;
  if(hasPen&&pronoPrevuNulET&&prono.penA!=null&&prono.penB!=null){
    const pP_A=Number(prono.penA),pP_B=Number(prono.penB);
    const mP_A=Number(match.penA),mP_B=Number(match.penB);
    if(pP_A===mP_A&&pP_B===mP_B){
      pts+=3; // score TAB exact: +1 (base) +2 (exact) = +3 bonus
    } else {
      pts+=1; // a prévu le nul en ET -> match allé aux TAB: +1 bonus de base
    }
  }

  return pts;
}
function buildRanking(state,gid,allM,restrict){

// ══════════════════════════════════════════════
// KNOCKOUT ENGINE
// ══════════════════════════════════════════════
function groupStandings(matches,group){
  const ms=matches.filter(m=>m.preloaded&&m.wcGroup===group);
  const ts=new Set();ms.forEach(m=>{ts.add(m.teamA);ts.add(m.teamB)});
  const rows={};ts.forEach(t=>{rows[t]={team:t,group,played:0,points:0,gf:0,ga:0}});
  let done=0;
  ms.forEach(m=>{
    if(m.scoreA===null||m.scoreB===null)return;done++;
    const a=rows[m.teamA],b=rows[m.teamB];if(!a||!b)return;
    a.played++;b.played++;a.gf+=m.scoreA;a.ga+=m.scoreB;b.gf+=m.scoreB;b.ga+=m.scoreA;
    if(m.scoreA>m.scoreB)a.points+=3;else if(m.scoreA<m.scoreB)b.points+=3;else{a.points++;b.points++;}
  });
  const table=Object.values(rows).map(r=>({...r,gd:r.gf-r.ga}));
  table.sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||teamName(a.team).localeCompare(teamName(b.team)));
  return{group,complete:done>0&&done===ms.length,done,total:ms.length,table};
}
function getBest8(standings){
  return standings.filter(s=>s.table.length>=3).map(s=>({...s.table[2],group:s.group}))
    .sort((a,b)=>b.points-a.points||(b.gd-a.gd)||(b.gf-a.gf)||a.group.localeCompare(b.group)).slice(0,8);
}
function resolveSlots(r32defs,groupMap,best8){
  const thirdSlots=[];
  r32defs.forEach((d,i)=>{if(d[1].startsWith('3'))thirdSlots.push({i,slot:d[1]});if(d[2].startsWith('3'))thirdSlots.push({i,slot:d[2]});});
  const countCand=slot=>best8.filter(t=>slot.slice(1).includes(t.group)).length;
  const sorted=[...thirdSlots].sort((a,b)=>countCand(a.slot)-countCand(b.slot));
  const assigned={};
  function bt(idx,used){
    if(idx===sorted.length)return true;
    const{i,slot}=sorted[idx];const allowed=slot.slice(1).split('');
    for(const t of best8){
      if(allowed.includes(t.group)&&!used.has(t.group)){
        assigned[`${i}-${slot}`]=t.team;used.add(t.group);
        if(bt(idx+1,used))return true;
        delete assigned[`${i}-${slot}`];used.delete(t.group);
      }
    }
    return false;
  }
  bt(0,new Set());
  return(slot,idx)=>{
    if(!slot)return null;
    if(slot.length===2)return groupMap[slot]||null;
    return assigned[`${idx}-${slot}`]||null;
  };
}
const koResult=(ko,stage,idx)=>ko[`${stage}-${idx}`]||{scoreA:null,scoreB:null,scoreAET:null,scoreBET:null,penA:null,penB:null};
function winner(tA,tB,stage,idx,ko){
  if(!tA||!tB)return null;
  const r=koResult(ko,stage,idx);
  if(r.scoreA===null||r.scoreB===null)return null;
  const fs=koFinalScore(r);
  if(fs.a>fs.b)return tA;if(fs.b>fs.a)return tB;
  if(r.penA!=null&&r.penB!=null&&r.penA!==r.penB)return r.penA>r.penB?tA:tB;
  return null;
}
function buildKO(state){
  const letters='ABCDEFGHIJKL'.split('');

  const groupMap={};standings.forEach(s=>{if(s.table[0])groupMap['1'+s.group]=s.table[0].team;if(s.table[1])groupMap['2'+s.group]=s.table[1].team;});

  const r16=R16_PAIRS.map(([x,y],i)=>({stage:'r16',index:i,matchNo:89+i,teamA:winner(r32[x].teamA,r32[x].teamB,'r32',x,state.knockout),teamB:winner(r32[y].teamA,r32[y].teamB,'r32',y,state.knockout),slotA:`W.M${r32[x].matchNo}`,slotB:`W.M${r32[y].matchNo}`,...koResult(state.knockout,'r16',i)}));
  const qf=QF_PAIRS.map(([x,y],i)=>({stage:'qf',index:i,matchNo:97+i,teamA:winner(r16[x].teamA,r16[x].teamB,'r16',x,state.knockout),teamB:winner(r16[y].teamA,r16[y].teamB,'r16',y,state.knockout),...koResult(state.knockout,'qf',i)}));
  const sf=[0,1].map(i=>({stage:'sf',index:i,matchNo:101+i,teamA:winner(qf[i*2].teamA,qf[i*2].teamB,'qf',i*2,state.knockout),teamB:winner(qf[i*2+1].teamA,qf[i*2+1].teamB,'qf',i*2+1,state.knockout),...koResult(state.knockout,'sf',i)}));
  function loser(tA,tB,stage,idx){const w=winner(tA,tB,stage,idx,state.knockout);if(!w||(!tA&&!tB))return null;return w===tA?tB:tA;}
  const third=[{stage:'third',index:0,matchNo:103,teamA:loser(sf[0].teamA,sf[0].teamB,'sf',0),teamB:loser(sf[1].teamA,sf[1].teamB,'sf',1),...koResult(state.knockout,'third',0)}];
  const finale=[{stage:'final',index:0,matchNo:104,teamA:winner(sf[0].teamA,sf[0].teamB,'sf',0,state.knockout),teamB:winner(sf[1].teamA,sf[1].teamB,'sf',1,state.knockout),...koResult(state.knockout,'final',0)}];
  return{allComplete,standings,best8,rounds:[r32,r16,qf,sf,third,finale]};
}
function allKoMatches(state){

  const best8teams=new Set(getBest8(standings).map(t=>t.team));
  el.innerHTML='<div class="groups-grid">'+standings.map(s=>{
    const{group,table,done,total}=s;
    const rows=table.map((r,i)=>{
      const url=teamFlag(r.team);
      const img=url?`<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
      const cls=i===0?'group-row q1':i===1?'group-row q2':best8teams.has(r.team)?'group-row q3':'group-row';
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      return`<div class="${cls}"><span class="gr">${medal||i+1}</span>${img}<span class="gn">${esc(teamName(r.team))}</span><span class="gp">${r.points}</span><span class="gs">${r.played?r.gf+'-'+r.ga:'-'}</span></div>`;
    }).join('');
    return`<div class="group-table"><div class="group-table-hdr"><span>Groupe ${group}</span><span style="font-size:11px;color:var(--muted)">${done}/${total}</span></div>${rows}</div>`;
  }).join('')+'</div>';
}

// ══════════════════════════════════════════════
// RENDER — Bracket visuel
// ══════════════════════════════════════════════
function renderBracket(state,containerId){
  const el=$(containerId);if(!el)return;
  const built=buildKO(state);
  if(!built.allComplete){el.innerHTML='<div class="empty">Disponible après la phase de groupes.</div>';return}
  const[r32,r16,qf,sf,third,finale]=built.rounds;const ko=state.knockout;
  function slotLabel(slot){
    if(!slot)return'?';
    if(slot.length===2)return(slot[0]==='1'?'1er':slot[0]==='2'?'2e':'3e')+' Grp '+slot[1];
    if(slot.startsWith('W.'))return slot;
    return'3e Grp '+slot.slice(1).split('').join('/');
  }
  function bTeam(code,slot,win,lose,silver){
    const url=teamFlag(code);
    const img=url?`<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<div class="fp"></div>`;
    const cls='bteam'+(win?(silver?' silver':' winner'):lose?' loser':code?'':' tbd');
    return`<div class="${cls}">${img}<span class="tn">${esc(code?teamName(code):slotLabel(slot))}</span></div>`;
  }
  function bMatch(m,silver){
    const r=koResult(ko,m.stage,m.index);const fs=koFinalScore(r);
    const has=r.scoreA!==null&&r.scoreB!==null;
    const wA=has&&(fs.a>fs.b||(fs.a===fs.b&&r.penA!=null&&r.penA>r.penB));
    const wB=has&&(fs.b>fs.a||(fs.a===fs.b&&r.penB!=null&&r.penB>r.penA));
    return`<div class="bmatch">${bTeam(m.teamA,m.slotA,wA,has&&!wA&&wB,silver)}${bTeam(m.teamB,m.slotB,wB,has&&!wB&&wA,silver)}</div>`;
  }
  function col(label,matches,sfcol,silver){
    return`<div class="bcol"><div class="bcol-label">${label}</div><div class="bmatches${sfcol?' sf-m':''}">${matches.map(m=>bMatch(m,silver||false)).join('')}</div></div>`;
  }
  // Finale + petite finale en haut
  function finBox(m,gold){
    const r=koResult(ko,m.stage,m.index);const fs=koFinalScore(r);
    const has=r.scoreA!==null&&r.scoreB!==null;
    const wA=has&&(fs.a>fs.b||(fs.a===fs.b&&r.penA!=null&&r.penA>r.penB));
    const wB=has&&(fs.b>fs.a||(fs.a===fs.b&&r.penB!=null&&r.penB>r.penA));
    function side(code,slot,win,lose){
      const url=code?teamFlag(code):'';
      const img=url?`<img src="${url}" alt="" style="width:22px;height:16px;object-fit:cover;border-radius:3px">`:`<div style="width:22px;height:16px;background:#e8eef7;border-radius:3px;flex-shrink:0"></div>`;
      return`<div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;${lose?'opacity:.4':''}"><span style="color:${win?(gold?'#c8860a':'#555'):'inherit'}">${img}${esc(code?teamName(code):slotLabel(slot))}</span></div>`;
    }
    let scoreStr='';
    if(has){scoreStr=`${r.scoreA}-${r.scoreB}`;if(r.scoreAET!=null)scoreStr+=` (${r.scoreAET}-${r.scoreBET} ap)`;if(r.penA!=null)scoreStr+=` (${r.penA}-${r.penB} tab)`;}
    const boxStyle=gold?'background:linear-gradient(135deg,#fffbe6,#fff3c0);border:2px solid #f5c842;border-radius:16px;padding:12px 20px;min-width:230px;text-align:center;box-shadow:0 4px 20px rgba(200,134,10,.22)'
      :'background:linear-gradient(135deg,#f4f4f4,#e8e8e8);border:2px solid #b0b0b0;border-radius:14px;padding:10px 18px;min-width:210px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)';
    return`<div style="${boxStyle}"><div style="font-size:12px;font-weight:800;color:${gold?'#c8860a':'#707070'};margin-bottom:8px">${gold?'🏆 FINALE — M104':'🥉 PETITE FINALE — M103'}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px">${side(m.teamA,m.slotA||'?',wA,has&&wB&&!wA)}<span style="font-size:11px;font-weight:800;color:${gold?'#c8860a':'#888'}">VS</span>${side(m.teamB,m.slotB||'?',wB,has&&wA&&!wB)}</div>
      ${has?`<div style="font-size:13px;font-weight:800;color:${gold?'#c8860a':'#666'};margin-top:6px">${scoreStr}</div>`:''}</div>`;
  }
  const lR32=[r32[0],r32[2],r32[1],r32[4],r32[3],r32[5],r32[6],r32[7]];
  const rR32=[r32[8],r32[10],r32[9],r32[11],r32[12],r32[14],r32[13],r32[15]];
  el.innerHTML=
    `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px">${finBox(finale[0],true)}${finBox(third[0],false)}</div>`+
    `<div class="bracket-scroll"><div class="bracket">${col('32es',lR32,false)}${col('16es',r16.slice(0,4),false)}${col('QF',qf.slice(0,2),false)}${col('SF',sf.slice(0,1),true)}${col('SF',sf.slice(1,2),true)}${col('QF',qf.slice(2,4),false)}${col('16es',r16.slice(4,8),false)}${col('32es',rR32,false)}</div></div>`;
}

// RENDER — Classement

function renderLeaderboard(state,containerId,groupFilterId,restrict,isPlayer){
  const gid=$(groupFilterId)?.value||'all';
  const rows=buildRanking(state,gid,allMatches(state),restrict);

  el.innerHTML=`<table><thead><tr><th>#</th><th>Joueur</th><th>Pts</th><th>Exact</th><th>Bon</th><th>Joués</th>${isPlayer?'<th></th>':''}</tr></thead><tbody>${
    rows.map((p,i)=>{
    const fav=p.favoriteTeam&&TEAMS[p.favoriteTeam]?`<img src="https://flagcdn.com/w40/${TEAMS[p.favoriteTeam][1]}.png" title="${esc(TEAMS[p.favoriteTeam][0])}" style="width:18px;height:13px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-left:4px" loading="lazy" onerror="this.style.display='none'">`:'';
    const favBonusBadge=p.favBonus?`<span style="font-size:10px;background:rgba(245,200,66,.2);color:#f5d442;padding:1px 5px;border-radius:999px;margin-left:4px">+${p.favBonus}🏆</span>`:'';
    return`<tr><td>${medal(i)}</td><td><b>${esc(p.name)}</b>${fav}${favBonusBadge}</td><td><b>${p.pts}</b></td><td>${p.exact}</td><td>${p.good}</td><td>${p.played}</td>${isPlayer?`<td><button class="small" style="padding:3px 8px;font-size:11px" type="button" data-action="view-pronos" data-pid="${p.id}">📋</button></td>`:''}</tr>`;
  }).join('')
  }</tbody></table>${isPlayer?`<div id="pronos-detail"></div>`:''}`;
}

function renderPlayerPronosDetail(state,pid,containerId){
  const el=$(containerId);if(!el)return;
  const player=state.players.find(p=>p.id===pid);
  if(!player){el.innerHTML='';return}

  const rows=done.map(m=>{
    const prono=state.predictions[m.id]?.[pid];
    const pts=calcPoints(m,prono);
    let bg='',badge='';
    if(pts===3){bg='background:linear-gradient(135deg,rgba(20,196,125,.25),rgba(10,157,101,.2));border-color:rgba(20,196,125,.6)';badge='<span style="font-size:11px;font-weight:800;background:rgba(20,196,125,.8);color:#fff;padding:1px 7px;border-radius:999px">🎯 3pts</span>';}
    else if(pts===1){bg='background:rgba(20,196,125,.12);border-color:rgba(20,196,125,.35)';badge='<span style="font-size:11px;font-weight:800;background:rgba(10,157,101,.8);color:#fff;padding:1px 7px;border-radius:999px">✓ 1pt</span>';}
    else if(pts===0){bg='background:rgba(168,21,55,.2);border-color:rgba(252,129,129,.4)';badge='<span style="font-size:11px;font-weight:800;background:rgba(168,21,55,.7);color:#fff;padding:1px 7px;border-radius:999px">✗ 0pt</span>';}
    else{bg='background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)';badge='<span style="font-size:11px;color:rgba(255,255,255,.4)">—</span>';}
    const pr=prono&&prono.scoreA!=null?`${prono.scoreA}-${prono.scoreB}`:'—';

}

// ══════════════════════════════════════════════
// RENDER — Prono block
// ══════════════════════════════════════════════
function renderPredBlock(state,match,player){
  const prono=state.predictions[match.id]?.[player.id];
  const pts=calcPoints(match,prono);
  const locked=isMatchLocked(match);
  const hasPred=prono!=null&&prono.scoreA!=null&&prono.scoreB!=null;
  const isKo=!!(match.isKo||match.knockout);
  const v=x=>x!=null?x:'';
  const mid=match.id,pid=player.id;
  let bgStyle,statusBadge;
  if(locked&&hasPred){
    // Calcul détaillé ligne par ligne
    const pA2=Number(prono.scoreA),pB2=Number(prono.scoreB);
    const mA2=Number(match.scoreA),mB2=Number(match.scoreB);
    let detail='',pts90=0,ptsET=0,ptsTAB=0;

    // 90min
    if(pA2===mA2&&pB2===mB2){pts90=3;detail+=`<div style="font-size:11px;color:rgba(20,196,125,.9);margin-top:4px">⚽ 90min <b>${pA2}-${pB2}</b> exact → <b>3pts</b></div>`;}
    else if(outcome(pA2,pB2)===outcome(mA2,mB2)){pts90=1;detail+=`<div style="font-size:11px;color:rgba(100,200,140,.8);margin-top:4px">⚽ 90min bon résultat → <b>1pt</b></div>`;}
    else{detail+=`<div style="font-size:11px;color:rgba(252,129,129,.8);margin-top:4px">⚽ 90min mauvais résultat → <b>0pt</b></div>`;}

    // ET
    if(isKo&&match.scoreAET!=null&&pA2===pB2&&prono.scoreAET!=null){
      const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET);
      const mET_A=Number(match.scoreAET),mET_B=Number(match.scoreBET);
      if(pET_A===mET_A&&pET_B===mET_B){ptsET=3;detail+=`<div style="font-size:11px;color:rgba(100,160,255,.9);margin-top:2px">🔵 Prolong. <b>${pET_A}-${pET_B}</b> exact → <b>+3 bonus</b></div>`;}
      else{ptsET=1;detail+=`<div style="font-size:11px;color:rgba(100,160,255,.7);margin-top:2px">🔵 Prolong. prévu (nul à 90) → <b>+1 bonus</b></div>`;}
    } else if(isKo&&match.scoreAET!=null&&pA2===pB2&&prono.scoreAET==null){
      ptsET=1;detail+=`<div style="font-size:11px;color:rgba(100,160,255,.7);margin-top:2px">🔵 Prolong. prévu (nul à 90) → <b>+1 bonus</b></div>`;
    }

    // TAB
    if(isKo&&match.penA!=null){
      const pET_A2=prono.scoreAET!=null?Number(prono.scoreAET):null;
      const pET_B2=prono.scoreBET!=null?Number(prono.scoreBET):null;
      if(pET_A2!==null&&pET_A2===pET_B2&&prono.penA!=null){
        const pP_A=Number(prono.penA),pP_B=Number(prono.penB);
        const mP_A=Number(match.penA),mP_B=Number(match.penB);
        if(pP_A===mP_A&&pP_B===mP_B){ptsTAB=3;detail+=`<div style="font-size:11px;color:rgba(245,200,66,.9);margin-top:2px">🟡 Tirs au but <b>${pP_A}-${pP_B}</b> exact → <b>+3 bonus</b></div>`;}
        else{ptsTAB=1;detail+=`<div style="font-size:11px;color:rgba(245,200,66,.7);margin-top:2px">🟡 Tirs au but prévu (nul en prolong.) → <b>+1 bonus</b></div>`;}
      }
    }

    const total=pts90+ptsET+ptsTAB;
    if(total>=3){
      bgStyle='background:linear-gradient(135deg,rgba(20,196,125,.25),rgba(10,157,101,.2));border:1.5px solid rgba(20,196,125,.6);border-radius:11px;padding:8px;margin-top:6px';
      statusBadge=`<span style="font-size:11px;font-weight:800;background:#276749;color:#fff;padding:1px 8px;border-radius:999px">🎯 ${total}pts</span>`;
    } else if(total>=1){
      bgStyle='background:rgba(20,196,125,.12);border:1.5px solid rgba(20,196,125,.35);border-radius:11px;padding:8px;margin-top:6px';
      statusBadge=`<span style="font-size:11px;font-weight:800;background:#08784e;color:#fff;padding:1px 8px;border-radius:999px">✓ ${total}pt${total>1?'s':''}</span>`;
    } else {
      bgStyle='background:rgba(168,21,55,.2);border:1.5px solid rgba(252,129,129,.4);border-radius:11px;padding:8px;margin-top:6px';
      statusBadge='<span style="font-size:11px;font-weight:800;background:#c53030;color:#fff;padding:1px 8px;border-radius:999px">✗ Raté 0pt</span>';
      detail=''; // pas besoin de détail si raté
    }
    // Ajouter le détail dans statusBadge
    statusBadge+=detail;
  }else if(locked&&!hasPred){bgStyle='background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:8px;margin-top:6px';statusBadge='<span style="font-size:11px;color:rgba(255,255,255,.4)">— Pas de prono</span>';}
  else if(!locked&&hasPred){bgStyle='background:rgba(20,196,125,.1);border:1px solid rgba(20,196,125,.3);border-radius:11px;padding:8px;margin-top:6px';statusBadge='<span style="font-size:11px;font-weight:700;background:rgba(20,196,125,.25);color:#4de8a8;padding:1px 8px;border-radius:999px">✓ Saisi</span>';}
  else{bgStyle='background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:8px;margin-top:6px';statusBadge='<span style="font-size:11px;color:rgba(255,255,255,.35)">En attente</span>';}
  const ro=locked?'readonly':'';const op=locked?';opacity:.55;cursor:not-allowed':'';
  const inputStyle='background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:800';
  const inputStyleLocked='background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.45);font-weight:800;cursor:not-allowed';
  const row90=`<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap"><b style="font-size:12px;flex:1;min-width:80px;color:#fff">${esc(player.name)}</b>${statusBadge}<input type="number" min="0" class="score-sm" id="pa-${mid}-${pid}" value="${v(prono?.scoreA)}" placeholder="0" ${ro} style="${locked?inputStyleLocked:inputStyle}"><span style="color:rgba(255,255,255,.6);font-weight:800">-</span><input type="number" min="0" class="score-sm" id="pb-${mid}-${pid}" value="${v(prono?.scoreB)}" placeholder="0" ${ro} style="${locked?inputStyleLocked:inputStyle}"> ${locked?'<span style="font-size:13px">🔒</span>':`<button class="primary small" type="button" data-action="set-pred" data-match="${mid}" data-player="${pid}">OK</button>`}</div>`;
  if(!isKo)return`<div style="${bgStyle}">${row90}</div>`;
  // KO: toujours afficher ET et TAB (pour que le joueur puisse tout saisir d'un coup)
  const _koHint=locked?'':
    `<div style="font-size:10px;color:rgba(255,255,255,.35);margin-top:4px;padding-left:2px">ℹ️ Remplis Prolong. si nul · Tirs au but si nul en prolong.</div>`;
  const etStyle='background:rgba(100,160,255,.2);border:1px solid rgba(100,160,255,.4);color:#fff;font-weight:800';
  const penStyle='background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.35);color:#fff;font-weight:800;width:38px';
  const rowET=`<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px"><span style="font-size:10px;color:rgba(100,160,255,.9);font-weight:600;min-width:80px">Prolong. :</span><input type="number" min="0" class="score-sm" style="${locked?inputStyleLocked:etStyle}" id="pet-a-${mid}-${pid}" value="${v(prono?.scoreAET)}" placeholder="-" ${ro}><span style="color:rgba(255,255,255,.5);font-weight:800">-</span><input type="number" min="0" class="score-sm" style="${locked?inputStyleLocked:etStyle}" id="pet-b-${mid}-${pid}" value="${v(prono?.scoreBET)}" placeholder="-" ${ro}><span style="font-size:10px;color:rgba(255,255,255,.4)">(si nul)</span></div>`;
  const rowPen=`<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px"><span style="font-size:10px;color:rgba(245,200,66,.9);font-weight:600;min-width:80px">Tirs au but :</span><input type="number" min="0" class="score-sm" style="${locked?inputStyleLocked:penStyle}" id="ppa-${mid}-${pid}" value="${v(prono?.penA)}" placeholder="-" ${ro}><span style="color:rgba(255,255,255,.5);font-weight:800">-</span><input type="number" min="0" class="score-sm" style="${locked?inputStyleLocked:penStyle}" id="ppb-${mid}-${pid}" value="${v(prono?.penB)}" placeholder="-" ${ro}></div>`;
  return`<div style="${bgStyle}">${row90}${rowET}${rowPen}${_koHint}</div>`;
}

// ══════════════════════════════════════════════
// RENDER — Match card
// ══════════════════════════════════════════════
function renderMatchCard(state,m,editable){
  const isKo=!!m.isKo;
  const idx=isKo?parseInt(m.id.split('-').pop()||0):null;
  const r=isKo?koResult(state.knockout,m.phase,idx):{scoreA:m.scoreA,scoreB:m.scoreB,scoreAET:null,scoreBET:null,penA:null,penB:null};
  const validated=r.scoreA!==null&&r.scoreB!==null;
  const hasET=isKo&&r.scoreAET!==null&&r.scoreBET!==null;
  const hasPen=isKo&&r.penA!==null&&r.penB!==null;
  let summary='';if(validated){summary=`${r.scoreA}-${r.scoreB}`;if(hasET)summary+=` (${r.scoreAET}-${r.scoreBET} ap)`;if(hasPen)summary+=` (${r.penA}-${r.penB} tab)`;}
  const badge=validated?`<span style="color:#08784e;font-size:11px;font-weight:700">✓ ${summary}</span>`:'';
  const saId=isKo?`koa-${m.phase}-${idx}`:`ra-${m.id}`;
  const sbId=isKo?`kob-${m.phase}-${idx}`:`rb-${m.id}`;
  if(!editable){return`<div class="match${validated?' validated':''}"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:11px;color:var(--muted)">${m.time||''} ${dateFr(m.date)}${m.wcGroup?' · '+esc(m.wcGroup):''}</span>${badge}</div><div class="match-row">${teamHtml(m.teamA)}<div style="padding:0 8px;font-weight:800">${validated?summary:'?-?'}</div>${teamHtml(m.teamB)}</div></div>`;}
  const koBlock=isKo?`<div style="margin-top:7px;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.15)">
    <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin-bottom:5px"><span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:600">90 min</span><div style="display:flex;align-items:center;gap:5px"><input type="number" min="0" class="score-sm" id="${saId}" value="${r.scoreA!=null?r.scoreA:''}" placeholder="-"><span style="color:var(--muted);font-weight:800">-</span><input type="number" min="0" class="score-sm" id="${sbId}" value="${r.scoreB!=null?r.scoreB:''}" placeholder="-"><span style="font-size:10px;color:rgba(255,255,255,.35)">(si nul→prolong.)</span></div></div>
    <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin-bottom:5px"><span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:600">Prolongations</span><div style="display:flex;align-items:center;gap:5px"><input type="number" min="0" class="score-sm" id="koaet-${m.phase}-${idx}" value="${r.scoreAET!=null?r.scoreAET:''}" placeholder="-"><span style="color:var(--muted);font-weight:800">-</span><input type="number" min="0" class="score-sm" id="kobet-${m.phase}-${idx}" value="${r.scoreBET!=null?r.scoreBET:''}" placeholder="-"><span style="font-size:10px;color:rgba(255,255,255,.35)">(si nul→tab)</span></div></div>
    <div style="display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center"><span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:600">Tirs au but</span><div style="display:flex;align-items:center;gap:5px"><input type="number" min="0" class="score-sm" id="kopa-${m.phase}-${idx}" value="${r.penA!=null?r.penA:''}" placeholder="-"><span style="color:var(--muted);font-weight:800">-</span><input type="number" min="0" class="score-sm" id="kopb-${m.phase}-${idx}" value="${r.penB!=null?r.penB:''}" placeholder="-"></div></div>
  </div><div style="margin-top:7px;display:flex;justify-content:flex-end"><button class="primary small" type="button" data-action="set-ko" data-stage="${m.phase}" data-index="${idx}">Valider</button></div>`
  :`<div class="match-row" style="margin-top:6px"><div class="team" style="flex:1;min-width:0">${teamHtml(m.teamA)}</div><div class="score-box"><input type="number" min="0" class="score-sm" id="${saId}" value="${r.scoreA!=null?r.scoreA:''}" placeholder="-"><span>-</span><input type="number" min="0" class="score-sm" id="${sbId}" value="${r.scoreB!=null?r.scoreB:''}" placeholder="-"><button class="primary small" type="button" data-action="update-result" data-id="${m.id}">OK</button></div><div class="team" style="flex:1;min-width:0;justify-content:flex-end">${teamHtml(m.teamB)}</div></div>`;
  return`<div class="match${validated?' validated':''}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:11px;color:var(--muted)">${m.time||''} ${dateFr(m.date)}${m.wcGroup?' · '+esc(m.wcGroup):''}</span>${badge}</div>${isKo?`<div class="match-row" style="margin-bottom:4px">${teamHtml(m.teamA)}<span style="flex:1"></span>${teamHtml(m.teamB)}</div>${koBlock}`:koBlock}</div>`;
}

function renderMatchSection(state,opts,isAdmin){

  mps.innerHTML=phaseSelector(state,'matchPhaseSelect',curPhase);

function renderPronos(state,opts,players,isAdmin){

  const curPhase=opts.pronosPhase||pps.querySelector('select')?.value||'groups';
  pps.innerHTML=phaseSelector(state,'pronosPhaseSelect',curPhase);
  const phase=$('pronosPhaseSelect')?.value||'groups';
  const poolEl=$('pronosPoolFilter');const poolFilter=poolEl?poolEl.value||'all':'all';
  const tb=$('togglePastBtn');const showPast=tb?tb.dataset.showPast==='1':true;
  let matchList=matchesForPhase(state,phase);
  if(poolFilter!=='all'&&phase==='groups')matchList=matchList.filter(m=>m.wcGroup===poolFilter);

  const editor=$('predEditor');if(!editor)return;

  const cards=matchList.map(m=>{

    const bg=locked&&officialIn?'background:rgba(20,196,125,.1);border:1px solid rgba(20,196,125,.25)':locked?'background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)':allDone?'background:rgba(20,196,125,.12);border:1px solid rgba(20,196,125,.3)':'background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)';
    const lockBadge=locked&&!officialIn?`<span style="font-size:11px;background:rgba(245,200,66,.15);color:#f5d442;border:1px solid rgba(245,200,66,.25);padding:2px 8px;border-radius:999px">🔒 Fermé</span>`:'';
    return`<div style="${bg};border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px)"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px"><span style="font-size:11px;color:var(--muted)">${m.time||''} ${dateFr(m.date)} · ${esc(m.wcGroup)}</span>${officialIn?`<span class="badge paid">${m.scoreA}-${m.scoreB}</span>`:lockBadge}</div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">${teamHtml(m.teamA)}<span style="font-size:13px;color:rgba(255,255,255,.4)">vs</span>${teamHtml(m.teamB)}</div>${players.map(p=>renderPredBlock(state,m,p)).join('')}</div>`;
  }).join('');
  editor.innerHTML=`<div class="pronos-grid">${cards}</div>`;
}

function calcSpecialPoints(match, prono) {
  if(!prono||!match)return null;
  if(!match.ended)return null; // match pas terminé
  let pts = 0;
  const detail = [];

  // Score (même barème KO)
  if(prono.scoreA!=null&&prono.scoreB!=null&&match.scoreA!=null&&match.scoreB!=null){
    const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
    const mA=Number(match.scoreA),mB=Number(match.scoreB);
    const s90 = pA===mA&&pB===mB?3:(outcome(pA,pB)===outcome(mA,mB)?1:0);
    pts+=s90;
    if(s90===3)detail.push({icon:'⚽',text:`Score ${mA}-${mB} exact`,pts:3,color:'rgba(20,196,125,.9)'});
    else if(s90===1)detail.push({icon:'⚽',text:'Bon résultat',pts:1,color:'rgba(100,200,140,.8)'});
    else detail.push({icon:'⚽',text:'Mauvais résultat',pts:0,color:'rgba(252,129,129,.8)'});
    // Bonus ET/TAB si applicable
    if(match.canET){
      const prevuNul=(pA===pB);
      if(match.scoreAET!=null&&prevuNul&&prono.scoreAET!=null){
        const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET);
        const mET_A=Number(match.scoreAET),mET_B=Number(match.scoreBET);
        const bET=pET_A===mET_A&&pET_B===mET_B?3:1;
        pts+=bET;
        detail.push({icon:'🔵',text:bET===3?`Prolong. ${mET_A}-${mET_B} exact`:'Prolong. prévu',pts:bET,color:'rgba(100,160,255,.9)'});
      }
      if(match.penA!=null){
        const pET_A2=prono.scoreAET!=null?Number(prono.scoreAET):null;
        const pET_B2=prono.scoreBET!=null?Number(prono.scoreBET):null;
        if(pET_A2!==null&&pET_A2===pET_B2&&prono.penA!=null){
          const pP_A=Number(prono.penA),pP_B=Number(prono.penB);
          const mP_A=Number(match.penA),mP_B=Number(match.penB);
          const bT=pP_A===mP_A&&pP_B===mP_B?3:1;
          pts+=bT;
          detail.push({icon:'🟡',text:bT===3?`Tab ${mP_A}-${mP_B} exact`:'Tab prévu',pts:bT,color:'rgba(245,200,66,.9)'});
        }
      }
    }
  }

  // Buteurs (1pt par buteur correct, en tenant compte des doublons)
  if(prono.scorers&&match.scorers){
    const pronoList=(prono.scorers||'').split('\n').map(s=>s.trim().toLowerCase()).filter(Boolean);
    const matchList=(match.scorers||[]).map(s=>s.toLowerCase());
    // Compter occurrences dans match
    const matchCount={};
    matchList.forEach(s=>{matchCount[s]=(matchCount[s]||0)+1;});
    const pronoCount={};
    pronoList.forEach(s=>{pronoCount[s]=(pronoCount[s]||0)+1;});
    let scorerPts=0;
    Object.keys(pronoCount).forEach(name=>{
      const got=Math.min(pronoCount[name],matchCount[name]||0);
      scorerPts+=got;
    });
    pts+=scorerPts;
    if(scorerPts>0)detail.push({icon:'👟',text:`${scorerPts} buteur${scorerPts>1?'s':''} correct${scorerPts>1?'s':''}`,pts:scorerPts,color:'rgba(100,220,180,.9)'});
  }

  // Cartons jaunes (1pt si nb exact)
  if(prono.yellowCards!=null&&match.yellowCards!=null){
    const ok=Number(prono.yellowCards)===Number(match.yellowCards);
    if(ok){pts+=1;detail.push({icon:'🟨',text:`${match.yellowCards} carton${match.yellowCards>1?'s':''} jaune${match.yellowCards>1?'s':''} correct`,pts:1,color:'rgba(245,200,66,.9)'});}
  }

  // Cartons rouges (1pt si nb exact)
  if(prono.redCards!=null&&match.redCards!=null){
    const ok=Number(prono.redCards)===Number(match.redCards);
    if(ok){pts+=1;detail.push({icon:'🟥',text:`${match.redCards} carton${match.redCards>1?'s':''} rouge${match.redCards>1?'s':''} correct`,pts:1,color:'rgba(220,80,80,.9)'});}
  }

  // Penalty (1pt si nombre exact, ou 1pt si présence correct)
  const mPenNb = match.penaltyCount!=null?Number(match.penaltyCount):(match.hasPenalty?1:0);
  const pPenNb = prono.penaltyCount!=null?Number(prono.penaltyCount):(prono.hasPenalty?1:0);
  if(prono.penaltyCount!=null||prono.hasPenalty!=null){
    const ok = pPenNb===mPenNb;
    if(ok){pts+=1;detail.push({icon:'🎯',text:'Penalty(s) correct ('+mPenNb+')',pts:1,color:'rgba(200,134,10,.9)'});}
  }

  // Fait rare (2pts si validé par admin)
  if(prono.rareEvent&&match.rareEventWinners&&match.rareEventWinners[prono.playerId]){
    pts+=2;detail.push({icon:'✨',text:'Fait rare validé',pts:2,color:'rgba(245,200,66,.9)'});
  }

  return{pts,detail};
}

function renderSpecialMatch(state){
  const el=$('testmatchContent');
  if(!el){console.warn('testmatchContent not found');return;}
  const sm=state.specialMatch;
  const inGroup=pid=>state.players.find(p=>p.id===pid)?.groupIds?.includes('matchunique');

  // ── VUE ADMIN ──
  const isAdmin=!getSession()?.role||getSession()?.role==='admin';

  if(isAdmin){
    if(!sm){
      // Formulaire création match
      el.innerHTML=`<div class="card">
        <h2>⚽ Créer un match spécial</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
          <div><label>Équipe A</label><input id="smTeamA" placeholder="Ex: Paris FC"></div>
          <div><label>Équipe B</label><input id="smTeamB" placeholder="Ex: Bayern"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
          <div><label>Date du match</label><input id="smDate" type="date"></div>
          <div><label>Heure du coup d'envoi</label>
          <select id="smTime" style="width:100%"></select></div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer">
          <input type="checkbox" id="smCanET" style="width:auto;accent-color:var(--green)">
          <span>Match pouvant aller aux prolongations / tirs au but</span>
        </label>
        <div class="actions"><button class="primary" type="button" data-action="create-special-match">Créer le match</button></div>
      </div>`;
      // Remplir les créneaux horaires disponibles (futur seulement, heure Paris)
      function populateTimes(){
        const sel=$('smTime');const dateEl=$('smDate');
        if(!sel||!dateEl)return;
        const dateVal=dateEl.value;
        if(!dateVal){sel.innerHTML='<option value="">Sélectionne d\'abord une date</option>';return;}
        // Heure Paris actuelle
        const nowParis=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
        const y=nowParis.getFullYear(),mo=String(nowParis.getMonth()+1).padStart(2,'0'),d=String(nowParis.getDate()).padStart(2,'0');
        const today=`${y}-${mo}-${d}`;
        const nowH=nowParis.getHours(),nowM=nowParis.getMinutes();
        const slots=[];
        for(let h=0;h<24;h++){for(let m=0;m<60;m+=15){
          if(dateVal>today){slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);}
          else if(dateVal===today){
            // Au moins 1h dans le futur heure Paris
            const totalMin=h*60+m;const nowMin=nowH*60+nowM;
            if(totalMin>nowMin+60)slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
          }
        }}
        sel.innerHTML=slots.length
          ?slots.map(s=>`<option value="${s}">${s}</option>`).join('')
          :'<option value="">Aucun créneau disponible aujourd\'hui</option>';
      }
      // Init date min = aujourd'hui Paris
      // Init date
      const nowP=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Paris'}));
      const todayP=`${nowP.getFullYear()}-${String(nowP.getMonth()+1).padStart(2,'0')}-${String(nowP.getDate()).padStart(2,'0')}`;
      const smDateEl=$('smDate');
      if(smDateEl){
        smDateEl.min=todayP;
        smDateEl.value=todayP;
        populateTimes();
        smDateEl.addEventListener('change',populateTimes);

function calcSpecialPointsLive(sm, prono){
  // Calcule les points partiels en temps réel
  if(!prono||prono.scoreA==null||prono.scoreB==null)return{pts:0,detail:[]};
  let pts=0; const detail=[];

  // Score (si admin a rentré un score)
  if(sm.scoreA!=null&&sm.scoreB!=null){
    const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
    const mA=Number(sm.scoreA),mB=Number(sm.scoreB);
    if(pA===mA&&pB===mB){
      pts+=3;detail.push({icon:'⚽',text:'Score exact '+mA+'-'+mB,pts:3,color:'rgba(20,196,125,.9)'});
    } else if(outcome(pA,pB)===outcome(mA,mB)){
      pts+=1;detail.push({icon:'⚽',text:'Bon résultat',pts:1,color:'rgba(100,200,140,.8)'});
    } else {
      detail.push({icon:'⚽',text:'Mauvais résultat',pts:0,color:'rgba(252,129,129,.8)'});
    }
    // Bonus ET si applicable
    if(sm.canET&&sm.scoreAET!=null&&prono.scoreAET!=null&&Number(prono.scoreA)===Number(prono.scoreB)){
      const pET_A=Number(prono.scoreAET),pET_B=Number(prono.scoreBET||0);
      const mET_A=Number(sm.scoreAET),mET_B=Number(sm.scoreBET||0);
      const bET=pET_A===mET_A&&pET_B===mET_B?3:1;
      pts+=bET;detail.push({icon:'🔵',text:bET===3?'Prolong. exact':'Prolong. prévu',pts:bET,color:'rgba(100,160,255,.9)'});
    }
  }

  // Buteurs (si admin a rentré des buteurs)
  if(prono.scorers&&sm.scorers&&sm.scorers.length>0){
    const pronoList=(prono.scorers||'').split('\n').map(s=>s.trim().toLowerCase()).filter(Boolean);
    const matchList=(sm.scorers||[]).map(s=>s.toLowerCase());
    const matchCount={};matchList.forEach(s=>{matchCount[s]=(matchCount[s]||0)+1;});
    const pronoCount={};pronoList.forEach(s=>{pronoCount[s]=(pronoCount[s]||0)+1;});
    let scorerPts=0;
    Object.keys(pronoCount).forEach(name=>{scorerPts+=Math.min(pronoCount[name],matchCount[name]||0);});
    if(scorerPts>0){pts+=scorerPts;detail.push({icon:'👟',text:scorerPts+' buteur'+(scorerPts>1?'s':'')+' correct'+(scorerPts>1?'s':''),pts:scorerPts,color:'rgba(100,220,180,.9)'});}
  }

  // Cartons jaunes
  if(prono.yellowCards!=null&&sm.yellowCards!=null){
    if(Number(prono.yellowCards)===Number(sm.yellowCards)){pts+=1;detail.push({icon:'🟨',text:'Cartons jaunes corrects ('+sm.yellowCards+')',pts:1,color:'rgba(245,200,66,.9)'});}
  }

  // Cartons rouges
  if(prono.redCards!=null&&sm.redCards!=null){
    if(Number(prono.redCards)===Number(sm.redCards)){pts+=1;detail.push({icon:'🟥',text:'Cartons rouges corrects ('+sm.redCards+')',pts:1,color:'rgba(220,80,80,.9)'});}
  }

  // Penaltys
  const mPenNb=sm.penaltyCount!=null?Number(sm.penaltyCount):(sm.hasPenalty?1:0);
  const pPenNb=prono.penaltyCount!=null?Number(prono.penaltyCount):(prono.hasPenalty?1:0);
  if((prono.penaltyCount!=null||prono.hasPenalty!=null)&&sm.penaltyCount!=null){
    if(pPenNb===mPenNb){pts+=1;detail.push({icon:'🎯',text:'Penaltys corrects ('+mPenNb+')',pts:1,color:'rgba(200,134,10,.9)'});}
  }

  // Fait rare
  if(prono.rareEvent&&sm.rareEventWinners&&sm.rareEventWinners[prono.playerId]){
    pts+=2;detail.push({icon:'✨',text:'Fait rare validé !',pts:2,color:'rgba(245,200,66,.9)'});
  }

  return{pts,detail};
}

function renderSpecialLeaderboard(state){
  const sm=state.specialMatch;if(!sm)return '';
  const inGroup=pid=>state.players.find(p=>p.id===pid)?.groupIds?.includes('matchunique');
  const players=state.players.filter(p=>inGroup(p.id));
  const medal=i=>['🥇','🥈','🥉'][i]||((i+1)+'.');
  const hasScore=sm.scoreA!=null&&sm.scoreB!=null;

  const statusBadge=sm.ended
    ?'<span class="badge paid">✓ Terminé</span>'
    :hasScore
      ?'<span class="badge warn">⚽ '+sm.scoreA+'-'+sm.scoreB+' en cours</span>'
      :'<span class="badge info">⏳ En attente du score</span>';

  const rows=players.map(p=>{
    const prono=state.specialPronos&&state.specialPronos[p.id]?state.specialPronos[p.id]:null;
    const hasProno=prono&&prono.scoreA!=null;
    const r=hasProno?calcSpecialPointsLive(sm,Object.assign({},prono,{playerId:p.id})):{pts:0,detail:[]};
    const pronoScore=hasProno?(prono.scoreA+'-'+prono.scoreB):null;
    return{id:p.id,name:p.name,pts:r.pts,pronoScore,hasProno};
  }).sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));

  const medal2=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':((i+1)+'.');
  const rowsHtml=rows.map((r,i)=>{
    const ptColor=r.pts>0?'#4de8a8':'rgba(255,255,255,.4)';
    return '<tr style="border-top:1px solid rgba(255,255,255,.07)">'+
      '<td style="padding:6px 8px">'+medal2(i)+'</td>'+
      '<td style="padding:6px 8px"><b>'+esc(r.name)+'</b></td>'+
      '<td style="padding:6px 8px">'+(r.pronoScore?'<span style="font-family:monospace;font-size:12px">'+r.pronoScore+'</span>':'<span style="color:rgba(255,255,255,.3);font-size:11px">—</span>')+'</td>'+
      '<td style="padding:6px 8px"><b style="font-size:15px;color:'+ptColor+'">'+r.pts+'</b>'+(r.pts>0&&!sm.ended?'<span style="font-size:10px;color:rgba(255,255,255,.3)"> live</span>':'')+'</td>'+
    '</tr>';
  }).join('');

  return '<div style="margin-bottom:10px">'+statusBadge+'</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:13px">'+
    '<thead><tr>'+
    '<th style="padding:5px 8px;text-align:left;color:var(--muted);font-size:11px">#</th>'+
    '<th style="padding:5px 8px;text-align:left;color:var(--muted);font-size:11px">Joueur</th>'+
    '<th style="padding:5px 8px;text-align:left;color:var(--muted);font-size:11px">Prono</th>'+
    '<th style="padding:5px 8px;text-align:left;color:var(--muted);font-size:11px">Pts</th>'+
    '</tr></thead><tbody>'+rowsHtml+'</tbody></table>';
}

function renderSpecialMatchPlayer(state, pid, el){
  if(!el) return;
  if(!pid){ el.innerHTML='<div class="card"><div class="empty">Erreur joueur.</div></div>'; return; }

  const sm = state.specialMatch;
  const playerObj = state.players.find(p => p.id === pid);
  const inGroup = playerObj && playerObj.groupIds && playerObj.groupIds.includes('matchunique');

  if(!inGroup){
    el.innerHTML = '<div class="card"><h2>⚡ Match spécial</h2><div class="empty">Pas dans le groupe Match unique. (pid:'+pid+' groups:'+JSON.stringify(playerObj?playerObj.groupIds:[])+')</div></div>';
    return;
  }
  if(!sm){
    el.innerHTML = '<div class="card"><h2>⚡ Match spécial</h2><div class="empty">⏳ Aucun match pour le moment.</div></div>';
    return;
  }

  const locked = isMatchLocked({date:sm.date, time:sm.time, scoreA: sm.ended ? 1 : null});
  const prono = (state.specialPronos && state.specialPronos[pid]) || {};
  const v = x => (x != null && x !== '') ? x : '';
  const ro = locked ? 'readonly' : '';

  // ── Calcul points live ──
  const hasAdminScore = sm.scoreA != null && sm.scoreB != null;
  const liveResult = (hasAdminScore && prono.scoreA != null) ? calcSpecialPointsLive(sm, Object.assign({}, prono, {playerId:pid})) : null;

  // ── Couleur fond score ──
  function scoreBg(){
    if(!hasAdminScore || prono.scoreA == null) return 'background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)';
    const pA=Number(prono.scoreA), pB=Number(prono.scoreB), mA=Number(sm.scoreA), mB=Number(sm.scoreB);
    if(pA===mA && pB===mB) return 'background:rgba(20,196,125,.2);border:1.5px solid rgba(20,196,125,.6)'; // vert exact
    if(outcome(pA,pB)===outcome(mA,mB)) return 'background:rgba(245,200,66,.15);border:1.5px solid rgba(245,200,66,.4)'; // jaune bon résultat
    return 'background:rgba(168,21,55,.2);border:1.5px solid rgba(252,129,129,.4)'; // rouge mauvais
  }

  // ── Lignes buteurs ──
  function buildScorerLines(sA, sB, saved){
    const total = (sA||0)+(sB||0);
    if(total===0) return '<p style="font-size:12px;color:rgba(255,255,255,.4);margin:0">Entre le score pour voir les lignes.</p>';
    let h='';
    for(let i=0;i<total;i++){
      // Couleur ligne: vert si buteur trouvé côté admin, sinon neutre
      const pronoName = (saved[i]||'').trim().toLowerCase();
      const adminScorers = (sm.scorers||[]).map(s=>s.toLowerCase());
      let lineBg = 'rgba(255,255,255,.07)';
      if(pronoName && hasAdminScore){
        lineBg = adminScorers.includes(pronoName) ? 'rgba(20,196,125,.2)' : 'rgba(168,21,55,.15)';
      }
      const lbl = i < sA ? esc(sm.teamA)+' But '+(i+1) : esc(sm.teamB)+' But '+(i-sA+1);
      h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;background:'+lineBg+';border-radius:8px;padding:4px 8px">';
      h += '<span style="font-size:11px;color:rgba(255,255,255,.5);min-width:110px">'+lbl+'</span>';
      h += '<input type="text" class="sp-scorer-input" data-idx="'+i+'" placeholder="Nom du buteur" value="'+(saved[i]||'')+'" '+ro+' style="flex:1;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 6px;font-size:13px;font-family:inherit;outline:none">';
      h += '</div>';
    }
    return h;
  }

  const savedScorers = (prono.scorers||'').split('\n');
  const initSA = prono.scoreA!=null ? Number(prono.scoreA) : 0;
  const initSB = prono.scoreB!=null ? Number(prono.scoreB) : 0;

  // ── Résultat final ──

  if(sm.ended && liveResult){
    const bg = liveResult.pts>=5?'background:rgba(20,196,125,.25);border:1.5px solid rgba(20,196,125,.6)'
      :liveResult.pts>=1?'background:rgba(20,196,125,.1);border:1px solid rgba(20,196,125,.3)'
      :'background:rgba(168,21,55,.2);border:1.5px solid rgba(252,129,129,.4)';
    const dHtml=(liveResult.detail||[]).map(d=>'<div style="font-size:11px;color:'+d.color+';margin-top:3px">'+d.icon+' '+esc(d.text)+' → <b>+'+d.pts+'pt'+(d.pts>1?'s':'')+'</b></div>').join('');
    resultHtml='<div style="'+bg+';border-radius:12px;padding:12px;margin-bottom:14px"><b style="font-size:15px">🏆 '+liveResult.pts+' point'+(liveResult.pts>1?'s':'')+'</b>'+dHtml+'</div>';
  }

  // ── Penalty: input number ──
  const penStyle = 'width:100%;background:rgba(200,134,10,.15);border:1px solid rgba(200,134,10,.4);color:#fff;font-weight:800;padding:8px;border-radius:10px;font-family:inherit;font-size:14px';

  const saveBtn = locked ? '' :
    '<div style="display:flex;justify-content:flex-end;margin-top:14px">'+
    '<button class="primary" type="button" data-action="save-special-prono" style="padding:11px 24px">✓ Enregistrer</button></div>';

  el.innerHTML =
    '<div class="card">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">'+
        '<h2 style="margin:0">⚡ '+esc(sm.teamA)+' vs '+esc(sm.teamB)+'</h2>'+
        '<span class="badge '+(locked?'warn':'paid')+'">'+(locked?'🔒 Fermé':'✍️ Ouvert')+'</span>'+
      '</div>'+
      '<p style="color:var(--muted);font-size:12px;margin-bottom:14px">'+dateFr(sm.date)+' '+esc(sm.time||'')+'</p>'+

function renderPlayer(state,player,opts={}){
  let pts=0,exact=0,played=0;
  allMatches(state).forEach(m=>{const p=state.predictions[m.id]?.[player.id];if(!p||m.scoreA===null)return;played++;if(p.scoreA===m.scoreA&&p.scoreB===m.scoreB){pts+=3;exact++;}else if(Math.sign(p.scoreA-p.scoreB)===Math.sign(m.scoreA-m.scoreB))pts++;});
  const sp=$('sP2');if(sp)sp.textContent=pts;const se=$('sE');if(se)se.textContent=exact;const sl=$('sPl');if(sl)sl.textContent=played;
  const lgEl=$('lgGroup');
  if(lgEl){const cur=lgEl.value||'';const pg=state.groups.filter(g=>player.groupIds.includes(g.id)&&g.id!=='matchunique');const showAll=pg.length>1;lgEl.innerHTML=(showAll?`<option value="all" ${cur==='all'||!cur?'selected':''}>Tous mes groupes</option>`:'')+pg.map(g=>`<option value="${esc(g.id)}" ${cur===g.id?'selected':''}>${esc(g.name)}</option>`).join('');if(!cur&&!showAll&&pg[0])lgEl.value=pg[0].id;}
  renderLeaderboard(state,'leaderboard','lgGroup',player.groupIds,true);
  renderPronos(state,opts,[player],false);
  // Special match tab
  {const spTab=$('specialmatchTab');const spEl=$('specialmatchContent');
  if(player.groupIds&&player.groupIds.includes('matchunique')){
    if(spTab)spTab.style.display='';
    if(spEl)try{renderSpecialMatchPlayer(state,player.id,spEl);}catch(err){console.error(err);}
  }else{
    if(spTab)spTab.style.display='none';
    if(spEl)spEl.innerHTML='';
  }}
  renderGroupTables(state,'groupTablesViz');
  const bs=$('bracketSummary');if(bs){const built=buildKO(state);bs.innerHTML=built.best8.length?`<div style="display:flex;flex-wrap:wrap;gap:4px">${built.best8.map((t,i)=>`<span class="badge info">${i+1}. ${esc(teamName(t.team))} (${t.group})</span>`).join('')}</div>`:'<p>Disponible après la phase de groupes.</p>';}
  renderBracket(state,'bracketViz');
}

function handleTabs(e){
  const tab=e.target.closest('.tab');if(!tab)return false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  tab.classList.add('active');const sec=$(tab.dataset.tab);if(sec)sec.classList.add('active');
  const fv=$('floatValidate');
  if(fv)fv.style.display=(tab.dataset.tab==='mypronos')?'block':'none';
  // Re-render selon l'onglet
  if(window._appRef){
    const app=window._appRef;
    if(tab.dataset.tab==='testmatch'&&window._appRef)try{renderSpecialMatch(window._appRef.state);}catch(err){}
    if(tab.dataset.tab==='specialmatch'){
      const sess=getSession();
      if(sess?.role==='player'&&window._appRef){
        const spEl=$('specialmatchContent');
        if(spEl){
          spEl.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">Chargement…</div>';
          jbGet().then(remote=>{
            const app=window._appRef;
            if(remote){
              // Mettre à jour l'état complet depuis JSONBin
              app.state.specialMatch=remote.specialMatch||null;
              app.state.specialPronos=remote.specialPronos||{};
              // Aussi mettre à jour les players pour avoir les groupIds à jour
              if(remote.players&&remote.players.length){
                const pid=sess.pid;
                const rp=remote.players.find(p=>p.id===pid);
                if(rp){
                  const lp=app.state.players.find(p=>p.id===pid);
                  if(lp)lp.groupIds=rp.groupIds;
                }
              }
            }
            renderSpecialMatchPlayer(app.state,sess.pid,spEl);
          }).catch(err=>{
            console.error('jbGet failed:',err);
            renderSpecialMatchPlayer(window._appRef.state,sess.pid,spEl);
          });
        }
      }
    }
  }
  return true;
}

function savePredFromInputs(st,mid,pid,isKo){
  if(!st.predictions[mid])st.predictions[mid]={};
  const pa=$(`pa-${mid}-${pid}`),pb=$(`pb-${mid}-${pid}`);
  const ppa=$(`ppa-${mid}-${pid}`),ppb=$(`ppb-${mid}-${pid}`);
  const petA=$(`pet-a-${mid}-${pid}`),petB=$(`pet-b-${mid}-${pid}`);
  const v=x=>x?.value!==''&&x?.value!=null?Number(x.value):null;
  if(!pa||!pb||pa.value===''||pb.value==='')return false;
  const sA=Number(pa.value),sB=Number(pb.value);
  // Validation KO : nul à 90min -> prolongations obligatoires
  if(isKo){
    if(sA===sB){
      const etA=v(petA),etB=v(petB);
      if(etA===null||etB===null){toast('⚠️ Match nul : remplis le score après prolongations !');return false;}
      // Score ET ne peut pas être inférieur au score 90min
      if(etA<sA||etB<sB){toast(`⚠️ Le score en prolongations ne peut pas être inférieur au score à 90min (${sA}-${sB}) !`);return false;}
      // Nul après prolongations -> tirs au but obligatoires
      if(etA===etB){
        const pA=v(ppa),pB=v(ppb);
        if(pA===null||pB===null){toast('⚠️ Nul en prolong. : remplis les tirs au but !');return false;}
        if(pA===pB){toast('⚠️ Les tirs au but ne peuvent pas être nuls !');return false;}
      }
    }
  }
  st.predictions[mid][pid]={scoreA:sA,scoreB:sB,scoreAET:v(petA),scoreBET:v(petB),penA:v(ppa),penB:v(ppb)};
  return true;
}

function initAdminEvents(app){
  document.addEventListener('click',async e=>{
    if(handleTabs(e)){
      // Si onglet testmatch, forcer render
      const tab=e.target.closest('.tab');
      if(tab?.dataset?.tab==='testmatch')renderSpecialMatch(app.state);
      return;
    }
    const btn=e.target.closest('button[data-action],input.pay-check');
    if(!btn)return;
    const st=app.state;
    // Toggle paiement
    if(btn.classList.contains('pay-check')){
      if(!st.payments)st.payments={};
      st.payments[btn.dataset.player]=btn.checked;
      saveState(st);
      const span=btn.nextElementSibling;if(span){span.textContent=btn.checked?'✓':'✗';span.style.color=btn.checked?'#08784e':'#a91537';}
      toast(btn.checked?'Paiement confirmé ✅':'Paiement annulé');return;
    }
    const a=btn.dataset.action;if(!a)return;
    if(a==='toggle-past-match'){const tb=$('togglePastMatchBtn');if(tb){const nv=tb.dataset.showPast==='1'?'0':'1';tb.dataset.showPast=nv;tb.textContent=nv==='1'?'🙈 Masquer passés':'👁 Voir passés';renderAdmin(st,{matchPhase:$('matchPhaseSelect')?.value||'groups'});}return;}
    // ── Handlers match spécial ──
    if(a==='create-special-match'){
      const tA=$('smTeamA')?.value?.trim(),tB=$('smTeamB')?.value?.trim();
      const date=$('smDate')?.value,time=$('smTime')?.value;
      if(!tA||!tB){toast('Remplis les deux équipes');return}
      st.specialMatch={teamA:tA,teamB:tB,date:date||'',time:time||'',canET:!!$('smCanET')?.checked,scoreA:null,scoreB:null,scoreAET:null,scoreBET:null,penA:null,penB:null,yellowCards:null,redCards:null,hasPenalty:false,scorers:[],rareEventWinners:{},ended:false};
      st.specialPronos={};app.state=await saveStateSync(st);renderAdmin(app.state);toast('Match créé ! Les joueurs peuvent maintenant pronostiquer.');return;
    }
    if(a==='delete-special-match'){st.specialMatch=null;st.specialPronos={};saveState(st);renderAdmin(st);toast('Match supprimé');return;}

function initPlayerEvents(app,player){
  document.addEventListener('click',e=>{
    if(handleTabs(e))return;
    const btn=e.target.closest('button[data-action],button#togglePastBtn');if(!btn)return;
    const action=btn.dataset?.action;
    // Toggle passés
    if(btn.id==='togglePastBtn'){const tb=$('togglePastBtn');if(!tb)return;const nv=tb.dataset.showPast==='1'?'0':'1';tb.dataset.showPast=nv;tb.textContent=nv==='1'?'🙈 Masquer passés':'👁 Voir passés';renderPlayer(app.state,player);return;}
    if(!action)return;
    if(action==='set-pred'){
      const mid=btn.dataset.match,pid=btn.dataset.player;if(pid!==player.id){toast('Action non autorisée');return}
      const allM=matchesForPhase(app.state,'groups').concat(allKoMatches(app.state));
      const m=allM.find(m=>m.id===mid);
      if(m&&isMatchLocked(m)){toast('🔒 Pronos fermés pour ce match');return}
      if(!savePredFromInputs(app.state,mid,pid,!!(m&&m.isKo)))return;
      saveState(app.state);
      // Mise à jour partielle: juste le bloc de ce joueur pour ce match
      // sans re-render complet (évite de perdre les autres valeurs saisies)
      const predBlock=btn.closest('[style*="border-radius:11px"]');
      if(predBlock&&m){
        const updatedHtml=renderPredBlock(app.state,m,player);
        const tmp=document.createElement('div');tmp.innerHTML=updatedHtml;
        predBlock.replaceWith(tmp.firstElementChild);
      }
      toast('✅ Prono enregistré');return;
    }
    if(action==='save-special-prono'){
      if(!app.state.specialMatch){toast('Pas de match spécial');return}
      if(!app.state.specialPronos)app.state.specialPronos={};
      const pid2=player.id;
      // Lire les inputs de buteurs dynamiques
      const scorerInputs=[...document.querySelectorAll('.sp-scorer-input')];
      const scorersVal=scorerInputs.map(i=>i.value.trim()).join('\n');
      const spA=$('sp-scoreA')?.value;const spB=$('sp-scoreB')?.value;
      app.state.specialPronos[pid2]={
        scoreA:spA!==''&&spA!=null?Number(spA):null,
        scoreB:spB!==''&&spB!=null?Number(spB):null,
        scoreAET:$('sp-scoreAET')?.value!==''?Number($('sp-scoreAET')?.value??''):null,
        scoreBET:$('sp-scoreBET')?.value!==''?Number($('sp-scoreBET')?.value??''):null,
        penA:$('sp-penA')?.value!==''?Number($('sp-penA')?.value??''):null,
        penB:$('sp-penB')?.value!==''?Number($('sp-penB')?.value??''):null,
        scorers:scorersVal,
        yellowCards:$('sp-yellow')?.value!==''?Number($('sp-yellow').value):null,
        redCards:$('sp-red')?.value!==''?Number($('sp-red').value):null,
        hasPenalty:$('sp-penalty-nb')?.value!==''&&Number($('sp-penalty-nb')?.value)>0,
        penaltyCount:$('sp-penalty-nb')?.value!==''?Number($('sp-penalty-nb').value):0,
        rareEvent:$('sp-rare')?.value?.trim()||''
      };
      saveState(app.state);
      // Bloquer le prono après validation
      renderPlayer(app.state,player);
      toast('✅ Prono enregistré et verrouillé !');return;
    }
    if(action==='logout'){clearSession();location.reload();return;}
    if(action==='save-all-preds'){
      const phase=$('pronosPhaseSelect')?.value||'groups';const matchList=matchesForPhase(app.state,phase);let count=0;
      matchList.forEach(m=>{if(isMatchLocked(m))return;if(savePredFromInputs(app.state,m.id,player.id,!!m.isKo))count++;});
      if(count>0){saveState(app.state);renderPlayer(app.state,player);toast(`✅ ${count} prono${count>1?'s':''} enregistré${count>1?'s':''}`);}
      else toast('Aucun nouveau prono');return;
    }
    if(action==='view-pronos'){
      const pid=btn.dataset.pid;const detail=$('pronos-detail');if(!detail)return;
      if(detail.dataset.openPid===pid){detail.innerHTML='';detail.dataset.openPid='';btn.textContent='📋';}
      else{renderPlayerPronosDetail(app.state,pid,'pronos-detail');detail.dataset.openPid=pid;btn.textContent='▲';detail.scrollIntoView({behavior:'smooth',block:'nearest'});}return;
    }
    if(action==='close-pronos'){const d=$('pronos-detail');if(d){d.innerHTML='';d.dataset.openPid='';}document.querySelectorAll('[data-action="view-pronos"]').forEach(b=>b.textContent='📋');return;}
  });
  document.addEventListener('change',e=>{
    const x=e.target;if(!x)return;
    if(x.id==='lgGroup')renderPlayer(app.state,player);
    if(x.id==='pronosPhaseSelect')renderPlayer(app.state,player,{pronosPhase:x.value});
    if(x.id==='pronosPoolFilter')renderPlayer(app.state,player);
  });
}

        <input id="loginName" placeholder="Ton pseudo" style="margin-bottom:10px">
        <label for="loginPwd">Mot de passe</label>
        <input id="loginPwd" type="password" placeholder="••••••" style="margin-bottom:16px">
        <button class="primary" type="button" id="loginBtn" style="width:100%;padding:12px">Se connecter</button>
        <p style="margin-top:16px;font-size:12px;color:var(--muted)">Tes identifiants sont fournis par l'administrateur</p>
      </div>
    </div>
  </div>`;
}

(async function(){
  $('app').innerHTML=`<div style="text-align:center;padding:80px;color:#5d7088"><div style="font-size:32px;margin-bottom:12px">⚽</div><div style="font-size:16px;font-weight:600">Chargement…</div></div>`;

  const session=getSession();

      window._appRef=app;buildAdminShell();renderAdmin(app.state);initAdminEvents(app);
      jbGet().then(d=>{const sb=$('syncBadge');if(sb)sb.innerHTML=d?'🟢 Synchronisé':'🔴 Hors ligne';}).catch(()=>{const sb=$('syncBadge');if(sb)sb.innerHTML='🔴 Hors ligne';});

      const activeTab=document.querySelector('.tab.active');

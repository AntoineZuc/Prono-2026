<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ligue 1 — Le Super Site du Zuc</title>
<style>
:root{--bg:#0a0e1a;--bg2:#0d1628;--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--gold:#f5c842;--red:#e53935;--blue:#1a73e8;--r:16px;--shadow:0 8px 32px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(ellipse 90% 60% at 10% 0%,rgba(20,196,125,.13) 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 90%,rgba(245,200,66,.09) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(20,196,125,.04) 0%,transparent 70%)}

/* Cards avec glassmorphism */
.card{background:rgba(255,255,255,.055);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:20px;margin-bottom:14px;
  box-shadow:var(--shadow)}

/* Inputs */
input,select,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;color:#fff;padding:11px 14px;font-size:15px;font-family:inherit;outline:none;
  transition:border-color .2s,background .2s}
input:focus,select:focus{border-color:rgba(20,196,125,.6);background:rgba(255,255,255,.1)}
select option{background:#0d1628}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;
  font-size:13px;font-weight:700;cursor:pointer;padding:10px 18px;font-family:inherit;
  transition:opacity .15s,transform .1s;user-select:none}
.btn:active{opacity:.8;transform:scale(.97)}
.btn-blue{background:linear-gradient(135deg,#1a73e8,#0d5cc7);color:#fff;box-shadow:0 4px 16px rgba(26,115,232,.3)}
.btn-green{background:linear-gradient(135deg,#14c47d,#0a9d65);color:#fff;box-shadow:0 4px 16px rgba(20,196,125,.3)}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text)}
.btn-red{background:rgba(229,57,53,.15);border:1px solid rgba(229,57,53,.3);color:#ff6b6b}
.btn-gold{background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a0e1a;box-shadow:0 4px 16px rgba(245,200,66,.2)}
.btn-full{width:100%;margin-top:10px}

/* Onglets pills */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding:4px;background:rgba(255,255,255,.04);border-radius:14px}
.tab{background:transparent;border:none;color:rgba(255,255,255,.45);border-radius:10px;
  padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;flex:1;text-align:center}
.tab.active{background:rgba(20,196,125,.18);color:#14c47d;border:1px solid rgba(20,196,125,.3);
  box-shadow:0 2px 12px rgba(20,196,125,.15)}

/* Match card */
.match-item{position:relative;display:flex;align-items:center;gap:8px;padding:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;margin-bottom:8px;flex-wrap:wrap;transition:background .15s}
.match-item.validated{border-color:rgba(20,196,125,.3);background:rgba(20,196,125,.05)}
.match-item.locked{border-color:rgba(255,255,255,.04);opacity:.85}
/* États côté joueur : pas encore pronostiqué / pronostiqué en attente / résultat connu */
.match-item.empty{border-color:rgba(255,255,255,.06)}
.match-item.filled{border-color:rgba(26,115,232,.35);background:rgba(26,115,232,.07)}
.match-item.pts-exact{border-color:rgba(20,196,125,.4);background:rgba(20,196,125,.08)}
.match-item.pts-good{border-color:rgba(245,200,66,.4);background:rgba(245,200,66,.07)}
.match-item.pts-wrong{border-color:rgba(229,57,53,.3);background:rgba(229,57,53,.05)}
.match-item.is-live{border-color:rgba(255,107,107,.5);animation:liveGlow 2s ease-in-out infinite}
@keyframes liveGlow{0%,100%{box-shadow:0 0 0 rgba(255,107,107,0)}50%{box-shadow:0 0 12px rgba(255,107,107,.25)}}
.live-badge{color:#ff6b6b;font-weight:800;animation:liveBlink 1.4s ease-in-out infinite}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff6b6b;margin-left:2px;animation:liveBlink 1.4s ease-in-out infinite}
@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.3}}

/* Score inputs — gros et visibles */
.score-inp{width:50px;height:50px;text-align:center;padding:0;font-size:21px;font-weight:900;
  border-radius:12px;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.15);
  color:#fff;font-family:inherit}
.score-inp:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.05);color:rgba(255,255,255,.3)}
.score-sep{font-size:18px;font-weight:900;color:var(--muted);margin:0 4px}
.row-save-btn{width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.09);color:#fff;font-size:15px;cursor:pointer;margin-left:4px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.row-save-btn.saved{border-color:rgba(20,196,125,.5);background:rgba(20,196,125,.15);color:#14c47d}
.row-save-btn:active{transform:scale(.9)}

/* Classement table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:6px 8px;text-align:center;color:var(--muted);font-size:11px;font-weight:700;
  border-bottom:1px solid rgba(255,255,255,.08);text-transform:uppercase;letter-spacing:.04em}
td{padding:7px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:none}
.zone-top3{background:rgba(20,196,125,.09)}
.zone-rel{background:rgba(229,57,53,.08)}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:rgba(20,30,50,.95);backdrop-filter:blur(12px);color:#fff;
  padding:10px 22px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Bouton portail */
#portalBtn{position:fixed;top:12px;left:12px;z-index:999;
  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;
  padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;
  transition:background .15s}
#portalBtn:hover{background:rgba(255,255,255,.18)}

/* Badges */
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;border:1px solid}
.badge-green{background:rgba(20,196,125,.15);color:#14c47d;border-color:rgba(20,196,125,.3)}
.badge-gold{background:rgba(245,200,66,.15);color:#f5c842;border-color:rgba(245,200,66,.3)}
.badge-red{background:rgba(229,57,53,.15);color:#ff6b6b;border-color:rgba(229,57,53,.3)}
.badge-muted{background:rgba(255,255,255,.06);color:var(--muted);border-color:rgba(255,255,255,.1)}

/* Ranking rows */
.rank-row{display:flex;align-items:center;justify-content:space-between;padding:10px;
  margin-bottom:6px;border-radius:12px;border:1px solid rgba(255,255,255,.05);transition:background .15s}
.rank-row.me{background:rgba(20,196,125,.1);border-color:rgba(20,196,125,.25)}
.rank-row:not(.me):hover{background:rgba(255,255,255,.04)}

/* ══════════════ CHAT WIDGET ══════════════ */
#chatBubble{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#1a73e8,#0d5cc7);display:flex;align-items:center;justify-content:center;
  font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:9997;border:none;
  transition:transform .15s}
#chatBubble:active{transform:scale(.92)}
#chatBadge{position:absolute;top:-3px;right:-3px;background:#e53935;color:#fff;font-size:11px;font-weight:800;
  min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #0a0e1a}
#chatPanel{position:fixed;bottom:88px;right:16px;width:min(360px,calc(100vw - 32px));height:min(500px,calc(100vh - 140px));
  background:rgba(13,22,40,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);border-radius:18px;z-index:9997;display:none;flex-direction:column;
  overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#chatPanel.open{display:flex}
.chat-header{display:flex;align-items:center;gap:8px;padding:14px 16px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.chat-header-title{font-size:14px;font-weight:800;flex:1}
.chat-back{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}
.chat-close{background:none;border:none;color:rgba(255,255,255,.5);font-size:16px;cursor:pointer;padding:0 4px}
.chat-thread-list{flex:1;overflow-y:auto;padding:10px}
.chat-thread-item{display:flex;align-items:center;justify-content:space-between;padding:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;
  margin-bottom:8px;cursor:pointer;transition:background .15s}
.chat-thread-item:active{background:rgba(255,255,255,.08)}
.chat-thread-name{font-size:13px;font-weight:700}
.chat-thread-sub{font-size:10px;color:#7a95b8;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.chat-thread-dot{width:9px;height:9px;border-radius:50%;background:#e53935;flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;word-break:break-word}
.chat-msg.mine{align-self:flex-end;background:linear-gradient(135deg,#1a73e8,#0d5cc7);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:rgba(255,255,255,.08);color:#e8f0fe;border-bottom-left-radius:4px}
.chat-msg.admin{align-self:flex-start;background:rgba(229,57,53,.16);border:1px solid rgba(229,57,53,.4);border-bottom-left-radius:4px}
.chat-msg-name{font-size:10px;font-weight:800;margin-bottom:2px;opacity:.85}
.chat-msg.admin .chat-msg-name{color:#ff6b6b}
.chat-msg-time{font-size:9px;opacity:.55;margin-top:3px}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.chat-input-row input{flex:1;margin:0;padding:10px 14px;font-size:14px}
.chat-send-btn{background:linear-gradient(135deg,#1a73e8,#0d5cc7);border:none;border-radius:10px;
  color:#fff;width:42px;height:42px;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;
  align-items:center;justify-content:center}
.chat-empty{text-align:center;color:#7a95b8;font-size:12px;padding:30px 16px}

</style>
</head>
<body>
<button id="portalBtn" onclick="location.href='football.html'">⬅ Portail</button>
<div id="app" style="max-width:560px;margin:0 auto;padding:54px 14px 40px"></div>
<div id="toast"></div>
<script>
const SECTION='l1';
const FB_PATH='l1';
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtDate=d=>{if(!d)return'';const[y,m,day]=d.split('-');return(day&&m&&y)?`${day}-${m}-${y}`:d;};
let _tt;const toast=m=>{const e=document.getElementById('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('show'),2800);};
const $=id=>document.getElementById(id);
function getSession(){try{const d=JSON.parse(localStorage.getItem('cdm2026session'));if(!d)return null;if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}return d;}catch{return null;}}
const fbGet=async p=>{try{const r=await fetch(`${FB}/${FB_PATH}/${p}.json`,{cache:'no-store'});return r.ok?await r.json():null;}catch{return null;}};
const fbSet=async(p,d)=>{try{await fetch(`${FB}/${FB_PATH}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return true;}catch{return false;}};
// Les noms des comptes joueurs vivent dans /players (racine Firebase globale,
// partagée par tout le site), pas dans les données propres à cette compétition.
async function fbGetPlayerNames(){try{const r=await fetch(`${FB}/players.json`,{cache:'no-store'});if(!r.ok)return{};const d=await r.json()||{};const map={};Object.values(d).forEach(p=>{if(p?.id)map[p.id]=p.name||p.id;});return map;}catch{return{};}}
const fbDel=async p=>{try{await fetch(`${FB}/${FB_PATH}/${p}.json`,{method:'DELETE'});return true;}catch{return false;}};
const fbRoot=async()=>{try{const r=await fetch(`${FB}/${FB_PATH}.json`,{cache:'no-store'});return r.ok?await r.json():null;}catch{return null;}};

// ── ÉQUIPE FAVORITE (bonus classement final) ────────────────────────────────
// Modifiable tant qu'aucun match de la compétition n'a commencé, verrouillée
// ensuite. Bonus au classement final : 10/7/5 pts pour 1er/2e/3e.
function isCompetitionStarted(matches){
  const kicks=(matches||[]).filter(m=>m.date).map(m=>new Date(`${m.date}T${m.time||'00:00'}:00`).getTime());
  if(!kicks.length)return false;
  return Date.now()>=Math.min(...kicks);
}
function favoriteBonus(table,favCode){
  if(!favCode)return 0;
  const idx=table.findIndex(t=>t.code===favCode);
  if(idx===0)return 10;
  if(idx===1)return 7;
  if(idx===2)return 5;
  return 0;
}
function favoritePickerHtml(started,myFav,teamsList,teamsObj){
  if(started){
    return myFav
      ?`<div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.25);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--gold)">⭐ Favori verrouillé : ${esc(teamsObj?.[myFav]?.name||LDC_CLUBS[myFav]?.name||myFav)}</div>`
      :`<div style="text-align:center;margin-top:10px;font-size:11px;color:var(--muted)">⭐ Pas d'équipe favorite choisie (compétition déjà commencée)</div>`;
  }
  return`<div style="margin-top:12px;background:rgba(245,200,66,.06);border:1px solid rgba(245,200,66,.2);border-radius:12px;padding:12px">
    <div style="font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">⭐ Ton équipe favorite (bonus classement final : 10/7/5 pts)</div>
    <div style="display:flex;gap:8px">
      <select id="favSelect" style="flex:1">
        <option value="">— Choisir —</option>
        ${teamsList.map(c=>`<option value="${esc(c)}" ${c===myFav?'selected':''}>${esc(teamsObj?.[c]?.name||c)}</option>`).join('')}
      </select>
      <button id="favSaveBtn" class="btn btn-gold" style="white-space:nowrap">✅ Valider</button>
    </div>
  </div>`;
}

function getMyGroups(pid){const s=JSON.parse(localStorage.getItem(SECTION+'_groups')||'{}');return s[pid]||[];}

// ── Pronos des copains du groupe sur un match donné (visible une fois le
// match verrouillé — jamais avant, pour ne pas influencer les autres) ──────
window.showGroupPronos=async function(matchId){
  const m=_state.matches?.[matchId];if(!m)return;
  const ed=_state.edition||{};const scores=_state.scores||{};const s=scores[matchId]||{};
  const pid=_sess.pid;const myGroups=getMyGroups(pid);
  if(!myGroups.length){toast('Rejoins un groupe pour voir les pronos des autres');return;}
  const [pronos,playerNames,...groupData]=await Promise.all([
    fbGet('pronos'),fbGetPlayerNames(),
    ...myGroups.map(g=>fetch(`${FB}/groups_${SECTION}/${g.code}.json`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null))
  ]);
  const members=new Set();groupData.forEach(g=>{if(g?.members)g.members.forEach(x=>members.add(x));});
  const rows=[...members].map(p=>{
    const pr=(pronos||{})[p]?.[matchId];
    const pts=(s.scoreA!=null&&pr?.scoreA!=null)?calcPoints(pr.scoreA,pr.scoreB,s.scoreA,s.scoreB,ed.ptsExact||3,ed.ptsResult||1):null;
    return{pid:p,name:playerNames[p]||p,pred:pr?`${pr.scoreA}-${pr.scoreB}`:'—',pts,isMe:p===pid};
  }).sort((a,b)=>(b.pts??-1)-(a.pts??-1)||a.name.localeCompare(b.name));
  const teamAName=_state.teams?.[m.teamA]?.name||m.teamA,teamBName=_state.teams?.[m.teamB]?.name||m.teamB;
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9990;padding:20px';
  d.innerHTML=`<div class="card" style="max-width:340px;width:100%;max-height:80vh;overflow-y:auto;margin:0">
    <div style="font-size:15px;font-weight:800;margin-bottom:2px">${esc(teamAName)} – ${esc(teamBName)}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px">${s.scoreA!=null?`Résultat : ${s.scoreA}-${s.scoreB}`:'Résultat pas encore connu'}</div>
    ${rows.map(r=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
      <span style="font-size:13px;font-weight:${r.isMe?800:600};color:${r.isMe?'#14c47d':'var(--text)'}">${esc(r.name)}${r.isMe?' 👤':''}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span style="font-size:14px;font-weight:800">${esc(r.pred)}</span>
        ${r.pts!=null?`<span style="font-size:11px;font-weight:700;color:${r.pts===(ed.ptsExact||3)?'#14c47d':r.pts>0?'var(--gold)':'#ff6b6b'}">${r.pts>0?'+'+r.pts:'✗'}</span>`:''}
      </span>
    </div>`).join('')||'<div style="color:var(--muted);font-size:13px">Personne n\'a encore pronostiqué</div>'}
    <button onclick="this.closest('div[style*=fixed]').remove()" style="display:block;width:100%;margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Fermer</button>
  </div>`;
  document.body.appendChild(d);
  d.addEventListener('click',e=>{if(e.target===d)d.remove();});
};
function saveMyGroup(pid,code,name){const s=JSON.parse(localStorage.getItem(SECTION+'_groups')||'{}');const g=s[pid]||[];if(!g.find(x=>x.code===code)){g.push({code,name});s[pid]=g;localStorage.setItem(SECTION+'_groups',JSON.stringify(s));}}

function calcPoints(pA,pB,rA,rB,ex=3,res=1){
  if(pA==null||pB==null||rA==null||rB==null)return null;
  if(+pA===+rA&&+pB===+rB)return ex;
  const sign=n=>n>0?1:n<0?-1:0;
  return sign(pA-pB)===sign(rA-rB)?res:0;
}
function calcTotal(pronos,scores,ex,res){
  let pts=0,exact=0,good=0,played=0;
  Object.entries(pronos||{}).forEach(([mid,pr])=>{
    const s=scores?.[mid];if(!s||s.scoreA==null)return;
    played++;const p=calcPoints(pr.scoreA,pr.scoreB,s.scoreA,s.scoreB,ex,res);
    if(p===ex)exact++;else if(p>0)good++;pts+=p||0;
  });
  return{pts,exact,good,played};
}

// Logos clubs LDC

function matchCardHtml(m,teams,scores,pronos,ed,isAdmin){
  const s=scores?.[m.id]||{};const pr=pronos?.[m.id]||{};
  const validated=s.scoreA!=null;const hasProno=pr.scoreA!=null;
  const isLive=s.status==='IN_PLAY'||s.status==='PAUSED';
  let pts=null,ptsColor='var(--muted)';
  if(validated&&hasProno){pts=calcPoints(pr.scoreA,pr.scoreB,s.scoreA,s.scoreB,ed.ptsExact||3,ed.ptsResult||1);ptsColor=pts===(ed.ptsExact||3)?'#14c47d':pts>0?'var(--gold)':'#ff6b6b';}
  const pfx=isAdmin?'sa':'pa',sfx=isAdmin?'sb':'pb';
  const valA=isAdmin?(s.scoreA??''):(pr.scoreA??'');const valB=isAdmin?(s.scoreB??''):(pr.scoreB??'');
  // Blocage prono : verrouillé dès 1h avant le coup d'envoi (pas au coup d'envoi lui-même)
  const locked=!isAdmin&&(()=>{
    if(!m.date)return false;
    const kickoff=new Date(`${m.date}T${m.time||'00:00'}:00`);

  })();
  const stageLabel={BARRAGES:'Barrages',R16:'8es',QF:'Quarts',SF:'Demies',FINAL_LDC:'Finale'};
  const stg=m.stage&&stageLabel[m.stage]?` · ${stageLabel[m.stage]}${m.leg?' ('+( m.leg===1?'Aller':'Retour')+')':''}`:m.matchday?` · J${m.matchday}`:'';
  // Classe visuelle côté joueur : distingue "pas encore pronostiqué" / "pronostiqué, en attente" / résultat gagné-perdu
  let stateClass='';
  if(!isAdmin){
    if(validated&&hasProno)stateClass=pts===(ed.ptsExact||3)?'pts-exact':pts>0?'pts-good':'pts-wrong';
    else if(hasProno)stateClass='filled';

  }
  const clickable=!isAdmin&&locked; // une fois verrouillé, on peut voir ce que les copains ont mis
  return`<div class="match-item ${validated?'validated':''} ${locked?'locked':''} ${stateClass} ${isLive?'is-live':''}" ${clickable?`onclick="showGroupPronos('${m.id}')" style="cursor:pointer"`:''}>
    ${clickable?'<div style="position:absolute;top:6px;right:10px;font-size:10px;color:var(--muted)">👥 voir les pronos</div>':''}
    <div style="font-size:10px;color:var(--muted);width:100%;display:flex;justify-content:space-between">
      <span>${fmtDate(m.date)} ${m.time||''}${isLive?' <span class="live-badge">🔴 EN DIRECT</span>':locked?' <span style="color:#ff6b6b;font-size:10px;font-weight:700">🔒 Verrouillé</span>':''}${stg}</span>
      ${pts!=null?`<span style="font-weight:800;color:${ptsColor}">${pts>0?'+'+pts+'pt'+(pts>1?'s':''):'✗'}</span>`:''}
    </div>

// ── Classement phase ligue ──────────────────────────────────────────────────
function buildLeagueTable(matches,scores){
  const t={};const init=c=>{if(!t[c])t[c]={code:c,j:0,g:0,n:0,p:0,bp:0,bc:0,pts:0};};
  matches.forEach(m=>{
    if(!m.teamA||!m.teamB)return;init(m.teamA);init(m.teamB);
    const s=scores[m.id];if(!s||s.scoreA==null)return;
    const a=+s.scoreA,b=+s.scoreB;
    t[m.teamA].j++;t[m.teamB].j++;t[m.teamA].bp+=a;t[m.teamA].bc+=b;t[m.teamB].bp+=b;t[m.teamB].bc+=a;
    if(a>b){t[m.teamA].g++;t[m.teamA].pts+=3;t[m.teamB].p++;}
    else if(a<b){t[m.teamB].g++;t[m.teamB].pts+=3;t[m.teamA].p++;}
    else{t[m.teamA].n++;t[m.teamA].pts++;t[m.teamB].n++;t[m.teamB].pts++;}
  });
  return Object.values(t).sort((a,b)=>b.pts-a.pts||(b.bp-b.bc)-(a.bp-a.bc)||b.bp-a.bp);
}

// ── KO génération ────────────────────────────────────────────────────────────
function generateKOMatches(table){
  const matches={};
  const pairs=[[8,23],[9,22],[10,21],[11,20],[12,19],[13,18],[14,17],[15,16]];
  pairs.forEach(([hi,lo],i)=>{
    const home=table[hi]?.code,away=table[lo]?.code;if(!home||!away)return;
    matches[`playoff_${i}_leg1`]={id:`playoff_${i}_leg1`,stage:'BARRAGES',round:`Barrage ${i+1}`,leg:1,teamA:away,teamB:home,scoreA:null,scoreB:null,date:'',time:'',playoffSlot:i};
    matches[`playoff_${i}_leg2`]={id:`playoff_${i}_leg2`,stage:'BARRAGES',round:`Barrage ${i+1}`,leg:2,teamA:home,teamB:away,scoreA:null,scoreB:null,date:'',time:'',playoffSlot:i};
  });
  for(let i=0;i<8;i++)matches[`direct_r16_${i}`]={id:`direct_r16_${i}`,stage:'DIRECT_R16',teamA:table[i]?.code,teamB:'TBD',scoreA:null,scoreB:null,date:'',time:''};
  return matches;
}

function koWinner(matches,scores,stage,slot){
  const legs=Object.values(matches).filter(m=>m.stage===stage&&m.playoffSlot===slot||m.koSlot===slot);
  const leg1=legs.find(m=>m.leg===1),leg2=legs.find(m=>m.leg===2);
  if(!leg1||!leg2)return null;
  const s1=scores[leg1.id],s2=scores[leg2.id];
  if(!s1||s1.scoreA==null||!s2||s2.scoreA==null)return null;
  const h=s2.scoreA+s1.scoreB,a=s2.scoreB+s1.scoreA;
  if(h>a)return leg2.teamA;if(a>h)return leg2.teamB;return null;
}

async function loadPlayerRanking(myGroups,myPronos,scores,ed,pid,activeGroup){
  const el=$('rankingContent');if(!el)return;
  el.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px">Chargement…</div>';
  const pronos=await fbGet('pronos')||{};
  const playerNames=await fbGetPlayerNames();
  const allFavorites=await fbGet('favorites')||{};
  const leagueMatches=Object.values(_state.matches||{}).filter(m=>m.matchday>0);
  const table=buildLeagueTable(leagueMatches,scores);
  const grp=activeGroup||document.querySelector('[data-grp].active')?.dataset?.grp||'all';
  let allowedPids=null;
  if(myGroups?.length){
    const targets=grp==='all'?myGroups:myGroups.filter(g=>g.code===grp);
    const gdata=await Promise.all(targets.map(g=>fetch(`${FB}/groups_${SECTION}/${g.code}.json`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)));
    const members=new Set();gdata.forEach(g=>{if(g?.members)g.members.forEach(m=>members.add(m));});
    if(members.size)allowedPids=[...members];
  }
  const rows=Object.entries(pronos).filter(([p])=>!allowedPids||allowedPids.includes(p))
    .map(([p,pp])=>{
      const base=calcTotal(pp,scores,ed.ptsExact||3,ed.ptsResult||1);
      const bonus=favoriteBonus(table,allFavorites[p]);
      return{pid:p,...base,bonus,pts:base.pts+bonus};
    })
    .sort((a,b)=>b.pts-a.pts||b.exact-a.exact);
  el.innerHTML=rows.length?rows.map((p,i)=>{
    const isMe=p.pid===pid;
    return`<div class="rank-row ${isMe?'me':''}">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:18px;min-width:28px">${['🥇','🥈','🥉'][i]||`${i+1}.`}</span>
        <div><div style="font-size:13px;font-weight:${isMe?900:700};color:${isMe?'#6ab4ff':'var(--text)'}">${esc(playerNames[p.pid]||p.pid)}${isMe?' 👤':''}</div>
        <div style="font-size:11px;color:var(--muted)">${p.exact}⚡ · ${p.good}✓ · ${p.played} joués${p.bonus>0?` · <span style="color:var(--gold)">+${p.bonus}⭐</span>`:''}</div></div>
      </div>
      <span style="font-size:18px;font-weight:900;color:var(--text)">${p.pts}<span style="font-size:11px;font-weight:400">pts</span></span>
    </div>`;
  }).join(''):'<div style="color:var(--muted);text-align:center;padding:20px">Aucun prono</div>';
}

async function autoSyncScores(){
  const key=localStorage.getItem('fdApiKey');
  const ed=_state?.edition;
  if(!key||!ed||_sess.role!=='admin')return;
  try{
    const comp=ed.fdComp||'FL1';
    const r=await fetch(`https://tiny-feather-9126.antoinezuccari.workers.dev?apikey=${encodeURIComponent(key)}&path=${encodeURIComponent(`/competitions/${comp}/matches?season=${ed.season}`)}`,{headers:{'X-Auth-Token':key}});
    if(!r.ok)return;
    const data=await r.json();
    const current=await fbGet('scores')||{};
    let changed=false;
    (data.matches||[]).forEach(m=>{
      const id=String(m.id);
      if(_state.matches?.[id]&&m.score?.fullTime?.home!=null){
        const s={scoreA:m.score.fullTime.home,scoreB:m.score.fullTime.away,status:m.status};
        if(!current[id]||current[id].scoreA!==s.scoreA||current[id].scoreB!==s.scoreB||current[id].status!==s.status){
          current[id]=s;changed=true;
        }
      }
    });
    if(changed){
      await fbSet('scores',current);
      _state.scores=current;
      console.log('Auto-sync: scores mis à jour');
    }
  }catch(e){console.warn('Auto-sync error:',e);}
}

// ── FONCTIONS GROUPES ────────────────────────────────────────────────────────
window.genCode=()=>{const el=$('grpCode');if(el)el.value=String(Math.floor(100000+Math.random()*900000));};

window.createGrp=async()=>{
  const name=($('grpName')?.value||'').trim();
  const code=($('grpCode')?.value||'').trim();
  if(!name||code.length<4){toast('Nom et code requis (4 chiffres min)');return;}
  const ex=await fetch(`${FB}/groups_${SECTION}/${code}.json`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  if(ex?.name){toast('Code déjà utilisé');return;}
  await fetch(`${FB}/groups_${SECTION}/${code}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,code,members:[],createdAt:Date.now()})});
  $('grpName').value='';$('grpCode').value='';
  toast('✅ Groupe "'+name+'" créé — code : '+code);
  loadGrpList();
};

async function loadGrpList(){
  const el=$('grpList');if(!el)return;
  el.innerHTML='<div style="color:var(--muted);font-size:13px">Chargement…</div>';
  try{
    const r=await fetch(`${FB}/groups_${SECTION}.json`,{cache:'no-store'});
    const groups=r.ok?await r.json():null;
    if(!groups||!Object.keys(groups).length){
      el.innerHTML='<div style="color:var(--muted);font-size:13px">Aucun groupe. Crée-en un ci-dessus.</div>';
      return;
    }
    el.innerHTML=Object.entries(groups).map(([code,g])=>`
      <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px;margin-bottom:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-weight:800">${esc(g.name)}</span>
            <span style="background:rgba(255,255,255,.08);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--gold)">${code}</span>
            <button onclick="navigator.clipboard.writeText('${code}').then(()=>toast('✅ Code ${code} copié !'))" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px">📋</button>
          </div>
          <button onclick="delGrp('${code}')" style="background:rgba(229,57,53,.15);border:1px solid rgba(229,57,53,.3);color:#ff6b6b;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">🗑</button>
        </div>
        <div style="font-size:12px;color:var(--muted)">👥 ${(g.members||[]).length} membre(s)</div>
      </div>`).join('');
  }catch(e){
    el.innerHTML='<div style="color:#ff6b6b;font-size:13px">❌ Erreur chargement</div>';
  }
}

window.delGrp=async code=>{
  if(!confirm('Supprimer le groupe '+code+' ?'))return;
  await fetch(`${FB}/groups_${SECTION}/${code}.json`,{method:'DELETE'});
  toast('Groupe supprimé');
  loadGrpList();
};

function startPoll(){
  stopPoll();
  _poll=setInterval(async()=>{
    const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'))return;
    if(Date.now()-_lastInteraction<8000)return;
    const data=await fbRoot();if(JSON.stringify(data)!==JSON.stringify(_state)){_state=data||{};render();}
  },5000);
}
function stopPoll(){if(_poll){clearInterval(_poll);_poll=null;}}
</script>

<!-- CHAT WIDGET -->
<button id="chatBubble" style="display:none">💬<span id="chatBadge"></span></button>
<div id="chatPanel">
  <div class="chat-header">
    <button class="chat-back" id="chatBackBtn" style="display:none">←</button>
    <div class="chat-header-title" id="chatHeaderTitle">💬 Mes discussions</div>
    <button class="chat-close" id="chatCloseBtn">✕</button>
  </div>
  <div id="chatBody"></div>
</div>

<script>
// ══════════════ CHAT WIDGET ══════════════
// Un chat par groupe ET par compétition (clé = "{section}_{codeGroupe}"),
// donc le même code de groupe sur deux compétitions différentes = deux
// discussions séparées. Pastille rouge = messages non lus. Les messages
// de l'admin s'affichent en rouge pour tout le monde.
(function(){
  const CHAT_SECTIONS=['l1'];
  let _chatThreads=[],_chatOpen=null,_chatMsgs=[],_chatPoll=null;

  function chatKey(section,code){return section+'_'+code;}
  function chatLastSeen(){try{return JSON.parse(localStorage.getItem('chat_lastSeen')||'{}');}catch{return{};}}
  function chatMarkSeen(key,ts){const s=chatLastSeen();s[key]=ts;try{localStorage.setItem('chat_lastSeen',JSON.stringify(s));}catch{}}

  async function chatFetchMsgs(key){
    try{
      const r=await fetch(`${FB}/chat/${key}.json?limitToLast=100`,{cache:'no-store'});
      if(!r.ok)return[];
      const d=await r.json();
      if(!d)return[];
      return Object.entries(d).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.ts-b.ts);
    }catch{return[];}
  }
  async function chatSend(key,msg){
    try{
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      await fetch(`${FB}/chat/${key}/${id}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(msg)});
      return true;
    }catch{return false;}
  }

  function chatMyThreads(pid){
    const threads=[];
    CHAT_SECTIONS.forEach(sec=>{
      try{
        const s=JSON.parse(localStorage.getItem(sec+'_groups')||'{}');
        (s[pid]||[]).forEach(g=>threads.push({section:sec,code:g.code,name:g.name,key:chatKey(sec,g.code)}));
      }catch{}
    });
    return threads;
  }

  const SECTION_LABEL={l1:'Ligue 1',cdm:'Coupe du Monde',ldc:'Ligue des Champions',euro:'Euro'};

  async function chatRefreshBadge(){
    const sess=getSession();if(!sess){document.getElementById('chatBubble').style.display='none';return;}
    document.getElementById('chatBubble').style.display='flex';
    _chatThreads=chatMyThreads(sess.pid);
    const seen=chatLastSeen();
    let unreadThreads=0;
    for(const t of _chatThreads){
      const msgs=await chatFetchMsgs(t.key);
      t._lastTs=msgs.length?msgs[msgs.length-1].ts:0;
      t._unread=t._lastTs>(seen[t.key]||0)&&msgs.some(m=>m.pid!==sess.pid);
      if(t._unread)unreadThreads++;
    }
    const badge=document.getElementById('chatBadge');
    if(unreadThreads>0){badge.textContent=unreadThreads;badge.style.display='flex';}
    else badge.style.display='none';
  }

  function chatRenderThreadList(){
    document.getElementById('chatBackBtn').style.display='none';
    document.getElementById('chatHeaderTitle').textContent='💬 Mes discussions';
    const body=document.getElementById('chatBody');
    if(!_chatThreads.length){
      body.innerHTML='<div class="chat-empty">Rejoins un groupe (L1, LDC ou CDM) pour accéder à son chat.</div>';
      return;
    }
    body.innerHTML=`<div class="chat-thread-list">${_chatThreads.map((t,i)=>`
      <div class="chat-thread-item" data-i="${i}">
        <div>
          <div class="chat-thread-name">${esc(t.name)}</div>
          <div class="chat-thread-sub">${SECTION_LABEL[t.section]||t.section}</div>
        </div>
        ${t._unread?'<div class="chat-thread-dot"></div>':''}
      </div>`).join('')}</div>`;
    body.querySelectorAll('.chat-thread-item').forEach(el=>{
      el.addEventListener('click',()=>chatOpenThread(_chatThreads[+el.dataset.i]));
    });
  }

  async function chatOpenThread(t){
    _chatOpen=t;
    document.getElementById('chatBackBtn').style.display='inline-block';
    document.getElementById('chatHeaderTitle').textContent=`${t.name} · ${SECTION_LABEL[t.section]||t.section}`;
    const body=document.getElementById('chatBody');
    body.innerHTML='<div class="chat-messages" id="chatMsgList"><div class="chat-empty">Chargement…</div></div>'+
      '<div class="chat-input-row"><input id="chatInput" placeholder="Écrire un message…" maxlength="500"><button class="chat-send-btn" id="chatSendBtn">➤</button></div>';
    _chatMsgs=await chatFetchMsgs(t.key);
    chatMarkSeen(t.key,_chatMsgs.length?_chatMsgs[_chatMsgs.length-1].ts:Date.now());
    chatRenderMessages();
    document.getElementById('chatSendBtn').addEventListener('click',chatDoSend);
    document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')chatDoSend();});
    chatRefreshBadge();
  }

  function chatRenderMessages(){
    const list=document.getElementById('chatMsgList');if(!list)return;
    const sess=getSession();
    list.innerHTML=_chatMsgs.length?_chatMsgs.map(m=>{
      const mine=m.pid===sess?.pid;
      const cls=mine?'mine':(m.isAdmin?'admin':'other');
      const time=new Date(m.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      return`<div class="chat-msg ${cls}">
        ${!mine?`<div class="chat-msg-name">${m.isAdmin?'🔴 ':''}${esc(m.name)}</div>`:''}
        <div>${esc(m.text)}</div>
        <div class="chat-msg-time">${time}</div>
      </div>`;
    }).join(''):'<div class="chat-empty">Aucun message. Lance la discussion !</div>';
    list.scrollTop=list.scrollHeight;
  }

  async function chatDoSend(){
    const input=document.getElementById('chatInput');
    const text=(input.value||'').trim();
    if(!text||!_chatOpen)return;
    const sess=getSession();if(!sess)return;
    input.value='';
    const msg={pid:sess.pid,name:sess.name||sess.pid,text,ts:Date.now(),isAdmin:sess.role==='admin'};
    _chatMsgs.push(msg);chatRenderMessages();
    await chatSend(_chatOpen.key,msg);
    chatMarkSeen(_chatOpen.key,msg.ts);
  }

  function chatPollActive(){
    clearInterval(_chatPoll);
    _chatPoll=setInterval(async()=>{
      if(_chatOpen&&document.getElementById('chatPanel').classList.contains('open')){
        const fresh=await chatFetchMsgs(_chatOpen.key);
        if(fresh.length!==_chatMsgs.length){_chatMsgs=fresh;chatRenderMessages();chatMarkSeen(_chatOpen.key,fresh.length?fresh[fresh.length-1].ts:Date.now());}
      } else {
        chatRefreshBadge();
      }
    },15000);
  }

  document.addEventListener('DOMContentLoaded',()=>{
    const bubble=document.getElementById('chatBubble');
    const panel=document.getElementById('chatPanel');
    if(!bubble||!panel)return;
    bubble.addEventListener('click',()=>{
      panel.classList.add('open');
      _chatOpen=null;
      chatRenderThreadList();
    });
    document.getElementById('chatCloseBtn').addEventListener('click',()=>panel.classList.remove('open'));
    document.getElementById('chatBackBtn').addEventListener('click',()=>{_chatOpen=null;chatRenderThreadList();});
    chatRefreshBadge();
    chatPollActive();
  });
  if(document.readyState!=='loading'){
    const bubble=document.getElementById('chatBubble');
    if(bubble){chatRefreshBadge();chatPollActive();}
  }
})();
</script>
</body>
</html>

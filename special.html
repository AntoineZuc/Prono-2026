<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Match Spécial — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--card:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--gold:#f5c842;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(245,200,66,.1) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 40% at 80% 80%,rgba(20,196,125,.08) 0%,transparent 55%)}
    select{width:100%;padding:9px 13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
    select option{background:#0d1628}
    input,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:10px;color:#fff;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
    input:focus,textarea:focus{border-color:rgba(245,200,66,.4)}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
    .btn{border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:9px 18px;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-gold{background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a0e1a}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text)}
    .btn-danger{background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#ff6b6b}
    .btn-green{background:rgba(20,196,125,.15);border:1px solid rgba(20,196,125,.3);color:#14c47d}
    .score-box{width:56px!important;text-align:center;font-size:20px!important;font-weight:900;padding:8px 2px!important;border-radius:12px!important}
    .adj-btn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-size:22px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s}
    .adj-btn:active{background:rgba(255,255,255,.18)}
    .score-row-ui{display:flex;align-items:center;gap:8px}
    .team-label{font-size:12px;font-weight:700;color:var(--muted);text-align:center;width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .score-sep{font-size:20px;font-weight:900;color:rgba(255,255,255,.3);width:16px;text-align:center}
    .save-btn{width:100%;padding:13px;font-size:14px;font-weight:800;border:none;border-radius:12px;cursor:pointer;font-family:inherit;margin-top:10px;transition:opacity .15s}
    .save-btn:active{opacity:.75}
    .save-btn-gold{background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a0e1a}
    .save-btn-blue{background:linear-gradient(135deg,rgba(100,160,255,.9),rgba(60,110,220,.9));color:#fff}
    .save-btn-yellow{background:linear-gradient(135deg,rgba(245,200,66,.9),rgba(200,150,20,.9));color:#0a0e1a}
    .stat-adj{display:flex;flex-direction:column;align-items:center;gap:6px}
    .stat-adj .adj-btn{width:36px;height:36px;font-size:18px}
    .stat-val{font-size:18px;font-weight:900;min-width:36px;text-align:center}
    .tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .tab{background:rgba(255,255,255,.06);border:1px solid var(--border);color:rgba(255,255,255,.45);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:700;cursor:pointer}
    .tab.active{background:rgba(245,200,66,.2);border-color:rgba(245,200,66,.5);color:var(--gold)}
    .tag{display:inline-flex;align-items:center;gap:5px;background:rgba(20,196,125,.12);border:1px solid rgba(20,196,125,.25);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;margin:2px}
    .tag .del{background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:15px;line-height:1;padding:0}
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .section{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
    .section.et{border-color:rgba(100,160,255,.3);background:rgba(100,160,255,.05)}
    .section.tab{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.04)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .live-dot{width:8px;height:8px;background:#e53935;border-radius:50%;display:inline-block;animation:pulse 1.2s infinite;margin-right:4px}
    .rank-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .rank-row.me{background:rgba(245,200,66,.06);border-radius:8px;padding:8px;margin:0 -4px}
    /* États champs */
    input.warn{border-color:rgba(255,140,0,.7)!important;background:rgba(255,140,0,.05)!important}
    /* Carte prono validé */
    .prono-saved{background:rgba(20,196,125,.08);border:1px solid rgba(20,196,125,.25);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .prono-saved .row-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
    .prono-saved .row-item:last-child{border-bottom:none}
    /* Badge live */
    .live-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(229,57,53,.15);border:1px solid rgba(229,57,53,.3);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#ff6b6b}
    /* iOS safe */
    @media(max-width:480px){
      .card,.prono-saved{padding:14px}
      .score-box{width:44px!important;font-size:16px!important}
      .tab{padding:6px 12px;font-size:11px}
      select{width:100%;padding:9px 13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
    select option{background:#0d1628}
    input,textarea{font-size:16px!important} /* évite zoom iOS */
    }
    .medal{font-size:16px;width:24px;text-align:center}
  </style>
</head>
<body>
<button id="portalBtn" onclick="location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:560px;margin:0 auto;padding:54px 14px 40px"></div>
<div id="toast"></div>
<script>
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _t;const toast=m=>{const e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>e.classList.remove('show'),2600)};

// ── Session (localStorage pour persistance mobile) ──
function getSession(){
  try{
    const d=JSON.parse(localStorage.getItem('cdm2026session'));
    if(!d)return null;
    if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}
    return d;
  }catch(e){return null;}
}
function setSession(data){
  try{localStorage.setItem('cdm2026session',JSON.stringify({...data,_exp:Date.now()+30*24*3600*1000}));}catch{}
}
function clearSession(){
  try{localStorage.removeItem('cdm2026session');}catch{}
}

// ── Firebase ──
const fb=async(path,method='GET',body)=>{
  const r=await fetch(`${FB}/${path}.json`,{method,cache:'no-store',
    headers:body?{'Content-Type':'application/json'}:{},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
};
const fbGet=p=>fb(p);
const fbPatch=(p,d)=>fb(p,'PATCH',d);
const fbSet=(p,d)=>fb(p,'PUT',d);
const fbDel=p=>fb(p,'DELETE');

// ── Utils ──
const v=el=>el&&el.value!==''?Number(el.value):null;
const outcome=(a,b)=>a>b?'H':a<b?'A':'D';
function dateFr(d,t){
  if(!d)return'';
  try{return new Date(d+'T'+(t||'12:00')+':00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+(t?' '+t:'');}
  catch(e){return d;}
}

// Verrouillage H-5min
function isLocked(sm){
  if(!sm?.date||!sm?.time)return false;
  const dt=new Date(sm.date+'T'+sm.time+':00');
  return Date.now()>=dt.getTime()-5*60000;
}
// Coup d'envoi passé → pronos visibles
function isStarted(sm){
  if(!sm?.date||!sm?.time)return false;
  return Date.now()>=new Date(sm.date+'T'+sm.time+':00').getTime();
}

// ── Calcul points ──
function calcPoints(sm,pr){
  if(!sm||!pr||pr.scoreA==null)return{pts:0,detail:[]};
  let pts=0;const det=[];
  const pA=+pr.scoreA,pB=+pr.scoreB;

  if(sm.scoreA!=null){
    const mA=+sm.scoreA,mB=+sm.scoreB;
    if(pA===mA&&pB===mB){pts+=3;det.push({i:'⚽',t:`Score exact ${mA}-${mB}`,p:3,c:'#14c47d'});}
    else if(outcome(pA,pB)===outcome(mA,mB)){pts+=1;det.push({i:'⚽',t:'Bon résultat',p:1,c:'#4de8a8'});}
    else det.push({i:'⚽',t:'Score raté',p:0,c:'rgba(252,129,129,.7)'});
  }

  // ET — seulement si joueur avait prévu nul à 90min
  if(sm.canET&&sm.scoreAET!=null&&pr.scoreAET!=null&&pA===pB){
    const pEA=+pr.scoreAET,pEB=+(pr.scoreBET??0),mEA=+sm.scoreAET,mEB=+(sm.scoreBET??0);
    const b=pEA===mEA&&pEB===mEB?3:1;
    pts+=b;det.push({i:'🔵',t:b===3?`Prolong. exact ${pEA}-${pEB}`:'Prolong. prévu',p:b,c:'rgba(100,160,255,.9)'});
  }

  // TAB — seulement si joueur avait prévu nul en prolongations
  if(sm.canET&&sm.penA!=null&&pr.penA!=null&&pA===pB&&pr.scoreAET!=null&&+pr.scoreAET===+(pr.scoreBET??-1)){
    const pPA=+pr.penA,pPB=+(pr.penB??0),mPA=+sm.penA,mPB=+(sm.penB??0);
    const b=pPA===mPA&&pPB===mPB?3:1;
    pts+=b;det.push({i:'🟡',t:b===3?`TAB exact ${pPA}-${pPB}`:'TAB prévu',p:b,c:'rgba(245,200,66,.9)'});
  }

  // Cartons jaunes total
  if(sm.yellowA!=null&&pr.yellowCards!=null){
    const tot=(+sm.yellowA||0)+(+sm.yellowB||0);
    if(+pr.yellowCards===tot){pts+=1;det.push({i:'🟨',t:`${tot} carton(s) jaune exact`,p:1,c:'var(--gold)'});}
  }
  // Cartons rouges total
  if(sm.redA!=null&&pr.redCards!=null){
    const tot=(+sm.redA||0)+(+sm.redB||0);
    if(+pr.redCards===tot){pts+=1;det.push({i:'🟥',t:`${tot} carton(s) rouge exact`,p:1,c:'#ff6b6b'});}
  }
  // Penaltys
  if(sm.penalties!=null&&pr.penalties!=null&&+pr.penalties===+sm.penalties){
    pts+=1;det.push({i:'🥅',t:`${sm.penalties} penalty exact`,p:1,c:'rgba(255,255,255,.7)'});
  }

  // Buteurs — admin a coché les bons via scorerValidations (clé: A__nom ou B__nom)
  if(sm.scorerValidations){
    const sv=sm.scorerValidations;
    let sp=0;
    (pr.scorersA||[]).forEach(s=>{const k='A__'+s.trim().toLowerCase();if(sv[k]===true)sp++;});
    (pr.scorersB||[]).forEach(s=>{const k='B__'+s.trim().toLowerCase();if(sv[k]===true)sp++;});
    if(sp>0){pts+=sp;det.push({i:'⚽',t:`${sp} buteur(s) validé(s)`,p:sp,c:'#14c47d'});}
  }

  // Fait marquant — admin valide par joueur
  if(sm.remarkValidations&&pr._pid&&sm.remarkValidations[pr._pid]===true&&pr.remark){
    pts+=1;det.push({i:'⭐',t:'Fait marquant validé',p:1,c:'var(--gold)'});
  }

  return{pts,detail:det};
}

// ── État ──
let _sm=null,_pronos={},_sess=null,_players={},_timer=null;

// ── INIT ──
(async()=>{
  const sess=getSession();
  if(!sess){location.href='index.html';return;}
  _sess=sess;
  $('app').innerHTML='<div style="text-align:center;padding:80px 20px;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px">⚡</div>Chargement…</div>';
  try{
    const[sm,pronos,players]=await Promise.all([fbGet('specialMatch'),fbGet('specialPronos'),fbGet('players')]);
    _sm=sm;_pronos=pronos||{};_players=players||{};
  }catch(e){_sm=null;_pronos={};_players={};}
  render();
  startPoll();
})();

function render(){
  if(!_sm?.teamA){_sess.role==='admin'?renderSetup():renderEmpty();return;}
  _sess.role==='admin'?renderAdmin():renderPlayer();
}

// ══════════════════════════════════════════════
// ADMIN — CRÉATION
// ══════════════════════════════════════════════
function renderSetup(){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:48px;margin-bottom:8px">⚡</div>
      <div style="font-size:20px;font-weight:900">Match Spécial</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Administration</div>
    </div>
    <div class="card">
      <h2 style="font-size:14px;font-weight:800;margin-bottom:14px">Créer un match</h2>
      <div style="margin-bottom:10px"><label>Équipe A</label><input id="cTA" placeholder="Ex: Paris SG"></div>
      <div style="margin-bottom:10px"><label>Équipe B</label><input id="cTB" placeholder="Ex: FC Metz"></div>
      <div style="margin-bottom:12px">
        <label>Date</label>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
          <select id="cDate_d">
            <option value="">Jour</option>
            <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option>
          </select>
          <select id="cDate_m">
            <option value="">Mois</option>
            <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
          </select>
          <select id="cDate_y">
            <option value="">Année</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <label>Heure (Paris)</label>
        <input id="cTime" type="text" placeholder="21:00" value="21:00" inputmode="numeric">
      </div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:16px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400">
        <input type="checkbox" id="cET" style="width:auto;accent-color:var(--gold)"> Prolongations/TAB possibles
      </label>
      <div style="margin-bottom:16px">
        <label>Code d'accès joueurs</label>
        <div style="margin-top:6px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 16px">
          <span id="cCode" style="font-size:24px;font-weight:900;letter-spacing:6px;color:var(--gold);flex:1;text-align:center">${Math.random().toString(36).slice(2,8).toUpperCase()}</span>
          <button type="button" onclick="document.getElementById('cCode').textContent=Math.random().toString(36).slice(2,8).toUpperCase()" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;flex-shrink:0" title="Regénérer">🎲</button>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Code généré automatiquement — partage-le aux joueurs</div>
      </div>
      <button class="btn btn-gold" id="cBtn" style="width:100%;font-size:14px">⚡ Créer le match</button>
    </div>`;
  // Remplir le select d'années dynamiquement (année courante → 2099)
  const yearSel=$('cDate_y');
  if(yearSel){
    const curY=new Date().getFullYear();
    for(let y=curY;y<=2099;y++){
      const o=document.createElement('option');o.value=y;o.textContent=y;yearSel.appendChild(o);
    }
  }

  $('cBtn').onclick=async()=>{
    const tA=($('cTA').value||'').trim(),tB=($('cTB').value||'').trim();
    const dd=$('cDate_d')?.value,mm=$('cDate_m')?.value,yy=$('cDate_y')?.value;
    const date=(dd&&mm&&yy)?`${yy}-${mm}-${dd}`:'';
    const time=($('cTime').value||'').trim();
    if(!tA||!tB||!date||!time){toast('Remplis tous les champs');return;}
    const dt=new Date(date+'T'+time+':00');
    if(dt.getTime()-Date.now()<30*60000){toast('⚠️ Le match doit être dans plus de 30 minutes !');return;}
    const accessCode=($('cCode')?.textContent||'').trim().toUpperCase()||null;
    const sm={teamA:tA,teamB:tB,date,time,canET:!!$('cET').checked,
      accessCode,
      scoreA:null,scoreB:null,et90done:false,etDone:false,
      scoreAET:null,scoreBET:null,penA:null,penB:null,
      yellowA:null,yellowB:null,redA:null,redB:null,penalties:null,
      scorers:[],remarkValidations:{}};
    await fbSet('specialMatch',sm);
    _sm=sm;toast('✅ Match créé !');render();
  };
}

// ══════════════════════════════════════════════
// ADMIN — LIVE
// ══════════════════════════════════════════════
function renderAdmin(){
  const sm=_sm,pr=_pronos;
  const players=Object.values(_players);
  const locked=isLocked(sm);
  const ranking=players
    .filter(p=>pr[p.id]?.scoreA!=null)
    .map(p=>{const{pts}=calcPoints(sm,{...pr[p.id],_pid:p.id});return{name:p.name,pts,pid:p.id};})
    .sort((a,b)=>b.pts-a.pts);

  $('app').innerHTML=`
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted)">⚡ Match Spécial — Admin</div>
      <div style="font-size:19px;font-weight:900;margin:2px 0">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
      ${_sm.accessCode?`<div style="margin-top:4px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:12px">
        🔑 Code : <b style="letter-spacing:2px;color:var(--gold)">${_sm.accessCode}</b>
      </div>`:''}
      <div style="font-size:12px;color:${locked?'#f5c842':'#14c47d'}">${dateFr(sm.date,sm.time)} · ${locked?'🔒 Verrouillé':'⏳ Ouvert'}</div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        ${sm.finished?'<span style="color:#14c47d;font-weight:700;font-size:13px;padding:8px 0">✅ Match terminé</span>':
          `<button class="btn btn-gold" id="finBtn" style="font-size:13px">🏁 Fin du match</button>`}
        <button class="btn btn-ghost" id="archBtn">📦 Archiver</button>
        <button class="btn btn-danger" id="delBtn">🗑 Supprimer</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="pronos">📋 Pronos</button>
      <button class="tab" data-tab="rank">🏆 Classement</button>
    </div>

    <!-- LIVE -->
    <div id="tab-live">
      <div class="card">

        <!-- Score 90min -->
        <label style="text-align:center;display:block;margin-bottom:10px">⚽ Score 90 min</label>
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px">

  // Cartons
  $('adSaveStats')?.addEventListener('click',async()=>{
    const y=v($('adY')),r=v($('adR')),p=v($('adPen'));

// Buteurs admin : case à cocher par joueur
window.toggleScorer=async function(key,val){
  const sv={...(_sm.scorerValidations||{}),[key]:val};
  await fbPatch('specialMatch',{scorerValidations:sv});
  _sm={..._sm,scorerValidations:sv};toast(val?'✅ Buteur validé':'Retiré');
};
window.toggleRemark=async function(pid,val){
  const rv={...(_sm.remarkValidations||{}),[pid]:val};
  await fbPatch('specialMatch',{remarkValidations:rv});
  _sm={..._sm,remarkValidations:rv};toast(val?'✅ Validé':'Invalidé');
};

// Archivage
async function archiveMatch(){
  const sm2=_sm,pr2=_pronos;
  const ts=Date.now();
  const players=Object.values(_players);
  const ranking=players
    .filter(p=>pr2[p.id]?.scoreA!=null)
    .map(p=>{const{pts}=calcPoints(sm2,{...pr2[p.id],_pid:p.id});return{pid:p.id,name:p.name,pts};})
    .sort((a,b)=>b.pts-a.pts);
  await Promise.all(ranking.map((r,i)=>fbSet(`history/${r.pid}/special_${ts}`,{
    competition:'special',label:`${sm2.teamA} vs ${sm2.teamB}`,
    date:new Date().toISOString().slice(0,10),
    rank:i+1,totalPlayers:ranking.length,totalScore:r.pts,
    teamA:sm2.teamA,teamB:sm2.teamB,
    scoreA:sm2.scoreA,scoreB:sm2.scoreB,
    prono:pr2[r.pid]||{},
    ranking:ranking.map((x,j)=>({name:x.name,score:x.pts,rank:j+1}))
  })));
}

// JOUEUR
// ══════════════════════════════════════════════
function getSpecialCode(sm){
  const key='special_access_'+sm.teamA+'_'+sm.teamB;
  return localStorage.getItem(key)||null;
}
function setSpecialCode(sm,code){
  const key='special_access_'+sm.teamA+'_'+sm.teamB;
  localStorage.setItem(key,code);
}
function renderCodeGate(){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:28px;padding-top:20px">
      <div style="font-size:52px;margin-bottom:10px">⚡</div>
      <div style="font-size:22px;font-weight:900">${esc(_sm.teamA)} vs ${esc(_sm.teamB)}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">Match réservé — code requis</div>
    </div>
    <div class="card">
      <label>Code d'accès</label>
      <input id="gateCode" placeholder="Ex: METZ26" style="text-transform:uppercase;font-size:20px;font-weight:700;text-align:center;letter-spacing:4px;margin-top:6px" maxlength="8">
      <button class="btn btn-gold" id="gateBtn" style="width:100%;margin-top:12px">✅ Accéder au match</button>
      <div id="gateErr" style="color:#ff6b6b;font-size:12px;text-align:center;margin-top:8px;display:none">Code incorrect</div>
    </div>`;
  $('gateBtn').addEventListener('click',()=>{
    const code=($('gateCode')?.value||'').trim().toUpperCase();
    if(code===(_sm.accessCode||'').toUpperCase()){
      setSpecialCode(_sm,code);
      renderPlayer();
    } else {
      const err=$('gateErr');if(err)err.style.display='block';
    }
  });
  $('gateCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('gateBtn').click();});
}
function renderPlayer(){
  // Vérifier le code si le match en a un
  if(_sm.accessCode){
    const saved=getSpecialCode(_sm);
    if(!saved||saved.toUpperCase()!==_sm.accessCode.toUpperCase()){
      renderCodeGate();return;
    }
  }
  const sm=_sm,sess=_sess;
  const locked=isLocked(sm),started=isStarted(sm);
  const myPr=_pronos[sess.pid]||{};
  const hasSaved=myPr.scoreA!=null;
  const{pts,detail}=calcPoints(sm,{...myPr,_pid:sess.pid});
  const players=Object.values(_players);
  const ranking=players
    .filter(p=>_pronos[p.id]?.scoreA!=null)
    .map(p=>{const{pts:p2}=calcPoints(sm,{...(_pronos[p.id]),_pid:p.id});return{name:p.name,pts:p2,pid:p.id};})
    .sort((a,b)=>b.pts-a.pts);
  const myRank=ranking.findIndex(r=>r.pid===sess.pid)+1;

  // ── Header commun ──
  const header=`
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:36px;margin-bottom:6px">⚡</div>
      <div style="font-size:18px;font-weight:900">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
      <div style="font-size:12px;margin-top:6px">
        ${started
          ?'<span class="live-badge"><span class="live-dot"></span>EN DIRECT</span>'
          :locked
            ?`<span style="color:#f5c842;font-weight:700">🔒 Pronos verrouillés</span>`
            :`<span style="color:#14c47d;font-weight:700">⏳ Ouvert — ferme 5min avant le coup d'envoi</span>`
        }
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${dateFr(sm.date,sm.time)}</div>
      ${myRank>0?`<div style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:14px">
        <span style="font-size:22px;font-weight:900;color:var(--gold)">${pts}pts</span>
        <span style="font-size:13px;color:var(--muted);background:rgba(255,255,255,.06);border-radius:999px;padding:3px 10px">${myRank===1?'🥇 ':myRank===2?'🥈 ':myRank===3?'🥉 ':''}${myRank}e / ${ranking.length}</span>
      </div>`:''}
    </div>`;

  // ── Si match pas commencé et pas encore de prono ──
  if(!locked&&!hasSaved){
    renderPronoForm(sm,sess,myPr,false,header,ranking,started);return;
  }
  // ── Si match pas commencé et prono enregistré → récap modifiable ──
  if(!locked&&hasSaved){
    renderPronoSaved(sm,sess,myPr,pts,detail,header,ranking,started);return;
  }
  // ── Match verrouillé ou en cours → vue live ──
  renderLive(sm,sess,myPr,pts,detail,header,ranking,started);
}

// ── Init formulaire prono ──
function initPronoForm(sm,sess,myPr,isEdit,ranking,started){
  let _sA=[...(myPr.scorersA||[])];
  let _sB=[...(myPr.scorersB||[])];

  function renderTags(team,list){
    const el=$(team==='A'?'tagsA':'tagsB');if(!el)return;
    el.innerHTML=list.map((s,i)=>`<span class="tag">${esc(s)}<button class="del" onclick="${team==='A'?'delA':'delB'}(${i})">×</button></span>`).join('');
  }
  function updateCounters(){
    const sA=v($('pSA'))||0,sB=v($('pSB'))||0;
    const sec=$('scorersSection');
    if(sec)sec.style.display=(sA+sB)>0?'block':'none';
    ['A','B'].forEach(t=>{
      const need=t==='A'?sA:sB,got=t==='A'?_sA.length:_sB.length;
      const cnt=$(t==='A'?'cntA':'cntB'),tgt=$(t==='A'?'tgtA':'tgtB');
      const warn=$(t==='A'?'warnA':'warnB');
      if(cnt)cnt.textContent=got;if(tgt)tgt.textContent=need;
      if(warn)warn.style.display=need>0&&got<need?'block':'none';
    });
    checkValid();
  }
  function checkValid(){
    const sA=v($('pSA')),sB=v($('pSB'));
    const ok=sA!==null&&sB!==null&&_sA.length>=(sA||0)&&_sB.length>=(sB||0);
    const btn=$('pSave');
    if(btn){btn.disabled=!ok;btn.style.opacity=ok?'1':'0.5';}
    const hint=$('saveHint');
    const needScorers=(sA||0)+(sB||0)>0&&(_sA.length<(sA||0)||_sB.length<(sB||0));
    if(hint)hint.style.display=needScorers?'block':'none';
  }

  window.addA=function(){
    const inp=$('inpA');if(!inp)return;
    const n=inp.value.trim();if(!n)return;
    const need=v($('pSA'))||0;
    if(_sA.length>=need){toast(`Maximum ${need} buteur(s) pour ${sm.teamA}`);return;}
    _sA.push(n);inp.value='';renderTags('A',_sA);updateCounters();inp.focus();
  };
  window.delA=function(i){_sA.splice(i,1);renderTags('A',_sA);updateCounters();};
  window.addB=function(){
    const inp=$('inpB');if(!inp)return;
    const n=inp.value.trim();if(!n)return;
    const need=v($('pSB'))||0;
    if(_sB.length>=need){toast(`Maximum ${need} buteur(s) pour ${sm.teamB}`);return;}
    _sB.push(n);inp.value='';renderTags('B',_sB);updateCounters();inp.focus();
  };
  window.delB=function(i){_sB.splice(i,1);renderTags('B',_sB);updateCounters();};

  // ── Fonctions +/− ──
  window.adj=function(id,d){
    bumpInteraction();const el=$(id);if(!el)return;
    el.value=Math.max(0,(+el.value||0)+d);
    updateScoreLogic();
  };
  window.adjET=function(id,d){
    bumpInteraction();const el=$(id);if(!el)return;
    const min90=id==='pETA'?(+($('pSA')?.value)||0):(+($('pSB')?.value)||0);
    el.value=Math.max(min90,(+el.value||min90)+d);
    updateETLogic();
  };
  window.adjTAB=function(id,d){bumpInteraction();const el=$(id);if(!el)return;el.value=Math.max(0,(+el.value||0)+d);checkValid();};
  window.adjStat=function(id,d){
    bumpInteraction();const el=$(id),vEl=$(id+'v');if(!el)return;
    const newVal=Math.max(0,(+el.value||0)+d);
    el.value=newVal;if(vEl)vEl.textContent=newVal;
  };

  function updateScoreLogic(){
    const sA=v($('pSA')),sB=v($('pSB'));
    const isNull90=sA!=null&&sB!=null&&sA===sB;
    const etSec=$('etSection');
    if(etSec){
      etSec.style.display=isNull90&&sm.canET?'block':'none';
      if(!isNull90){
        [$('pETA'),$('pETB'),$('pPA'),$('pPB')].forEach(el=>{if(el)el.value='';});
        const tabSec=$('tabSection');if(tabSec)tabSec.style.display='none';
      } else if(sA!=null){
        // Forcer ET >= score 90
        const pETA=$('pETA'),pETB=$('pETB');
        if(pETA&&(+pETA.value||0)<sA)pETA.value=sA;
        if(pETB&&(+pETB.value||0)<sB)pETB.value=sB;
      }
    }
    // Vider buteurs si score change
    if(sA!=null)_sA=_sA.slice(0,sA||0);
    if(sB!=null)_sB=_sB.slice(0,sB||0);
    renderTags('A',_sA);renderTags('B',_sB);
    updateCounters();
  }

  function updateETLogic(){
    const sA=v($('pSA'))??0,sB=v($('pSB'))??0;
    const pETA=$('pETA'),pETB=$('pETB');
    // Forcer ET >= score 90 si une valeur est saisie
    if(pETA&&pETA.value!==''&&(+pETA.value||0)<sA)pETA.value=sA;
    if(pETB&&pETB.value!==''&&(+pETB.value||0)<sB)pETB.value=sB;
    // Lire valeurs ET (champ vide = même que score 90min = nul possible)
    const eA=pETA&&pETA.value!==''?+pETA.value:sA;
    const eB=pETB&&pETB.value!==''?+pETB.value:sB;
    const isNullET=eA===eB;
    const tabSec=$('tabSection');
    if(tabSec){
      tabSec.style.display=isNullET?'block':'none';
      if(!isNullET){[$('pPA'),$('pPB')].forEach(el=>{if(el)el.value='';});}
    }
    checkValid();
  }

  ['pSA','pSB'].forEach(id=>$(id)?.addEventListener('input',updateScoreLogic));
  ['pETA','pETB'].forEach(id=>$(id)?.addEventListener('input',updateETLogic));

  renderTags('A',_sA);renderTags('B',_sB);
  setTimeout(()=>{updateScoreLogic();updateCounters();},50);


  $('pCancel')?.addEventListener('click',()=>render());

  $('pSave')?.addEventListener('click',async()=>{
    const sA=v($('pSA')),sB=v($('pSB'));
    if(sA===null||sB===null){toast('Entre le score');return;}
    if(_sA.length<(sA||0)||_sB.length<(sB||0)){toast('⚠️ Complète tous les buteurs');return;}
    const prono={scoreA:sA,scoreB:sB,_pid:sess.pid};
    if(sm.canET&&sA===sB){
      const eA=v($('pETA')),eB=v($('pETB'));
      if(eA!==null&&eB!==null){
        if(eA<sA||eB<sB){toast('⚠️ ET ne peut pas être inférieur au 90min');return;}
        prono.scoreAET=eA;prono.scoreBET=eB;
        if(eA===eB){const pA=v($('pPA')),pB=v($('pPB'));if(pA!==null&&pB!==null){if(pA===pB){toast('⚠️ TAB ne peut pas être nul');return;}prono.penA=pA;prono.penB=pB;}}
      }
    }
    const y=v($('pY')),r=v($('pR')),p=v($('pPen'));
    if(y!=null)prono.yellowCards=y;if(r!=null)prono.redCards=r;if(p!=null)prono.penalties=p;
    if(_sA.length)prono.scorersA=_sA;if(_sB.length)prono.scorersB=_sB;
    prono.scorers=[..._sA,..._sB];
    const rem=($('pRemark')?.value||'').trim();if(rem)prono.remark=rem;
    await fbSet(`specialPronos/${sess.pid}`,prono);
    _pronos[sess.pid]=prono;
    toast('✅ Prono enregistré !');
    render();
  });
}

function renderEmpty(){
  $('app').innerHTML=`<div style="text-align:center;padding:60px 20px">
    <div style="font-size:52px;margin-bottom:12px">⚡</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:8px">Match Spécial</div>
    <div style="color:var(--muted);font-size:14px">Aucun match en cours.</div>
    ${_sess.role!=='admin'?'<div style="font-size:12px;color:var(--muted);margin-top:8px">Demande un code \u00e0 l\'admin pour rejoindre</div>':''}
  </div>`;
}

// ── Polling ──
let _lastInteraction=0;
function bumpInteraction(){_lastInteraction=Date.now();}

function startPoll(){
  if(_timer)clearInterval(_timer);
  _timer=setInterval(async()=>{
    try{
      // Bloquer si champ actif OU interaction récente (10s)
      const ae=document.activeElement;
      const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||ae.tagName==='BUTTON');
      if(typing||Date.now()-_lastInteraction<10000)return;
      const[sm,pronos]=await Promise.all([fbGet('specialMatch'),fbGet('specialPronos')]);
      const changed=JSON.stringify({sm,pronos})!==JSON.stringify({sm:_sm,pronos:_pronos});
      if(changed){_sm=sm;_pronos=pronos||{};render();}
    }catch(e){}
  },6000);
}
</script>
</body>
</html>

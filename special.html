<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Match Spécial — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--card:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--gold:#f5c842;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(245,200,66,.1) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 40% at 80% 80%,rgba(20,196,125,.08) 0%,transparent 55%)}
    input,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:10px;color:#fff;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
    input:focus,textarea:focus{border-color:rgba(245,200,66,.4)}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
    .btn{border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:9px 18px;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-gold{background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a0e1a}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text)}
    .btn-danger{background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#ff6b6b}
    .btn-green{background:rgba(20,196,125,.15);border:1px solid rgba(20,196,125,.3);color:#14c47d}
    .score-box{width:50px!important;text-align:center;font-size:18px!important;font-weight:800;padding:7px 4px!important}
    .tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .tab{background:rgba(255,255,255,.06);border:1px solid var(--border);color:rgba(255,255,255,.45);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:700;cursor:pointer}
    .tab.active{background:rgba(245,200,66,.2);border-color:rgba(245,200,66,.5);color:var(--gold)}
    .tag{display:inline-flex;align-items:center;gap:5px;background:rgba(20,196,125,.12);border:1px solid rgba(20,196,125,.25);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;margin:2px}
    .tag .del{background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:15px;line-height:1;padding:0}
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .section{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
    .section.et{border-color:rgba(100,160,255,.3);background:rgba(100,160,255,.05)}
    .section.tab{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.04)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .live-dot{width:8px;height:8px;background:#e53935;border-radius:50%;display:inline-block;animation:pulse 1.2s infinite;margin-right:4px}
    .rank-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .rank-row.me{background:rgba(245,200,66,.06);border-radius:8px;padding:8px;margin:0 -4px}
    .medal{font-size:16px;width:24px;text-align:center}
  </style>
</head>
<body>
<button id="portalBtn" onclick="location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:560px;margin:0 auto;padding:54px 14px 40px"></div>
<div id="toast"></div>
<script>
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _t;const toast=m=>{const e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>e.classList.remove('show'),2600)};

// ── Session (localStorage pour persistance mobile) ──
function getSession(){
  try{
    const d=JSON.parse(localStorage.getItem('cdm2026session'));
    if(!d)return null;
    if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}
    return d;
  }catch(e){return null;}
}

// ── Firebase ──
const fb=async(path,method='GET',body)=>{
  const r=await fetch(`${FB}/${path}.json`,{method,cache:'no-store',
    headers:body?{'Content-Type':'application/json'}:{},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
};
const fbGet=p=>fb(p);
const fbPatch=(p,d)=>fb(p,'PATCH',d);
const fbSet=(p,d)=>fb(p,'PUT',d);
const fbDel=p=>fb(p,'DELETE');

// ── Utils ──
const v=el=>el&&el.value!==''?Number(el.value):null;
const outcome=(a,b)=>a>b?'H':a<b?'A':'D';
function dateFr(d,t){
  if(!d)return'';
  try{return new Date(d+'T'+(t||'12:00')+':00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+(t?' '+t:'');}
  catch(e){return d;}
}

// Verrouillage H-5min
function isLocked(sm){
  if(!sm?.date||!sm?.time)return false;
  const dt=new Date(sm.date+'T'+sm.time+':00');
  return Date.now()>=dt.getTime()-5*60000;
}
// Coup d'envoi passé → pronos visibles
function isStarted(sm){
  if(!sm?.date||!sm?.time)return false;
  return Date.now()>=new Date(sm.date+'T'+sm.time+':00').getTime();
}

// ── Calcul points ──
function calcPoints(sm,pr){
  if(!sm||!pr||pr.scoreA==null)return{pts:0,detail:[]};
  let pts=0;const det=[];
  const pA=+pr.scoreA,pB=+pr.scoreB;

  if(sm.scoreA!=null){
    const mA=+sm.scoreA,mB=+sm.scoreB;
    if(pA===mA&&pB===mB){pts+=3;det.push({i:'⚽',t:`Score exact ${mA}-${mB}`,p:3,c:'#14c47d'});}
    else if(outcome(pA,pB)===outcome(mA,mB)){pts+=1;det.push({i:'⚽',t:'Bon résultat',p:1,c:'#4de8a8'});}
    else det.push({i:'⚽',t:'Score raté',p:0,c:'rgba(252,129,129,.7)'});
  }

  // ET — seulement si joueur avait prévu nul à 90min
  if(sm.canET&&sm.scoreAET!=null&&pr.scoreAET!=null&&pA===pB){
    const pEA=+pr.scoreAET,pEB=+(pr.scoreBET??0),mEA=+sm.scoreAET,mEB=+(sm.scoreBET??0);
    const b=pEA===mEA&&pEB===mEB?3:1;
    pts+=b;det.push({i:'🔵',t:b===3?`Prolong. exact ${pEA}-${pEB}`:'Prolong. prévu',p:b,c:'rgba(100,160,255,.9)'});
  }

  // TAB — seulement si joueur avait prévu nul en prolongations
  if(sm.canET&&sm.penA!=null&&pr.penA!=null&&pA===pB&&pr.scoreAET!=null&&+pr.scoreAET===+(pr.scoreBET??-1)){
    const pPA=+pr.penA,pPB=+(pr.penB??0),mPA=+sm.penA,mPB=+(sm.penB??0);
    const b=pPA===mPA&&pPB===mPB?3:1;
    pts+=b;det.push({i:'🟡',t:b===3?`TAB exact ${pPA}-${pPB}`:'TAB prévu',p:b,c:'rgba(245,200,66,.9)'});
  }

  // Cartons jaunes total
  if(sm.yellowA!=null&&pr.yellowCards!=null){
    const tot=(+sm.yellowA||0)+(+sm.yellowB||0);
    if(+pr.yellowCards===tot){pts+=1;det.push({i:'🟨',t:`${tot} carton(s) jaune exact`,p:1,c:'var(--gold)'});}
  }
  // Cartons rouges total
  if(sm.redA!=null&&pr.redCards!=null){
    const tot=(+sm.redA||0)+(+sm.redB||0);
    if(+pr.redCards===tot){pts+=1;det.push({i:'🟥',t:`${tot} carton(s) rouge exact`,p:1,c:'#ff6b6b'});}
  }
  // Penaltys
  if(sm.penalties!=null&&pr.penalties!=null&&+pr.penalties===+sm.penalties){
    pts+=1;det.push({i:'🥅',t:`${sm.penalties} penalty exact`,p:1,c:'rgba(255,255,255,.7)'});
  }

  // Buteurs — admin a saisi la liste, on compare avec le prono joueur
  if(sm.scorers?.length&&pr.scorers){
    const adminList=sm.scorers.map(s=>s.toLowerCase().trim());
    const pronoList=(pr.scorers||[]).map(s=>s.toLowerCase().trim()).filter(Boolean);
    let sp=0;
    const used={};
    pronoList.forEach(s=>{
      const idx=adminList.findIndex((x,i)=>x===s&&!used[i]);
      if(idx>=0){used[idx]=true;sp++;}
    });
    if(sp>0){pts+=sp;det.push({i:'⚽',t:`${sp} buteur(s) correct(s)`,p:sp,c:'#14c47d'});}
  }

  // Fait marquant — admin valide par joueur
  if(sm.remarkValidations&&pr._pid&&sm.remarkValidations[pr._pid]===true&&pr.remark){
    pts+=1;det.push({i:'⭐',t:'Fait marquant validé',p:1,c:'var(--gold)'});
  }

  return{pts,detail:det};
}

// ── État ──
let _sm=null,_pronos={},_sess=null,_players={},_timer=null;

// ── INIT ──
(async()=>{
  const sess=getSession();
  if(!sess){location.href='index.html';return;}
  _sess=sess;
  $('app').innerHTML='<div style="text-align:center;padding:80px 20px;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px">⚡</div>Chargement…</div>';
  try{
    const[sm,pronos,players]=await Promise.all([fbGet('specialMatch'),fbGet('specialPronos'),fbGet('players')]);
    _sm=sm;_pronos=pronos||{};_players=players||{};
  }catch(e){_sm=null;_pronos={};_players={};}
  render();
  startPoll();
})();

function render(){
  if(!_sm?.teamA){_sess.role==='admin'?renderSetup():renderEmpty();return;}
  _sess.role==='admin'?renderAdmin():renderPlayer();
}

// ══════════════════════════════════════════════
// ADMIN — CRÉATION
// ══════════════════════════════════════════════
function renderSetup(){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:48px;margin-bottom:8px">⚡</div>
      <div style="font-size:20px;font-weight:900">Match Spécial</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Administration</div>
    </div>
    <div class="card">
      <h2 style="font-size:14px;font-weight:800;margin-bottom:14px">Créer un match</h2>
      <div style="margin-bottom:10px"><label>Équipe A</label><input id="cTA" placeholder="Ex: Paris SG"></div>
      <div style="margin-bottom:10px"><label>Équipe B</label><input id="cTB" placeholder="Ex: FC Metz"></div>
      <div style="margin-bottom:10px"><label>Date</label><input id="cDate" type="date"></div>
      <div style="margin-bottom:14px"><label>Heure (Paris)</label><input id="cTime" type="time" value="21:00"></div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:16px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400">
        <input type="checkbox" id="cET" style="width:auto;accent-color:var(--gold)"> Prolongations/TAB possibles
      </label>
      <button class="btn btn-gold" id="cBtn" style="width:100%;font-size:14px">⚡ Créer le match</button>
    </div>`;
  $('cBtn').onclick=async()=>{
    const tA=($('cTA').value||'').trim(),tB=($('cTB').value||'').trim();
    const date=($('cDate').value||'').trim(),time=($('cTime').value||'').trim();
    if(!tA||!tB||!date||!time){toast('Remplis tous les champs');return;}
    const dt=new Date(date+'T'+time+':00');
    if(dt.getTime()-Date.now()<30*60000){toast('⚠️ Le match doit être dans plus de 30 minutes !');return;}
    const sm={teamA:tA,teamB:tB,date,time,canET:!!$('cET').checked,
      scoreA:null,scoreB:null,et90done:false,etDone:false,
      scoreAET:null,scoreBET:null,penA:null,penB:null,
      yellowA:null,yellowB:null,redA:null,redB:null,penalties:null,
      scorers:[],remarkValidations:{}};
    await fbSet('specialMatch',sm);
    _sm=sm;toast('✅ Match créé !');render();
  };
}

// ══════════════════════════════════════════════
// ADMIN — LIVE
// ══════════════════════════════════════════════
function renderAdmin(){
  const sm=_sm,pr=_pronos;
  const players=Object.values(_players);
  const locked=isLocked(sm);
  const ranking=players
    .filter(p=>pr[p.id]?.scoreA!=null)
    .map(p=>{const{pts}=calcPoints(sm,{...pr[p.id],_pid:p.id});return{name:p.name,pts,pid:p.id};})
    .sort((a,b)=>b.pts-a.pts);

  $('app').innerHTML=`
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted)">⚡ Match Spécial — Admin</div>
      <div style="font-size:19px;font-weight:900;margin:2px 0">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
      <div style="font-size:12px;color:${locked?'#f5c842':'#14c47d'}">${dateFr(sm.date,sm.time)} · ${locked?'🔒 Verrouillé':'⏳ Ouvert'}</div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="archBtn">📦 Archiver</button>
        <button class="btn btn-danger" id="delBtn">🗑 Supprimer</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="pronos">📋 Pronos</button>
      <button class="tab" data-tab="rank">🏆 Classement</button>
    </div>

    <!-- LIVE -->
    <div id="tab-live">
      <div class="card">
        <!-- Score 90min -->
        <div style="margin-bottom:14px">
          <label>Score 90min</label>
          <div class="row">
            <span style="font-weight:700;min-width:60px">${esc(sm.teamA)}</span>
            <input class="score-box" id="adSA" type="number" min="0" value="${sm.scoreA??''}">
            <span>-</span>
            <input class="score-box" id="adSB" type="number" min="0" value="${sm.scoreB??''}">
            <span style="font-weight:700;min-width:60px">${esc(sm.teamB)}</span>
            <button class="btn btn-gold" id="adSaveScore" style="padding:7px 14px">✓</button>
          </div>
          ${sm.scoreA!=null&&!sm.et90done&&sm.canET&&+sm.scoreA===+sm.scoreB?`
            <button class="btn btn-ghost" id="adFin90" style="margin-top:8px;width:100%;font-size:12px">Fin 90min → Prolongations</button>`:''}
        </div>

        ${sm.et90done&&!sm.etDone?`
        <div class="section et" style="margin-bottom:12px">
          <label style="color:rgba(100,160,255,.8)">🔵 Prolongations</label>
          <div class="row">
            <span style="font-weight:700;min-width:60px">${esc(sm.teamA)}</span>
            <input class="score-box" id="adETA" type="number" min="0" value="${sm.scoreAET??''}">
            <span>-</span>
            <input class="score-box" id="adETB" type="number" min="0" value="${sm.scoreBET??''}">
            <span style="font-weight:700;min-width:60px">${esc(sm.teamB)}</span>
            <button class="btn btn-gold" id="adSaveET" style="padding:7px 14px">✓</button>
          </div>
          ${sm.scoreAET!=null&&+sm.scoreAET===+sm.scoreBET?`
            <button class="btn btn-ghost" id="adFinET" style="margin-top:8px;width:100%;font-size:12px">Fin Prolongations → TAB</button>`:''}
        </div>`:''}

        ${sm.etDone?`
        <div class="section tab" style="margin-bottom:12px">
          <label style="color:rgba(245,200,66,.8)">🟡 Tirs au but</label>
          <div class="row">
            <span style="font-weight:700;min-width:60px">${esc(sm.teamA)}</span>
            <input class="score-box" id="adPA" type="number" min="0" value="${sm.penA??''}">
            <span>-</span>
            <input class="score-box" id="adPB" type="number" min="0" value="${sm.penB??''}">
            <span style="font-weight:700;min-width:60px">${esc(sm.teamB)}</span>
            <button class="btn btn-gold" id="adSavePen" style="padding:7px 14px">✓</button>
          </div>
        </div>`:''}

        <!-- Cartons + Penaltys -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
          <div><label>🟨 Jaunes</label><input type="number" min="0" id="adY" value="${sm.yellowA!=null?(+sm.yellowA||0)+(+sm.yellowB||0)||'':''}" style="padding:6px 8px;font-size:13px"></div>
          <div><label>🟥 Rouges</label><input type="number" min="0" id="adR" value="${sm.redA!=null?(+sm.redA||0)+(+sm.redB||0)||'':''}" style="padding:6px 8px;font-size:13px"></div>
          <div><label>🥅 Penaltys</label><input type="number" min="0" id="adPen" value="${sm.penalties??''}" style="padding:6px 8px;font-size:13px"></div>
        </div>
        <button class="btn btn-ghost" id="adSaveStats" style="width:100%;margin-bottom:14px;font-size:12px">💾 Sauvegarder cartons/penaltys</button>

        <!-- Buteurs admin (liste libre saisie par l'admin) -->
        <div style="margin-bottom:14px">
          <label>⚽ Buteurs officiels</label>
          <div id="scorerTags" style="margin-bottom:6px">${(sm.scorers||[]).map((s,i)=>`<span class="tag">${esc(s)}<button class="del" onclick="delScorer(${i})">×</button></span>`).join('')}</div>
          <div class="row">
            <input id="scorerInp" placeholder="Nom du buteur…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addScorer()}">
            <button class="btn btn-green" onclick="addScorer()" style="padding:8px 14px;white-space:nowrap">+ Ajouter</button>
          </div>
        </div>

        <!-- Faits marquants : admin valide par joueur -->
        <div class="section">
          <label style="color:var(--gold);margin-bottom:8px">⭐ Faits marquants pronostiqués</label>
          ${(()=>{
            const rv=sm.remarkValidations||{};
            const entries=players.filter(p=>pr[p.id]?.remark);
            if(!entries.length)return'<div style="font-size:12px;color:var(--muted)">Aucun fait marquant pronostiqué.</div>';
            return entries.map(p=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)">
              <input type="checkbox" ${rv[p.id]?'checked':''} onchange="toggleRemark('${p.id}',this.checked)" style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;cursor:pointer">
              <span style="font-size:13px"><b>${esc(p.name)}</b> : ${esc(pr[p.id].remark)}</span>
            </div>`).join('');
          })()}
        </div>
      </div>
    </div>

    <!-- PRONOS -->
    <div id="tab-pronos" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:12px">Pronos des ${players.length} joueurs</div>
        ${players.map(p=>{
          const r=pr[p.id];
          return`<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
            <b style="font-size:13px">${esc(p.name)}</b>
            ${r?.scoreA!=null?`<div style="font-size:12px;color:var(--muted);margin-top:3px">
              Score: <b style="color:#fff">${r.scoreA}-${r.scoreB}</b>
              ${r.scoreAET!=null?` · ET: ${r.scoreAET}-${r.scoreBET}`:''}
              ${r.penA!=null?` · TAB: ${r.penA}-${r.penB}`:''}
              ${r.yellowCards!=null?` · 🟨${r.yellowCards} 🟥${r.redCards||0} 🥅${r.penalties||0}`:''}
              ${r.scorers?.length?` · ⚽ ${r.scorers.join(', ')}`:''}
              ${r.remark?` · ⭐ <i>${esc(r.remark)}</i>`:''}
            </div>`:'<div style="font-size:12px;color:rgba(255,255,255,.3)">Pas de prono</div>'}
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- CLASSEMENT -->
    <div id="tab-rank" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:12px">🏆 Classement</div>
        ${ranking.map((r,i)=>`<div class="rank-row">
          <div class="row" style="gap:8px"><span class="medal">${['🥇','🥈','🥉'][i]||i+1+'.'}</span><span style="font-size:13px;font-weight:700">${esc(r.name)}</span></div>
          <span style="font-size:16px;font-weight:900;color:var(--gold)">${r.pts}pts</span>
        </div>`).join('')||'<div style="color:var(--muted);font-size:13px">Aucun prono enregistré.</div>'}
      </div>
    </div>`;

  // Tabs
  $('app').querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      $('app').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['live','pronos','rank'].forEach(id=>{const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';});
    };
  });

  // Score 90min
  $('adSaveScore')?.addEventListener('click',async()=>{
    const sA=v($('adSA')),sB=v($('adSB'));
    if(sA===null||sB===null){toast('Entre les deux scores');return;}
    await fbPatch('specialMatch',{scoreA:sA,scoreB:sB});
    _sm={..._sm,scoreA:sA,scoreB:sB};toast('✅ Score sauvegardé');render();
  });
  $('adFin90')?.addEventListener('click',async()=>{
    await fbPatch('specialMatch',{et90done:true});
    _sm={..._sm,et90done:true};render();
  });

  // Prolongations
  $('adSaveET')?.addEventListener('click',async()=>{
    const eA=v($('adETA')),eB=v($('adETB'));
    if(eA===null||eB===null){toast('Entre le score ET');return;}
    await fbPatch('specialMatch',{scoreAET:eA,scoreBET:eB});
    _sm={..._sm,scoreAET:eA,scoreBET:eB};toast('✅ Prolongations sauvegardées');render();
  });
  $('adFinET')?.addEventListener('click',async()=>{
    await fbPatch('specialMatch',{etDone:true});
    _sm={..._sm,etDone:true};render();
  });

  // TAB
  $('adSavePen')?.addEventListener('click',async()=>{
    const pA=v($('adPA')),pB=v($('adPB'));
    if(pA===null||pB===null){toast('Entre le TAB');return;}
    if(pA===pB){toast('⚠️ Le TAB ne peut pas être nul !');return;}
    await fbPatch('specialMatch',{penA:pA,penB:pB});
    _sm={..._sm,penA:pA,penB:pB};toast('✅ TAB sauvegardé');render();
  });

  // Cartons
  $('adSaveStats')?.addEventListener('click',async()=>{
    const y=v($('adY')),r=v($('adR')),p=v($('adPen'));
    await fbPatch('specialMatch',{yellowA:y,yellowB:0,redA:r,redB:0,penalties:p});
    _sm={..._sm,yellowA:y,yellowB:0,redA:r,redB:0,penalties:p};toast('✅ Stats sauvegardées');
  });

  // Archiver
  $('archBtn')?.addEventListener('click',async()=>{
    if(!confirm('Archiver ce match dans les profils joueurs ? Le match reste actif.'))return;
    await archiveMatch();
    toast('✅ Archivé !');
  });

  // Supprimer
  $('delBtn')?.addEventListener('click',async()=>{
    if(!confirm(`Supprimer "${_sm.teamA} vs ${_sm.teamB}" ?\nLes résultats seront archivés avant suppression.`))return;
    if(!confirm('Confirmation finale — supprimer définitivement ?'))return;
    await archiveMatch();
    await fbDel('specialMatch');
    await fbDel('specialPronos');
    _sm=null;_pronos={};toast('✅ Archivé et supprimé');render();
  });
}

// Buteurs admin
const _adScorers=()=>(_sm?.scorers||[]);
window.addScorer=async function(){
  const inp=$('scorerInp');if(!inp)return;
  const name=inp.value.trim();if(!name)return;
  const list=[..._adScorers(),name];
  await fbPatch('specialMatch',{scorers:list});
  _sm={..._sm,scorers:list};inp.value='';
  renderScorerTags();inp.focus();
};
window.delScorer=async function(i){
  const list=_adScorers().filter((_,idx)=>idx!==i);
  await fbPatch('specialMatch',{scorers:list});
  _sm={..._sm,scorers:list};renderScorerTags();
};
function renderScorerTags(){
  const el=$('scorerTags');if(!el)return;
  el.innerHTML=(_sm?.scorers||[]).map((s,i)=>`<span class="tag">${esc(s)}<button class="del" onclick="delScorer(${i})">×</button></span>`).join('');
}
window.toggleRemark=async function(pid,val){
  const rv={...(_sm.remarkValidations||{}),[pid]:val};
  await fbPatch('specialMatch',{remarkValidations:rv});
  _sm={..._sm,remarkValidations:rv};toast(val?'✅ Validé':'Invalidé');
};

// Archivage
async function archiveMatch(){
  const sm2=_sm,pr2=_pronos;
  const ts=Date.now();
  const players=Object.values(_players);
  const ranking=players
    .filter(p=>pr2[p.id]?.scoreA!=null)
    .map(p=>{const{pts}=calcPoints(sm2,{...pr2[p.id],_pid:p.id});return{pid:p.id,name:p.name,pts};})
    .sort((a,b)=>b.pts-a.pts);
  await Promise.all(ranking.map((r,i)=>fbSet(`history/${r.pid}/special_${ts}`,{
    competition:'special',label:`${sm2.teamA} vs ${sm2.teamB}`,
    date:new Date().toISOString().slice(0,10),
    rank:i+1,totalPlayers:ranking.length,totalScore:r.pts,
    teamA:sm2.teamA,teamB:sm2.teamB,
    scoreA:sm2.scoreA,scoreB:sm2.scoreB,
    prono:pr2[r.pid]||{}
  })));
}

// ══════════════════════════════════════════════
// JOUEUR
// ══════════════════════════════════════════════
function renderPlayer(){
  const sm=_sm,sess=_sess;
  const locked=isLocked(sm),started=isStarted(sm);
  const myPr=_pronos[sess.pid]||{};
  const{pts,detail}=calcPoints(sm,{...myPr,_pid:sess.pid});

  // Classement
  const players=Object.values(_players);
  const ranking=players
    .filter(p=>_pronos[p.id]?.scoreA!=null)
    .map(p=>{const{pts:p2}=calcPoints(sm,{...(_pronos[p.id]),_pid:p.id});return{name:p.name,pts:p2,pid:p.id};})
    .sort((a,b)=>b.pts-a.pts);
  const myRank=ranking.findIndex(r=>r.pid===sess.pid)+1;

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:36px;margin-bottom:6px">⚡</div>
      <div style="font-size:18px;font-weight:900">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
      <div style="font-size:12px;margin-top:4px;color:${locked?'#f5c842':'#14c47d'}">
        ${locked?`🔒 Verrouillé — ${dateFr(sm.date,sm.time)}`:`⏳ Ouvert jusqu'à H-5min (${dateFr(sm.date,sm.time)})`}
      </div>
      ${pts>0||myRank>0?`<div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:16px">
        ${pts>0?`<span style="font-size:22px;font-weight:900;color:var(--gold)">${pts} pts</span>`:''}
        ${myRank>0?`<span style="font-size:13px;color:var(--muted)">${myRank===1?'🥇':myRank===2?'🥈':myRank===3?'🥉':''}${myRank}/${ranking.length}</span>`:''}
      </div>`:''}
    </div>

    <div class="tab-bar">
      ${!locked?`<button class="tab active" data-tab="prono">🎯 Mon prono</button>`:''}
      <button class="tab ${locked?'active':''}" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="rank">🏆 Classement</button>
    </div>

    <!-- PRONO -->
    ${!locked?`<div id="tab-prono">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">Ton pronostic</div>

        <!-- Score 90min -->
        <div style="margin-bottom:14px">
          <label>Score (90 min)</label>
          <div class="row">
            <span style="font-weight:700;min-width:55px">${esc(sm.teamA)}</span>
            <input class="score-box" id="pSA" type="number" min="0" value="${myPr.scoreA??''}">
            <span>-</span>
            <input class="score-box" id="pSB" type="number" min="0" value="${myPr.scoreB??''}">
            <span style="font-weight:700;min-width:55px">${esc(sm.teamB)}</span>
          </div>
        </div>

        ${sm.canET?`
        <div class="section et" style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:rgba(100,160,255,.8);margin-bottom:8px">🔵 Prolongations <span style="font-weight:400;opacity:.6">(si nul à 90min)</span></div>
          <div class="row" style="margin-bottom:10px">
            <span style="font-size:12px;min-width:55px">${esc(sm.teamA)}</span>
            <input class="score-box" id="pETA" type="number" min="0" value="${myPr.scoreAET??''}">
            <span>-</span>
            <input class="score-box" id="pETB" type="number" min="0" value="${myPr.scoreBET??''}">
            <span style="font-size:12px;min-width:55px">${esc(sm.teamB)}</span>
          </div>
          <div style="font-size:11px;font-weight:700;color:rgba(245,200,66,.8);margin-bottom:8px">🟡 TAB <span style="font-weight:400;opacity:.6">(si nul en prolong.)</span></div>
          <div class="row">
            <span style="font-size:12px;min-width:55px">${esc(sm.teamA)}</span>
            <input class="score-box" id="pPA" type="number" min="0" value="${myPr.penA??''}">
            <span>-</span>
            <input class="score-box" id="pPB" type="number" min="0" value="${myPr.penB??''}">
            <span style="font-size:12px;min-width:55px">${esc(sm.teamB)}</span>
          </div>
        </div>`:''}

        <!-- Cartons -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
          <div><label>🟨 Jaunes</label><input type="number" min="0" id="pY" value="${myPr.yellowCards??''}" style="padding:7px;font-size:13px"></div>
          <div><label>🟥 Rouges</label><input type="number" min="0" id="pR" value="${myPr.redCards??''}" style="padding:7px;font-size:13px"></div>
          <div><label>🥅 Penaltys</label><input type="number" min="0" id="pPen" value="${myPr.penalties??''}" style="padding:7px;font-size:13px"></div>
        </div>

        <!-- Buteurs -->
        <div style="margin-bottom:12px">
          <label>⚽ Buteurs (un par un)</label>
          <div id="pScorerTags" style="margin-bottom:6px">${(myPr.scorers||[]).map((s,i)=>`<span class="tag">${esc(s)}<button class="del" onclick="pDelScorer(${i})">×</button></span>`).join('')}</div>
          <div class="row">
            <input id="pScorerInp" placeholder="Nom du buteur…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();pAddScorer()}">
            <button class="btn btn-green" onclick="pAddScorer()" style="padding:8px 14px;white-space:nowrap">+ Ajouter</button>
          </div>
        </div>

        <!-- Fait marquant -->
        <div class="section" style="margin-bottom:14px">
          <label style="color:var(--gold);margin-bottom:6px">⭐ Fait marquant</label>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Note quelque chose qui pourrait se passer (penalty, but contre son camp, expulsion…)</div>
          <input id="pRemark" placeholder="Ex: Il y aura un penalty…" value="${esc(myPr.remark||'')}">
        </div>

        <button class="btn btn-gold" id="pSave" style="width:100%;font-size:14px">💾 Enregistrer mon prono</button>
      </div>
    </div>`:''}

    <!-- LIVE -->
    <div id="tab-live" style="display:${locked?'block':'none'}">
      <div class="card">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px">
          ${sm.scoreA!=null?'<span class="live-dot"></span>':''}
          <span style="font-size:13px;font-weight:800">Score en direct</span>
        </div>
        <div style="text-align:center;font-size:54px;font-weight:900;letter-spacing:5px;margin:8px 0">
          ${sm.scoreA!=null?`${sm.scoreA}-${sm.scoreB}`:'—'}
        </div>
        ${sm.et90done&&sm.scoreAET!=null?`<div style="text-align:center;font-size:15px;color:rgba(100,160,255,.9);margin-top:4px">Prolong. : ${sm.scoreAET}-${sm.scoreBET}</div>`:''}
        ${sm.etDone&&sm.penA!=null?`<div style="text-align:center;font-size:14px;color:var(--gold);margin-top:4px">TAB : ${sm.penA}-${sm.penB}</div>`:''}
        ${sm.yellowA!=null?`<div style="display:flex;justify-content:center;gap:16px;margin:10px 0;font-size:13px;color:var(--muted)">
          <span>🟨 ${(+sm.yellowA||0)+(+sm.yellowB||0)}</span>
          <span>🟥 ${(+sm.redA||0)+(+sm.redB||0)}</span>
          ${sm.penalties!=null?`<span>🥅 ${sm.penalties}</span>`:''}
        </div>`:''}
        ${sm.scorers?.length?`<div style="margin-top:8px">${sm.scorers.map(s=>`<span class="tag">⚽ ${esc(s)}</span>`).join('')}</div>`:''}
        ${myPr.scoreA!=null?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)">
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px">MON PRONO → ${myPr.scoreA}-${myPr.scoreB}</div>
          ${detail.map(d=>`<div style="font-size:12px;color:${d.c};margin-bottom:3px">${d.i} ${d.t} <b>+${d.p}pt${d.p>1?'s':''}</b></div>`).join('')}
          ${pts>0?`<div style="font-size:16px;font-weight:900;color:var(--gold);margin-top:8px">Total : ${pts} pts</div>`:''}
        </div>`:''}
      </div>
    </div>

    <!-- CLASSEMENT -->
    <div id="tab-rank" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:12px">🏆 Classement en direct</div>
        ${ranking.map((r,i)=>`<div class="rank-row${r.pid===sess.pid?' me':''}">
          <div class="row" style="gap:8px">
            <span class="medal">${['🥇','🥈','🥉'][i]||i+1+'.'}</span>
            <span style="font-size:13px;font-weight:700">${esc(r.name)}${r.pid===sess.pid?' 👤':''}</span>
          </div>
          <span style="font-size:15px;font-weight:900;color:var(--gold)">${r.pts}pts</span>
        </div>`).join('')||`<div style="color:var(--muted);font-size:13px">Aucun prono enregistré.</div>`}
        ${!started?`<div style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center">Les détails des pronos seront visibles au coup d'envoi</div>`:''}
      </div>
    </div>`;

  // Tabs
  $('app').querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      $('app').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['prono','live','rank'].forEach(id=>{const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';});
    };
  });

  // Buteurs joueur
  let _pScorers=[...(myPr.scorers||[])];
  function renderPScorerTags(){
    const el=$('pScorerTags');if(!el)return;
    el.innerHTML=_pScorers.map((s,i)=>`<span class="tag">${esc(s)}<button class="del" onclick="pDelScorer(${i})">×</button></span>`).join('');
  }
  window.pAddScorer=function(){
    const inp=$('pScorerInp');if(!inp)return;
    const name=inp.value.trim();if(!name)return;
    _pScorers.push(name);inp.value='';renderPScorerTags();inp.focus();
  };
  window.pDelScorer=function(i){_pScorers.splice(i,1);renderPScorerTags();};

  // ET/TAB lock
  function updateLock(){
    const sA=v($('pSA')),sB=v($('pSB'));
    const nonNul90=sA!=null&&sB!=null&&sA!==sB;
    [$('pETA'),$('pETB')].forEach(el=>{
      if(!el)return;el.disabled=nonNul90;el.style.opacity=nonNul90?'0.35':'1';
      if(nonNul90)el.value='';
    });
    const eA=v($('pETA')),eB=v($('pETB'));
    const noTab=nonNul90||(eA!=null&&eB!=null&&eA!==eB);
    [$('pPA'),$('pPB')].forEach(el=>{
      if(!el)return;el.disabled=noTab;el.style.opacity=noTab?'0.35':'1';
      if(noTab)el.value='';
    });
  }
  ['pSA','pSB'].forEach(id=>$(id)?.addEventListener('input',updateLock));
  ['pETA','pETB'].forEach(id=>$(id)?.addEventListener('input',updateLock));
  setTimeout(updateLock,50);

  // Sauvegarder
  $('pSave')?.addEventListener('click',async()=>{
    const sA=v($('pSA')),sB=v($('pSB'));
    if(sA===null||sB===null){toast('Entre au moins le score');return;}
    const prono={scoreA:sA,scoreB:sB,_pid:sess.pid};
    // ET/TAB
    if(sm.canET&&sA===sB){
      const eA=v($('pETA')),eB=v($('pETB'));
      if(eA!==null&&eB!==null){
        if(eA<sA||eB<sB){toast('⚠️ Score ET ne peut pas être inférieur au 90min');return;}
        prono.scoreAET=eA;prono.scoreBET=eB;
        if(eA===eB){
          const pA=v($('pPA')),pB=v($('pPB'));
          if(pA!==null&&pB!==null){
            if(pA===pB){toast('⚠️ Le TAB ne peut pas être nul !');return;}
            prono.penA=pA;prono.penB=pB;
          }
        }
      }
    }
    const y=v($('pY')),r=v($('pR')),p=v($('pPen'));
    if(y!=null)prono.yellowCards=y;if(r!=null)prono.redCards=r;if(p!=null)prono.penalties=p;
    if(_pScorers.length)prono.scorers=_pScorers;
    const rem=($('pRemark')?.value||'').trim();if(rem)prono.remark=rem;
    await fbSet(`specialPronos/${sess.pid}`,prono);
    _pronos[sess.pid]=prono;
    const btn=$('pSave');
    if(btn){btn.textContent='✅ Prono enregistré !';btn.style.background='linear-gradient(135deg,#14c47d,#0a9d65)';
      setTimeout(()=>{btn.textContent='💾 Enregistrer mon prono';btn.style.background='';},2500);}
    toast('✅ Prono enregistré !');
  });
}

function renderEmpty(){
  $('app').innerHTML=`<div style="text-align:center;padding:60px 20px">
    <div style="font-size:52px;margin-bottom:12px">⚡</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:8px">Match Spécial</div>
    <div style="color:var(--muted);font-size:14px">Aucun match pour le moment.</div>
  </div>`;
}

// ── Polling ──
function startPoll(){
  if(_timer)clearInterval(_timer);
  _timer=setInterval(async()=>{
    try{
      const[sm,pronos]=await Promise.all([fbGet('specialMatch'),fbGet('specialPronos')]);
      const changed=JSON.stringify({sm,pronos})!==JSON.stringify({sm:_sm,pronos:_pronos});
      if(changed){
        _sm=sm;_pronos=pronos||{};
        const focused=document.activeElement;
        const typing=focused&&['INPUT','TEXTAREA'].includes(focused.tagName);
        if(!typing)render();
      }
    }catch(e){}
  },6000);
}
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Match Spécial — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--gold:#f5c842;--red:#e53935;--shadow:0 8px 32px rgba(0,0,0,.4);--radius:16px}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,'Segoe UI Emoji',system-ui,sans-serif;color:var(--text);min-height:100vh;background:var(--bg);
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(245,200,66,.12) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(20,196,125,.1) 0%,transparent 55%);}
    input[type="date"],input[type="time"]{width:100%;min-width:0;box-sizing:border-box}
    input,select,textarea{width:100%;padding:9px 13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:rgba(245,200,66,.5)}
    select option{background:#0d1628}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
    button.primary{background:linear-gradient(135deg,#f5c842,#d4a017);border:none;border-radius:12px;color:#0a0e1a;font-size:14px;font-weight:800;cursor:pointer;padding:11px 20px;transition:opacity .15s}
    button.primary:hover{opacity:.85}
    button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--text);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;padding:8px 16px}
    button.danger{background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#ff6b6b;border-radius:10px;font-size:13px;cursor:pointer;padding:7px 14px}
    .card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:18px;margin-bottom:12px}
    .tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
    .tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
    .tab.active{background:rgba(245,200,66,.2);border-color:rgba(245,200,66,.5);color:var(--gold)}
    .score-box{width:52px;text-align:center;font-size:18px;font-weight:800;padding:8px 4px!important}
    .badge{display:inline-block;font-size:10px;border-radius:999px;padding:3px 9px;font-weight:700;border:1px solid}
    .tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;margin:2px}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:12px;left:12px;z-index:8888;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}
    .prono-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .prono-row:last-child{border-bottom:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .live-dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-right:4px;animation:pulse 1.5s infinite}
  </style>
</head>
<body>
<button id="portalBtn" onclick="window.location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:560px;margin:0 auto;padding:56px 16px 40px"></div>
<div id="toast"></div>
<script>
// ══════════════════════════════════════════════
// MATCH SPÉCIAL — Le Super Site du Zuc
// ══════════════════════════════════════════════
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _tt;
const toast=msg=>{const el=$('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2600);};
function getSession(){try{return JSON.parse(sessionStorage.getItem('cdm2026session'));}catch(e){return null;}}
function clearSession(){try{sessionStorage.removeItem('cdm2026session');}catch(e){}}

// ── Firebase ──────────────────────────────────
async function fbGet(){try{const r=await fetch(`${FB}/specialMatch.json`,{cache:'no-store'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
async function fbGetPronos(){try{const r=await fetch(`${FB}/specialPronos.json`,{cache:'no-store'});if(!r.ok)return{};return await r.json()||{};}catch(e){return{};}}
async function fbPatchMatch(data){try{const r=await fetch(`${FB}/specialMatch.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.ok;}catch(e){return false;}}
async function fbPatchProno(pid,data){try{const r=await fetch(`${FB}/specialPronos/${pid}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.ok;}catch(e){return false;}}
async function fbGetPlayers(){try{const r=await fetch(`${FB}/players.json`,{cache:'no-store'});if(!r.ok)return{};return await r.json()||{};}catch(e){return{};}}

// ── Utils ─────────────────────────────────────
function isLocked(sm){
  if(!sm?.date||!sm?.time)return false;
  const lock=new Date(sm.date+'T'+sm.time+':00');
  return new Date()>=new Date(lock.getTime()-5*60000); // H-5min
}
function isVisible(sm){
  if(!sm?.date||!sm?.time)return false;
  return new Date()>=new Date(sm.date+'T'+sm.time+':00');
}
function v(el){if(!el||el.value==='')return null;const n=Number(el.value);return isNaN(n)?null:n;}
function outcome(a,b){return a>b?'A':a<b?'B':'N';}
function dateFr(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}catch(e){return d;}}

// ── Calcul points ─────────────────────────────
function calcPoints(sm,prono){
  if(!sm||!prono||prono.scoreA==null)return{total:0,detail:[]};
  const mA=sm.scoreA,mB=sm.scoreB;
  if(mA==null)return{total:0,detail:[]};
  const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
  let total=0;const detail=[];

  // Score 90min
  if(pA===mA&&pB===mB){total+=3;detail.push({icon:'⚽',text:`Score exact ${pA}-${pB}`,pts:3,color:'#14c47d'});}
  else if(outcome(pA,pB)===outcome(mA,mB)){total+=1;detail.push({icon:'⚽',text:'Bon résultat',pts:1,color:'#4de8a8'});}
  else detail.push({icon:'⚽',text:'Score raté',pts:0,color:'rgba(252,129,129,.7)'});

  // ET
  if(sm.canET&&sm.scoreAET!=null&&prono.scoreAET!=null&&pA===pB){
    const pEA=Number(prono.scoreAET),pEB=Number(prono.scoreBET||0);
    const mEA=Number(sm.scoreAET),mEB=Number(sm.scoreBET||0);
    if(pEA===mEA&&pEB===mEB){total+=3;detail.push({icon:'🔵',text:`Prolong. exact ${pEA}-${pEB}`,pts:3,color:'rgba(100,160,255,.9)'});}
    else{total+=1;detail.push({icon:'🔵',text:'Prolong. prévu',pts:1,color:'rgba(100,160,255,.7)'});}
  }

  // TAB
  if(sm.canET&&sm.penA!=null&&prono.penA!=null&&prono.scoreAET!=null&&Number(prono.scoreAET)===Number(prono.scoreBET)){
    const pPA=Number(prono.penA),pPB=Number(prono.penB||0);
    const mPA=Number(sm.penA),mPB=Number(sm.penB||0);
    if(pPA===mPA&&pPB===mPB){total+=3;detail.push({icon:'🟡',text:`TAB exact ${pPA}-${pPB}`,pts:3,color:'rgba(245,200,66,.9)'});}
    else{total+=1;detail.push({icon:'🟡',text:'TAB prévu',pts:1,color:'rgba(245,200,66,.7)'});}
  }

  // Cartons jaunes
  if(sm.yellowA!=null&&prono.yellowCards!=null){
    const total_yellow=(sm.yellowA||0)+(sm.yellowB||0);
    if(Number(prono.yellowCards)===total_yellow){total+=1;detail.push({icon:'🟨',text:`Cartons jaunes exact (${total_yellow})`,pts:1,color:'var(--gold)'});}
  }

  // Cartons rouges
  if(sm.redA!=null&&prono.redCards!=null){
    const total_red=(sm.redA||0)+(sm.redB||0);
    if(Number(prono.redCards)===total_red){total+=1;detail.push({icon:'🟥',text:`Cartons rouges exact (${total_red})`,pts:1,color:'#ff6b6b'});}
  }

  // Penaltys
  if(sm.penalties!=null&&prono.penalties!=null){
    if(Number(prono.penalties)===Number(sm.penalties)){total+=1;detail.push({icon:'🥅',text:`Penaltys exact (${sm.penalties})`,pts:1,color:'rgba(255,255,255,.7)'});}
  }

  // Buteurs
  if(sm.scorers&&prono.scorersA!=null){
    const allScorers=[...(sm.scorers.A||[]),...(sm.scorers.B||[])].map(s=>s.toLowerCase().trim());
    const pronoScorers=[...(prono.scorersA||[]),...(prono.scorersB||[])].map(s=>s.toLowerCase().trim()).filter(Boolean);
    let scorerPts=0;
    pronoScorers.forEach(ps=>{if(allScorers.includes(ps))scorerPts++;});
    if(scorerPts>0){total+=scorerPts;detail.push({icon:'⚽',text:`${scorerPts} buteur${scorerPts>1?'s':''} correct${scorerPts>1?'s':''}`,pts:scorerPts,color:'#14c47d'});}
  }

  // Fait marquant : validation individuelle par l'admin
  if(sm.remark&&prono.remark&&sm.remarkValidations){
    const pid=prono._pid;
    if(pid&&sm.remarkValidations[pid]===true){
      total+=1;detail.push({icon:'⭐',text:'Fait marquant validé',pts:1,color:'var(--gold)'});
    }
  }

  return{total,detail};
}

// ── État global ───────────────────────────────
let _sm=null,_pronos={},_session=null,_players={},_pollTimer=null;

function render(){
  const isAdmin=_session?.role==='admin';
  if(!_sm?.teamA){
    isAdmin?renderAdminSetup():renderNoMatch();
    return;
  }
  if(isAdmin)renderAdmin();
  else renderPlayer();
}

// ── VUE ADMIN : SETUP ─────────────────────────
function renderAdminSetup(){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:44px;margin-bottom:8px">⚡</div>
      <div style="font-size:20px;font-weight:900">Match Spécial</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Administration</div>
    </div>
    <div class="card">
      <h2 style="font-size:15px;font-weight:800;margin:0 0 16px">Créer un match</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">
        <div style="flex:1;min-width:140px"><label>Équipe A</label><input id="smTeamA" placeholder="Ex: France"></div>
        <div style="flex:1;min-width:140px"><label>Équipe B</label><input id="smTeamB" placeholder="Ex: Brésil"></div>
      </div>
      <div style="margin-bottom:12px"><label>Date</label><input id="smDate" type="text" placeholder="JJ/MM/AAAA" inputmode="numeric"></div>
      <div style="margin-bottom:12px"><label>Heure coup d'envoi (Paris)</label><input id="smTime" type="text" placeholder="21:00" value="21:00" inputmode="numeric"></div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;text-transform:none;letter-spacing:0;cursor:pointer">
        <input type="checkbox" id="smCanET" style="width:auto;accent-color:var(--gold)"> Prolongations/TAB possibles
      </label>
      <button class="primary" id="smCreateBtn" style="width:100%">⚡ Créer le match</button>
    </div>`;

  $('smCreateBtn').addEventListener('click',async()=>{
    const tA=($('smTeamA')?.value||'').trim();
    const tB=($('smTeamB')?.value||'').trim();
    const dateRaw=($('smDate')?.value||'').trim();
    const timeRaw=($('smTime')?.value||'').trim();
    const date=parseDateFR(dateRaw)||dateRaw;
    const time=parseTime(timeRaw)||timeRaw;
    if(!tA||!tB||!date||!time||date.length<8){toast('Format date: JJ/MM/AAAA · heure: 21:00');return;}
    const sm={teamA:tA,teamB:tB,date,time,canET:!!$('smCanET')?.checked,
      remark:($('smRemark')?.value||'').trim()||null,
      scoreA:null,scoreB:null,scoreAET:null,scoreBET:null,penA:null,penB:null,
      yellowA:null,yellowB:null,redA:null,redB:null,penalties:null,
      scorers:{A:[],B:[]},remarkAnswer:null,remarkValidated:false,finished:false};
    const ok=await fbPatchMatch(sm);
    if(ok){_sm=sm;toast('✅ Match créé !');render();}
    else toast('❌ Erreur Firebase');
  });
}

// ── VUE ADMIN : MATCH EN COURS ────────────────
function renderAdmin(){
  const sm=_sm;
  const pronos=_pronos;
  const players=Object.values(_players).filter(p=>p.competitionIds?.includes('special')||p.groupIds?.includes('matchunique'));
  const locked=isLocked(sm);
  const visible=isVisible(sm);

  // Classement
  const scores=players.map(p=>{
    const pr=pronos[p.id]||{};
    const{total,detail}=calcPoints(sm,pr);
    return{pid:p.id,name:p.name,total,detail,prono:pr};
  }).sort((a,b)=>b.total-a.total);

  $('app').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:11px;color:var(--muted)">⚡ Match Spécial — Admin</div>
        <div style="font-size:18px;font-weight:900">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${dateFr(sm.date)} ${sm.time} · ${locked?'<span style="color:#f5c842">🔒 Verrouillé</span>':'<span style="color:#14c47d">⏳ Ouvert</span>'}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${!sm.finished?`<button class="danger" id="smFinishBtn">🏁 Terminer</button>`:''}
        <button class="danger" id="smDeleteBtn">🗑 Supprimer</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="pronos">📋 Pronos</button>
      <button class="tab" data-tab="classement">🏆 Classement</button>
    </div>

    <!-- TAB LIVE -->
    <div id="tab-live">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">Saisie des résultats en direct</div>

        <!-- Score 90min -->
        <div style="margin-bottom:14px">
          <label>Score 90min</label>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:700;min-width:70px">${esc(sm.teamA)}</span>
            <input class="score-box" id="adScoreA" type="number" min="0" value="${sm.scoreA??''}">
            <span style="font-weight:700">-</span>
            <input class="score-box" id="adScoreB" type="number" min="0" value="${sm.scoreB??''}">
            <span style="font-size:13px;font-weight:700;min-width:70px">${esc(sm.teamB)}</span>
            <button class="primary" id="adSaveScore" style="padding:8px 16px;font-size:13px">✓</button>
          </div>
        </div>

        ${sm.canET&&sm.scoreA!=null&&sm.scoreA===sm.scoreB?`
        <!-- Prolongations -->
        <div style="margin-bottom:12px">
          <label>Prolongations</label>
          <div style="display:flex;align-items:center;gap:8px">
            <input class="score-box" id="adETa" type="number" min="${sm.scoreA||0}" value="${sm.scoreAET??''}">
            <span>-</span>
            <input class="score-box" id="adETb" type="number" min="${sm.scoreB||0}" value="${sm.scoreBET??''}">
            <button class="primary" id="adSaveET" style="padding:8px 16px;font-size:13px">✓</button>
          </div>
        </div>`:''}

        ${sm.scoreAET!=null&&sm.scoreAET===sm.scoreBET?`
        <!-- TAB -->
        <div style="margin-bottom:12px">
          <label>Tirs au but</label>
          <div style="display:flex;align-items:center;gap:8px">
            <input class="score-box" id="adPenA" type="number" min="0" value="${sm.penA??''}">
            <span>-</span>
            <input class="score-box" id="adPenB" type="number" min="0" value="${sm.penB??''}">
            <button class="primary" id="adSavePen" style="padding:8px 16px;font-size:13px">✓</button>
          </div>
        </div>`:''}

        <!-- Cartons + Penaltys -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
          <div>
            <label>🟨 Jaunes</label>
            <input type="number" min="0" id="adYellow" value="${(sm.yellowA??0)+(sm.yellowB??0)||''}" style="padding:6px 8px;font-size:13px">
          </div>
          <div>
            <label>🟥 Rouges</label>
            <input type="number" min="0" id="adRed" value="${(sm.redA??0)+(sm.redB??0)||''}" style="padding:6px 8px;font-size:13px">
          </div>
          <div>
            <label>🥅 Penaltys</label>
            <input type="number" min="0" id="adPenCount" value="${sm.penalties??''}" style="padding:6px 8px;font-size:13px">
          </div>
        </div>
        <button class="secondary" id="adSaveStats" style="width:100%;margin-bottom:14px">💾 Sauvegarder cartons/penaltys</button>

        <!-- Buteurs -->
        <div style="margin-bottom:12px">
          <label>Buteurs ${esc(sm.teamA)}</label>
          <input id="adScorersA" placeholder="Noms séparés par virgule" value="${(sm.scorers?.A||[]).join(', ')}">
        </div>
        <div style="margin-bottom:12px">
          <label>Buteurs ${esc(sm.teamB)}</label>
          <input id="adScorersB" placeholder="Noms séparés par virgule" value="${(sm.scorers?.B||[]).join(', ')}">
        </div>
        <button class="secondary" id="adSaveScorers" style="width:100%;margin-bottom:14px">💾 Sauvegarder buteurs</button>


        <!-- Fait marquant : l'admin valide les pronostics libres des joueurs -->
        <div style="background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2);border-radius:10px;padding:12px">
          <div style="font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px">⭐ Faits marquants</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Coche si le fait s'est produit :</div>
          ${Object.entries(pronos).filter(([,pr])=>pr?.remark).length===0
            ?'<div style="font-size:12px;color:var(--muted)">Aucun fait marquant pronostiqué.</div>'
            :Object.entries(pronos).filter(([,pr])=>pr?.remark).map(([pid,pr])=>{
              const p=players.find(x=>x.id===pid);
              const validated=sm.remarkValidations?.[pid]===true;
              return'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">'+
                '<input type="checkbox" '+(validated?'checked':'')+' onchange="validateRemark(\''+pid+'\',this.checked)" style="width:18px;height:18px;accent-color:#14c47d;flex-shrink:0;cursor:pointer">'+
                '<span style="font-size:13px"><b>'+esc(p?.name||pid)+'</b> : '+esc(pr.remark)+'</span>'+
              '</div>';
            }).join('')}
        </div>
      </div>
    </div>

    <!-- TAB PRONOS -->
    <div id="tab-pronos" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">📋 Pronos des joueurs (${players.length})</div>
        ${players.map(p=>{
          const pr=pronos[p.id]||{};
          const hasProno=pr.scoreA!=null;
          return`<div class="prono-row">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:700;margin-bottom:4px">${esc(p.name)}</div>
              ${hasProno?`
                <div style="font-size:12px;color:var(--muted)">Score: <b style="color:#fff">${pr.scoreA}-${pr.scoreB}</b>
                  ${pr.scoreAET!=null?` · Prolong: ${pr.scoreAET}-${pr.scoreBET}`:''}
                  ${pr.penA!=null?` · TAB: ${pr.penA}-${pr.penB}`:''}
                </div>
                ${pr.yellowCards!=null?`<div style="font-size:11px;color:var(--muted)">🟨 ${pr.yellowCards} 🟥 ${pr.redCards||0} 🥅 ${pr.penalties||0} penaltys</div>`:''}
                ${(pr.scorersA?.length||pr.scorersB?.length)?`<div style="font-size:11px;color:var(--muted)">⚽ ${[...(pr.scorersA||[]),...(pr.scorersB||[])].join(', ')}</div>`:''}
                ${pr.remark?`<div style="font-size:11px;color:var(--gold)">⭐ ${esc(pr.remark)}</div>`:''}
              `:'<div style="font-size:12px;color:rgba(255,255,255,.3)">Pas de prono</div>'}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- TAB CLASSEMENT -->
    <div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">🏆 Classement</div>
        ${scores.map((s,i)=>`
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <div style="display:flex;align-items:center;gap:10px">
              <span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
              <span style="font-size:13px;font-weight:700">${esc(s.name)}</span>
            </div>
            <span style="font-size:16px;font-weight:900;color:var(--gold)">${s.total}pts</span>
          </div>`).join('')}
      </div>
    </div>`;

  // Tabs
  $('app').querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      $('app').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['live','pronos','classement'].forEach(id=>{
        const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';
      });
    });
  });

  // Handlers
  $('adSaveScore')?.addEventListener('click',async()=>{
    const sA=v($('adScoreA')),sB=v($('adScoreB'));
    if(sA===null||sB===null){toast('Entre les deux scores');return;}
    const ok=await fbPatchMatch({scoreA:sA,scoreB:sB});
    if(ok){_sm={..._sm,scoreA:sA,scoreB:sB};toast('✅ Score sauvegardé');render();}
  });
  $('adSaveET')?.addEventListener('click',async()=>{
    const eA=v($('adETa')),eB=v($('adETb'));
    if(eA===null||eB===null){toast('Entre le score ET');return;}
    const ok=await fbPatchMatch({scoreAET:eA,scoreBET:eB});
    if(ok){_sm={..._sm,scoreAET:eA,scoreBET:eB};toast('✅ ET sauvegardé');render();}
  });
  $('adSavePen')?.addEventListener('click',async()=>{
    const pA=v($('adPenA')),pB=v($('adPenB'));
    if(pA===null||pB===null||pA===pB){toast('TAB doivent être différents');return;}
    const ok=await fbPatchMatch({penA:pA,penB:pB});
    if(ok){_sm={..._sm,penA:pA,penB:pB};toast('✅ TAB sauvegardé');render();}
  });
  $('adSaveStats')?.addEventListener('click',async()=>{
    const yellow=v($('adYellow')),red=v($('adRed')),pen=v($('adPenCount'));
    // Stocker le total dans yellowA pour compatibilité calcul
    const ok=await fbPatchMatch({yellowA:yellow,yellowB:0,redA:red,redB:0,penalties:pen});
    if(ok){_sm={..._sm,yellowA:yellow,yellowB:0,redA:red,redB:0,penalties:pen};toast('✅ Stats sauvegardées');}
  });
  $('adSaveScorers')?.addEventListener('click',async()=>{
    const sA=($('adScorersA')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    const sB=($('adScorersB')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    const ok=await fbPatchMatch({scorers:{A:sA,B:sB}});
    if(ok){_sm={..._sm,scorers:{A:sA,B:sB}};toast('✅ Buteurs sauvegardés');}
  });
  // validateRemark est appelé inline depuis le HTML
  window.validateRemark=async function(pid,val){
    const validations={...(_sm.remarkValidations||{}),[pid]:val};
    const ok=await fbPatchMatch({remarkValidations:validations});
    if(ok){_sm={..._sm,remarkValidations:validations};toast(val?'✅ Validé':'Invalidé');}
    else toast('Erreur Firebase');
  };
  $('smFinishBtn')?.addEventListener('click',async()=>{
    if(!confirm('Marquer le match comme terminé ?'))return;
    await fbPatchMatch({finished:true});_sm={..._sm,finished:true};render();
  });
  $('smDeleteBtn')?.addEventListener('click',async()=>{
    if(!confirm('Supprimer ce match ? Les pronos seront effacés.'))return;
    await fetch(`${FB}/specialMatch.json`,{method:'DELETE'});
    await fetch(`${FB}/specialPronos.json`,{method:'DELETE'});
    _sm=null;_pronos={};render();
  });
}

// ── VUE JOUEUR ────────────────────────────────
function renderPlayer(){
  const sm=_sm;
  const session=_session;
  const locked=isLocked(sm);
  const visible=isVisible(sm);
  const myProno=_pronos[session.pid]||{};
  const{total,detail}=calcPoints(sm,myProno);

  if(!sm?.teamA){renderNoMatch();return;}

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:6px">⚡</div>
      <div style="font-size:19px;font-weight:900">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
      <div style="font-size:12px;margin-top:4px;color:${locked?'#f5c842':'#14c47d'}">
        ${locked?`🔒 Verrouillé depuis ${dateFr(sm.date)} ${sm.time}`:`⏳ Ouvert jusqu'à 5 min avant le coup d'envoi (${dateFr(sm.date)} ${sm.time})`}
      </div>
      ${total>0?`<div style="margin-top:8px;font-size:22px;font-weight:900;color:var(--gold)">${total} pts</div>`:''}
    </div>

    <div class="tab-bar">
      ${!locked?`<button class="tab active" data-tab="prono">🎯 Mon prono</button>`:''}
      <button class="tab ${locked?'active':''}" data-tab="live">📡 Live</button>
      ${visible?`<button class="tab" data-tab="classement">🏆 Classement</button>`:''}
    </div>

    <!-- TAB PRONO -->
    ${!locked?`<div id="tab-prono">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">Ton pronostic</div>

        <!-- Score -->
        <div style="margin-bottom:14px">
          <label>Score (90 min)</label>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:13px;font-weight:700;min-width:60px">${esc(sm.teamA)}</span>
            <input class="score-box" id="pScoreA" type="number" min="0" value="${myProno.scoreA??''}">
            <span style="font-weight:700">-</span>
            <input class="score-box" id="pScoreB" type="number" min="0" value="${myProno.scoreB??''}">
            <span style="font-size:13px;font-weight:700;min-width:60px">${esc(sm.teamB)}</span>
          </div>
        </div>

        ${sm.canET?`
        <div style="background:rgba(100,160,255,.08);border-radius:10px;padding:12px;margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:rgba(100,160,255,.8);margin-bottom:8px">SI NUL À 90MIN</div>
          <label>Prolongations</label>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <input class="score-box" id="pETa" type="number" min="0" value="${myProno.scoreAET??''}">
            <span>-</span>
            <input class="score-box" id="pETb" type="number" min="0" value="${myProno.scoreBET??''}">
          </div>
          <label>TAB (si nul en prolong.)</label>
          <div style="display:flex;align-items:center;gap:8px">
            <input class="score-box" id="pPenA" type="number" min="0" value="${myProno.penA??''}">
            <span>-</span>
            <input class="score-box" id="pPenB" type="number" min="0" value="${myProno.penB??''}">
          </div>
        </div>`:''}

        <!-- Cartons + Penaltys (totaux des deux équipes) -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
          <div>
            <label>🟨 Jaunes (total)</label>
            <input type="number" min="0" id="pYellow" value="${myProno.yellowCards??''}" style="padding:7px 10px;font-size:13px">
          </div>
          <div>
            <label>🟥 Rouges (total)</label>
            <input type="number" min="0" id="pRed" value="${myProno.redCards??''}" style="padding:7px 10px;font-size:13px">
          </div>
          <div>
            <label>🥅 Penaltys</label>
            <input type="number" min="0" id="pPen" value="${myProno.penalties??''}" style="padding:7px 10px;font-size:13px">
          </div>
        </div>

        <!-- Buteurs -->
        <div style="margin-bottom:12px">
          <label>Buteurs ${esc(sm.teamA)} (séparés par virgule)</label>
          <input id="pScorersA" placeholder="Ex: Mbappé, Giroud" value="${(myProno.scorersA||[]).join(', ')}">
        </div>
        <div style="margin-bottom:12px">
          <label>Buteurs ${esc(sm.teamB)} (séparés par virgule)</label>
          <input id="pScorersB" placeholder="Ex: Ronaldo" value="${(myProno.scorersB||[]).join(', ')}">
        </div>

        <!-- Fait marquant : texte libre du joueur -->
        <div style="background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2);border-radius:10px;padding:12px;margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:6px">⭐ FAIT MARQUANT</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Note quelque chose qui pourrait se passer pendant ce match (penalty, but contre son camp, expulsion…)</div>
          <input id="pRemark" placeholder="Ex: Il y aura un penalty, Mbappé marquera un doublé…" value="${esc(myProno.remark||'')}">
        </div>

        <button class="primary" id="pSaveBtn" style="width:100%">💾 Enregistrer mon prono</button>
      </div>
    </div>`:''}

    <!-- TAB LIVE -->
    <div id="tab-live" style="display:${locked?'block':'none'}">
      <div class="card">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px">
          ${sm.scoreA!=null?`<span class="live-dot"></span>`:''}
          <span style="font-size:13px;font-weight:800">Score en direct</span>
        </div>
        <div style="text-align:center;font-size:52px;font-weight:900;letter-spacing:4px;margin:12px 0">
          ${sm.scoreA!=null?`${sm.scoreA}-${sm.scoreB}`:'—'}
        </div>
        ${sm.scoreAET!=null?`<div style="text-align:center;font-size:15px;color:var(--muted)">Prolong: ${sm.scoreAET}-${sm.scoreBET}</div>`:''}
        ${sm.penA!=null?`<div style="text-align:center;font-size:14px;color:var(--gold)">TAB: ${sm.penA}-${sm.penB}</div>`:''}

        ${sm.yellowA!=null?`
        <div style="display:flex;justify-content:center;gap:16px;margin:10px 0;font-size:13px">
          <span>🟨 ${(sm.yellowA||0)+(sm.yellowB||0)} cartons jaunes</span>
          <span>🟥 ${(sm.redA||0)+(sm.redB||0)} rouges</span>
          ${sm.penalties!=null?`<span>🥅 ${sm.penalties} penalty${sm.penalties>1?'s':''}</span>`:''}
        </div>`:''}

        ${(sm.scorers?.A?.length||sm.scorers?.B?.length)?`
        <div style="margin-top:8px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">BUTEURS</div>
          ${(sm.scorers.A||[]).map(s=>`<span class="tag">⚽ ${esc(s)} <span style="color:var(--muted)">${esc(sm.teamA)}</span></span>`).join('')}
          ${(sm.scorers.B||[]).map(s=>`<span class="tag">⚽ ${esc(s)} <span style="color:var(--muted)">${esc(sm.teamB)}</span></span>`).join('')}
        </div>`:''}

        ${detail.length>0?`
        <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">MON SCORE</div>
          ${detail.map(d=>`<div style="font-size:12px;color:${d.color};margin-bottom:3px">${d.icon} ${d.text} → <b>+${d.pts}pt${d.pts>1?'s':''}</b></div>`).join('')}
          <div style="font-size:16px;font-weight:900;color:var(--gold);margin-top:8px">Total : ${total} pts</div>
        </div>`:''}

        <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--muted)">
          Mon prono : ${myProno.scoreA!=null?`${myProno.scoreA}-${myProno.scoreB}`:'Aucun'}
        </div>
      </div>
    </div>

    <!-- TAB CLASSEMENT (visible seulement après le coup d'envoi) -->
    ${visible?`<div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">🏆 Classement & Pronos</div>
        ${Object.values(_players).filter(p=>_pronos[p.id]?.scoreA!=null).map(p=>{
          const pr=_pronos[p.id];
          const{total}=calcPoints(sm,pr);
          const mine=p.id===session.pid;
          return{name:p.name,total,pr,mine};
        }).sort((a,b)=>b.total-a.total).map((s,i)=>`
          <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);${s.mine?'background:rgba(245,200,66,.06);border-radius:10px;padding:10px;margin:0 -4px;':''}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
              <div style="display:flex;align-items:center;gap:8px">
                <span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
                <span style="font-weight:700;font-size:13px">${esc(s.name)}${s.mine?' 👤':''}</span>
              </div>
              <span style="font-size:16px;font-weight:900;color:var(--gold)">${s.total}pts</span>
            </div>
            <div style="font-size:11px;color:var(--muted);padding-left:26px">
              Score: ${s.pr.scoreA}-${s.pr.scoreB}
              ${s.pr.scorersA?.length||s.pr.scorersB?.length?` · ⚽ ${[...(s.pr.scorersA||[]),...(s.pr.scorersB||[])].join(', ')}`:''}
              ${s.pr.remark?` · ⭐ ${esc(s.pr.remark)}`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`:''}`;

  // Tabs
  $('app').querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      $('app').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['prono','live','classement'].forEach(id=>{
        const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';
      });
    });
  });

  // Sauvegarder prono
  $('pSaveBtn')?.addEventListener('click',async()=>{
    const sA=v($('pScoreA')),sB=v($('pScoreB'));
    if(sA===null||sB===null){toast('Entre au moins le score.');return;}
    const prono={scoreA:sA,scoreB:sB};
    // ET/TAB
    if(sm.canET&&sA===sB){
      const eA=v($('pETa')),eB=v($('pETb'));
      if(eA!=null){prono.scoreAET=eA;prono.scoreBET=eB??eA;
        if(eA===eB){const pA=v($('pPenA')),pB=v($('pPenB'));if(pA!=null){prono.penA=pA;prono.penB=pB??pA;}}
      }
    }
    // Cartons/penaltys
    const yel=v($('pYellow')),red=v($('pRed')),pen=v($('pPen'));
    if(yel!=null)prono.yellowCards=yel;
    if(red!=null)prono.redCards=red;
    if(pen!=null)prono.penalties=pen;
    // Buteurs
    const sA2=($('pScorersA')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    const sB2=($('pScorersB')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(sA2.length)prono.scorersA=sA2;
    if(sB2.length)prono.scorersB=sB2;
    // Fait marquant
    const rem=($('pRemark')?.value||'').trim();
    if(rem)prono.remark=rem;

    prono._pid=session.pid;
    const ok=await fbPatchProno(session.pid,prono);
    if(ok){_pronos[session.pid]=prono;toast('✅ Prono enregistré !');render();}
    else toast('❌ Erreur de sauvegarde');
  });
}

function renderNoMatch(){
  $('app').innerHTML=`
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:52px;margin-bottom:12px">⚡</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">Match Spécial</div>
      <div style="color:var(--muted);font-size:14px">Aucun match pour le moment.<br>L'administrateur créera le prochain match.</div>
    </div>`;
}

// ── Polling ───────────────────────────────────
function startPolling(){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(async()=>{
    const[sm,pronos]=await Promise.all([fbGet(),fbGetPronos()]);
    const changed=JSON.stringify(sm)!==JSON.stringify(_sm)||JSON.stringify(pronos)!==JSON.stringify(_pronos);
    if(changed){_sm=sm;_pronos=pronos;render();}
  },6000);
}


// Convertir JJ/MM/AAAA → YYYY-MM-DD
function parseDateFR(s){
  const m=s.trim().match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);
  if(!m)return null;
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
// Normaliser heure HH:MM ou HHhMM
function parseTime(s){
  const m=s.trim().match(/^(\d{1,2})[h:](\d{2})$/i);
  if(!m)return null;
  return `${m[1].padStart(2,'0')}:${m[2]}`;
}

// ── Init ──────────────────────────────────────
(async function(){
  const session=getSession();
  if(!session){window.location.href='index.html';return;}
  _session=session;
  $('app').innerHTML='<div style="text-align:center;padding:80px;color:#7a95b8"><div style="font-size:32px;margin-bottom:12px">⚡</div><div>Chargement…</div></div>';
  const[sm,pronos,players]=await Promise.all([fbGet(),fbGetPronos(),fbGetPlayers()]);
  _sm=sm;_pronos=pronos;_players=players;
  render();
  startPolling();
})();
</script>

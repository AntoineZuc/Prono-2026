<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Match Spécial — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--gold:#f5c842;--red:#e53935;--radius:16px;--shadow:0 8px 32px rgba(0,0,0,.4)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,'Segoe UI Emoji',system-ui,sans-serif;color:var(--text);min-height:100vh;background:var(--bg);
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(245,200,66,.12) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(20,196,125,.1) 0%,transparent 55%);}
    input,select,textarea{width:100%;padding:9px 13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
    input:focus,select:focus{border-color:rgba(245,200,66,.5)}
    select option{background:#0d1628}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
    button.primary{background:linear-gradient(135deg,#f5c842,#d4a017);border:none;border-radius:12px;color:#0a0e1a;font-size:14px;font-weight:800;cursor:pointer;padding:11px 20px;transition:opacity .15s}
    button.primary:hover{opacity:.85}
    button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--text);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;padding:8px 16px}
    button.danger{background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#ff6b6b;border-radius:10px;font-size:13px;cursor:pointer;padding:7px 14px}
    .card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:18px;margin-bottom:12px}
    .tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
    .tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
    .tab.active{background:rgba(245,200,66,.2);border-color:rgba(245,200,66,.5);color:var(--gold)}
    .score-box{width:52px!important;text-align:center;font-size:18px!important;font-weight:800;padding:8px 4px!important}
    .tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;margin:2px}
    .section-box{border-radius:10px;padding:12px;margin-bottom:12px}
    .section-et{background:rgba(100,160,255,.08);border:1px solid rgba(100,160,255,.2)}
    .section-tab{background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2)}
    .section-remark{background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2)}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:12px;left:12px;z-index:8888;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .live-dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-right:4px;animation:pulse 1.5s infinite}
    input[disabled]{opacity:.4;cursor:not-allowed}
  </style>
</head>
<body>
<button id="portalBtn" onclick="window.location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:560px;margin:0 auto;padding:56px 16px 40px"></div>
<div id="toast"></div>
<script>
// ══════════════════════════════════════════════
// MATCH SPÉCIAL — Le Super Site du Zuc
// ══════════════════════════════════════════════
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _tt;
const toast=msg=>{const el=$('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2600);};
function getSession(){try{return JSON.parse(sessionStorage.getItem('cdm2026session'));}catch(e){return null;}}

// ── Firebase ──────────────────────────────────
async function fbGet(){try{const r=await fetch(`${FB}/specialMatch.json`,{cache:'no-store'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
async function fbGetPronos(){try{const r=await fetch(`${FB}/specialPronos.json`,{cache:'no-store'});if(!r.ok)return{};return await r.json()||{};}catch(e){return{};}}
async function fbGetPlayers(){try{const r=await fetch(`${FB}/players.json`,{cache:'no-store'});if(!r.ok)return{};return await r.json()||{};}catch(e){return{};}}
async function fbPatch(path,data){try{const r=await fetch(`${FB}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.ok;}catch(e){return false;}}
async function fbSet(path,data){try{const r=await fetch(`${FB}/${path}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.ok;}catch(e){return false;}}
async function fbDel(path){try{const r=await fetch(`${FB}/${path}.json`,{method:'DELETE'});return r.ok;}catch(e){return false;}}

// ── Utils ─────────────────────────────────────
function v(el){if(!el||el.value==='')return null;const n=Number(el.value);return isNaN(n)?null:n;}
function outcome(a,b){return a>b?'A':a<b?'B':'N';}
function dateFr(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}catch(e){return d;}}

// Verrouillage H-5min
function isLocked(sm){
  if(!sm?.date||!sm?.time)return false;
  const lock=new Date(sm.date+'T'+sm.time+':00');
  return new Date()>=new Date(lock.getTime()-5*60000);
}
// Visible (pronos autres joueurs) à l'heure du coup d'envoi
function isVisible(sm){
  if(!sm?.date||!sm?.time)return false;
  return new Date()>=new Date(sm.date+'T'+sm.time+':00');
}

// ── Calcul points ─────────────────────────────
function calcPoints(sm,prono){
  if(!sm||!prono||prono.scoreA==null)return{total:0,detail:[]};
  const mA=sm.scoreA,mB=sm.scoreB;
  if(mA==null)return{total:0,detail:[]};
  const pA=Number(prono.scoreA),pB=Number(prono.scoreB);
  let total=0;const detail=[];

  // Score 90min — 3pts exact / 1pt bon résultat
  if(pA===mA&&pB===mB){total+=3;detail.push({icon:'⚽',text:`Score exact ${pA}-${pB}`,pts:3,color:'#14c47d'});}
  else if(outcome(pA,pB)===outcome(Number(mA),Number(mB))){total+=1;detail.push({icon:'⚽',text:'Bon résultat',pts:1,color:'#4de8a8'});}
  else detail.push({icon:'⚽',text:'Score raté',pts:0,color:'rgba(252,129,129,.7)'});

  // Prolongations — seulement si joueur avait prévu nul à 90min
  if(sm.canET&&sm.scoreAET!=null&&prono.scoreAET!=null&&pA===pB){
    const pEA=Number(prono.scoreAET),pEB=Number(prono.scoreBET??0);
    const mEA=Number(sm.scoreAET),mEB=Number(sm.scoreBET??0);
    if(pEA===mEA&&pEB===mEB){total+=3;detail.push({icon:'🔵',text:`Prolong. exact ${pEA}-${pEB}`,pts:3,color:'rgba(100,160,255,.9)'});}
    else{total+=1;detail.push({icon:'🔵',text:'Prolong. prévu',pts:1,color:'rgba(100,160,255,.7)'});}
  }

  // TAB — seulement si joueur avait prévu nul en prolong.
  if(sm.canET&&sm.penA!=null&&prono.penA!=null&&pA===pB&&prono.scoreAET!=null&&Number(prono.scoreAET)===Number(prono.scoreBET??-1)){
    const pPA=Number(prono.penA),pPB=Number(prono.penB??0);
    const mPA=Number(sm.penA),mPB=Number(sm.penB??0);
    if(pPA===mPA&&pPB===mPB){total+=3;detail.push({icon:'🟡',text:`TAB exact ${pPA}-${pPB}`,pts:3,color:'rgba(245,200,66,.9)'});}
    else{total+=1;detail.push({icon:'🟡',text:'TAB prévu',pts:1,color:'rgba(245,200,66,.7)'});}
  }

  // Cartons jaunes — 1pt si total exact
  if(sm.yellowA!=null&&prono.yellowCards!=null){
    const tot=(Number(sm.yellowA)||0)+(Number(sm.yellowB)||0);
    if(Number(prono.yellowCards)===tot){total+=1;detail.push({icon:'🟨',text:`${tot} carton${tot>1?'s':''} jaune${tot>1?'s':''} exact`,pts:1,color:'var(--gold)'});}
  }

  // Cartons rouges — 1pt si total exact
  if(sm.redA!=null&&prono.redCards!=null){
    const tot=(Number(sm.redA)||0)+(Number(sm.redB)||0);
    if(Number(prono.redCards)===tot){total+=1;detail.push({icon:'🟥',text:`${tot} carton${tot>1?'s':''} rouge${tot>1?'s':''} exact`,pts:1,color:'#ff6b6b'});}
  }

  // Penaltys — 1pt si exact
  if(sm.penalties!=null&&prono.penalties!=null){
    if(Number(prono.penalties)===Number(sm.penalties)){total+=1;detail.push({icon:'🥅',text:`${sm.penalties} penalty exact`,pts:1,color:'rgba(255,255,255,.7)'});}
  }

  // Buteurs — 1pt par buteur validé par l'admin
  if(sm.scorerValidations&&prono.scorersA!=null){
    const all=[...(prono.scorersA||[]),...(prono.scorersB||[])];
    let scorerPts=0;
    all.forEach(s=>{if(s&&sm.scorerValidations[s.toLowerCase().trim()]===true)scorerPts++;});
    if(scorerPts>0){total+=scorerPts;detail.push({icon:'⚽',text:`${scorerPts} buteur${scorerPts>1?'s':''} validé${scorerPts>1?'s':''}`,pts:scorerPts,color:'#14c47d'});}
  }

  // Fait marquant — 1pt si validé par l'admin
  if(sm.remarkValidations&&prono.remark){
    const pid=prono._pid;
    if(pid&&sm.remarkValidations[pid]===true){total+=1;detail.push({icon:'⭐',text:'Fait marquant validé',pts:1,color:'var(--gold)'});}
  }

  return{total,detail};
}

// ── État global ───────────────────────────────
let _sm=null,_pronos={},_session=null,_players={},_pollTimer=null;

// ── INIT ──────────────────────────────────────
(async function(){
  const session=getSession();
  if(!session){window.location.href='index.html';return;}
  _session=session;
  $('app').innerHTML='<div style="text-align:center;padding:80px;color:#7a95b8"><div style="font-size:32px;margin-bottom:12px">⚡</div><div>Chargement…</div></div>';
  const[sm,pronos,players]=await Promise.all([fbGet(),fbGetPronos(),fbGetPlayers()]);
  _sm=sm;_pronos=pronos;_players=players;
  render();
  startPolling();
})();

function render(){
  if(!_sm?.teamA){
    _session.role==='admin'?renderAdminSetup():renderNoMatch();
    return;
  }
  _session.role==='admin'?renderAdmin():renderPlayer();
}

// ── SETUP ADMIN ───────────────────────────────
function renderAdminSetup(){
  // Vérifier que l'heure n'est pas passée ou dans moins de 30min
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:44px;margin-bottom:8px">⚡</div>
      <div style="font-size:20px;font-weight:900">Match Spécial</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Administration</div>
    </div>
    <div class="card">
      <h2 style="font-size:15px;font-weight:800;margin:0 0 16px">Créer un match</h2>
      <div style="margin-bottom:12px">
        <label>Équipe A</label><input id="smTeamA" placeholder="Ex: France">
      </div>
      <div style="margin-bottom:12px">
        <label>Équipe B</label><input id="smTeamB" placeholder="Ex: Brésil">
      </div>
      <div style="margin-bottom:12px">
        <label>Date du match</label>
        <input id="smDate" type="date">
      </div>
      <div style="margin-bottom:12px">
        <label>Heure coup d'envoi (Paris)</label>
        <input id="smTime" type="time" value="21:00">
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;text-transform:none;letter-spacing:0;cursor:pointer">
        <input type="checkbox" id="smCanET" style="width:auto;accent-color:var(--gold)"> Prolongations/TAB possibles
      </label>
      <button class="primary" id="smCreateBtn" style="width:100%">⚡ Créer le match</button>
    </div>`;

  $('smCreateBtn').addEventListener('click',async()=>{
    const tA=($('smTeamA')?.value||'').trim();
    const tB=($('smTeamB')?.value||'').trim();
    const date=($('smDate')?.value||'').trim();
    const time=($('smTime')?.value||'').trim();
    if(!tA||!tB||!date||!time){toast('Remplis tous les champs.');return;}
    // Vérifier que le match est dans le futur (> 30min)
    const matchTime=new Date(date+'T'+time+':00');
    if(matchTime.getTime()-Date.now()<30*60*1000){
      toast('⚠️ Le match doit être dans plus de 30 minutes !');return;
    }
    const sm={teamA:tA,teamB:tB,date,time,canET:!!$('smCanET')?.checked,
      scoreA:null,scoreB:null,et90done:false,etDone:false,
      scoreAET:null,scoreBET:null,penA:null,penB:null,
      yellowA:null,yellowB:null,redA:null,redB:null,penalties:null,
      scorerValidations:{},remarkValidations:{}};
    const ok=await fbSet('specialMatch',sm);
    if(ok){_sm=sm;toast('✅ Match créé !');render();}
    else toast('❌ Erreur Firebase');
  });
}

// ── ADMIN LIVE ────────────────────────────────
function renderAdmin(){
  const sm=_sm;const pronos=_pronos;
  const players=Object.values(_players).filter(p=>p.competitionIds?.includes('special')||p.groupIds?.includes('matchunique'));
  const locked=isLocked(sm);
  const scores=players.map(p=>{const pr=pronos[p.id]||{};const{total}=calcPoints(sm,{...pr,_pid:p.id});return{name:p.name,total};}).sort((a,b)=>b.total-a.total);

  $('app').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:11px;color:var(--muted)">⚡ Match Spécial — Admin</div>
        <div style="font-size:18px;font-weight:900">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
        <div style="font-size:12px;color:${locked?'#f5c842':'#14c47d'};margin-top:2px">
          ${dateFr(sm.date)} ${sm.time} · ${locked?'🔒 Verrouillé':'⏳ Ouvert'}
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="danger" id="smDeleteBtn">🗑 Supprimer</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="pronos">📋 Pronos</button>
      <button class="tab" data-tab="classement">🏆 Classement</button>
    </div>

    <!-- LIVE -->
    <div id="tab-live">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">Saisie en direct</div>

        <!-- Score 90min -->
        <div style="margin-bottom:14px">
          <label>Score 90min</label>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:700">${esc(sm.teamA)}</span>
            <input class="score-box" id="adSA" type="number" min="0" value="${sm.scoreA??''}">
            <span style="font-weight:700">-</span>
            <input class="score-box" id="adSB" type="number" min="0" value="${sm.scoreB??''}">
            <span style="font-size:13px;font-weight:700">${esc(sm.teamB)}</span>
            <button class="primary" id="adSaveScore" style="padding:8px 14px;font-size:13px">✓</button>
          </div>
        </div>

        ${sm.canET&&sm.scoreA!=null&&Number(sm.scoreA)===Number(sm.scoreB)?`
        <!-- Prolongations -->
        <div class="section-box section-et" style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:rgba(100,160,255,.9);margin-bottom:8px">🔵 Prolongations</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:700">${esc(sm.teamA)}</span>
            <input class="score-box" id="adETA" type="number" min="0" value="${sm.scoreAET??''}">
            <span>-</span>
            <input class="score-box" id="adETB" type="number" min="0" value="${sm.scoreBET??''}">
            <span style="font-size:13px;font-weight:700">${esc(sm.teamB)}</span>
            <button class="primary" id="adSaveET" style="padding:8px 14px;font-size:13px">✓</button>
          </div>
        </div>`:''}

        ${sm.canET&&sm.scoreAET!=null&&Number(sm.scoreAET)===Number(sm.scoreBET)?`
        <!-- TAB -->
        <div class="section-box section-tab" style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:rgba(245,200,66,.9);margin-bottom:8px">🟡 Tirs au but</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:700">${esc(sm.teamA)}</span>
            <input class="score-box" id="adPenA" type="number" min="0" value="${sm.penA??''}">
            <span>-</span>
            <input class="score-box" id="adPenB" type="number" min="0" value="${sm.penB??''}">
            <span style="font-size:13px;font-weight:700">${esc(sm.teamB)}</span>
            <button class="primary" id="adSavePen" style="padding:8px 14px;font-size:13px">✓</button>
          </div>
        </div>`:''}

        <!-- Cartons + Penaltys -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
          <div><label>🟨 Jaunes total</label><input type="number" min="0" id="adYellow" value="${sm.yellowA!=null?(Number(sm.yellowA||0)+Number(sm.yellowB||0))||'':''}" style="padding:6px 8px;font-size:13px"></div>
          <div><label>🟥 Rouges total</label><input type="number" min="0" id="adRed" value="${sm.redA!=null?(Number(sm.redA||0)+Number(sm.redB||0))||'':''}" style="padding:6px 8px;font-size:13px"></div>
          <div><label>🥅 Penaltys</label><input type="number" min="0" id="adPen" value="${sm.penalties??''}" style="padding:6px 8px;font-size:13px"></div>
        </div>
        <button class="secondary" id="adSaveStats" style="width:100%;margin-bottom:14px">💾 Sauvegarder cartons/penaltys</button>

        <!-- Buteurs : admin coche les pronostics corrects des joueurs -->
        <div style="background:rgba(20,196,125,.06);border:1px solid rgba(20,196,125,.15);border-radius:10px;padding:12px;margin-bottom:12px">
          <div style="font-size:12px;font-weight:700;color:#14c47d;margin-bottom:8px">⚽ Buteurs pronostiqués</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Coche les buteurs qui ont marqué :</div>
          ${(()=>{
            const all=[];
            players.forEach(p=>{
              const pr=pronos[p.id]||{};
              [...(pr.scorersA||[]),...(pr.scorersB||[])].forEach(s=>{
                const key=s.trim().toLowerCase();
                if(!key)return;
                if(!all.find(x=>x.key===key))all.push({key,name:s.trim(),players:[]});
                const e=all.find(x=>x.key===key);
                if(e&&!e.players.includes(p.name))e.players.push(p.name);
              });
            });
            if(!all.length)return'<div style="font-size:12px;color:var(--muted)">Aucun buteur pronostiqué.</div>';
            const v2=sm.scorerValidations||{};
            return all.map(s=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)">
              <input type="checkbox" ${v2[s.key]?'checked':''} onchange="toggleScorer('${s.key}',this.checked)" style="width:18px;height:18px;accent-color:#14c47d;flex-shrink:0;cursor:pointer">
              <div><div style="font-size:13px;font-weight:700">${esc(s.name)}</div><div style="font-size:11px;color:var(--muted)">par : ${esc(s.players.join(', '))}</div></div>
            </div>`).join('');
          })()}
        </div>

        <!-- Faits marquants -->
        <div class="section-box section-remark">
          <div style="font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px">⭐ Faits marquants pronostiqués</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Coche si le fait s'est produit :</div>
          ${(()=>{
            const rv=sm.remarkValidations||{};
            const entries=players.filter(p=>pronos[p.id]?.remark);
            if(!entries.length)return'<div style="font-size:12px;color:var(--muted)">Aucun fait marquant pronostiqué.</div>';
            return entries.map(p=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)">
              <input type="checkbox" ${rv[p.id]?'checked':''} onchange="toggleRemark('${p.id}',this.checked)" style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;cursor:pointer">
              <span style="font-size:13px"><b>${esc(p.name)}</b> : ${esc(pronos[p.id].remark)}</span>
            </div>`).join('');
          })()}
        </div>
      </div>
    </div>

    <!-- PRONOS -->
    <div id="tab-pronos" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">📋 Pronos (${players.length} joueurs)</div>
        ${players.map(p=>{
          const pr=pronos[p.id]||{};
          return`<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <div style="font-size:13px;font-weight:700;margin-bottom:4px">${esc(p.name)}</div>
            ${pr.scoreA!=null?`<div style="font-size:12px;color:var(--muted)">Score: <b style="color:#fff">${pr.scoreA}-${pr.scoreB}</b>${pr.scoreAET!=null?` · Prolong: ${pr.scoreAET}-${pr.scoreBET}`:''}${pr.penA!=null?` · TAB: ${pr.penA}-${pr.penB}`:''}</div>`:'<div style="font-size:12px;color:rgba(255,255,255,.3)">Pas de prono</div>'}
            ${pr.yellowCards!=null?`<div style="font-size:11px;color:var(--muted)">🟨${pr.yellowCards} 🟥${pr.redCards||0} 🥅${pr.penalties||0}</div>`:''}
            ${(pr.scorersA?.length||pr.scorersB?.length)?`<div style="font-size:11px;color:var(--muted)">⚽ ${[...(pr.scorersA||[]),...(pr.scorersB||[])].join(', ')}</div>`:''}
            ${pr.remark?`<div style="font-size:11px;color:var(--gold)">⭐ ${esc(pr.remark)}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- CLASSEMENT -->
    <div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">🏆 Classement</div>
        ${scores.map((s,i)=>`
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <div style="display:flex;align-items:center;gap:10px">
              <span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
              <span style="font-size:13px;font-weight:700">${esc(s.name)}</span>
            </div>
            <span style="font-size:16px;font-weight:900;color:var(--gold)">${s.total}pts</span>
          </div>`).join('')}
      </div>
    </div>`;

  // Tabs
  $('app').querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      $('app').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['live','pronos','classement'].forEach(id=>{const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';});
    });
  });

  // Score 90min
  $('adSaveScore')?.addEventListener('click',async()=>{
    const sA=v($('adSA')),sB=v($('adSB'));
    if(sA===null||sB===null){toast('Entre les deux scores');return;}
    const ok=await fbPatch('specialMatch',{scoreA:sA,scoreB:sB});
    if(ok){_sm={..._sm,scoreA:sA,scoreB:sB};toast('✅ Score sauvegardé');render();}
  });

  // Prolongations
  $('adSaveET')?.addEventListener('click',async()=>{
    const eA=v($('adETA')),eB=v($('adETB'));
    if(eA===null||eB===null){toast('Entre le score ET');return;}
    if(eA<Number(_sm.scoreA)||eB<Number(_sm.scoreB)){toast('⚠️ Score ET ne peut pas être inférieur au score 90min');return;}
    const ok=await fbPatch('specialMatch',{scoreAET:eA,scoreBET:eB});
    if(ok){_sm={..._sm,scoreAET:eA,scoreBET:eB};toast('✅ Prolongations sauvegardées');render();}
  });

  // TAB
  $('adSavePen')?.addEventListener('click',async()=>{
    const pA=v($('adPenA')),pB=v($('adPenB'));
    if(pA===null||pB===null){toast('Entre le score TAB');return;}
    if(pA===pB){toast('⚠️ Les TAB ne peuvent pas être nuls !');return;}
    const ok=await fbPatch('specialMatch',{penA:pA,penB:pB,etDone:true});
    if(ok){_sm={..._sm,penA:pA,penB:pB};toast('✅ TAB sauvegardés');render();}
  });

  // Cartons
  $('adSaveStats')?.addEventListener('click',async()=>{
    const yellow=v($('adYellow')),red=v($('adRed')),pen=v($('adPen'));
    const ok=await fbPatch('specialMatch',{yellowA:yellow,yellowB:0,redA:red,redB:0,penalties:pen});
    if(ok){_sm={..._sm,yellowA:yellow,yellowB:0,redA:red,redB:0,penalties:pen};toast('✅ Stats sauvegardées');}
  });

  // Archiver + Supprimer
  $('smDeleteBtn')?.addEventListener('click',async()=>{
    if(!confirm('Supprimer ce match ?\nLes résultats seront archivés dans les profils joueurs avant suppression.'))return;
    if(!confirm('Dernière confirmation — supprimer et archiver définitivement ?'))return;
    toast('⏳ Archivage en cours…');
    const sm2=_sm;const pronos2=_pronos;
    const ts=Date.now();
    const label=`${sm2.teamA} vs ${sm2.teamB}`;
    // Calculer le classement final
    const ranking=players.map(p=>{
      const pr=pronos2[p.id]||{};
      const{total}=calcPoints(sm2,{...pr,_pid:p.id});
      return{pid:p.id,name:p.name,total};
    }).sort((a,b)=>b.total-a.total);
    // Archiver dans /history/{pid}/special_{ts}
    const archivePromises=ranking.map((r,i)=>{
      const entry={
        competition:'special',
        label,
        date:new Date().toISOString().slice(0,10),
        rank:i+1,
        totalPlayers:ranking.length,
        totalScore:r.total,
        teamA:sm2.teamA,
        teamB:sm2.teamB,
        scoreA:sm2.scoreA,
        scoreB:sm2.scoreB,
        prono:pronos2[r.pid]||{}
      };
      return fbSet(`history/${r.pid}/special_${ts}`,entry);
    });
    await Promise.all(archivePromises);
    await fbDel('specialMatch');
    await fbDel('specialPronos');
    _sm=null;_pronos={};
    toast('✅ Archivé et supprimé !');
    render();
  });
}

// Callbacks inline (buteurs + faits marquants)
window.toggleScorer=async function(key,val){
  const v2={...(_sm.scorerValidations||{}),[key]:val};
  const ok=await fbPatch('specialMatch',{scorerValidations:v2});
  if(ok){_sm={..._sm,scorerValidations:v2};toast(val?'✅ Buteur validé':'Retiré');}
};
window.toggleRemark=async function(pid,val){
  const v2={...(_sm.remarkValidations||{}),[pid]:val};
  const ok=await fbPatch('specialMatch',{remarkValidations:v2});
  if(ok){_sm={..._sm,remarkValidations:v2};toast(val?'✅ Validé':'Invalidé');}
};

// ── VUE JOUEUR ────────────────────────────────
function renderPlayer(){
  const sm=_sm;const session=_session;
  const locked=isLocked(sm);const visible=isVisible(sm);
  const myProno=_pronos[session.pid]||{};
  const{total,detail}=calcPoints(sm,{...myProno,_pid:session.pid});

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:6px">⚡</div>
      <div style="font-size:19px;font-weight:900">${esc(sm.teamA)} vs ${esc(sm.teamB)}</div>
      <div style="font-size:12px;margin-top:4px;color:${locked?'#f5c842':'#14c47d'}">
        ${locked?`🔒 Verrouillé — ${dateFr(sm.date)} ${sm.time}`:`⏳ Ouvert jusqu'à H-5min (${dateFr(sm.date)} ${sm.time})`}
      </div>
      ${total>0?`<div style="margin-top:8px;font-size:22px;font-weight:900;color:var(--gold)">${total} pts</div>`:''}
    </div>

    <div class="tab-bar">
      ${!locked?`<button class="tab active" data-tab="prono">🎯 Mon prono</button>`:''}
      <button class="tab ${locked?'active':''}" data-tab="live">📡 Live</button>
      ${visible?`<button class="tab" data-tab="classement">🏆 Classement</button>`:''}
    </div>

    ${!locked?`<div id="tab-prono">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">Ton pronostic</div>

        <!-- Score 90min -->
        <div style="margin-bottom:14px">
          <label>Score (90 min)</label>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:13px;font-weight:700;min-width:55px">${esc(sm.teamA)}</span>
            <input class="score-box" id="pSA" type="number" min="0" value="${myProno.scoreA??''}">
            <span style="font-weight:700">-</span>
            <input class="score-box" id="pSB" type="number" min="0" value="${myProno.scoreB??''}">
            <span style="font-size:13px;font-weight:700;min-width:55px">${esc(sm.teamB)}</span>
          </div>
        </div>

        ${sm.canET?`
        <div class="section-box section-et" style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:rgba(100,160,255,.8);margin-bottom:8px">🔵 Prolongations <span style="font-weight:400;color:rgba(255,255,255,.3)">(si nul à 90min)</span></div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="font-size:12px;min-width:55px">${esc(sm.teamA)}</span>
            <input class="score-box" id="pETA" type="number" min="0" value="${myProno.scoreAET??''}" ${myProno.scoreA!=null&&myProno.scoreA!==myProno.scoreB?'disabled':''}>
            <span>-</span>
            <input class="score-box" id="pETB" type="number" min="0" value="${myProno.scoreBET??''}" ${myProno.scoreA!=null&&myProno.scoreA!==myProno.scoreB?'disabled':''}>
            <span style="font-size:12px;min-width:55px">${esc(sm.teamB)}</span>
          </div>
          <div style="font-size:11px;font-weight:700;color:rgba(245,200,66,.8);margin-bottom:8px">🟡 TAB <span style="font-weight:400;color:rgba(255,255,255,.3)">(si nul en prolong.)</span></div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;min-width:55px">${esc(sm.teamA)}</span>
            <input class="score-box" id="pPenA" type="number" min="0" value="${myProno.penA??''}" ${(myProno.scoreA!=null&&myProno.scoreA!==myProno.scoreB)||(myProno.scoreAET!=null&&myProno.scoreAET!==myProno.scoreBET)?'disabled':''}>
            <span>-</span>
            <input class="score-box" id="pPenB" type="number" min="0" value="${myProno.penB??''}" ${(myProno.scoreA!=null&&myProno.scoreA!==myProno.scoreB)||(myProno.scoreAET!=null&&myProno.scoreAET!==myProno.scoreBET)?'disabled':''}>
            <span style="font-size:12px;min-width:55px">${esc(sm.teamB)}</span>
          </div>
        </div>`:''}

        <!-- Cartons + Penaltys -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
          <div><label>🟨 Jaunes</label><input type="number" min="0" id="pYellow" value="${myProno.yellowCards??''}" style="padding:7px;font-size:13px"></div>
          <div><label>🟥 Rouges</label><input type="number" min="0" id="pRed" value="${myProno.redCards??''}" style="padding:7px;font-size:13px"></div>
          <div><label>🥅 Penaltys</label><input type="number" min="0" id="pPen" value="${myProno.penalties??''}" style="padding:7px;font-size:13px"></div>
        </div>

        <!-- Buteurs -->
        <div style="margin-bottom:12px">
          <label>Buteurs ${esc(sm.teamA)} (séparés par virgule)</label>
          <input id="pScorersA" placeholder="Ex: Mbappé, Dembélé" value="${(myProno.scorersA||[]).join(', ')}">
        </div>
        <div style="margin-bottom:12px">
          <label>Buteurs ${esc(sm.teamB)} (séparés par virgule)</label>
          <input id="pScorersB" placeholder="Ex: Ronaldo" value="${(myProno.scorersB||[]).join(', ')}">
        </div>

        <!-- Fait marquant -->
        <div class="section-box section-remark" style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:6px">⭐ Fait marquant</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Note quelque chose qui pourrait se passer (penalty, expulsion, but contre son camp…)</div>
          <input id="pRemark" placeholder="Ex: Il y aura au moins un penalty, Mbappé marquera un doublé…" value="${esc(myProno.remark||'')}">
        </div>

        <button class="primary" id="pSaveBtn" style="width:100%">💾 Enregistrer mon prono</button>
      </div>
    </div>`:''}

    <!-- LIVE -->
    <div id="tab-live" style="display:${locked?'block':'none'}">
      <div class="card">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px">
          ${sm.scoreA!=null?`<span class="live-dot"></span>`:''}
          <span style="font-size:13px;font-weight:800">Score en direct</span>
        </div>
        <div style="text-align:center;font-size:52px;font-weight:900;letter-spacing:4px;margin:8px 0">
          ${sm.scoreA!=null?`${sm.scoreA}-${sm.scoreB}`:'—'}
        </div>
        ${sm.scoreAET!=null?`<div style="text-align:center;color:rgba(100,160,255,.9);font-size:15px">Prolong: ${sm.scoreAET}-${sm.scoreBET}</div>`:''}
        ${sm.penA!=null?`<div style="text-align:center;color:var(--gold);font-size:14px">TAB: ${sm.penA}-${sm.penB}</div>`:''}
        ${sm.yellowA!=null?`<div style="display:flex;justify-content:center;gap:16px;margin:10px 0;font-size:13px"><span>🟨 ${(Number(sm.yellowA||0)+Number(sm.yellowB||0))} jaunes</span><span>🟥 ${(Number(sm.redA||0)+Number(sm.redB||0))} rouges</span>${sm.penalties!=null?`<span>🥅 ${sm.penalties} penalty</span>`:''}</div>`:''}
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--muted)">Mon prono : ${myProno.scoreA!=null?`${myProno.scoreA}-${myProno.scoreB}`:'Aucun'}</div>
        ${detail.length>0?`<div style="margin-top:12px">${detail.map(d=>`<div style="font-size:12px;color:${d.color};margin-bottom:3px">${d.icon} ${d.text} → <b>+${d.pts}pt${d.pts>1?'s':''}</b></div>`).join('')}<div style="font-size:16px;font-weight:900;color:var(--gold);margin-top:8px">Total : ${total} pts</div></div>`:''}
      </div>
    </div>

    <!-- CLASSEMENT -->
    ${visible?`<div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-size:13px;font-weight:800;margin-bottom:14px">🏆 Classement & Pronos</div>
        ${Object.values(_players).filter(p=>_pronos[p.id]?.scoreA!=null).map(p=>{
          const pr=_pronos[p.id];const{total}=calcPoints(sm,{...pr,_pid:p.id});const mine=p.id===session.pid;
          return{name:p.name,total,pr,mine,pid:p.id};
        }).sort((a,b)=>b.total-a.total).map((s,i)=>`
          <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);${s.mine?'background:rgba(245,200,66,.06);border-radius:10px;padding:10px;margin:0 -4px;':''}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
              <div style="display:flex;align-items:center;gap:8px">
                <span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
                <span style="font-weight:700;font-size:13px">${esc(s.name)}${s.mine?' 👤':''}</span>
              </div>
              <span style="font-size:16px;font-weight:900;color:var(--gold)">${s.total}pts</span>
            </div>
            <div style="font-size:11px;color:var(--muted);padding-left:26px">
              Score: ${s.pr.scoreA}-${s.pr.scoreB}${s.pr.scorersA?.length||s.pr.scorersB?.length?` · ⚽ ${[...(s.pr.scorersA||[]),...(s.pr.scorersB||[])].join(', ')}`:''} ${s.pr.remark?`· ⭐ ${esc(s.pr.remark)}`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`:''}`;

  // Tabs
  $('app').querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      $('app').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['prono','live','classement'].forEach(id=>{const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';});
    });
  });

  // Mise à jour ET/TAB en temps réel
  function updateLock(){
    const sA=v($('pSA')),sB=v($('pSB'));
    const nonNul90=sA!=null&&sB!=null&&sA!==sB;
    const etA=$('pETA'),etB=$('pETB'),penA=$('pPenA'),penB=$('pPenB');
    [etA,etB].forEach(el=>{if(!el)return;el.disabled=nonNul90;el.style.opacity=nonNul90?'0.4':'1';if(nonNul90)el.value='';});
    const eA=v($('pETA')),eB=v($('pETB'));
    const nonNulET=eA!=null&&eB!=null&&eA!==eB;
    const tabDis=nonNul90||nonNulET;
    [penA,penB].forEach(el=>{if(!el)return;el.disabled=tabDis;el.style.opacity=tabDis?'0.4':'1';if(tabDis)el.value='';});
  }
  ['pSA','pSB'].forEach(id=>$(id)?.addEventListener('input',updateLock));
  ['pETA','pETB'].forEach(id=>$(id)?.addEventListener('input',updateLock));
  setTimeout(updateLock,50);

  // Sauvegarder prono
  $('pSaveBtn')?.addEventListener('click',async()=>{
    const sA=v($('pSA')),sB=v($('pSB'));
    if(sA===null||sB===null){toast('Entre au moins le score.');return;}
    const prono={scoreA:sA,scoreB:sB,_pid:session.pid};
    // ET/TAB si canET et score nul
    if(sm.canET&&sA===sB){
      const eA=v($('pETA')),eB=v($('pETB'));
      if(eA!=null&&eB!=null){
        if(eA<sA||eB<sB){toast('⚠️ Score ET ne peut pas être inférieur au 90min');return;}
        prono.scoreAET=eA;prono.scoreBET=eB;
        if(eA===eB){
          const pA=v($('pPenA')),pB=v($('pPenB'));
          if(pA!=null&&pB!=null){if(pA===pB){toast('⚠️ TAB doivent être différents !');return;}prono.penA=pA;prono.penB=pB;}
        }
      }
    }
    // Cartons
    const y=v($('pYellow')),r=v($('pRed')),p2=v($('pPen'));
    if(y!=null)prono.yellowCards=y;if(r!=null)prono.redCards=r;if(p2!=null)prono.penalties=p2;
    // Buteurs
    const sA2=($('pScorersA')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    const sB2=($('pScorersB')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(sA2.length)prono.scorersA=sA2;if(sB2.length)prono.scorersB=sB2;
    // Fait marquant
    const rem=($('pRemark')?.value||'').trim();if(rem)prono.remark=rem;
    const ok=await fbSet(`specialPronos/${session.pid}`,prono);
    if(ok){_pronos[session.pid]=prono;toast('✅ Prono enregistré !');render();}
    else toast('❌ Erreur de sauvegarde');
  });
}

function renderNoMatch(){
  $('app').innerHTML=`<div style="text-align:center;padding:60px 20px">
    <div style="font-size:52px;margin-bottom:12px">⚡</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:8px">Match Spécial</div>
    <div style="color:var(--muted);font-size:14px">Aucun match pour le moment.</div>
  </div>`;
}

// ── Polling ───────────────────────────────────
function startPolling(){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(async()=>{
    const[sm,pronos]=await Promise.all([fbGet(),fbGetPronos()]);
    const ch=JSON.stringify({sm,pronos})!==JSON.stringify({sm:_sm,pronos:_pronos});
    if(ch){_sm=sm;_pronos=pronos;const focused=document.activeElement;const typing=focused&&['INPUT','TEXTAREA'].includes(focused.tagName);if(!typing)render();}
  },6000);
}
</script>

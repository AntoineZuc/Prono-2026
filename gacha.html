<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZUC TCG</title>
<style>
:root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--gold:#f5c842;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── ÉCRAN PRINCIPAL ── */
#app{max-width:500px;margin:0 auto;padding:54px 16px 40px;min-height:100vh}

/* ── PACK OPENING ── */
#packScreen{display:none;position:fixed;inset:0;background:#0a0e1a;z-index:100;flex-direction:column;align-items:center;justify-content:center}
#packScreen.active{display:flex}
#packFlash{position:fixed;inset:0;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 65%);opacity:0;pointer-events:none;z-index:150;transition:opacity .25s ease}
#packFlash.show{opacity:.9;transition:opacity .12s ease}
.pack-wrap{position:relative;width:238px;height:340px;cursor:pointer}
.pack-wrap.opening{cursor:default}
.pack-wrap.opening .pack-face-card{animation:packOpen .6s cubic-bezier(.65,0,.35,1) forwards}
@keyframes packOpen{
  0%{transform:scale(1) rotate(0)}
  28%{transform:scale(1.06) rotate(-2.5deg)}
  52%{transform:scale(1.06) rotate(2.5deg)}
  72%{transform:scale(1.22) rotate(0);opacity:1}
  100%{transform:scale(.25) rotate(6deg);opacity:0}
}
.pack-glow{position:absolute;inset:-30px;border-radius:34px;animation:pulse 2.2s infinite;filter:blur(2px)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.05);opacity:1}}
.pack-face-card{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;user-select:none;
  box-shadow:0 4px 0 rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.1)}
.pack-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 16px}
.pack-pattern{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:15px 15px;opacity:.6}
.pack-border-frame{position:absolute;inset:11px;border:1px solid;border-radius:13px;pointer-events:none;opacity:.45}
.pack-corner{position:absolute;font-size:15px;line-height:1;opacity:.85;z-index:1}
.pack-corner.tl{top:15px;left:15px}
.pack-corner.tr{top:15px;right:15px}
.pack-corner.bl{bottom:15px;left:15px}
.pack-corner.br{bottom:15px;right:15px}
.pack-sheen{position:absolute;inset:-50%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 2px,transparent 2px 22px);animation:sheenMove 3.5s linear infinite;mix-blend-mode:overlay}
@keyframes sheenMove{0%{transform:translate(0,0)}100%{transform:translate(60px,60px)}}
.pack-top{display:flex;flex-direction:column;align-items:center;gap:5px;z-index:1}
.pack-medallion{width:96px;height:96px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(0,0,0,.25) 75%);z-index:1;position:relative}
.pack-medallion::before{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.pack-emblem{font-size:44px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.pack-logo{font-size:19px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.pack-season{font-size:11px;font-weight:800;letter-spacing:3px;opacity:.9}
.pack-subtitle{font-size:9.5px;letter-spacing:2.5px;opacity:.65;margin-top:1px;color:#fff}
.pack-count-tag{font-size:9.5px;font-weight:800;letter-spacing:1.5px;z-index:1;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.32);border:1px solid}
.pack-tap{font-size:13px;color:rgba(255,255,255,.4);margin-top:26px;animation:blink 2s infinite;transition:opacity .2s}
.pack-tap.hide{animation:none;opacity:0!important}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

/* ── SLIDER CARTES ── */
#cardSlider{display:none;position:fixed;inset:0;background:#0a0e1a;z-index:100}
#cardSlider.active{display:block}
.slider-header{position:absolute;top:20px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
.slider-nav{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px}
.slider-wrap{position:relative;width:246px;height:344px;perspective:1000px;touch-action:pan-y}
.nav-arrow{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.nav-arrow:disabled{opacity:.25;cursor:default}
.dots{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s}
.dot.active{background:var(--gold)}
.btn-album{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:min(260px,80vw);background:linear-gradient(135deg,var(--gold),#d4a017);border:none;border-radius:12px;color:#0a0e1a;font-size:14px;font-weight:800;padding:14px 0;cursor:pointer;font-family:inherit;visibility:hidden;opacity:0;transition:opacity .2s}
.btn-album.show{visibility:visible;opacity:1}
.slide-hint{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:12px;color:rgba(255,255,255,.3);pointer-events:none}
.card-slide{position:absolute;inset:0;border-radius:14px;overflow:hidden;cursor:grab;user-select:none;transition:transform .15s;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:cardIn .35s ease}
.card-slide:active{cursor:grabbing}
@keyframes cardIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
/* couche 1 : fond dégradé (remplace l'illustration tant qu'elle n'existe pas) */
.card-art-bg{position:absolute;inset:0}
/* couche 2 : cadre PNG (fenêtre transparente + bandeau opaque) */
.card-frame-img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
/* couche 3 : texte dans le bandeau bas du cadre */
.card-num-badge{position:absolute;top:3%;right:9%;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:3}
/* badge coin haut-gauche : "Nouvelle" ou "×N" — posé sur le dessin, jamais dans le bloc de texte du bas (évite tout décalage/chevauchement) */
.card-corner-badge{position:absolute;top:3%;left:6%;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;z-index:3}
.card-corner-badge.new{background:linear-gradient(135deg,#ff3b30,#c62828);color:#fff;box-shadow:0 2px 10px rgba(229,57,53,.65);animation:newPulse 1.6s ease-in-out infinite}
@keyframes newPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.card-corner-badge.qty{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(2px)}
.card-info{position:absolute;left:7%;right:7%;top:74%;bottom:4.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;z-index:3}
.card-name{font-size:16px;font-weight:900;text-align:center;line-height:1.15;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.card-stars{font-size:14px;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card-rarity-label{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-align:center;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.4)}
/* dégradés de fond + couleurs de texte par rareté */
.rarity-commun .card-art-bg{background:radial-gradient(ellipse 80% 60% at 50% 25%,#3a3a42 0%,#1c1c22 100%)}
.rarity-commun .card-name{color:#1c1c1c;text-shadow:0 1px 2px rgba(255,255,255,.3)}
.rarity-commun .card-rarity-label{color:#3a3a3a;text-shadow:0 1px 2px rgba(255,255,255,.3)}
.rarity-commun .card-stars{color:#8a6d00;text-shadow:0 1px 2px rgba(255,255,255,.3)}
.rarity-rare .card-art-bg{background:radial-gradient(ellipse 80% 60% at 50% 25%,#1a3f7a 0%,#0d1f3d 100%)}
.rarity-rare .card-name{color:#bcd6ff}
.rarity-rare .card-rarity-label{color:#6fa8ff}
.rarity-rare .card-stars{color:var(--gold)}
.rarity-ultra_rare .card-art-bg{background:radial-gradient(ellipse 80% 60% at 50% 25%,#4a1a8a 0%,#1c0a3a 100%)}
.rarity-ultra_rare .card-name{color:#e3c2ff}
.rarity-ultra_rare .card-rarity-label{color:#bf7bff}
.rarity-ultra_rare .card-stars{color:var(--gold)}
.rarity-legendaire .card-art-bg{background:radial-gradient(ellipse 80% 60% at 50% 25%,#7a5a10 0%,#2a1e00 100%)}
.rarity-legendaire .card-name{color:#fff3c4}
.rarity-legendaire .card-rarity-label{color:var(--gold)}
.rarity-legendaire .card-stars{color:var(--gold)}
.rarity-ultime .card-art-bg{background:radial-gradient(ellipse 80% 60% at 50% 25%,#7a1010 0%,#1a0000 100%)}
.rarity-ultime .card-name{color:#ffb3ab}
.rarity-ultime .card-rarity-label{color:#ff5b4d}
.rarity-ultime .card-stars{color:var(--gold)}

/* ── ALBUM ── */
#albumScreen{display:none;position:fixed;inset:0;overflow-y:auto;z-index:100;background:#0a0e1a}
#albumScreen.active{display:block}
.album-cover{background:linear-gradient(135deg,#1a0a00,#2d1800);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
.album-cover::before{content:'';position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 80% 60% at 50% 0%,rgba(245,200,66,.18),transparent),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(229,57,53,.12),transparent)}
.cover-logo{font-size:42px;font-weight:900;color:var(--gold);letter-spacing:6px;z-index:1;text-shadow:0 0 40px rgba(245,200,66,.4)}
.cover-sub{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:4px;z-index:1;margin-top:6px}
.cover-bar{width:80px;height:3px;background:var(--gold);border-radius:2px;margin:16px 0;z-index:1;opacity:.6}
.cover-stats{z-index:1;display:flex;gap:24px;margin-top:8px}
.cstat{text-align:center}
.cstat-n{font-size:22px;font-weight:900;color:var(--gold)}
.cstat-l{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}
.album-close{position:fixed;top:16px;right:16px;background:rgba(20,24,36,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;z-index:110;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.album-pending-banner{align-items:center;justify-content:center;gap:8px;text-align:center;background:rgba(245,200,66,.12);border-bottom:1px solid rgba(245,200,66,.25);color:var(--gold);font-size:13px;font-weight:700;padding:12px 16px}
.album-section{padding:20px 16px 0;max-width:500px;margin:0 auto}
.section-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.album-card{aspect-ratio:1060/1484;border-radius:7px;position:relative;cursor:pointer;overflow:hidden;transition:transform .15s}
.album-card:active{transform:scale(.96)}
/* carte non possédée */
.album-card.empty{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.album-card.empty .card-num{font-size:10px;color:rgba(255,255,255,.15);font-weight:700}
.album-card.empty .card-plus{font-size:0;color:transparent}/* pas de + dans l'album général */
/* carte possédée : dégradé rareté + cadre PNG en mini */
.album-card.owned .card-art-bg{position:absolute;inset:0}
.album-card.owned .card-frame-img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.album-card .count-badge{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.7);border-radius:999px;padding:1px 5px;font-size:9px;font-weight:700;color:#fff;display:none;z-index:3}
.album-card.owned.multi .count-badge{display:block}
/* carte à ranger (depuis l'ouverture) */
.album-card.to-place{background:rgba(245,200,66,.08);border:2px solid var(--gold);animation:glow-place 1.5s infinite}
@keyframes glow-place{0%,100%{box-shadow:0 0 0 rgba(245,200,66,0)}50%{box-shadow:0 0 12px rgba(245,200,66,.4)}}
.album-card.to-place .card-plus-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gold);font-weight:300;background:rgba(245,200,66,.05)}

/* ── HOME ── */
.home-header{text-align:center;padding:20px 0 28px}
.home-logo{font-size:32px;font-weight:900;color:var(--gold);letter-spacing:4px}
.home-sub{font-size:11px;color:var(--muted);letter-spacing:3px;margin-top:4px}
.pack-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid var(--gold);border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.pack-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(245,200,66,.12),transparent 60%);pointer-events:none}
.pack-available{font-size:44px;font-weight:900;color:var(--gold);margin-bottom:4px}
.pack-label{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:20px}
.btn-open{width:100%;background:linear-gradient(135deg,var(--gold),#d4a017);border:none;border-radius:14px;color:#0a0e1a;font-size:16px;font-weight:900;padding:16px;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-open:disabled{opacity:.4;cursor:not-allowed}
.btn-open:not(:disabled):active{opacity:.8}
.countdown{font-size:28px;font-weight:900;color:var(--muted);margin:8px 0 4px}
.countdown-label{font-size:12px;color:rgba(255,255,255,.3)}
.btn-album-home{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:var(--text);font-size:15px;font-weight:700;padding:14px;cursor:pointer;font-family:inherit;margin-top:12px}
.btn-album-home.has-pending{border-color:rgba(245,200,66,.4);background:rgba(245,200,66,.07)}
.pending-note{display:block;font-size:11.5px;font-weight:700;color:var(--gold);margin-top:5px}
.progress-wrap{background:rgba(255,255,255,.05);border-radius:12px;padding:16px;margin-top:0}
.progress-label{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.progress-bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#e53935);border-radius:4px;transition:width .4s}
</style>
</head>
<body>
<button id="portalBtn" onclick="location.href='index.html'">⬅ Portail</button>
<div id="app"></div>
<div id="toast"></div>

<!-- PACK OPENING -->
<div id="packScreen">
  <div class="pack-wrap" id="packWrap"></div>
  <div class="pack-tap" id="packTapHint">Touche le pack pour l'ouvrir</div>
</div>
<div id="packFlash"></div>

<!-- SLIDER CARTES -->
<div id="cardSlider">
  <div class="slider-header" id="sliderHeader">Carte 1 / 5</div>
  <div class="slider-nav">
    <button class="nav-arrow" id="navPrev">‹</button>
    <div class="slider-wrap" id="sliderWrap"></div>
    <button class="nav-arrow" id="navNext">›</button>
  </div>
  <div class="dots" id="sliderDots"></div>
  <button class="btn-album" id="btnGoAlbum">📖 Ranger dans l'album</button>
  <div class="slide-hint" id="slideHint">← Glisse ou touche les flèches →</div>
</div>

<!-- ALBUM -->
<div id="albumScreen">
  <div class="album-cover">
    <button class="album-close" id="albumCloseBtn" onclick="closeAlbum()">✕ Fermer</button>
    <div class="cover-logo">ZUC TCG</div>
    <div class="cover-sub">SAISON 1 · MÉTIERS · 2025</div>
    <div class="cover-bar"></div>
    <div class="cover-stats">
      <div class="cstat"><div class="cstat-n" id="covOwned">0</div><div class="cstat-l">Cartes</div></div>
      <div class="cstat"><div class="cstat-n" id="covTotal">151</div><div class="cstat-l">Total</div></div>
      <div class="cstat"><div class="cstat-n" id="covPct">0%</div><div class="cstat-l">Complet</div></div>
    </div>
  </div>
  <div id="albumPendingBanner" class="album-pending-banner" style="display:none"></div>
  <div id="albumContent"></div>
</div>

<script>
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _tt;const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('show'),2800);};
function getSession(){try{const d=JSON.parse(localStorage.getItem('cdm2026session'));if(!d)return null;if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}return d;}catch{return null;}}

// ── SAISONS ───────────────────────────────────────────────────────────────
// Chaque saison a son propre design de pack. Pour lancer la saison 2, il
// suffira de compléter son entrée ici et de passer CURRENT_SEASON à 1.
const SEASONS=[
  {name:'SAISON 1',subtitle:'MÉTIERS',emblem:'💼',
    colorA:'#1a1a2e',colorB:'#0d0d18',accent:'#f5c842',glow:'rgba(245,200,66,.35)'},
  {name:'SAISON 2',subtitle:'À VENIR',emblem:'🌍',
    colorA:'#0d1b2a',colorB:'#081119',accent:'#4ecdc4',glow:'rgba(78,205,196,.35)'},
  {name:'SAISON 3',subtitle:'À VENIR',emblem:'🔥',
    colorA:'#2a0e0e',colorB:'#160707',accent:'#e53935',glow:'rgba(229,57,53,.35)'},
];
const CURRENT_SEASON=0;

// ── CARTES DB ──────────────────────────────────────────────────────────────
const CARDS=[
  // Commun (1-80) ⭐
  {id:1,name:'Boulanger',rarity:'commun',stars:1,file:'boulanger'},
  {id:2,name:'Pompier',rarity:'commun',stars:1,file:'pompier'},
  {id:3,name:'Facteur',rarity:'commun',stars:1,file:'facteur'},
  {id:4,name:'Maçon',rarity:'commun',stars:1,file:'macon'},
  {id:5,name:'Plombier',rarity:'commun',stars:1,file:'plombier'},
  {id:6,name:'Électricien',rarity:'commun',stars:1,file:'electricien'},
  {id:7,name:'Chauffeur de bus',rarity:'commun',stars:1,file:'chauffeur_de_bus'},
  {id:8,name:'Éboueur',rarity:'commun',stars:1,file:'eboueur'},
  {id:9,name:'Caissier',rarity:'commun',stars:1,file:'caissier'},
  {id:10,name:'Jardinier',rarity:'commun',stars:1,file:'jardinier'},
  {id:11,name:'Coiffeur',rarity:'commun',stars:1,file:'coiffeur'},
  {id:12,name:'Boucher',rarity:'commun',stars:1,file:'boucher'},
  {id:13,name:'Épicier',rarity:'commun',stars:1,file:'epicier'},
  {id:14,name:'Peintre en bâtiment',rarity:'commun',stars:1,file:'peintre_en_batiment'},
  {id:15,name:'Carreleur',rarity:'commun',stars:1,file:'carreleur'},
  {id:16,name:'Gardien d\'immeuble',rarity:'commun',stars:1,file:'gardien_dimmeuble'},
  {id:17,name:'Agent de sécurité',rarity:'commun',stars:1,file:'agent_de_securite'},
  {id:18,name:'Livreur',rarity:'commun',stars:1,file:'livreur'},
  {id:19,name:'Serveur',rarity:'commun',stars:1,file:'serveur'},
  {id:20,name:'Cuisinier',rarity:'commun',stars:1,file:'cuisinier'},
  {id:21,name:'Mécanicien',rarity:'commun',stars:1,file:'mecanicien'},
  {id:22,name:'Garagiste',rarity:'commun',stars:1,file:'garagiste'},
  {id:23,name:'Fleuriste',rarity:'commun',stars:1,file:'fleuriste'},
  {id:24,name:'Libraire',rarity:'commun',stars:1,file:'libraire'},
  {id:25,name:'Couvreur',rarity:'commun',stars:1,file:'couvreur'},

const RARITY_STARS={commun:'★☆☆☆☆',rare:'★★☆☆☆',ultra_rare:'★★★☆☆',legendaire:'★★★★☆',ultime:'★★★★★'};

// Probabilités (sur 1000)
const RARITY_WEIGHTS={commun:870,rare:100,ultra_rare:25,legendaire:4,ultime:1};

// ── FIREBASE ──────────────────────────────────────────────────────────────
const fbGet=async p=>{try{const r=await fetch(`${FB}/gacha/${p}.json`,{cache:'no-store'});return r.ok?await r.json():null;}catch{return null;}};
const fbSet=async(p,d)=>{try{await fetch(`${FB}/gacha/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return true;}catch{return false;}};

// File unique lecture+écriture des données joueur : chaque opération
// (relire l'état frais depuis Firebase, le fusionner, l'écrire) attend
// que la précédente soit ENTIÈREMENT terminée avant de démarrer. Ça évite
// qu'une opération lise une donnée pas encore à jour pendant qu'une autre
// est en train d'écrire (ex: ranger une carte pendant qu'un pack s'ouvre).
let _opChain=Promise.resolve();
// mutate: async (fraisData) => rien — modifie _data directement (ou via fraisData, identique à _data)
function queuePlayerOp(mutate){
  _opChain=_opChain.then(async()=>{
    const fresh=await fbGet(`players/${_sess.pid}`);
    if(fresh)_data=fresh;
    await mutate(_data);
    return fbSet(`players/${_sess.pid}`,_data);
  });
  return _opChain;
}
// Variante lecture seule (pas de ré-écriture) — pour juste vérifier l'état
// le plus frais sans risquer d'écraser une écriture concurrente inutilement.
function queuePlayerRead(onFresh){
  _opChain=_opChain.then(async()=>{
    const fresh=await fbGet(`players/${_sess.pid}`);
    if(fresh){_data=fresh;await onFresh(_data);}
  });
  return _opChain;
}
const fbPatch=async(p,d)=>{try{await fetch(`${FB}/gacha/${p}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return true;}catch{return false;}};

// ── LOGIQUE PACK ──────────────────────────────────────────────────────────
function getPackAvailableTime(){
  const now=new Date();
  const t=new Date(now);
  t.setHours(8,0,0,0);
  // Si on est avant 8h, le pack est disponible dès aujourd'hui à 8h
  // Si on est après 8h, le prochain pack est demain à 8h
  if(now>=t)t.setDate(t.getDate()+1);
  return t;
}

function isPackAvailable(lastOpenedTs){
  if(!lastOpenedTs)return true;
  const now=new Date();
  const last=new Date(lastOpenedTs);
  // Dernier pack ouvert : on calcule le "reset" à 8h du jour du dernier
  const reset=new Date(last);
  reset.setHours(8,0,0,0);
  if(last<reset)reset.setDate(reset.getDate()-1);// last était avant 8h → le reset est le jour même à 8h
  else reset.setDate(reset.getDate()+1);// last était après 8h → reset demain 8h
  return now>=reset;
}

function drawCards(){
  const pool=[];
  // Garantir au moins 1 rare ou + par pack
  const drawn=[];
  const pickOne=()=>{
    const total=Object.values(RARITY_WEIGHTS).reduce((a,b)=>a+b,0);
    let r=Math.random()*total;
    for(const[rarity,w] of Object.entries(RARITY_WEIGHTS)){r-=w;if(r<=0)return rarity;}
    return 'commun';
  };
  for(let i=0;i<5;i++){
    const rarity=i===0?pickOne():pickOne();// 1ère carte peut être n'importe quoi
    const pool2=CARDS.filter(c=>c.rarity===rarity);
    drawn.push(pool2[Math.floor(Math.random()*pool2.length)]);
  }
  // Garantie : si aucune carte rare+, remplacer la dernière
  const hasRarePlus=drawn.some(c=>['rare','ultra_rare','legendaire','ultime'].includes(c.rarity));
  if(!hasRarePlus){
    const rarePool=CARDS.filter(c=>c.rarity==='rare');
    drawn[4]=rarePool[Math.floor(Math.random()*rarePool.length)];
  }
  return drawn;
}

// l'ouverture test — les cartes (_newCards) sont déjà tirées à ce stade.
function playOpenAnimation(){
  const wrap=document.getElementById('packWrap');
  const tap=document.getElementById('packTapHint');
  const flash=document.getElementById('packFlash');
  wrap.onclick=null;
  tap.classList.add('hide');
  wrap.classList.add('opening');
  setTimeout(()=>{ flash.classList.add('show'); },430);
  setTimeout(()=>{ flash.classList.remove('show'); },560);
  setTimeout(()=>{
    document.getElementById('packScreen').classList.remove('active');
    wrap.classList.remove('opening');
    tap.classList.remove('hide');
    showCardSlider();
  },600);
}

  const ps=document.getElementById('packScreen');
  ps.classList.add('active');
  document.getElementById('packWrap').onclick=playOpenAnimation;

  // Lecture-fusion-écriture mise en file : garantit qu'aucune autre
  // opération (ranger une carte, ouvrir un autre pack) ne peut se glisser
  // entre la lecture et l'écriture, même en cas d'actions rapprochées.
  queuePlayerOp(async(d)=>{
    const now=Date.now();
    const col={...(d.collection||{})};
    _newCards.forEach(c=>{col[c.id]=(col[c.id]||0)+1;});
    // Cartes vraiment nouvelles (jamais possédées avant ce pack) → en attente
    // de rangement. On les mémorise dans Firebase, pas juste en mémoire locale,
    // pour que "à ranger" survive même si le joueur quitte sans tout placer.
    const newlyOwned=_newCards.filter(c=>col[c.id]===1).map(c=>c.id);
    const pending=Array.from(new Set([...(d.pendingPlace||[]),...newlyOwned]));
    d.collection=col;d.lastPackTs=now;d.pendingPlace=pending;
  }).then(ok=>{
    if(!ok)toast('⚠️ Connexion instable — réessaie si les cartes n\'apparaissent pas dans ton album');
  });
}

// ── SLIDER CARTES ─────────────────────────────────────────────────────────
function cardImgUrl(card){
  return `cards/${card.file}.jpg`;
}
function starsHtml(n,total=5){
  let h='';
  for(let i=0;i<total;i++)h+=`<span style="color:${i<n?'#f5c842':'rgba(255,255,255,.15)'};font-size:13px">★</span>`;
  return h;
}
function cardHtml(card){
  const isNew=(_data.collection[card.id]||0)<=1;
  const qty=_data.collection[card.id]||1;
  const cornerBadge=isNew
    ?'<div class="card-corner-badge new">✨ Nouvelle</div>'
    :(qty>1?`<div class="card-corner-badge qty">×${qty}</div>`:'');
  return`<div class="card-slide rarity-${card.rarity}">
    <div class="card-art-bg"></div>
    <img class="card-frame-img" src="cards/frames/frame_${card.rarity}.png">
    <div class="card-num-badge">N°${String(card.id).padStart(3,'0')}</div>
    ${cornerBadge}
    <div class="card-info">
      <div class="card-name">${esc(card.name)}</div>
      <div class="card-stars">${starsHtml(card.stars)}</div>
      <div class="card-rarity-label">${RARITY_LABEL[card.rarity]}</div>
    </div>
  </div>`;
}

function showCardSlider(){
  const sl=document.getElementById('cardSlider');
  const wrap=document.getElementById('sliderWrap');
  sl.classList.add('active');
  renderSlide(0);
  setupSwipe(wrap);
  document.getElementById('navPrev').onclick=()=>{ if(_curSlide>0)renderSlide(_curSlide-1); };
  document.getElementById('navNext').onclick=()=>{ if(_curSlide<_newCards.length-1)renderSlide(_curSlide+1); };
}

function renderSlide(idx){
  _curSlide=idx;
  const wrap=document.getElementById('sliderWrap');
  const header=document.getElementById('sliderHeader');
  const dots=document.getElementById('sliderDots');
  const hint=document.getElementById('slideHint');
  const btnAlbum=document.getElementById('btnGoAlbum');
  const navPrev=document.getElementById('navPrev');
  const navNext=document.getElementById('navNext');

  wrap.innerHTML=cardHtml(_newCards[idx]);
  wrap.querySelectorAll('img').forEach(img=>img.setAttribute('draggable','false'));
  header.textContent=`Carte ${idx+1} / ${_newCards.length}`;
  dots.innerHTML=_newCards.map((_,i)=>`<div class="dot${i===idx?' active':''}"></div>`).join('');
  navPrev.disabled=idx===0;
  navNext.disabled=idx===_newCards.length-1;
  const isLast=idx===_newCards.length-1;
  hint.style.opacity=isLast?'0':'1';
  btnAlbum.classList.toggle('show',isLast);
  btnAlbum.textContent='📖 Ranger dans l\'album';
  btnAlbum.onclick=()=>{
    document.getElementById('cardSlider').classList.remove('active');
    openAlbum();
  };
}

function setupSwipe(el){
  let startX=0,startY=0,dragging=false,locked=false,usedTouch=false;
  const onStart=e=>{
    if(e.type==='mousedown'&&usedTouch)return; // évite le double-déclenchement tactile + souris émulée
    if(e.type.startsWith('touch'))usedTouch=true;
    const p=e.touches?e.touches[0]:e;
    startX=p.clientX;startY=p.clientY;dragging=true;
  };
  const onEnd=e=>{
    if(e.type==='mouseup'&&usedTouch)return;
    if(!dragging||locked)return;dragging=false;
    const p=e.changedTouches?e.changedTouches[0]:e;
    const dx=p.clientX-startX, dy=p.clientY-startY;
    // ignorer si le mouvement est surtout vertical (scroll) ou trop court
    if(Math.abs(dx)<80||Math.abs(dx)<Math.abs(dy)*1.3)return;
    locked=true;
    setTimeout(()=>{locked=false;},350); // un seul changement de carte par geste
    if(dx<0&&_curSlide<_newCards.length-1)renderSlide(_curSlide+1);
    else if(dx>0&&_curSlide>0)renderSlide(_curSlide-1);
  };
  const onCancel=()=>{dragging=false;};
  el.addEventListener('touchstart',onStart,{passive:true});
  el.addEventListener('touchend',onEnd);
  el.addEventListener('touchcancel',onCancel);
  el.addEventListener('mousedown',onStart);
  el.addEventListener('mouseup',onEnd);
  el.addEventListener('mouseleave',onCancel);
}

// ── ALBUM ─────────────────────────────────────────────────────────────────
// Remet à zéro la collection de l'admin — utile après une longue session
// de tests où les packs illimités ont fait gonfler artificiellement le
// compteur. Ne touche à rien côté joueurs.
async function resetCollection(){
  if(!confirm('Remettre ta collection à 0 ? Toutes tes cartes (y compris les cartes de test) seront perdues. Cette action est irréversible.'))return;
  await queuePlayerOp(async(d)=>{
    d.collection={};
    d.pendingPlace=[];
  });
  toast('🗑️ Collection réinitialisée');
  renderHome();
}

function openAlbum(){
  // Les cartes "à ranger" viennent de Firebase (_data.pendingPlace), pas
  // d'un état local — donc si le joueur ferme sans tout placer, elles
  // restent en attente et réapparaissent la prochaine fois qu'il ouvre
  // l'album, avec le bandeau 📌.
  _placingCards=(_data.pendingPlace||[]).map(id=>CARDS.find(c=>c.id===id)).filter(Boolean);
  const al=document.getElementById('albumScreen');
  al.classList.add('active');
  renderAlbum();

  // Recharge en file (donc jamais en concurrence avec un pack en cours
  // d'ouverture ou une carte en cours de rangement) la version la plus
  // fraîche depuis Firebase — corrige silencieusement l'affichage si un
  // autre onglet/appareil avait une version plus à jour.
  queuePlayerRead(async()=>{
    _placingCards=(_data.pendingPlace||[]).map(id=>CARDS.find(c=>c.id===id)).filter(Boolean);
    if(document.getElementById('albumScreen').classList.contains('active'))renderAlbum();
  });
}
function closeAlbum(){
  document.getElementById('albumScreen').classList.remove('active');
  renderHome();
}

function renderAlbum(){
  const col=_data.collection||{};
  const owned=Object.keys(col).length;
  const pct=Math.round(owned/151*100);
  document.getElementById('covOwned').textContent=owned;
  document.getElementById('covTotal').textContent=151;
  document.getElementById('covPct').textContent=pct+'%';

  // Le bouton fermer reste toujours identique — l'info "à ranger" est
  // affichée séparément (bandeau sous l'en-tête), jamais mélangée au
  // bouton pour que "fermer" reste évident en un coup d'œil.
  const pendingBanner=document.getElementById('albumPendingBanner');
  if(_placingCards.length>0){
    pendingBanner.style.display='flex';
    pendingBanner.textContent=`📌 ${_placingCards.length} nouvelle${_placingCards.length>1?'s':''} carte${_placingCards.length>1?'s':''} à ranger ci-dessous`;
  } else {
    pendingBanner.style.display='none';
  }

  const content=document.getElementById('albumContent');
  const sections=[
    {label:'⚪ Commun — 1 à 80',ids:range(1,80)},
    {label:'🔵 Rare — 81 à 120',ids:range(81,120)},
    {label:'🟣 Ultra Rare — 121 à 140',ids:range(121,140)},
    {label:'🟡 Légendaire — 141 à 150',ids:range(141,150)},
    {label:'🔴 Ultime — 151',ids:[151]},
  ];

  content.innerHTML=sections.map(sec=>`
    <div class="album-section">
      <div class="section-label">${sec.label}</div>
      <div class="cards-grid">
        ${sec.ids.map(id=>{
          const card=CARDS.find(c=>c.id===id);
          const qty=col[id]||0;
          const toPlace=_placingCards.some(c=>c.id===id)&&qty===1;// nouvelle carte non encore rangée
          if(qty===0){
            return`<div class="album-card empty" onclick="void(0)">
              <div class="card-num">${String(id).padStart(3,'0')}</div>
            </div>`;
          }
          if(toPlace){
            return`<div class="album-card to-place rarity-${card.rarity}" onclick="placeCard(${id})">
              <div class="card-plus-btn">+</div>
              <div class="count-badge" style="${qty>1?'display:block':''}">×${qty}</div>
            </div>`;
          }
          return`<div class="album-card owned rarity-${card.rarity} ${qty>1?'multi':''}" onclick="showCardDetail(${id})">
            <div class="card-art-bg"></div>
            <img class="card-frame-img" src="cards/frames/frame_${card.rarity}.png" loading="lazy">
            ${qty>1?`<div class="count-badge">×${qty}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}

window.placeCard=function(id){
  _placingCards=_placingCards.filter(c=>c.id!==id); // retour visuel instantané
  toast('✅ Carte rangée dans l\'album !');
  renderAlbum();
  // Lecture-fusion-écriture en file : lit l'état le plus frais avant de
  // retirer la carte, pour ne jamais faire revivre une carte déjà rangée
  // depuis un autre appareil/onglet entre-temps.
  queuePlayerOp(async(d)=>{
    d.pendingPlace=(d.pendingPlace||[]).filter(pid=>pid!==id);
  });
};

window.showCardDetail=function(id){
  const card=CARDS.find(c=>c.id===id);
  const qty=(_data.collection||{})[id]||0;
  if(!card||!qty)return;
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px';
  d.innerHTML=`<div style="max-width:260px;width:100%">
    <div class="card-slide rarity-${card.rarity}" style="position:relative;border-radius:16px;width:100%;aspect-ratio:1060/1484">
      <div class="card-art-bg"></div>
      <img class="card-frame-img" src="cards/frames/frame_${card.rarity}.png">
      <div class="card-num-badge">N°${String(card.id).padStart(3,'0')}</div>
      ${qty>1?`<div class="card-corner-badge qty">×${qty}</div>`:''}
      <div class="card-info">
        <div class="card-name">${esc(card.name)}</div>
        <div class="card-stars">${starsHtml(card.stars)}</div>
        <div class="card-rarity-label">${RARITY_LABEL[card.rarity]}</div>
      </div>
    </div>
    <button onclick="this.closest('div[style*=fixed]').remove()" style="display:block;width:100%;margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Fermer</button>
  </div>`;
  document.body.appendChild(d);
  d.addEventListener('click',e=>{if(e.target===d)d.remove();});
};
</script>

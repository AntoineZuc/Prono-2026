    :root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--gold:#f5c842;--green:#14c47d;--red:#e53935;--purple:#9c27b0;--r:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(156,39,176,.15) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 40% at 80% 80%,rgba(229,57,53,.1) 0%,transparent 55%)}
    .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:18px;margin-bottom:12px}
    .btn{display:block;width:100%;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;padding:13px 20px;font-family:inherit;transition:opacity .15s;text-align:center}
    .btn:active{opacity:.75}
    .btn-purple{background:linear-gradient(135deg,#9c27b0,#6a1b9a);color:#fff;margin-top:8px}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--text);margin-top:8px}
    .btn-red{background:rgba(229,57,53,.2);border:1px solid rgba(229,57,53,.4);color:#ff6b6b;margin-top:8px}
    .btn-green{background:rgba(20,196,125,.15);border:1px solid rgba(20,196,125,.3);color:#14c47d;margin-top:8px}
    input,select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;padding:10px 14px;font-size:16px;font-family:inherit;outline:none}
    input:focus,select:focus{border-color:rgba(156,39,176,.5)}
    select option{background:#0d1628}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
    #quitBtn{display:none;position:fixed;bottom:16px;right:16px;z-index:999;background:rgba(220,50,50,.2);border:1px solid rgba(220,50,50,.4);color:#ff6b6b;border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer}
    .prow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .prow:last-child{border-bottom:none}
    .bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:6px}
    .bar-fill{height:100%;background:linear-gradient(90deg,#9c27b0,#e91e63);border-radius:4px;transition:width .4s}
    .word-card{background:linear-gradient(135deg,rgba(156,39,176,.2),rgba(233,30,99,.15));border:2px solid rgba(156,39,176,.4);border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:12px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .pulse{animation:pulse 1.5s infinite}
  </style>
</head>

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function code6(){return Math.random().toString(36).slice(2,8).toUpperCase();}

let _sess=null,_poll=null,_sid=null,_lastS=null;

// ── INIT ──
(async()=>{
  const sess=getSession();
  if(!sess){location.href='index.html';return;}
  _sess=sess;
  $('app').innerHTML='<div style="text-align:center;padding:80px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">🕵️</div>Chargement…</div>';
  const all=await fbGet('imposteur');
  if(all){
    const found=Object.entries(all).find(([,s])=>s.creatorPid===sess.pid||(s.players&&s.players[sess.pid]));
    if(found){_sid=found[0];renderSession(found[1]);startPoll();return;}
  }
  renderHome();
})();

// ── QUIT ──
window.quitSession=async function(){
  if(!_sid)return;
  const s=await fbGet(`imposteur/${_sid}`);
  const isCreator=s?.creatorPid===_sess?.pid;
  const msg=isCreator?'Supprimer la session pour tout le monde ?':'Quitter cette session ?';
  if(!confirm(msg))return;
  stopPoll();
  if(isCreator)await fbDel(`imposteur/${_sid}`);
  else await fbDel(`imposteur/${_sid}/players/${_sess.pid}`);
  _sid=null;$('quitBtn').style.display='none';renderHome();
};

function renderHome(){
  $('quitBtn').style.display='none';
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:24px;padding-top:8px">

      <div style="border-top:1px solid rgba(255,255,255,.1);margin-top:16px;padding-top:16px">
        <label>Rejoindre avec un code</label>
        <div style="display:flex;gap:8px;margin-top:6px">
          <input id="joinCode" placeholder="ABC123" style="text-transform:uppercase;font-size:18px;font-weight:700;text-align:center;letter-spacing:4px">

  $('createBtn').onclick=renderCreate;
  $('joinBtn').onclick=doJoin;
  $('joinCode').onkeydown=e=>{if(e.key==='Enter')doJoin();};
}

async function doJoin(){
  const code=($('joinCode')?.value||'').trim().toUpperCase();
  if(code.length!==6){toast('Code à 6 caractères');return;}
  const s=await fbGet(`imposteur/${code}`);
  if(!s){toast('Session introuvable');return;}
  if(s.phase!=='lobby'){toast('Partie déjà commencée');return;}
  if(s.players?.[_sess.pid]){_sid=code;startPoll();renderSession(s);return;}
  await fbPatch(`imposteur/${code}/players`,{[_sess.pid]:{name:_sess.name,pid:_sess.pid,score:0}});
  _sid=code;startPoll();
  renderSession(await fbGet(`imposteur/${code}`));
}

// ── CREATE ──
function renderCreate(){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px"><div style="font-size:36px;margin-bottom:6px">🕵️</div><div style="font-size:20px;font-weight:900">Créer une session</div></div>
    <div class="card">

        <select id="nbImp"><option value="1">1 imposteur</option><option value="2">2 imposteurs</option></select></div>

        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);margin-top:6px">
          <input type="checkbox" id="showRole" checked style="width:18px;height:18px;accent-color:#9c27b0">
          Vert = civil · Rouge = imposteur (sinon blanc pour tous)
        </label></div>
      <div style="margin-bottom:12px"><label>Mr White</label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);margin-top:6px">
          <input type="checkbox" id="allowMW" style="width:18px;height:18px;accent-color:#9c27b0">

        </label></div>
      <div style="margin-bottom:4px"><label>Score cible</label>
        <select id="targetScore"><option value="5">5 pts</option><option value="10" selected>10 pts</option><option value="15">15 pts</option></select></div>
      <button class="btn btn-purple" id="doCreate">🚀 Créer</button>
      <button class="btn btn-ghost" onclick="renderHome()">← Retour</button>
    </div>`;
  $('doCreate').onclick=async()=>{
    const sid=code6();
    await fbSet(`imposteur/${sid}`,{
      creatorPid:_sess.pid,creatorName:_sess.name,phase:'lobby',
      nbImposteurs:+$('nbImp').value,showRole:$('showRole').checked,
      allowMW:$('allowMW').checked,targetScore:+$('targetScore').value,
      players:{[_sess.pid]:{name:_sess.name,pid:_sess.pid,score:0}},
      usedWords:[],round:0,
    });
    _sid=sid;startPoll();
    renderSession(await fbGet(`imposteur/${sid}`));
  };
}

// ── RENDER SESSION ──
function renderSession(s){
  if(!s){renderHome();return;}
  $('quitBtn').style.display='block';
  const isCreator=s.creatorPid===_sess.pid;
  const players=Object.values(s.players||{});
  switch(s.phase){
    case 'lobby':  renderLobby(s,isCreator,players);break;
    case 'word':   renderWord(s,isCreator,players);break;
    case 'discuss':renderDiscuss(s,isCreator,players);break;
    case 'countdown':renderCountdown(s,Object.values(s.players||{}));break;
    case 'vote':   renderVote(s,isCreator,players);break;
    case 'result': renderResult(s,isCreator,players);break;
    case 'end':    renderEnd(s,isCreator,players);break;
  }
}

// ── START ROUND ──
async function startRound(s,players){
  const active=players.filter(p=>!p.eliminated);
  const nb=Math.min(s.nbImposteurs,Math.floor(active.length/2));
  const available=WORDS.filter(w=>!(s.usedWords||[]).includes(w.c)&&(s.allowMW||!w.mw));
  if(!available.length){toast('Plus de mots !');return;}
  const word=rnd(available);
  const imps=shuffle(active).slice(0,nb).map(p=>p.pid);
  // Premier = jamais Mr White, jamais imposteur si possible
  const civils=active.filter(p=>!imps.includes(p.pid));
  const first=rnd(civils.length?civils:active);
  const roles={};
  active.forEach(p=>{
    roles[p.pid]=imps.includes(p.pid)
      ?{role:'imposteur',word:word.mw?'':word.i,isMW:!!word.mw}
      :{role:'civil',word:word.c};
  });
  await fbPatch(`imposteur/${_sid}`,{
    phase:'word',round:(s.round||0)+1,
    word:word.c,wordImp:word.i||'',isMW:!!word.mw,
    roles,firstPid:first.pid,firstName:first.name,
    readyList:[],spokeList:[],votes:{},
    usedWords:[...(s.usedWords||[]),word.c],
  });
}

// ── PHASE COUNTDOWN ──
let _cdInterval=null;
function renderCountdown(s,players){
  const elapsed=Math.floor((Date.now()-(s.countdownStart||Date.now()))/1000);
  const remaining=Math.max(0,10-elapsed);

  $('app').innerHTML=`
    <div style="text-align:center;padding:40px 20px">
      <div style="font-size:90px;font-weight:900;color:${remaining<=3?'#ff6b6b':'var(--gold)'};line-height:1;margin-bottom:12px" id="cdNum">${remaining}</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:20px">Le vote commence dans…</div>
      <div class="bar" style="max-width:300px;margin:0 auto;height:10px">
        <div class="bar-fill" style="width:${remaining/10*100}%"></div>
      </div>
    </div>`;

  if(_cdInterval)clearInterval(_cdInterval);
  _cdInterval=setInterval(async()=>{
    const el=$('cdNum');
    const e2=Math.floor((Date.now()-(s.countdownStart||Date.now()))/1000);
    const r2=Math.max(0,10-e2);
    if(el){el.textContent=r2;el.style.color=r2<=3?'#ff6b6b':'var(--gold)';}
    const bar=document.querySelector('.bar-fill');
    if(bar)bar.style.width=(r2/10*100)+'%';
    if(r2<=0){
      clearInterval(_cdInterval);_cdInterval=null;
      // Passer au vote (seulement le créateur pour éviter les doublons)
      if(s.creatorPid===_sess.pid){
        await fbPatch(`imposteur/${_sid}`,{phase:'vote',votes:{}});
      }
    }
  },500);
}

// ── PHASE VOTE ──
function renderVote(s,isCreator,players){
  const active=players.filter(p=>!p.eliminated);
  const votes=s.votes||{};
  const myVote=votes[_sess.pid];
  const voteCount=Object.keys(votes).length;

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px;padding-top:8px">
      <div style="font-size:32px;margin-bottom:6px">🗳️</div>
      <div style="font-size:20px;font-weight:900">Vote — Manche ${s.round}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${voteCount}/${active.length} votes</div>
    </div>
    ${myVote
      ?`<div class="card" style="text-align:center;border-color:rgba(20,196,125,.3)">
          <div style="color:#14c47d;font-weight:700;font-size:14px">✅ Tu as voté pour ${esc(s.players?.[myVote]?.name||'?')}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">${voteCount}/${active.length} votes reçus</div>
        </div>`
      :`<div class="card">
          <div style="font-size:13px;font-weight:700;margin-bottom:12px">Qui est l'imposteur ?</div>
          ${active.filter(p=>p.pid!==_sess.pid).map(p=>
            `<button class="btn btn-ghost" style="margin-top:6px" onclick="castVote('${p.pid}')">🕵️ ${esc(p.name)}</button>`
          ).join('')}
        </div>`}
    ${isCreator&&voteCount>=Math.ceil(active.length/2)
      ?`<button class="btn btn-purple" id="revealBtn">🔍 Révéler le résultat</button>`:''}`;

  window.castVote=async function(targetPid){
    await fbPatch(`imposteur/${_sid}/votes`,{[_sess.pid]:targetPid});
  };
  $('revealBtn')?.addEventListener('click',async()=>{
    const btn=$('revealBtn');
    if(btn){btn.disabled=true;btn.textContent='⏳';}
    // Relire Firebase pour avoir TOUS les votes
    const s2=await fbGet(`imposteur/${_sid}`);
    const votes2=s2.votes||{};
    const counts={};
    Object.values(votes2).forEach(v=>{counts[v]=(counts[v]||0)+1;});
    if(!Object.keys(counts).length){toast('Aucun vote reçu');if(btn){btn.disabled=false;btn.textContent='🔍 Révéler le résultat';}return;}
    const maxV=Math.max(...Object.values(counts));
    const tied=Object.keys(counts).filter(pid=>counts[pid]===maxV);

    let eliminated;
    if(tied.length>1){
      // Égalité → créateur choisit parmi les ex-aequo
      eliminated=await new Promise(res=>{
        const d=document.createElement('div');
        d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
        d.innerHTML=`<div style="background:#0d1628;border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:20px;width:100%;max-width:360px;text-align:center">
          <div style="font-size:20px;font-weight:900;margin-bottom:8px">⚖️ Égalité !</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Qui élimines-tu ?</div>
          ${tied.map(pid=>`<button onclick="this.closest('div[style*=fixed]').remove();window._tie='${pid}'" style="display:block;width:100%;margin:6px 0;padding:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">${esc(s2.players?.[pid]?.name||pid)}</button>`).join('')}
        </div>`;
        document.body.appendChild(d);
        const iv=setInterval(()=>{if(window._tie){clearInterval(iv);const c=window._tie;window._tie=null;res(c);}},100);
      });
    } else {
      eliminated=tied[0];
    }

    const isImpElim=s2.roles?.[eliminated]?.role==='imposteur';
    // Calculer nouveaux scores avec s2 (état complet à jour)
    const newScores=computeNewScores(s2,eliminated,isImpElim);
    await fbPatch(`imposteur/${_sid}`,{phase:'result',eliminatedPid:eliminated,isImpElim,voteCounts:counts,votes:votes2,newScores});
  });
}

function computeNewScores(s,eliminatedPid,isImpElim){
  // Partir des scores actuels
  const scores={};
  Object.values(s.players||{}).forEach(p=>{scores[p.pid]=p.score||0;});

  // Joueurs actifs AVANT élimination (donc l'éliminé est encore dedans ici)
  const activeBefore=Object.values(s.players||{}).filter(p=>!p.eliminated);

  if(isImpElim){
    // Tous les civils actifs (hors l'éliminé) gagnent 1pt
    activeBefore
      .filter(p=>p.pid!==eliminatedPid && s.roles?.[p.pid]?.role==='civil')
      .forEach(p=>{scores[p.pid]++;});
  } else {
    // Tous les imposteurs actifs gagnent 1pt
    activeBefore
      .filter(p=>s.roles?.[p.pid]?.role==='imposteur')
      .forEach(p=>{scores[p.pid]++;});
  }
  return scores;
}

// ── PHASE RESULT ──
async function renderResult(s,isCreator,players){
  const elim=s.eliminatedPid;
  const elimName=s.players?.[elim]?.name||'?';
  const isImp=s.isImpElim;
  const active=players.filter(p=>!p.eliminated);
  const votes=s.votes||{};
  const voteCounts=s.voteCounts||{};
  const newScores=s.newScores||{};

  // Scores APRÈS la manche (déjà calculés)
  const sortedPlayers=[...players].map(p=>({...p,newScore:newScores[p.pid]??p.score}))
    .sort((a,b)=>b.newScore-a.newScore);

  // Qui a voté pour qui
  const votesByTarget={};
  Object.entries(votes).forEach(([voter,target])=>{
    if(!votesByTarget[target])votesByTarget[target]=[];
    votesByTarget[target].push(s.players?.[voter]?.name||voter);
  });

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:16px;padding-top:8px">
      <div style="font-size:48px;margin-bottom:8px">${isImp?'🎉':'😢'}</div>
      <div style="font-size:20px;font-weight:900;margin-bottom:6px">${isImp?'Bien joué !':'Mauvais vote…'}</div>
      <div style="font-size:15px;color:${isImp?'#14c47d':'#ff6b6b'}">${esc(elimName)} était ${isImp?'🔴 l\'imposteur':'🟢 un civil'} !</div>
    </div>

    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">🗳️ RÉSULTAT DES VOTES</div>
      ${Object.entries(votesByTarget).sort((a,b)=>(voteCounts[b[0]]||0)-(voteCounts[a[0]]||0)).map(([pid,voters])=>`
        <div class="prow">
          <div>
            <span style="font-size:13px;font-weight:700;color:${pid===elim?'#ff6b6b':'var(--text)'}">${esc(s.players?.[pid]?.name||'?')}${pid===elim?' 🗑':''}</span>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Voté par : ${voters.map(n=>esc(n)).join(', ')}</div>
          </div>
          <span style="font-size:16px;font-weight:900;color:${pid===elim?'#ff6b6b':'var(--muted)'}">${voteCounts[pid]||0} vote${(voteCounts[pid]||0)>1?'s':''}</span>
        </div>`).join('')}
    </div>

    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">🎭 RÔLES</div>
      ${Object.entries(s.roles||{}).map(([pid,r])=>{
        const p=s.players?.[pid];if(!p)return'';
        const gained=newScores[pid]-(p.score||0);
        return`<div class="prow">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;padding:2px 8px;border-radius:999px;background:${r.role==='imposteur'?'rgba(229,57,53,.2)':'rgba(20,196,125,.15)'};color:${r.role==='imposteur'?'#ff6b6b':'#14c47d'}">
              ${r.role==='imposteur'?(r.isMW?'Mr White':'Imposteur'):'Civil'}
            </span>
            <span style="font-size:13px;font-weight:600">${esc(p.name)}</span>
            ${r.word?`<span style="font-size:11px;color:var(--muted)">— ${esc(r.word)}</span>`:''}
          </div>
          ${gained>0?`<span style="font-size:12px;font-weight:800;color:#14c47d">+${gained}pt</span>`:''}
        </div>`;
      }).join('')}
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:13px">
        <span style="color:var(--muted)">Mot civil : </span><b>${esc(s.word)}</b>
        ${s.wordImp?`&nbsp;·&nbsp;<span style="color:var(--muted)">Mot imposteur : </span><b>${esc(s.wordImp)}</b>`:''}
      </div>
    </div>

    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">🏆 SCORES APRÈS LA MANCHE</div>
      ${sortedPlayers.map((p,i)=>`<div class="prow">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:16px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
          <span style="font-size:13px;font-weight:700;color:${p.eliminated?'rgba(255,255,255,.3)':'var(--text)'}">${esc(p.name)}${p.pid===elim?' 🚫':''}</span>
        </div>
        <span style="font-size:16px;font-weight:900;color:${p.eliminated?'rgba(255,255,255,.3)':'var(--gold)'}">${p.newScore}/${s.targetScore||10}</span>
      </div>`).join('')}
    </div>

    ${isCreator?`<button class="btn btn-purple" id="nextBtn">➡️ Manche suivante</button>`
    :'<div style="text-align:center;color:var(--muted);font-size:13px;padding:16px">En attente du créateur… <span class="pulse">⏳</span></div>'}`;

  $('nextBtn')?.addEventListener('click',async()=>{
    const btn=$('nextBtn');
    if(btn){btn.disabled=true;btn.textContent='⏳';}

    // Construire l'état final avec nouveaux scores + élimination
    const updatedPlayers={};
    Object.values(s.players||{}).forEach(p=>{
      updatedPlayers[p.pid]={
        ...p,
        score:newScores[p.pid]??p.score,
        eliminated:p.pid===elim?true:!!p.eliminated
      };
    });

    // Sauvegarder dans Firebase EN UNE SEULE opération
    await fbPatch(`imposteur/${_sid}/players`,updatedPlayers);

    // Calculer suite LOCALEMENT
    const allP=Object.values(updatedPlayers);
    const activeAfter=allP.filter(p=>!p.eliminated);
    const impsAfter=activeAfter.filter(p=>s.roles?.[p.pid]?.role==='imposteur');
    const winner=allP.find(p=>p.score>=(s.targetScore||10));
    const impossibleGame=activeAfter.length<=2||(impsAfter.length>0&&impsAfter.length*2>=activeAfter.length);

    if(winner){
      await fbPatch(`imposteur/${_sid}`,{phase:'end',winnerName:winner.name,winnerPid:winner.pid});
    } else if(impossibleGame&&impsAfter.length>0){
      const lastImp=impsAfter[0];
      updatedPlayers[lastImp.pid].score++;
      await fbPatch(`imposteur/${_sid}/players/${lastImp.pid}`,{score:updatedPlayers[lastImp.pid].score});
      await fbPatch(`imposteur/${_sid}`,{phase:'end',winnerName:lastImp.name,winnerPid:lastImp.pid,autoEnd:true});
    } else {
      // Nouvelle manche — passer l'état local à jour
      const fakeS={...s,players:updatedPlayers};
      await startRound(fakeS,activeAfter);
    }
  });
}

// ── PHASE END ──
function renderEnd(s,isCreator,players){
  if(_cdInterval){clearInterval(_cdInterval);_cdInterval=null;}
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px;padding-top:8px">
      <div style="font-size:52px;margin-bottom:8px">🏆</div>
      <div style="font-size:22px;font-weight:900">Fin de partie !</div>
      <div style="font-size:16px;color:var(--gold);margin-top:6px">🥇 ${esc(s.winnerName||'?')} gagne !</div>
      ${s.autoEnd?'<div style="font-size:12px;color:var(--muted);margin-top:4px">Victoire auto — plus assez de joueurs</div>':''}
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px">CLASSEMENT FINAL</div>
      ${sorted.map((p,i)=>`<div class="prow">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:18px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
          <span style="font-size:14px;font-weight:700">${esc(p.name)}</span>
        </div>
        <span style="font-size:18px;font-weight:900;color:var(--gold)">${p.score}pts</span>
      </div>`).join('')}
    </div>
    ${isCreator?`
    <button class="btn btn-purple" id="replayBtn">🔄 Rejouer</button>
    <button class="btn btn-red" id="closeBtn">🗑 Fermer la session</button>`:''}`;
  $('replayBtn')?.addEventListener('click',async()=>{
    const reset={};
    players.forEach(p=>{reset[p.pid]={...p,score:0,eliminated:false};});
    await fbPatch(`imposteur/${_sid}`,{phase:'lobby',players:reset,round:0,usedWords:[],roles:{},votes:{},readyList:[],spokeList:[]});
  });
  $('closeBtn')?.addEventListener('click',async()=>{
    if(!confirm('Fermer la session ?'))return;
    await fbDel(`imposteur/${_sid}`);
    _sid=null;stopPoll();$('quitBtn').style.display='none';renderHome();
  });
}

// ── POLLING ──
function startPoll(){
  stopPoll();
  _poll=setInterval(async()=>{
    const s=await fbGet(`imposteur/${_sid}`);
    if(!s){stopPoll();renderHome();return;}
    if(JSON.stringify(s)!==JSON.stringify(_lastS)){
      _lastS=s;
      if(s.phase==='countdown'){renderCountdown(s,Object.values(s.players||{}));return;}
      renderSession(s);
    }
  },1500);
}
function stopPoll(){if(_poll){clearInterval(_poll);_poll=null;}}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>L'Imposteur — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--card:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--text:#e8f0fe;--muted:#7a95b8;--gold:#f5c842;--red:#e53935;--green:#14c47d;--purple:#9c27b0;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(156,39,176,.15) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 40% at 80% 80%,rgba(229,57,53,.1) 0%,transparent 55%)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;backdrop-filter:blur(8px)}
    .btn{border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;padding:12px 20px;font-family:inherit;transition:opacity .15s}
    .btn:active{opacity:.75}
    .btn-purple{background:linear-gradient(135deg,#9c27b0,#6a1b9a);color:#fff}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text)}
    .btn-red{background:rgba(229,57,53,.2);border:1px solid rgba(229,57,53,.4);color:#ff6b6b}
    .btn-green{background:rgba(20,196,125,.15);border:1px solid rgba(20,196,125,.3);color:#14c47d}
    input,select{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:10px;color:#fff;padding:10px 14px;font-size:16px;font-family:inherit;outline:none}
    input:focus,select:focus{border-color:rgba(156,39,176,.5)}
    select option{background:#0d1628}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
    .player-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .player-row:last-child{border-bottom:none}
    .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
    .badge-civil{background:rgba(20,196,125,.15);color:#14c47d}
    .badge-imposteur{background:rgba(229,57,53,.15);color:#ff6b6b}
    .badge-mrwhite{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
    .score-bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:4px}
    .score-fill{height:100%;background:linear-gradient(90deg,#9c27b0,#e91e63);border-radius:4px;transition:width .4s}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .pulse{animation:pulse 2s infinite}
    .word-reveal{background:linear-gradient(135deg,rgba(156,39,176,.2),rgba(233,30,99,.15));border:2px solid rgba(156,39,176,.4);border-radius:16px;padding:30px 20px;text-align:center}
  </style>
</head>
<body>
<button id="portalBtn" onclick="location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:500px;margin:0 auto;padding:54px 14px 40px"></div>
<div id="toast"></div>
<script>
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _t;const toast=m=>{const e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>e.classList.remove('show'),2800);};

// ── Session ──
function getSession(){try{const d=JSON.parse(localStorage.getItem('cdm2026session'));if(!d)return null;if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}return d;}catch{return null;}}

// ── Firebase ──
const fbGet=async p=>{try{const r=await fetch(`${FB}/${p}.json`,{cache:'no-store'});return r.ok?await r.json():null;}catch{return null;}};
const fbSet=async(p,d)=>{try{await fetch(`${FB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return true;}catch{return false;}};
const fbPatch=async(p,d)=>{try{await fetch(`${FB}/${p}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return true;}catch{return false;}};
const fbDel=async p=>{try{await fetch(`${FB}/${p}.json`,{method:'DELETE'});return true;}catch{return false;}};

// ── Mots ──
const WORDS=[
  {c:"Lion",i:"Tigre"},{c:"Dauphin",i:"Requin"},{c:"Corbeau",i:"Pie"},{c:"Lapin",i:"Lièvre"},{c:"Cochon",i:"Sanglier"},{c:"Mouton",i:"Chèvre"},{c:"Cheval",i:"Âne"},{c:"Poule",i:"Dinde"},{c:"Crabe",i:"Homard"},{c:"Grenouille",i:"Crapaud"},{c:"Aigle",i:"Faucon"},{c:"Loup",i:"Coyote"},{c:"Ours",i:"Panda"},{c:"Serpent",i:"Lézard"},{c:"Baleine",i:"Orque"},
  {c:"Pizza",i:"Tarte flambée"},{c:"Hamburger",i:"Sandwich"},{c:"Sushi",i:"Maki"},{c:"Croissant",i:"Pain au chocolat"},{c:"Baguette",i:"Ficelle"},{c:"Camembert",i:"Brie"},{c:"Champagne",i:"Mousseux"},{c:"Bière",i:"Cidre"},{c:"Café",i:"Expresso"},{c:"Chocolat noir",i:"Chocolat au lait"},{c:"Fraise",i:"Framboise"},{c:"Orange",i:"Mandarine"},{c:"Citron",i:"Citron vert"},{c:"Pastèque",i:"Melon"},{c:"Noix",i:"Noisette"},{c:"Crêpe",i:"Gaufre"},{c:"Ketchup",i:"Sauce barbecue"},{c:"Moutarde",i:"Raifort"},
  {c:"Football",i:"Rugby"},{c:"Tennis",i:"Badminton"},{c:"Natation",i:"Water-polo"},{c:"Cyclisme",i:"Triathlon"},{c:"Ski alpin",i:"Snowboard"},{c:"Boxe",i:"Karaté"},{c:"Judo",i:"Lutte"},{c:"Basket",i:"Handball"},{c:"Volleyball",i:"Beach-volley"},{c:"Golf",i:"Croquet"},{c:"Escrime",i:"Tir à l'arc"},{c:"Aviron",i:"Canoë"},
  {c:"Plage",i:"Lac"},{c:"Forêt",i:"Jungle"},{c:"Montagne",i:"Colline"},{c:"Château",i:"Manoir"},{c:"Cathédrale",i:"Église"},{c:"Supermarché",i:"Épicerie"},{c:"Cinéma",i:"Théâtre"},{c:"Musée",i:"Galerie"},{c:"Hôpital",i:"Clinique"},{c:"École",i:"Université"},{c:"Prison",i:"Commissariat"},{c:"Aéroport",i:"Gare"},{c:"Stade",i:"Arène"},{c:"Piscine",i:"Spa"},

  {c:"Médecin",i:"Infirmier"},{c:"Pompier",i:"Policier"},{c:"Pilote",i:"Copilote"},{c:"Chef cuisinier",i:"Pâtissier"},{c:"Architecte",i:"Ingénieur"},{c:"Avocat",i:"Notaire"},{c:"Journaliste",i:"Présentateur"},{c:"Acteur",i:"Réalisateur"},{c:"Chanteur",i:"Musicien"},{c:"Professeur",i:"Formateur"},{c:"Agriculteur",i:"Maraîcher"},{c:"Électricien",i:"Plombier"},{c:"Boucher",i:"Charcutier"},{c:"Boulanger",i:"Pâtissier"},
  {c:"Rose",i:"Pivoine"},{c:"Tournesol",i:"Marguerite"},{c:"Chêne",i:"Hêtre"},{c:"Sapin",i:"Pin"},{c:"Bambou",i:"Roseau"},{c:"Cactus",i:"Aloé vera"},{c:"Volcan",i:"Geyser"},{c:"Cascade",i:"Rivière"},{c:"Désert",i:"Steppe"},{c:"Glacier",i:"Banquise"},
  {c:"Voiture",i:"Camion"},{c:"Moto",i:"Scooter"},{c:"Vélo",i:"Trottinette"},{c:"Bus",i:"Tramway"},{c:"Train",i:"TGV"},{c:"Avion",i:"Hélicoptère"},{c:"Bateau",i:"Ferry"},
  {c:"Mariage",i:"Fiançailles"},{c:"Anniversaire",i:"Fête"},{c:"Noël",i:"Saint-Nicolas"},{c:"Vacances",i:"Week-end"},{c:"Soleil",i:"Lune"},{c:"Pluie",i:"Grêle"},{c:"Neige",i:"Verglas"},{c:"Arc-en-ciel",i:"Aurore boréale"},
  {c:"Jean",i:"Pantalon de sport"},{c:"T-shirt",i:"Polo"},{c:"Robe",i:"Jupe"},{c:"Veste",i:"Blazer"},{c:"Manteau",i:"Parka"},{c:"Baskets",i:"Chaussures de sport"},{c:"Talons",i:"Bottines"},{c:"Sandales",i:"Tongs"},
  // Mr White
  {c:"Sel",i:"",mw:true},{c:"Chaussette",i:"",mw:true},{c:"Brosse",i:"",mw:true},{c:"Radiateur",i:"",mw:true},{c:"Robinet",i:"",mw:true},{c:"Crayon",i:"",mw:true},{c:"Rideau",i:"",mw:true},{c:"Tiroir",i:"",mw:true},
];

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}
function code6(){return Math.random().toString(36).slice(2,8).toUpperCase();}

let _sess=null,_poll=null,_lastInteraction=0;
function bump(){_lastInteraction=Date.now();}

// ── INIT ──
(async()=>{
  const sess=getSession();
  if(!sess){location.href='index.html';return;}
  _sess=sess;
  $('app').innerHTML='<div style="text-align:center;padding:80px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">🕵️</div><div>Chargement…</div></div>';
  render();
})();

// ── RENDER principal ──
async function render(){
  const sess=_sess;
  if(!sess)return;

  // Chercher une session active pour ce joueur
  const allSessions=await fbGet('imposteur');
  if(!allSessions){renderHome(sess);return;}

  // Trouver une session où ce joueur est inscrit ou créateur
  const mySession=Object.entries(allSessions).find(([,s])=>
    s.creatorPid===sess.pid || (s.players&&s.players[sess.pid])
  );

  if(!mySession){renderHome(sess);return;}
  const[sessionId,session]=mySession;
  renderSession(sess,sessionId,session);
}

// ── HOME : créer ou rejoindre ──
function renderHome(sess){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:28px;padding-top:8px">
      <div style="font-size:52px;margin-bottom:8px">🕵️</div>
      <div style="font-size:24px;font-weight:900">L'Imposteur</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">Bienvenue ${esc(sess.name||'Joueur')}</div>
    </div>
    <div class="card">
      <button class="btn btn-purple" id="createBtn" style="width:100%;font-size:15px;padding:14px;margin-bottom:12px">➕ Créer une session</button>
      <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:2px">
        <label>Rejoindre avec un code</label>
        <div style="display:flex;gap:8px;margin-top:6px">
          <input id="joinCode" placeholder="ABC123" style="text-transform:uppercase;font-size:18px;font-weight:700;text-align:center;letter-spacing:4px">
          <button class="btn btn-ghost" id="joinBtn" style="white-space:nowrap;flex-shrink:0">Rejoindre</button>
        </div>
      </div>
    </div>`;

  $('createBtn').addEventListener('click',()=>renderCreate(sess));
  $('joinBtn').addEventListener('click',async()=>{
    const code=($('joinCode')?.value||'').trim().toUpperCase();
    if(code.length!==6){toast('Code à 6 caractères');return;}
    const sessions=await fbGet('imposteur');
    if(!sessions){toast('Session introuvable');return;}
    const found=Object.entries(sessions).find(([id])=>id===code);
    if(!found){toast('Session introuvable');return;}
    const[id,s]=found;
    if(s.phase!=='lobby'){toast('Partie déjà commencée');return;}
    if(s.players&&s.players[sess.pid]){toast('Tu es déjà dans cette session');render();return;}
    await fbPatch(`imposteur/${id}/players`,{[sess.pid]:{name:sess.name||sess.pid,pid:sess.pid,score:0,eliminated:false}});
    toast('✅ Rejoint !');render();
  });
  $('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('joinBtn').click();});
}

// ── CRÉER une session ──
function renderCreate(sess){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:6px">🕵️</div>
      <div style="font-size:20px;font-weight:900">Créer une session</div>
    </div>
    <div class="card">
      <div style="margin-bottom:14px">
        <label>Nombre d'imposteurs</label>
        <select id="nbImp">
          <option value="1">1 imposteur</option>
          <option value="2">2 imposteurs</option>
        </select>

          <input type="checkbox" id="allowMrWhite" style="width:18px;height:18px;accent-color:#9c27b0;cursor:pointer">

        </label>
      </div>
      <div style="margin-bottom:8px">
        <label>Score cible</label>
        <select id="targetScore">

        </select>
      </div>
      <button class="btn btn-purple" id="doCreate" style="width:100%;margin-top:14px;font-size:14px;padding:13px">🚀 Créer</button>
      <button class="btn btn-ghost" onclick="render()" style="width:100%;margin-top:8px;font-size:13px">← Retour</button>
    </div>`;

  $('doCreate').addEventListener('click',async()=>{
    const sessionId=code6();
    const session={
      creatorPid:sess.pid,
      creatorName:sess.name||sess.pid,
      phase:'lobby',
      nbImposteurs:+$('nbImp').value,
      showRole:$('showRole').checked,
      allowMrWhite:$('allowMrWhite').checked,
      targetScore:+$('targetScore').value,
      players:{[sess.pid]:{name:sess.name||sess.pid,pid:sess.pid,score:0,eliminated:false}},
      usedWords:[],
      round:0,
      createdAt:Date.now(),
    };
    await fbSet(`imposteur/${sessionId}`,session);
    toast('✅ Session créée !');render();
  });
}

// ── SESSION ──
async function renderSession(sess,sessionId,s){
  stopPoll();
  const isCreator=s.creatorPid===sess.pid;
  const players=Object.values(s.players||{});
  const myPlayer=s.players?.[sess.pid];

  if(s.phase==='lobby') renderLobby(sess,sessionId,s,isCreator,players);
  else if(s.phase==='word') renderWord(sess,sessionId,s,isCreator,players,myPlayer);
  else if(s.phase==='turn') renderTurn(sess,sessionId,s,isCreator,players,myPlayer);
  else if(s.phase==='vote') renderVote(sess,sessionId,s,isCreator,players,myPlayer);
  else if(s.phase==='result') renderResult(sess,sessionId,s,isCreator,players);
  else if(s.phase==='end') renderEnd(sess,sessionId,s,players);

  startPoll(sess,sessionId);
}

// ── LOBBY ──
function renderLobby(sess,sessionId,s,isCreator,players){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:6px">🕵️</div>
      <div style="font-size:20px;font-weight:900">Salon d'attente</div>

        <span style="font-size:28px;font-weight:900;letter-spacing:8px;color:var(--gold);background:rgba(245,200,66,.1);border-radius:12px;padding:8px 20px">${sessionId}</span>
      </div>
      <div style="font-size:12px;color:var(--muted)">Partage ce code aux autres joueurs</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:12px;color:var(--muted)">JOUEURS (${players.length})</div>
      ${players.map(p=>`
        <div class="player-row">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:18px">${p.pid===s.creatorPid?'👑':''}</span>
            <span style="font-size:14px;font-weight:700">${esc(p.name)}</span>
          </div>
          <span style="font-size:12px;color:var(--muted)">${p.pid===sess.pid?'Toi':''}</span>
        </div>`).join('')}
    </div>
    <div class="card" style="font-size:12px;color:var(--muted)">
      <div style="margin-bottom:4px">⚙️ ${s.nbImposteurs} imposteur${s.nbImposteurs>1?'s':''} · Rôles ${s.showRole?'visibles':'cachés'} · ${s.allowMrWhite?'Mr White activé':'Sans Mr White'}</div>
      <div>🏆 Objectif : ${s.targetScore} points</div>
    </div>
    ${isCreator?`
    <button class="btn btn-purple" id="startBtn" style="width:100%;font-size:15px;padding:14px;${players.length<3?'opacity:.5;cursor:not-allowed':''}" ${players.length<3?'disabled':''}>
      ${players.length<3?'Attends au moins 3 joueurs…':'🚀 Lancer la partie'}
    </button>
    <button class="btn btn-red" id="delBtn" style="width:100%;margin-top:8px;font-size:13px">🗑 Supprimer la session</button>`
    :'<div style="text-align:center;color:var(--muted);font-size:13px;padding:16px">En attente du créateur… <span class="pulse">⏳</span></div>'}`;

  $('startBtn')?.addEventListener('click',async()=>{
    if(players.length<3){toast('Au moins 3 joueurs !');return;}
    await startRound(sessionId,s,players);
  });

  $('delBtn')?.addEventListener('click',async()=>{
    if(!confirm('Supprimer la session ?'))return;
    await fbDel(`imposteur/${sessionId}`);
    render();
  });
}

// ── DÉMARRER UNE MANCHE ──
async function startRound(sessionId,s,players){
  const active=players.filter(p=>!p.eliminated);
  const nbImp=Math.min(s.nbImposteurs,Math.floor(active.length/2));

  // Choisir un mot pas déjà utilisé
  const available=WORDS.filter(w=>!s.usedWords?.includes(w.c)&&(s.allowMrWhite||!w.mw));
  if(!available.length){toast('Plus de mots disponibles !');return;}
  const word=rand(available);
  const isMrWhite=!!word.mw;

  // Attribuer les rôles
  const shuffled=shuffle(active);
  const imposteurs=shuffled.slice(0,nbImp).map(p=>p.pid);

  // Ordre de passage : jamais un Mr White en premier
  let order=shuffle(active.filter(p=>!imposteurs.includes(p.pid)).map(p=>p.pid));
  // Ajouter les imposteurs après le premier civil
  const impOrder=shuffle(imposteurs);
  order=[order[0],...shuffle([...order.slice(1),...impOrder])];

  // Créer les rôles des joueurs
  const roles={};
  active.forEach(p=>{
    if(imposteurs.includes(p.pid)){
      roles[p.pid]={role:'imposteur',word:isMrWhite?'':word.i,isMrWhite};
    } else {
      roles[p.pid]={role:'civil',word:word.c};
    }
  });

  await fbPatch(`imposteur/${sessionId}`,{
    phase:'word',
    round:(s.round||0)+1,
    word:word.c,
    wordImposteur:word.i,
    isMrWhite,
    roles,
    order,
    currentTurnIndex:0,
    votes:{},
    usedWords:[...(s.usedWords||[]),word.c],
    eliminated:s.eliminated||[],
  });
}

// ── AFFICHAGE MOT ──
function renderWord(sess,sessionId,s,isCreator,players,myPlayer){
  if(!s.roles||!s.roles[sess.pid]){$('app').innerHTML='<div style="text-align:center;padding:80px;color:var(--muted)">Chargement…</div>';return;}
  const myRole=s.roles[sess.pid];
  const isImp=myRole.role==='imposteur';
  const isMrW=myRole.isMrWhite;
  const showRole=s.showRole;

  let wordColor='var(--text)';
  if(showRole){wordColor=isImp?'#ff6b6b':'#14c47d';}

  $('app').innerHTML=`

      <div style="font-size:12px;color:var(--muted);margin-top:2px">Mémorise ton mot et passe le téléphone</div>
    </div>

    <div class="word-reveal" style="border-color:${showRole?isImp?'rgba(229,57,53,.5)':'rgba(20,196,125,.5)':'rgba(156,39,176,.4)'}">
      ${showRole?`<div style="font-size:12px;font-weight:700;margin-bottom:12px;color:${wordColor}">${isImp?'🔴 IMPOSTEUR':'🟢 CIVIL'}</div>`:''}
      ${isMrW?`
        <div style="font-size:14px;color:rgba(255,255,255,.5);margin-bottom:8px">Tu es</div>
        <div style="font-size:32px;font-weight:900;color:#fff">Mr White</div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px">Tu n'as pas de mot. Reste discret et devine celui des autres !</div>
      `:`
        <div style="font-size:14px;color:rgba(255,255,255,.5);margin-bottom:8px">Ton mot</div>
        <div style="font-size:36px;font-weight:900;color:${wordColor}">${esc(myRole.word)}</div>
      `}
    </div>

    <div style="margin-top:20px;padding:14px;background:rgba(255,255,255,.04);border-radius:12px;font-size:12px;color:var(--muted)">
      <div style="margin-bottom:4px">👥 Ordre de passage :</div>
      ${(s.order||[]).map((pid,i)=>`<span style="margin-right:6px;color:${pid===sess.pid?'var(--gold)':'var(--muted)'}">${i+1}. ${esc(s.players[pid]?.name||pid)}</span>`).join('')}
    </div>

    <button class="btn btn-purple" id="readyBtn" style="width:100%;margin-top:16px;font-size:14px;padding:13px">✅ J'ai lu mon mot</button>`;

  $('readyBtn').addEventListener('click',async()=>{
    // Marquer ce joueur comme prêt
    await fbPatch(`imposteur/${sessionId}/ready`,{[sess.pid]:true});
    // Vérifier si tous sont prêts
    const s2=await fbGet(`imposteur/${sessionId}`);
    const active=Object.values(s2.players||{}).filter(p=>!p.eliminated);
    const ready=Object.keys(s2.ready||{});
    if(ready.length>=active.length){
      await fbPatch(`imposteur/${sessionId}`,{phase:'turn',ready:{}});
    }
    $('readyBtn').disabled=true;
    $('readyBtn').textContent='⏳ En attente des autres…';
  });
}

// ── TOUR DE TABLE ──
function renderTurn(sess,sessionId,s,isCreator,players,myPlayer){
  const order=s.order||[];
  const currentIdx=s.currentTurnIndex||0;
  const currentPid=order[currentIdx];
  const isMyTurn=currentPid===sess.pid;
  const currentName=s.players?.[currentPid]?.name||'?';
  const totalTurns=order.length;

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:32px;margin-bottom:6px">🎙️</div>
      <div style="font-size:18px;font-weight:900">Tour de table — Manche ${s.round}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${currentIdx+1} / ${totalTurns}</div>
    </div>

    <div class="card" style="text-align:center;border-color:${isMyTurn?'rgba(156,39,176,.4)':'var(--border)'}">
      ${isMyTurn?`
        <div style="font-size:48px;margin-bottom:12px">🎤</div>
        <div style="font-size:22px;font-weight:900;color:var(--purple)">C'est ton tour !</div>
        <div style="font-size:13px;color:var(--muted);margin:10px 0">Donne un mot en lien avec ton mot secret sans le révéler</div>
        <button class="btn btn-purple" id="passBtn" style="width:100%;font-size:14px;padding:13px;margin-top:8px">✅ J'ai parlé → Joueur suivant</button>
      `:`
        <div style="font-size:48px;margin-bottom:12px">⏳</div>
        <div style="font-size:22px;font-weight:900">${esc(currentName)}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px">est en train de parler…</div>
      `}
    </div>

    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">ORDRE DE PASSAGE</div>
      ${order.map((pid,i)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;opacity:${i<currentIdx?'0.4':i===currentIdx?'1':'0.7'}">
          <span style="font-size:14px;min-width:20px">${i<currentIdx?'✅':i===currentIdx?'🎤':'⏳'}</span>
          <span style="font-size:13px;font-weight:${i===currentIdx?700:400};color:${pid===sess.pid?'var(--gold)':'var(--text)'}">${esc(s.players?.[pid]?.name||'?')}${pid===sess.pid?' (toi)':''}</span>
        </div>`).join('')}
    </div>`;

  $('passBtn')?.addEventListener('click',async()=>{
    bump();
    const nextIdx=currentIdx+1;
    if(nextIdx>=totalTurns){
      // Tour complet → vote
      await fbPatch(`imposteur/${sessionId}`,{phase:'vote',currentTurnIndex:0,votes:{}});
    } else {
      await fbPatch(`imposteur/${sessionId}`,{currentTurnIndex:nextIdx});
    }
  });
}

// ── VOTE ──
function renderVote(sess,sessionId,s,isCreator,players,myPlayer){
  const votes=s.votes||{};
  const myVote=votes[sess.pid];
  const activePlayers=players.filter(p=>!p.eliminated);

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:6px">🗳️</div>
      <div style="font-size:20px;font-weight:900">Vote</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">Qui est l'imposteur ?</div>
    </div>

    ${myVote?`
    <div class="card" style="text-align:center;border-color:rgba(20,196,125,.3)">
      <div style="font-size:14px;color:#14c47d;font-weight:700">✅ Tu as voté pour ${esc(s.players?.[myVote]?.name||'?')}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">${Object.keys(votes).length} / ${activePlayers.length} votes</div>
    </div>`:`
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:14px">Clique sur le joueur suspect :</div>
      ${activePlayers.filter(p=>p.pid!==sess.pid).map(p=>`
        <button onclick="vote('${p.pid}')" class="btn btn-ghost" style="width:100%;margin-bottom:8px;font-size:14px;padding:12px;text-align:left">
          🕵️ ${esc(p.name)}
        </button>`).join('')}
    </div>`}

    <div class="card">
      <div style="font-size:12px;color:var(--muted);">Votes reçus : ${Object.keys(votes).length} / ${activePlayers.length}</div>
    </div>

    ${isCreator&&Object.keys(votes).length>=Math.ceil(activePlayers.length/2)?`
    <button class="btn btn-purple" id="revealBtn" style="width:100%;font-size:14px;padding:13px">🔍 Révéler le résultat</button>`:''}`;

  window.vote=async function(targetPid){
    bump();
    await fbPatch(`imposteur/${sessionId}/votes`,{[sess.pid]:targetPid});
  };

  $('revealBtn')?.addEventListener('click',async()=>{
    // Compter les votes
    const voteCounts={};
    Object.values(votes).forEach(v=>{voteCounts[v]=(voteCounts[v]||0)+1;});
    const maxVotes=Math.max(...Object.values(voteCounts));
    const eliminated=Object.entries(voteCounts).filter(([,v])=>v===maxVotes).map(([pid])=>pid);
    const eliminatedPid=eliminated[0];

    const isImposteur=s.roles?.[eliminatedPid]?.role==='imposteur';
    await fbPatch(`imposteur/${sessionId}`,{phase:'result',eliminatedPid,isImposteur,voteCounts});
  });
}

// ── RÉSULTAT ──
async function renderResult(sess,sessionId,s,isCreator,players){
  const elim=s.eliminatedPid;
  const elimName=s.players?.[elim]?.name||'?';
  const isImp=s.isImposteur;
  const active=players.filter(p=>!p.eliminated);

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px;padding-top:8px">
      <div style="font-size:52px;margin-bottom:8px">${isImp?'🎉':'😢'}</div>
      <div style="font-size:22px;font-weight:900;margin-bottom:6px">${isImp?'Bien joué !':'Raté…'}</div>
      <div style="font-size:16px;color:${isImp?'#14c47d':'#ff6b6b'}">${esc(elimName)} était ${isImp?'🔴 l\'imposteur':'🟢 un civil'} !</div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px">LES RÔLES</div>
      ${Object.entries(s.roles||{}).map(([pid,r])=>{
        const p=s.players?.[pid];
        if(!p)return'';
        return`<div class="player-row">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="badge ${r.role==='imposteur'?'badge-imposteur':r.isMrWhite?'badge-mrwhite':'badge-civil'}">${r.role==='imposteur'?(r.isMrWhite?'Mr White':'Imposteur'):'Civil'}</span>
            <span style="font-size:14px;font-weight:600">${esc(p.name)}</span>
          </div>
          <span style="font-size:12px;color:var(--muted)">${esc(r.word||'—')}</span>
        </div>`;
      }).join('')}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px">
        <span style="color:var(--muted)">Mot des civils : </span><b>${esc(s.word)}</b>
        ${s.wordImposteur?`<span style="color:var(--muted);margin-left:12px">Mot imposteur : </span><b>${esc(s.wordImposteur)}</b>`:''}
      </div>
    </div>

    ${isCreator?`<button class="btn btn-purple" id="nextBtn" style="width:100%;font-size:14px;padding:13px">➡️ Manche suivante</button>`
    :'<div style="text-align:center;color:var(--muted);font-size:13px;padding:16px">En attente du créateur… <span class="pulse">⏳</span></div>'}`;

  $('nextBtn')?.addEventListener('click',async()=>{
    // Mettre à jour les scores
    const scoreUpdates={};
    if(isImp){
      // Civils gagnent 1pt
      active.filter(p=>s.roles?.[p.pid]?.role==='civil').forEach(p=>{
        scoreUpdates[p.pid]={...s.players[p.pid],score:(s.players[p.pid]?.score||0)+1};
      });
    } else {
      // Imposteur gagne 1pt
      active.filter(p=>s.roles?.[p.pid]?.role==='imposteur').forEach(p=>{
        scoreUpdates[p.pid]={...s.players[p.pid],score:(s.players[p.pid]?.score||0)+1};
      });
    }

    // Éliminer le joueur voté
    if(elim&&s.players[elim]){
      scoreUpdates[elim]={...s.players[elim],eliminated:true};
    }

    await fbPatch(`imposteur/${sessionId}/players`,scoreUpdates);

    // Recharger et vérifier fin
    const s2=await fbGet(`imposteur/${sessionId}`);
    const allPlayers=Object.values({...s.players,...scoreUpdates});
    const winner=allPlayers.find(p=>p.score>=(s.targetScore||10));
    const activeAfter=allPlayers.filter(p=>!p.eliminated);
    const imposteurAfter=activeAfter.filter(p=>s2.roles?.[p.pid]?.role==='imposteur');

    if(winner){
      await fbPatch(`imposteur/${sessionId}`,{phase:'end',winner:winner.name});
    } else if(activeAfter.length<=2||imposteurAfter.length>=Math.ceil(activeAfter.length/2)){
      // Imposteur gagne car plus assez de civils
      const imp=activeAfter.find(p=>s2.roles?.[p.pid]?.role==='imposteur');
      if(imp){
        await fbPatch(`imposteur/${sessionId}/players/${imp.pid}`,{score:(imp.score||0)+1});
      }
      await fbPatch(`imposteur/${sessionId}`,{phase:'end',winner:imp?.name||'Imposteur'});
    } else {
      await startRound(sessionId,{...s,...s2,players:{...s.players,...scoreUpdates}},allPlayers.filter(p=>!p.eliminated));
    }
  });
}

// ── FIN ──
function renderEnd(sess,sessionId,s,players){
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:24px;padding-top:8px">
      <div style="font-size:52px;margin-bottom:8px">🏆</div>
      <div style="font-size:22px;font-weight:900">Fin de partie !</div>
      <div style="font-size:16px;color:var(--gold);margin-top:6px">🥇 ${esc(s.winner||'?')} gagne !</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px">CLASSEMENT</div>
      ${sorted.map((p,i)=>`
        <div class="player-row">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:20px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
            <div>
              <div style="font-size:14px;font-weight:700">${esc(p.name)}</div>
              <div class="score-bar" style="width:120px"><div class="score-fill" style="width:${Math.min(100,(p.score/(s.targetScore||10))*100)}%"></div></div>
            </div>
          </div>
          <span style="font-size:18px;font-weight:900;color:var(--gold)">${p.score}pts</span>
        </div>`).join('')}
    </div>
    ${s.creatorPid===sess.pid?`
    <button class="btn btn-purple" id="replayBtn" style="width:100%;font-size:14px;padding:13px">🔄 Rejouer</button>
    <button class="btn btn-red" id="closeBtn" style="width:100%;margin-top:8px;font-size:13px">🗑 Fermer la session</button>`:''}`;

  $('replayBtn')?.addEventListener('click',async()=>{
    const resetPlayers={};
    players.forEach(p=>{resetPlayers[p.pid]={...p,score:0,eliminated:false};});
    await fbPatch(`imposteur/${sessionId}`,{phase:'lobby',players:resetPlayers,round:0,usedWords:[],roles:{},votes:{},order:[],eliminated:[]});
    render();
  });
  $('closeBtn')?.addEventListener('click',async()=>{
    if(!confirm('Supprimer la session ?'))return;
    await fbDel(`imposteur/${sessionId}`);
    render();
  });
}

// ── POLLING ──
function startPoll(sess,sessionId){
  stopPoll();
  _poll=setInterval(async()=>{
    if(Date.now()-_lastInteraction<3000)return;
    const s=await fbGet(`imposteur/${sessionId}`);
    if(!s){stopPoll();render();return;}
    renderSession(sess,sessionId,s);
  },3000);
}
function stopPoll(){if(_poll){clearInterval(_poll);_poll=null;}}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Miss France — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--pink:#e040fb;--pink2:#ab00d6;--gold:#f5c842;--green:#14c47d;--radius:16px;--shadow:0 8px 32px rgba(0,0,0,.4)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,'Segoe UI Emoji',system-ui,sans-serif;color:var(--text);min-height:100vh;background:var(--bg);
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(224,64,251,.15) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(245,200,66,.1) 0%,transparent 55%);}
    input,select,textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:rgba(224,64,251,.6)}
    select option{background:#0d1628;color:#fff}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
    button.primary{background:linear-gradient(135deg,#e040fb,#ab00d6);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;padding:11px 20px;transition:opacity .15s}
    button.primary:hover{opacity:.85}
    button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--text);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;padding:8px 16px}
    button.secondary:hover{background:rgba(255,255,255,.14)}
    button.danger{background:rgba(220,50,50,.2);border:1px solid rgba(220,50,50,.4);color:#ff6b6b;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;padding:8px 16px}
    .card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:20px;margin-bottom:12px}
    .tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
    .tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
    .tab.active{background:rgba(224,64,251,.2);border-color:rgba(224,64,251,.5);color:#e040fb}
    .miss-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
    .miss-tag.eliminated{opacity:.35;text-decoration:line-through}
    .miss-tag.top5{border-color:rgba(245,200,66,.4);background:rgba(245,200,66,.1);color:var(--gold)}
    .badge{display:inline-block;font-size:10px;border-radius:999px;padding:2px 8px;font-weight:700;border:1px solid}
    .pts-badge{background:rgba(224,64,251,.15);color:#e040fb;border-color:rgba(224,64,251,.3)}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:12px;left:12px;z-index:8888;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}
    .rank-medal{font-size:20px}
    .score-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .score-row:last-child{border-bottom:none}
    .pick-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .pick-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;min-width:80px}
  </style>
</head>
<body>
<button id="portalBtn" onclick="window.location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:520px;margin:0 auto;padding:60px 16px 40px"></div>
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
// MISS FRANCE — Le Super Site du Zuc
// ══════════════════════════════════════════════
const FB_URL='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const MF_KEY='missf_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _tt;
const toast=msg=>{const el=$('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2600);};

function getSession(){try{const s=sessionStorage.getItem('cdm2026session');return s?JSON.parse(s):null;}catch(e){return null;}}

// ── FIREBASE ──────────────────────────────────
async function mfGet(){
  try{
    const r=await fetch(`${FB_URL}/missf.json`,{cache:'no-store'});
    if(!r.ok)return null;
    return await r.json();
  }catch(e){return null;}
}
async function mfSet(data){
  try{
    const r=await fetch(`${FB_URL}/missf.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    return r.ok;
  }catch(e){return false;}
}
async function mfPatch(data){
  try{
    const r=await fetch(`${FB_URL}/missf.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    return r.ok;
  }catch(e){return false;}
}

// ── BARÈME ────────────────────────────────────
// remaining = combien de candidates restent quand celle-ci est éliminée
// (on l'élimine quand il en reste N, donc sa "place finale" = N+1... 
//  mais en Miss France on saisit dans l'ordre décroissant)
// Place finale : 1=Miss France, 2=1ère dauphine, etc.
const POINTS_BY_PLACE={1:25,2:18,3:15,4:12,5:10};
function calcPoints(place,total){
  // place = position finale (1=gagnante)
  if(place<=5) return POINTS_BY_PLACE[place]||10;
  // Combien restent quand on a cette place : "place" candidates restantes dans le top
  // Top 15 à 6 = 5pts (places 6 à 15)
  if(place<=15) return 5;
  return 0;
}

// ── CALCUL SCORES JOUEURS ─────────────────────
function calcPlayerScore(picks,results,total){
  // picks = {p1:nom, p2:nom, p3:nom, p4:nom, p5:nom} (p1=Miss France)
  // results = {place_1:nom, place_2:nom, ...} ou tableau results[i]=nom (index 0=gagnante)
  if(!picks||!results)return{total:0,detail:[]};
  let pts=0;
  const detail=[];
  for(let place=1;place<=5;place++){
    const picked=picks['p'+place];
    if(!picked)continue;
    const actualPlace=Object.entries(results).find(([k,v])=>v===picked);
    if(!actualPlace)continue;
    const ap=parseInt(actualPlace[0].replace('place_',''));
    const base=calcPoints(ap,total);
    const bonus=(ap===place)?2:0;
    pts+=base+bonus;
    detail.push({pick:picked,pickedPlace:place,actualPlace:ap,base,bonus});
  }
  return{total:pts,detail};
}

// ── RENDU ─────────────────────────────────────
let _state=null;
let _session=null;
let _pollTimer=null;

function isLocked(edition){
  if(!edition||!edition.lockDate||!edition.lockTime)return false;
  const now=new Date();
  const lock=new Date(edition.lockDate+'T'+edition.lockTime+':00');
  return now>=lock;
}

function render(state,session){
  _state=state;_session=session;
  const app=$('app');
  if(!state||!state.edition){
    if(session.role==='admin') renderAdminSetup(app);
    else renderNoEdition(app);
    return;
  }
  const ed=state.edition;
  if(session.role==='admin') renderAdmin(app,state,ed);
  else renderPlayer(app,state,ed,session);
}

// ── VUE ADMIN : SETUP ─────────────────────────
function renderAdminSetup(app){
  app.innerHTML=`
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:44px;margin-bottom:8px">👑</div>
      <div style="font-size:22px;font-weight:900">Miss France</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Administration</div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;font-weight:800;margin:0 0 16px">Créer une édition</h2>
      <div style="margin-bottom:12px">
        <label>Titre de l'édition (ex: Miss France 2026)</label>
        <input id="mfTitle" placeholder="Miss France 2026">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div>
          <label>Date de verrouillage</label>
          <input id="mfDate" type="date">
        </div>
        <div>
          <label>Heure (Paris)</label>
          <input id="mfTime" type="time" value="21:00">
        </div>
      </div>
      <div style="margin-bottom:16px">
        <label>Candidates (une par ligne)</label>
        <textarea id="mfCandidates" rows="12" placeholder="Miss Alsace&#10;Miss Aquitaine&#10;Miss Auvergne&#10;..."></textarea>
      </div>
      <button class="primary" id="mfCreateBtn" style="width:100%">👑 Créer l'édition</button>
    </div>`;

  $('mfCreateBtn').addEventListener('click',async()=>{
    const title=($('mfTitle')?.value||'').trim();
    const date=($('mfDate')?.value||'').trim();
    const time=($('mfTime')?.value||'').trim();
    const raw=($('mfCandidates')?.value||'');
    const candidates=raw.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!title||!date||!time){toast('Remplis le titre, la date et l\'heure.');return;}
    if(candidates.length<5){toast('Entre au moins 5 candidates.');return;}
    const edition={title,lockDate:date,lockTime:time,candidates,results:{},finished:false,createdAt:Date.now()};
    const ok=await mfSet({edition,pronos:{}});
    if(ok){toast('✅ Édition créée !');const s=await mfGet();render(s,_session);}
    else toast('❌ Erreur Firebase');
  });
}

// ── VUE ADMIN : GESTION ───────────────────────
function renderAdmin(app,state,ed){
  const locked=isLocked(ed);
  const candidates=ed.candidates||[];
  const results=ed.results||{};
  const eliminated=Object.values(results);
  const remaining=candidates.filter(c=>!eliminated.includes(c));
  const pronos=state.pronos||{};

  // Calcul classement
  const scores=Object.entries(pronos).map(([pid,picks])=>{
    const sc=calcPlayerScore(picks,results,candidates.length);
    return{pid,name:picks._name||pid,score:sc.total,detail:sc.detail};
  }).sort((a,b)=>b.score-a.score);

  app.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Administration</div>
        <div style="font-size:20px;font-weight:900">👑 ${esc(ed.title)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${!ed.finished?`<button class="danger" id="mfFinishBtn">🏁 Terminer</button>
          <button id="mfArchiveBtn" style="background:rgba(224,64,251,.2);border:1px solid rgba(224,64,251,.4);color:#e040fb;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:8px 16px">📦 Archiver</button>`:'<span style="color:var(--green);font-weight:700;font-size:13px">✅ Terminé</span>'}
        <button class="secondary" id="mfDeleteBtn">🗑 Supprimer</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="classement">🏆 Classement</button>
      <button class="tab" data-tab="pronos">📋 Pronos</button>
    </div>

    <!-- TAB LIVE -->
    <div id="tab-live">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <div style="font-weight:800;font-size:14px">Candidates restantes (${remaining.length}/${candidates.length})</div>
          <div style="font-size:11px;color:${locked?'#14c47d':'#f5c842'}">${locked?'🔒 Verrouillé':'⏳ Ouvert jusqu\'au '+ed.lockDate+' '+ed.lockTime}</div>
        </div>
        ${remaining.length>0?`
        <div style="margin-bottom:14px">
          <label>Éliminer une candidate</label>
          <div style="display:flex;gap:8px">
            <select id="mfElimSelect" style="flex:1">
              <option value="">— Choisir —</option>
              ${remaining.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}
            </select>
            <button class="primary" id="mfElimBtn" style="white-space:nowrap">❌ Éliminer</button>
          </div>
        </div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${candidates.map((c,i)=>{
            const elimIdx=Object.entries(results).find(([k,v])=>v===c);
            const place=elimIdx?parseInt(elimIdx[0].replace('place_','')):null;
            const isTop5=place&&place<=5;
            const isElim=eliminated.includes(c);
            return`<span class="miss-tag ${isElim&&!isTop5?'eliminated':''} ${isTop5?'top5':''}">${esc(c)}${isTop5?` <span style="font-size:10px">${place===1?'👑':place+'e'}</span>`:''}${isElim&&!isTop5?' ❌':''}</span>`;
          }).join('')}
        </div>
        ${eliminated.length>0?`
        <div style="margin-top:16px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px">
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">RÉSULTATS SAISIS</div>
          ${Object.entries(results).sort((a,b)=>parseInt(a[0].replace('place_',''))-parseInt(b[0].replace('place_',''))).map(([k,v])=>{
            const p=parseInt(k.replace('place_',''));
            const medal=p===1?'👑':p===2?'🥈':p===3?'🥉':p+'e';
            const pts=calcPoints(p,candidates.length);
            return`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)">
              <span style="font-size:16px;min-width:28px">${medal}</span>
              <span style="flex:1;font-size:13px;font-weight:600">${esc(v)}</span>
              <span class="badge pts-badge">${pts}pts</span>
              <button onclick="undoElim('${k}')" style="background:none;border:none;color:rgba(255,100,100,.6);cursor:pointer;font-size:14px">↩</button>
            </div>`;
          }).join('')}
        </div>`:''}
      </div>
    </div>

    <!-- TAB CLASSEMENT -->
    <div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:14px">🏆 Classement (${scores.length} joueurs)</div>
        ${scores.length===0?'<div style="color:var(--muted);font-size:13px">Aucun prono enregistré.</div>':
          scores.map((s,i)=>`
          <div class="score-row">
            <div style="display:flex;align-items:center;gap:12px">
              <span class="rank-medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
              <span style="font-weight:700;font-size:14px">${esc(s.name)}</span>
            </div>
            <span style="font-size:18px;font-weight:900;color:var(--pink)">${s.score}pts</span>
          </div>`).join('')}
      </div>
    </div>

    <!-- TAB PRONOS -->
    <div id="tab-pronos" style="display:none">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:14px">📋 Pronos des joueurs</div>
        ${Object.entries(pronos).length===0?'<div style="color:var(--muted);font-size:13px">Aucun prono enregistré.</div>':
          Object.entries(pronos).map(([pid,picks])=>`
          <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.06)">
            <div style="font-weight:800;font-size:13px;margin-bottom:8px;color:var(--pink)">${esc(picks._name||pid)}</div>
            ${[1,2,3,4,5].map(p=>`
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px">
              <span style="color:var(--muted);min-width:50px">${p===1?'👑 1ère':p+'e place'}</span>
              <span style="font-weight:600">${esc(picks['p'+p]||'—')}</span>
            </div>`).join('')}
          </div>`).join('')}
      </div>
    </div>`;

  // Tabs
  app.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      app.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['live','classement','pronos'].forEach(id=>{
        const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';
      });
    });
  });

  // Éliminer
  $('mfElimBtn')?.addEventListener('click',async()=>{
    const name=$('mfElimSelect')?.value;
    if(!name){toast('Choisis une candidate.');return;}
    // La place = nombre de candidates restantes au moment de l'élimination
    const elim=Object.values(results);
    const rem=candidates.filter(c=>!elim.includes(c));
    const place=rem.length; // quand il reste N candidates, celle qu'on élimine a la place N
    const key='place_'+place;
    results[key]=name;
    const ok=await mfPatch({[`edition/results/${key}`]:name});
    if(ok){toast(`${name} éliminée (place ${place})`);const s=await mfGet();render(s,_session);}
    else toast('❌ Erreur');
  });

  // Archiver
  $('mfArchiveBtn')?.addEventListener('click',async()=>{
    if(!confirm('Archiver Miss France ?\n\nLes résultats seront sauvegardés dans l\'historique de chaque joueur, puis remis à zéro.'))return;
    toast('Archivage en cours…');
    try{
      const pronos=state.pronos||{};
      const results=ed.results||{};
      const candidates=ed.candidates||[];
      // Calculer scores
      const scores=Object.entries(pronos).map(([pid,picks])=>{
        const sc=calcPlayerScore(picks,results,candidates.length);
        return{pid,name:picks._name||pid,score:sc.total,picks};
      }).sort((a,b)=>b.score-a.score);
      // Construire entrées historique
      const archiveId='missf_'+Date.now();
      const updates={};
      scores.forEach((s,i)=>{
        updates[`${s.pid}/${archiveId}`]={
          competition:'missf',label:ed.title,date:new Date().toISOString().slice(0,10),
          rank:i+1,totalPlayers:scores.length,totalScore:s.score,
          pronos:s.picks
        };
      });
      const r=await fetch('https://prono-2026-515b8-default-rtdb.firebaseio.com/history.json',{
        method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)
      });
      if(!r.ok){toast('❌ Erreur archivage');return;}
      // Effacer l'édition
      await mfSet(null);
      toast('📦 Miss France archivée !');
      setTimeout(()=>render(null,_session),1000);
    }catch(e){toast('❌ Erreur : '+e.message);}
  });

  // Terminer
  $('mfFinishBtn')?.addEventListener('click',async()=>{
    if(!confirm('Marquer l\'édition comme terminée ?'))return;
    const ok=await mfPatch({'edition/finished':true});
    if(ok){toast('🏁 Édition terminée !');const s=await mfGet();render(s,_session);}
    else toast('❌ Erreur');
  });

  // Supprimer
  $('mfDeleteBtn')?.addEventListener('click',async()=>{
    if(!confirm('Supprimer toute l\'édition ? Cette action est irréversible.'))return;
    const ok=await mfSet(null);
    if(ok){toast('Édition supprimée');render(null,_session);}
    else toast('❌ Erreur');
  });
}

// Annuler une élimination
window.undoElim=async function(key){
  if(!confirm('Annuler cette élimination ?'))return;
  try{
    await fetch(`${FB_URL}/missf/edition/results/${key}.json`,{method:'DELETE'});
    const s=await mfGet();render(s,_session);
    toast('Élimination annulée');
  }catch(e){toast('❌ Erreur');}
};

// ── VUE JOUEUR ────────────────────────────────
function renderPlayer(app,state,ed,session){
  const locked=isLocked(ed);
  const pronos=state.pronos||{};
  const myPicks=pronos[session.pid]||{};
  const results=ed.results||{};
  const candidates=ed.candidates||[];
  const eliminated=Object.values(results);
  const myScore=calcPlayerScore(myPicks,results,candidates.length);

  // Classement
  const scores=Object.entries(pronos).map(([pid,picks])=>{
    const sc=calcPlayerScore(picks,results,candidates.length);
    return{pid,name:picks._name||pid,score:sc.total};
  }).sort((a,b)=>b.score-a.score);
  const myRank=scores.findIndex(s=>s.pid===session.pid)+1;

  app.innerHTML=`
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:40px;margin-bottom:6px">👑</div>
      <div style="font-size:20px;font-weight:900">${esc(ed.title)}</div>
      <div style="font-size:12px;color:${locked?'#14c47d':'#f5c842'};margin-top:4px">
        ${locked?'🔒 Pronos verrouillés':'⏳ Pronos ouverts jusqu\'au '+ed.lockDate+' à '+ed.lockTime}
      </div>
      ${myScore.total>0?`<div style="margin-top:10px;font-size:24px;font-weight:900;color:var(--pink)">${myScore.total} pts${myRank>0?' · '+myRank+'e':''}</div>`:''}
    </div>

    <div class="tab-bar">
      ${!locked?`<button class="tab active" data-tab="pronos">🎯 Mes pronos</button>`:''}
      <button class="tab ${locked?'active':''}" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="classement">🏆 Classement</button>
    </div>

    <!-- TAB PRONOS (seulement si pas verrouillé) -->
    ${!locked?`<div id="tab-pronos">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:6px">Ton top 5</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:16px">Qui sera Miss France ? Classe tes 5 favorites dans l'ordre.</div>
        ${[1,2,3,4,5].map(p=>`
        <div class="pick-row">
          <div class="pick-label">${p===1?'👑 Miss France':p===2?'🥈 2ème':p===3?'🥉 3ème':p+'ème'}</div>
          <select id="pick_${p}" style="flex:1">
            <option value="">— Choisir —</option>
            ${candidates.map(c=>`<option value="${esc(c)}" ${myPicks['p'+p]===c?'selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>`).join('')}
        <button class="primary" id="savePicks" style="width:100%;margin-top:8px">💾 Enregistrer mon top 5</button>
      </div>
    </div>`:''}

    <!-- TAB LIVE -->
    <div id="tab-live" style="display:${locked?'block':'none'}">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:14px">📡 Suivi en direct</div>
        ${Object.entries(results).length===0?'<div style="color:var(--muted);font-size:13px">En attente des résultats…</div>':
          Object.entries(results).sort((a,b)=>parseInt(a[0].replace('place_',''))-parseInt(b[0].replace('place_',''))).map(([k,v])=>{
            const p=parseInt(k.replace('place_',''));
            const medal=p===1?'👑':p===2?'🥈':p===3?'🥉':p+'e';
            const pts=calcPoints(p,candidates.length);
            const iMine=Object.values(myPicks).includes(v);
            return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
              <span style="font-size:16px;min-width:28px">${medal}</span>
              <span style="flex:1;font-size:13px;font-weight:${iMine?'800':'400'};color:${iMine?'var(--pink)':'var(--text)'}">${esc(v)}${iMine?' ⭐':''}</span>
              <span class="badge pts-badge">${pts}pts</span>
            </div>`;
          }).join('')}
        <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px">
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">Encore en lice (${candidates.filter(c=>!eliminated.includes(c)).length})</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${candidates.filter(c=>!eliminated.includes(c)).map(c=>{
              const iMine=Object.values(myPicks).includes(c);
              return`<span class="miss-tag ${iMine?'top5':''}">${esc(c)}</span>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- TAB CLASSEMENT -->
    <div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:14px">🏆 Classement</div>
        ${scores.length===0?'<div style="color:var(--muted);font-size:13px">Aucun prono enregistré.</div>':
          scores.map((s,i)=>`
          <div class="score-row" style="${s.pid===session.pid?'background:rgba(224,64,251,.08);border-radius:10px;padding:10px;margin:0 -8px;':''}">
            <div style="display:flex;align-items:center;gap:12px">
              <span class="rank-medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
              <div>
                <div style="font-weight:700;font-size:14px">${esc(s.name)}${s.pid===session.pid?' 👤':''}</div>
                ${locked?`<div style="font-size:11px;color:var(--muted)">${showPicks(pronos[s.pid])}</div>`:''}
              </div>
            </div>
            <span style="font-size:18px;font-weight:900;color:var(--pink)">${s.score}pts</span>
          </div>`).join('')}
      </div>
    </div>`;

  // Tabs
  app.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      app.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['pronos','live','classement'].forEach(id=>{
        const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';
      });
    });
  });

  // Sauvegarder picks
  $('savePicks')?.addEventListener('click',async()=>{
    const picks={_name:session.name||session.pid};
    const chosen=new Set();
    let valid=true;
    for(let p=1;p<=5;p++){
      const v=$('pick_'+p)?.value;
      if(!v){toast(`Choisis ta ${p===1?'Miss France':p+'ème place'}.`);valid=false;break;}
      if(chosen.has(v)){toast('Tu ne peux pas choisir la même Miss deux fois !');valid=false;break;}
      chosen.add(v);
      picks['p'+p]=v;
    }
    if(!valid)return;
    const ok=await mfPatch({[`pronos/${session.pid}`]:picks});
    if(ok)toast('✅ Top 5 enregistré !');
    else toast('❌ Erreur de sauvegarde');
  });

  // Validation doublon en temps réel
  [1,2,3,4,5].forEach(p=>{
    $('pick_'+p)?.addEventListener('change',()=>{
      const vals=[1,2,3,4,5].map(i=>$('pick_'+i)?.value).filter(Boolean);
      const dupes=vals.filter((v,i)=>vals.indexOf(v)!==i);
      if(dupes.length>0){
        $('pick_'+p).style.borderColor='rgba(220,50,50,.7)';
        toast(`⚠️ ${dupes[0]} est déjà sélectionnée !`);
      } else {
        [1,2,3,4,5].forEach(i=>{const el=$('pick_'+i);if(el)el.style.borderColor='';});
      }
    });
  });
}

function showPicks(picks){
  if(!picks)return'Pas de prono';
  return[1,2,3,4,5].map(p=>picks['p'+p]||'?').join(' › ');
}

function renderNoEdition(app){
  app.innerHTML=`
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:52px;margin-bottom:12px">👑</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">Miss France</div>
      <div style="color:var(--muted);font-size:14px">Aucune édition en cours.<br>L'administrateur créera la prochaine édition.</div>
    </div>`;
}

// ── POLLING ───────────────────────────────────
function startPolling(){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(async()=>{
    const s=await mfGet();
    if(JSON.stringify(s)!==JSON.stringify(_state)){
      render(s,_session);
    }
  },8000);
}

// ── INIT ──────────────────────────────────────
(async function(){
  const session=getSession();
  if(!session){window.location.href='index.html';return;}

  $('app').innerHTML='<div style="text-align:center;padding:80px;color:#7a95b8"><div style="font-size:32px;margin-bottom:12px">👑</div><div>Chargement…</div></div>';

  const state=await mfGet();
  render(state,session);
  startPolling();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Super Site du Zuc</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,Arial,system-ui,sans-serif;background:#0a0e1a;color:#e8f0fe;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:40px 32px;text-align:center;max-width:380px;width:100%}
    button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#e8f0fe;border-radius:12px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer}
    button:hover{background:rgba(255,255,255,.14)}
  </style>
</head>
<body>
  <div class="card">
    <div id="ico" style="font-size:56px;margin-bottom:16px"></div>
    <h1 id="ttl" style="font-size:22px;margin-bottom:8px;font-weight:900"></h1>
    <p id="sub" style="color:#7a95b8;font-size:14px;margin-bottom:28px"></p>
    <button onclick="window.location.href='index.html'">← Retour au portail</button>
  </div>
  <script>
    const pages={
      ldc:{ico:'⭐',ttl:'Ligue des Champions',sub:'Cette compétition arrive bientôt !'},
      missf:{ico:'👑',ttl:'Miss France',sub:'Cette compétition arrive bientôt !'},
      jeux:{ico:'🎲',ttl:'Jeux de société',sub:'🚧 En cours de développement — revenez bientôt !'}
    };
    const id=location.pathname.split('/').pop().replace('.html','');
    const p=pages[id]||{ico:'🏆',ttl:'Bientôt',sub:'En cours...'};
    document.getElementById('ico').textContent=p.ico;
    document.getElementById('ttl').textContent=p.ttl;
    document.getElementById('sub').textContent=p.sub;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Miss France — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--pink:#e040fb;--gold:#f5c842;--green:#14c47d;--radius:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100vh;background:var(--bg);
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(224,64,251,.15) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 40% at 80% 80%,rgba(245,200,66,.1) 0%,transparent 55%)}
    select{width:100%;padding:9px 13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
    select option{background:#0d1628;color:#fff}
    input,textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:16px;outline:none;font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:rgba(224,64,251,.6)}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
    .btn-primary{background:linear-gradient(135deg,#e040fb,#ab00d6);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;padding:11px 20px;font-family:inherit;transition:opacity .15s}
    .btn-primary:hover{opacity:.85}
    .btn-secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--text);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;padding:8px 16px;font-family:inherit}
    .btn-danger{background:rgba(220,50,50,.2);border:1px solid rgba(220,50,50,.4);color:#ff6b6b;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;padding:8px 16px;font-family:inherit}
    .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:20px;margin-bottom:12px}
    .tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
    .tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
    .tab.active{background:rgba(224,64,251,.2);border-color:rgba(224,64,251,.5);color:var(--pink)}
    .miss-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
    .miss-tag.eliminated{opacity:.3;text-decoration:line-through}
    .miss-tag.top5{border-color:rgba(224,64,251,.5);background:rgba(224,64,251,.1);color:var(--pink)}
    .miss-tag.active{border-color:rgba(224,64,251,.3);cursor:pointer}
    .miss-tag.active:hover{background:rgba(224,64,251,.12)}
    .pick-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .pick-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;min-width:72px}
    .score-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .score-row:last-child{border-bottom:none}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:12px;left:12px;z-index:888;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<button id="portalBtn" onclick="location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:520px;margin:0 auto;padding:60px 16px 40px"></div>
<div id="toast"></div>
<script>
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _tt;
const toast=m=>{const e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('show'),2600);};

// ── Session ──
function getSession(){
  try{
    const d=JSON.parse(localStorage.getItem('cdm2026session'));
    if(!d)return null;
    if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}
    return d;
  }catch(e){return null;}
}

// ── Firebase ──
const fbGet=async()=>{try{const r=await fetch(`${FB}/missf.json`,{cache:'no-store'});return r.ok?await r.json():null;}catch{return null;}};
const fbSet=async d=>{try{const r=await fetch(`${FB}/missf.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.ok;}catch{return false;}};
const fbPatch=async d=>{try{const r=await fetch(`${FB}/missf.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.ok;}catch{return false;}};
const fbSetResults=async r=>{try{const res=await fetch(`${FB}/missf/edition/results.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});return res.ok;}catch{return false;}};

// ── Barème ──
const PTS={1:25,2:18,3:15,4:12,5:10};
function calcPoints(place){
  if(place>=1&&place<=5)return PTS[place];
  // Top 15 = éliminées en phase 2 = places 6 à 15
  if(place>=6&&place<=15)return 5;
  // Places > 15 = éliminées en phase 1 = 0pts
  return 0;
}
function calcPlayerScore(picks,results,finished){
  if(!picks||!results)return{total:0,detail:[]};
  // Ne calculer les points que si l'émission est terminée
  // Sinon les places intermédiaires faussent tout
  if(!finished)return{total:0,detail:[]};
  let pts=0;const detail=[];
  for(let p=1;p<=5;p++){
    const picked=picks['p'+p];if(!picked)continue;
    const found=Object.entries(results).find(([,v])=>v===picked);if(!found)continue;
    const ap=parseInt(found[0].replace('place_',''));
    const base=calcPoints(ap);
    const bonus=ap===p?2:0;
    pts+=base+bonus;
    detail.push({pick:picked,pickedPlace:p,actualPlace:ap,base,bonus});
  }
  return{total:pts,detail};
}

// ── État ──
let _state=null,_session=null,_poll=null;

function isLocked(ed){
  if(!ed?.lockDate||!ed?.lockTime)return false;
  return Date.now()>=new Date(ed.lockDate+'T'+ed.lockTime+':00').getTime();
}

function render(state,session){
  _state=state;_session=session;
  const app=$('app');
  if(!state?.edition){
    session.role==='admin'?renderSetup(app):renderEmpty(app);
    return;
  }
  session.role==='admin'?renderAdmin(app,state,state.edition):renderPlayer(app,state,state.edition,session);
}

// ══ SETUP ADMIN ══════════════════════════════
function renderSetup(app){
  const yrs=Array.from({length:75},(_,i)=>`<option value="${2025+i}">${2025+i}</option>`).join('');
  const days=Array.from({length:31},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${String(i+1).padStart(2,'0')}</option>`).join('');
  const months=Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${String(i+1).padStart(2,'0')}</option>`).join('');

  app.innerHTML=`
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:44px;margin-bottom:8px">👑</div>
      <div style="font-size:22px;font-weight:900">Miss France</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Administration</div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;font-weight:800;margin-bottom:16px">Créer une édition</h2>
      <div style="margin-bottom:12px">
        <label>Titre</label>
        <input id="mfTitle" placeholder="Miss France 2026">
      </div>
      <div style="margin-bottom:12px">
        <label>Date de verrouillage</label>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
          <select id="mfD"><option value="">Jour</option>${days}</select>
          <select id="mfM"><option value="">Mois</option>${months}</select>
          <select id="mfY"><option value="">Année</option>${yrs}</select>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label>Heure (Paris)</label>
        <input id="mfTime" type="text" placeholder="21:00" value="21:00" inputmode="numeric">
      </div>
      <div style="margin-bottom:16px">
        <label>Candidates (une par ligne)</label>
        <textarea id="mfCands" rows="10" placeholder="Miss Alsace&#10;Miss Aquitaine&#10;..."></textarea>
      </div>
      <button class="btn-primary" id="mfCreate" style="width:100%">👑 Créer l'édition</button>
    </div>`;

  $('mfCreate').addEventListener('click',async()=>{
    const title=($('mfTitle')?.value||'').trim();
    const d=$('mfD')?.value,m=$('mfM')?.value,y=$('mfY')?.value;
    const date=d&&m&&y?`${y}-${m}-${d}`:'';
    const time=($('mfTime')?.value||'').trim();
    const candidates=($('mfCands')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if(!title||!date||!time){toast('Remplis le titre, la date et l\'heure');return;}
    if(candidates.length<5){toast('Au moins 5 candidates');return;}
    const ok=await fbSet({edition:{title,lockDate:date,lockTime:time,candidates,results:{},qualified:[],finished:false},pronos:{}});
    if(ok){toast('✅ Édition créée !');render(await fbGet(),_session);}
    else toast('❌ Erreur Firebase');
  });
}

// ══ ADMIN LIVE ═══════════════════════════════
function renderAdmin(app,state,ed){
  const locked=isLocked(ed);
  const candidates=ed.candidates||[];
  const results=ed.results||{};
  const pronos=state.pronos||{};
  const scores=Object.entries(pronos)
    .map(([pid,picks])=>({pid,name:picks._name||pid,...calcPlayerScore(picks,results,ed.finished)}))
    .sort((a,b)=>b.total-a.total);

  const elimSet=new Set(Object.values(results));
  const placed=Object.entries(results).filter(([k])=>parseInt(k.replace('place_',''))<=5).sort((a,b)=>parseInt(a[0].replace('place_',''))-parseInt(b[0].replace('place_','')));
  const stillIn=candidates.filter(c=>!elimSet.has(c));
  const qualified=new Set(ed.qualified||[]);

  app.innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Administration</div>
        <div style="font-size:20px;font-weight:900">👑 ${esc(ed.title)}</div>
        <div style="font-size:12px;color:${locked?'#14c47d':'#f5c842'};margin-top:3px">${locked?'🔒 Verrouillé':'⏳ Ouvert'}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${!ed.finished?'<button class="btn-danger" id="mfFinish">🏁 Terminer</button>':''}
        <button class="btn-secondary" id="mfArchive" style="border-color:rgba(224,64,251,.4);color:var(--pink)">📦 Archiver</button>
        <button class="btn-danger" id="mfDelete">🗑 Supprimer</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="classement">🏆 Classement</button>
      <button class="tab" data-tab="pronos">📋 Pronos</button>
    </div>

    <div id="tab-live">${buildLive(ed,candidates,results,stillIn,placed,qualified)}</div>

    <div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:14px">🏆 Classement (${scores.length} joueurs)</div>
        ${scores.length?scores.map((s,i)=>`
          <div class="score-row">
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-size:20px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
              <span style="font-weight:700;font-size:14px">${esc(s.name)}</span>
            </div>
            <span style="font-size:18px;font-weight:900;color:var(--pink)">${s.total}pts</span>
          </div>`).join(''):'<div style="color:var(--muted)">Aucun prono.</div>'}
      </div>
    </div>

    <div id="tab-pronos" style="display:none">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:14px">📋 Pronos des joueurs</div>
        ${Object.entries(pronos).length?Object.entries(pronos).map(([pid,picks])=>`
          <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)">
            <div style="font-weight:800;font-size:13px;color:var(--pink);margin-bottom:6px">${esc(picks._name||pid)}</div>
            ${[1,2,3,4,5].map(p=>`
            <div style="font-size:12px;margin-bottom:3px;display:flex;gap:8px">
              <span style="color:var(--muted);min-width:50px">${p===1?'👑 1ère':p+'e'}</span>
              <span>${esc(picks['p'+p]||'—')}</span>
            </div>`).join('')}
          </div>`).join(''):'<div style="color:var(--muted)">Aucun prono.</div>'}
      </div>
    </div>`;

  // Tabs
  app.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      app.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['live','classement','pronos'].forEach(id=>{
        const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';
      });
    });
  });

  // État local pour les clics instantanés
  let _qual=new Set(ed.qualified||[]);
  let _res={...results};

  // Clic sur une Miss
  window.missClick=async function(name,phase,target){
    if(phase===1||phase===2){
      if(_qual.has(name)){_qual.delete(name);}
      else{
        if(_qual.size>=target){toast('Déjà '+target+' sélectionnée(s) !');return;}
        _qual.add(name);
      }
      rebuildLive(ed,candidates,_res,phase,target,_qual);

    }else if(phase===3){
      _res['place_'+target]=name;
      await fbSetResults(_res);
      render(await fbGet(),_session);

    }else if(phase===4){
      if(!confirm('Désigner '+name+' comme Miss France 👑 ?'))return;
      _res['place_1']=name;
      const already=new Set(Object.values(_res));
      const runner=candidates.find(c=>!already.has(c)&&c!==name);
      if(runner)_res['place_2']=runner;
      await fbSetResults(_res);
      await fbPatch({edition:{...ed,results:_res,finished:true}});
      render(await fbGet(),_session);
    }
  };

  window.validatePhase=async function(phase,target){
    const btn=$('mfValidBtn');
    if(btn){btn.disabled=true;btn.textContent='⏳ Enregistrement…';}
    // Éliminer toutes les non-qualifiées
    const usedNums=Object.keys(_res).map(k=>parseInt(k.replace('place_',''))).filter(n=>n>5);
    let next=usedNums.length?Math.max(...usedNums)+1:6;
    candidates.forEach(c=>{
      if(!_qual.has(c)&&!Object.values(_res).includes(c)){_res['place_'+next]=c;next++;}
    });
    _qual=new Set(); // reset pour la prochaine phase
    await fetch(`${FB}/missf/edition/qualified.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify([])});
    await fbSetResults(_res);
    render(await fbGet(),_session);
  };

  window.undoElim=async function(key){
    if(!confirm('Annuler ?'))return;
    await fetch(`${FB}/missf/edition/results/${key}.json`,{method:'DELETE'});
    render(await fbGet(),_session);
  };

  $('mfFinish')?.addEventListener('click',async()=>{
    if(!confirm('Marquer comme terminée ?'))return;
    await fbPatch({edition:{...ed,finished:true}});
    render(await fbGet(),_session);
  });

  $('mfArchive')?.addEventListener('click',async()=>{
    if(!confirm('Archiver "'+ed.title+'" ?\nLes scores seront sauvegardés dans l\'historique de chaque joueur.'))return;
    toast('⏳ Archivage…');
    try{
      const res=ed.results||{};
      const nb=candidates.length;
      const sc=Object.entries(pronos).map(([pid,picks])=>{
        const{total}=calcPlayerScore(picks,res,true);
        return{pid,name:picks._name||pid,score:total};
      }).sort((a,b)=>b.score-a.score);
      const ranking=sc.map((s,i)=>({name:s.name,score:s.score,rank:i+1}));
      const id='missf_'+Date.now();
      const updates={};
      sc.forEach((s,i)=>{updates[`${s.pid}/${id}`]={competition:'missf',label:ed.title,date:new Date().toISOString().slice(0,10),rank:i+1,totalPlayers:sc.length,totalScore:s.score,ranking};});
      const r=await fetch(`${FB}/history.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)});
      if(!r.ok){toast('❌ Erreur archivage');return;}
      await fbSet(null);
      toast('📦 Archivé !');
      setTimeout(()=>render(null,_session),800);
    }catch(e){toast('❌ '+e.message);}
  });

  $('mfDelete')?.addEventListener('click',async()=>{
    if(!confirm('Supprimer "'+ed.title+'" ?\nL\'historique des joueurs ne sera PAS effacé.'))return;
    await fbSet(null);
    toast('🗑 Supprimé');
    setTimeout(()=>render(null,_session),800);
  });
}

function buildLive(ed,candidates,results,stillIn,placed,qualified){
  if(ed.finished||results.place_1){
    // Podium final
    let h='<div class="card" style="text-align:center;padding:24px">';
    h+='<div style="font-size:48px;margin-bottom:8px">👑</div>';
    h+='<div style="font-size:22px;font-weight:900">'+esc(results.place_1||'')+'</div>';
    h+='<div style="font-size:14px;color:var(--gold);margin-bottom:20px">Miss France · '+esc(ed.title)+' 🎉</div></div>';
    h+='<div class="card"><div style="font-size:13px;font-weight:800;margin-bottom:12px">🏆 Classement</div>';
    placed.forEach(([k,v])=>{
      const p=parseInt(k.replace('place_',''));
      const pts=calcPoints(p);
      const med=p===1?'👑':p===2?'🥈':p===3?'🥉':p+'e';
      h+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
        <span style="font-size:18px;min-width:28px">${med}</span>
        <span style="flex:1;font-size:14px;font-weight:700">${esc(v)}</span>
        ${pts>0?`<span style="color:var(--pink);font-weight:700">+${pts}pts</span>`:'<span style="color:var(--muted);font-size:12px">0pt</span>'}
      </div>`;
    });
    h+='</div>';
    return h;
  }

  const nb=stillIn.length;
  let phase,target;
  if(nb<=2){phase=4;target=1;}
  else if(nb<=5){phase=3;target=nb;}
  else if(nb<=15){phase=2;target=5;}
  else{phase=1;target=15;}

  return buildPhase(ed,candidates,stillIn,placed,qualified,phase,target);
}

function buildPhase(ed,candidates,stillIn,placed,qualified,phase,target){
  const cnt=qualified.size;
  const ready=cnt===target;

  if(phase===1||phase===2){
    const label=phase===1?'15 qualifiées pour le tour suivant':'5 qualifiées pour la finale';
    const btn=phase===1?'✓ Valider — passer au Top 15':'✓ Valider — passer au Top 5';
    let h=`<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-weight:800;font-size:15px">Phase ${phase}${phase===2?' — Top 15':''} · ${stillIn.length} candidates</div>
        <div style="font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:${ready?'rgba(20,196,125,.15)':'rgba(255,255,255,.06)'};color:${ready?'#14c47d':'var(--muted)'}">${cnt}/${target}</div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Clique sur les <b>${label}</b> — reclique pour désélectionner</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">`;
    stillIn.forEach(c=>{
      const isQ=qualified.has(c);
      h+=`<span class="miss-tag ${isQ?'top5':'active'}" onclick="missClick('${esc(c)}',${phase},${target})">${esc(c)}${isQ?' <span style="font-size:10px">✓</span>':''}</span>`;
    });
    h+=`</div>
      <button id="mfValidBtn" style="width:100%;padding:12px;font-size:14px;font-weight:800;border:none;border-radius:12px;font-family:inherit;cursor:${ready?'pointer':'not-allowed'};background:${ready?'linear-gradient(135deg,#14c47d,#0a9d65)':'rgba(255,255,255,.08)'};color:${ready?'#0a0e1a':'rgba(255,255,255,.3)'};" ${ready?'':'disabled'} onclick="validatePhase(${phase},${target})">${ready?btn:'Sélectionne '+target+' candidates pour continuer'}</button>
    </div>`;
    return h;
  }

  if(phase===3){
    let h=`<div class="card">
      <div style="font-weight:800;font-size:15px;margin-bottom:4px">Phase 3 — Top 5 · ${stillIn.length} restantes</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Clique sur <b>Miss ${target}ème</b></div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:14px">Il en restera ${stillIn.length-1} — continue jusqu'à ce qu'il en reste 2</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">`;
    stillIn.forEach(c=>{h+=`<span class="miss-tag active" style="font-size:14px;padding:8px 12px" onclick="missClick('${esc(c)}',3,${target})">${esc(c)}</span>`;});
    h+='</div>';
    if(placed.length){
      h+='<div style="border-top:1px solid rgba(255,255,255,.08);padding-top:12px"><div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">CLASSÉES</div>';
      placed.forEach(([k,v])=>{
        const p=parseInt(k.replace('place_',''));
        h+=`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px">
          <span style="color:#14c47d;font-weight:700;min-width:24px">${p===3?'🥉':p+'e'}</span>
          <span style="flex:1">${esc(v)}</span>
          <button onclick="undoElim('${k}')" style="background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:13px">↩</button>
        </div>`;
      });
      h+='</div>';
    }
    h+='</div>';
    return h;
  }

  // Phase 4 : Finale
  let h=`<div class="card" style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;margin-bottom:12px">👑</div>
    <div style="font-size:24px;font-weight:900;margin-bottom:20px">FINALE</div>
    <div style="display:flex;flex-direction:column;gap:12px">`;
  stillIn.forEach(c=>{
    h+=`<button onclick="missClick('${esc(c)}',4,1)" style="background:rgba(224,64,251,.15);border:2px solid rgba(224,64,251,.5);border-radius:14px;color:#fff;font-size:18px;font-weight:800;padding:20px;cursor:pointer;font-family:inherit;width:100%">${esc(c)}</button>`;
  });
  h+='</div></div>';
  return h;
}

function rebuildLive(ed,candidates,res,phase,target,qual){
  const elimSet=new Set(Object.values(res));
  const stillIn=candidates.filter(c=>!elimSet.has(c));
  const placed=Object.entries(res).filter(([k])=>parseInt(k.replace('place_',''))<=5)
    .sort((a,b)=>parseInt(a[0].replace('place_',''))-parseInt(b[0].replace('place_','')));
  const page=$('tab-live');
  if(page)page.innerHTML=buildPhase(ed,candidates,stillIn,placed,qual,phase,target);
}

// ══ VUE JOUEUR ═══════════════════════════════
function renderPlayer(app,state,ed,session){
  const locked=isLocked(ed);
  const pronos=state.pronos||{};
  const myPicks=pronos[session.pid]||{};
  const candidates=ed.candidates||[];
  const results=ed.results||{};
  const myScore=calcPlayerScore(myPicks,results,ed.finished);
  const eliminated=Object.values(results);

  const scores=Object.entries(pronos)
    .map(([pid,picks])=>({pid,name:picks._name||pid,...calcPlayerScore(picks,results,ed.finished)}))
    .sort((a,b)=>b.total-a.total);
  const myRank=scores.findIndex(s=>s.pid===session.pid)+1;
  const hasPicked=[1,2,3,4,5].every(p=>myPicks['p'+p]);
  const canEdit=!locked;

  app.innerHTML=`
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:40px;margin-bottom:6px">👑</div>
      <div style="font-size:20px;font-weight:900">${esc(ed.title)}</div>
      <div style="font-size:12px;margin-top:4px;color:${locked?'var(--green)':hasPicked?'var(--green)':'var(--gold)'}">
        ${locked?'🔒 Pronos verrouillés':hasPicked?'✅ Top 5 enregistré — modifiable jusqu\'au verrouillage':'⏳ Ouvert jusqu\'au '+ed.lockDate+' à '+ed.lockTime}
      </div>
      ${myScore.total>0?`<div style="margin-top:10px;font-size:22px;font-weight:900;color:var(--pink)">${myScore.total}pts${myRank>0?' · '+myRank+'e':''}</div>`:''}
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="pronos">🎯 Mes pronos</button>
      <button class="tab" data-tab="live">📡 Live</button>
      <button class="tab" data-tab="classement">🏆 Classement</button>
    </div>

    <!-- Pronos -->
    <div id="tab-pronos">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:8px">Ton top 5</div>
        ${canEdit?`
        <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Classe tes 5 favorites dans l'ordre. Tu peux modifier jusqu'au verrouillage.</div>
        ${[1,2,3,4,5].map(p=>`
        <div class="pick-row">
          <div class="pick-label">${p===1?'👑 1ère':p===2?'🥈 2ème':p===3?'🥉 3ème':p+'ème'}</div>
          <select id="pick_${p}">
            <option value="">— Choisir —</option>
            ${candidates.map(c=>`<option value="${esc(c)}"${myPicks['p'+p]===c?' selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>`).join('')}
        <button class="btn-primary" id="savePicks" style="width:100%;margin-top:10px">${hasPicked?'🔄 Modifier mon top 5':'💾 Enregistrer mon top 5'}</button>`
        :`
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Pronos verrouillés.</div>
        ${hasPicked?[1,2,3,4,5].map(p=>`
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <span style="font-size:16px;min-width:28px">${p===1?'👑':p===2?'🥈':p===3?'🥉':p+'e'}</span>
            <span style="font-size:14px;font-weight:700;flex:1">${esc(myPicks['p'+p]||'—')}</span>
            ${results['place_'+p]?`<span style="font-size:11px;color:${myPicks['p'+p]===results['place_'+p]?'#14c47d':'rgba(255,255,255,.3)'}">→ ${esc(results['place_'+p])}</span>`:''}
          </div>`).join(''):'<div style="color:var(--muted);font-size:13px">Aucun prono.</div>'}
        `}
      </div>
    </div>

    <!-- Live (visible seulement après verrouillage) -->
    <div id="tab-live" style="display:none">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:12px">📡 ${locked?'Résultats en direct':'En attente du début de l\'émission'}</div>
        ${!locked&&Object.keys(results).length===0?`
          <div style="color:var(--muted);font-size:13px;margin-bottom:16px">L'émission n'a pas encore commencé. Les résultats apparaîtront ici en direct dès que l'admin commencera la saisie.</div>
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">Tes pronostics :</div>
          ${[1,2,3,4,5].map(p=>`
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)">
            <span style="font-size:14px;min-width:26px">${p===1?'👑':p===2?'🥈':p===3?'🥉':p+'e'}</span>
            <span style="font-size:13px;font-weight:600;color:var(--pink)">${esc(myPicks['p'+p]||'—')}</span>
          </div>`).join('')}
        `:`
        ${Object.keys(results).length===0?'<div style="color:var(--muted)">En attente des résultats…</div>':
          Object.entries(results).sort((a,b)=>parseInt(a[0].replace('place_',''))-parseInt(b[0].replace('place_',''))).map(([k,v])=>{
            const p=parseInt(k.replace('place_',''));
            const med=p===1?'👑':p===2?'🥈':p===3?'🥉':p<=15?p+'e':'';
            const pts=ed.finished?calcPoints(p):0;
            const mine=Object.values(myPicks).includes(v);
            // Afficher top5 et top15 seulement (pas les éliminées phase 1)
            if(p>15)return'';
            return`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)">
              <span style="font-size:15px;min-width:26px">${med}</span>
              <span style="flex:1;font-size:13px;font-weight:${mine?800:400};color:${mine?'var(--pink)':'var(--text)'}">${esc(v)}${mine?' ⭐':''}</span>
              ${ed.finished?`<span style="font-size:12px;color:var(--pink);font-weight:700">${pts>0?'+'+pts+'pts':'0pt'}</span>`:''}
            </div>`;
          }).join('')}
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)">
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">Encore en lice (${candidates.filter(c=>!eliminated.includes(c)).length})</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${candidates.filter(c=>!eliminated.includes(c)).map(c=>`<span class="miss-tag ${Object.values(myPicks).includes(c)?'top5':''}">${esc(c)}</span>`).join('')}
          </div>
        </div>`}
      </div>
    </div>

    <!-- Classement -->
    <div id="tab-classement" style="display:none">
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:12px">🏆 Classement</div>
        ${scores.length?scores.map((s,i)=>`
          <div class="score-row" ${s.pid===session.pid?'style="background:rgba(224,64,251,.08);border-radius:10px;padding:10px;margin:0 -8px"':''}>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:18px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
              <div>
                <div style="font-weight:700">${esc(s.name)}${s.pid===session.pid?' 👤':''}</div>
                ${locked?`<div style="font-size:11px;color:var(--muted)">${[1,2,3,4,5].map(p=>esc(pronos[s.pid]?.['p'+p]||'?')).join(' › ')}</div>`:''}
              </div>
            </div>
            <span style="font-size:18px;font-weight:900;color:var(--pink)">${s.total}pts</span>
          </div>`).join(''):'<div style="color:var(--muted)">Aucun prono.</div>'}
      </div>
    </div>`;

  // Tabs
  app.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      app.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['pronos','live','classement'].forEach(id=>{
        const el=$('tab-'+id);if(el)el.style.display=t.dataset.tab===id?'block':'none';
      });
    });
  });

  if(canEdit){
    $('savePicks')?.addEventListener('click',async()=>{
      const picks={_name:session.name||session.pid};
      const seen=new Set();let ok=true;
      for(let p=1;p<=5;p++){
        const v=$('pick_'+p)?.value;
        if(!v){toast('Choisis la '+(p===1?'Miss France':p+'ème place'));ok=false;break;}
        if(seen.has(v)){toast(v+' est déjà dans ton top 5 !');ok=false;break;}
        seen.add(v);picks['p'+p]=v;
      }
      if(!ok)return;
      if(!confirm('Confirmes-tu ton top 5 ?'))return;
      const res=await fbPatch({[`pronos/${session.pid}`]:picks});
      if(res){toast('✅ Top 5 enregistré !');render(await fbGet(),_session);}
      else toast('❌ Erreur');
    });

    // Détection doublons en temps réel
    [1,2,3,4,5].forEach(p=>{
      $('pick_'+p)?.addEventListener('change',()=>{
        const vals=[1,2,3,4,5].map(i=>$('pick_'+i)?.value).filter(Boolean);
        const dup=vals.find((v,i)=>vals.indexOf(v)!==i);
        [1,2,3,4,5].forEach(i=>{const e=$('pick_'+i);if(e)e.style.borderColor='';});
        if(dup)toast('⚠️ '+dup+' déjà sélectionnée !');
      });
    });
  }
}

function renderEmpty(app){
  app.innerHTML=`<div style="text-align:center;padding:60px 20px">
    <div style="font-size:52px;margin-bottom:12px">👑</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:8px">Miss France</div>
    <div style="color:var(--muted)">Aucune édition en cours.</div>
  </div>`;
}

// ── Polling ──
function startPolling(){
  if(_poll)clearInterval(_poll);
  _poll=setInterval(async()=>{
    const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))return;
    const s=await fbGet();
    if(JSON.stringify(s)!==JSON.stringify(_state)){
      const activeTab=document.querySelector('.tab.active')?.dataset?.tab;
      render(s,_session);
      if(activeTab){
        const t=document.querySelector(`.tab[data-tab="${activeTab}"]`);
        if(t){
          document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
          t.classList.add('active');
          ['pronos','live','classement'].forEach(id=>{
            const e=document.getElementById('tab-'+id);
            if(e)e.style.display=id===activeTab?'block':'none';
          });
        }
      }
    }
  },8000);
}

// ── Init ──
(async()=>{
  const session=getSession();
  if(!session){location.href='index.html';return;}
  $('app').innerHTML='<div style="text-align:center;padding:80px;color:var(--muted)"><div style="font-size:32px;margin-bottom:12px">👑</div><div>Chargement…</div></div>';
  render(await fbGet(),session);
  startPolling();
})();
</script>

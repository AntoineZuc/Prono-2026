<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LDC — Le Super Site du Zuc</title>
<style>
:root{--bg:#0a0e1a;--text:#e8f0fe;--muted:#7a95b8;--blue:#1a73e8;--gold:#f5c842;--green:#14c47d;--red:#e53935;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(26,115,232,.15) 0%,transparent 60%),
                   radial-gradient(ellipse 60% 40% at 80% 80%,rgba(245,200,66,.08) 0%,transparent 55%)}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:18px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:10px 18px;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-blue{background:linear-gradient(135deg,#1a73e8,#0d5cc7);color:#fff}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--text)}
.btn-green{background:rgba(20,196,125,.15);border:1px solid rgba(20,196,125,.3);color:#14c47d}
.btn-red{background:rgba(229,57,53,.15);border:1px solid rgba(229,57,53,.3);color:#ff6b6b}
.btn-gold{background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a0e1a}
.btn-full{width:100%;margin-top:8px}
input,select,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;padding:10px 14px;font-size:15px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:rgba(26,115,232,.6)}
select option{background:#0d1628}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
.tab.active{background:rgba(26,115,232,.2);border-color:rgba(26,115,232,.5);color:#6ab4ff}
.match-card{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;margin-bottom:6px;gap:8px}
.match-card.validated{border-color:rgba(20,196,125,.25);background:rgba(20,196,125,.05)}
.match-card.my-prono{border-color:rgba(26,115,232,.3)}
.team{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.team img{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-inp{width:36px;text-align:center;padding:6px 2px;font-size:16px;font-weight:900;border-radius:8px}
.score-sep{font-size:16px;font-weight:900;color:var(--muted);margin:0 2px}
.cls-table{width:100%;border-collapse:collapse;font-size:12px}
.cls-table th{padding:5px 8px;text-align:center;color:var(--muted);font-weight:700;font-size:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.cls-table td{padding:6px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.cls-table tr:last-child td{border-bottom:none}
.cls-table td:nth-child(2){text-align:left}
.zone-q8{background:rgba(26,115,232,.1)}
.zone-playoff{background:rgba(245,200,66,.08)}
.zone-out{opacity:.5}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<button id="portalBtn" onclick="location.href='index.html'">⬅ Portail</button>
<div id="app" style="max-width:560px;margin:0 auto;padding:54px 14px 40px"></div>
<div id="toast"></div>
<script>
// ── Constantes ──────────────────────────────────────────────────────────────
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const LDC_PATH='ldc2';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _tt;
const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('show'),2800);};

// ── Auth ─────────────────────────────────────────────────────────────────────
function hashPwd(p){let h=0;for(let i=0;i<p.length;i++)h=Math.imul(31,h)+p.charCodeAt(i)|0;return h.toString(36);}
function getSession(){try{const d=JSON.parse(localStorage.getItem('cdm2026session'));if(!d)return null;if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}return d;}catch{return null;}}

// ── Firebase ─────────────────────────────────────────────────────────────────
const fb=async(p,m='GET',d)=>{try{const r=await fetch(`${FB}/${LDC_PATH}/${p}.json`,{method:m,cache:'no-store',...(d?{headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}:{})});return r.ok?await r.json():null;}catch{return null;}};
const fbGet=p=>fb(p);
const fbSet=(p,d)=>fb(p,'PUT',d);
const fbPatch=(p,d)=>fb(p,'PATCH',d);
const fbDel=p=>fb(p,'DELETE');
const fbRoot=async()=>{try{const r=await fetch(`${FB}/${LDC_PATH}.json`,{cache:'no-store'});return r.ok?await r.json():null;}catch{return null;}};

// ── Groupes d'accès ───────────────────────────────────────────────────────────
function getMyGroups(pid){const s=JSON.parse(localStorage.getItem('ldc_access_groups')||'{}');return s[pid]||[];}
function saveMyGroup(pid,code,name){const s=JSON.parse(localStorage.getItem('ldc_access_groups')||'{}');const g=s[pid]||[];if(!g.find(x=>x.code===code)){g.push({code,name});s[pid]=g;localStorage.setItem('ldc_access_groups',JSON.stringify(s));}}

// ── Logos clubs ───────────────────────────────────────────────────────────────
const LDC_CLUBS={
  MCI:{name:'Manchester City',crest:'https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg'},
  ARS:{name:'Arsenal',crest:'https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg'},
  CHE:{name:'Chelsea',crest:'https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg'},
  LIV:{name:'Liverpool',crest:'https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg'},
  MUN:{name:'Manchester United',crest:'https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg'},
  TOT:{name:'Tottenham',crest:'https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg'},
  RMA:{name:'Real Madrid',crest:'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg'},
  BAR:{name:'Barcelone',crest:'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg'},
  ATM:{name:'Atlético Madrid',crest:'https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_de_Madrid_2017_logo.svg'},
  BAY:{name:'Bayern Munich',crest:'https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282002%E2%80%932017%29.svg'},
  BVB:{name:'Borussia Dortmund',crest:'https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg'},
  B04:{name:'Bayer Leverkusen',crest:'https://upload.wikimedia.org/wikipedia/en/5/59/Bayer_04_Leverkusen_logo.svg'},
  RBL:{name:'RB Leipzig',crest:'https://upload.wikimedia.org/wikipedia/en/0/04/RB_Leipzig_2014_logo.svg'},
  PSG:{name:'Paris Saint-Germain',crest:'https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg'},
  LYO:{name:'Lyon',crest:'https://upload.wikimedia.org/wikipedia/en/e/e2/Olympique_Lyonnais.svg'},
  MON:{name:'Monaco',crest:'https://upload.wikimedia.org/wikipedia/en/e/ea/AS_Monaco_FC.svg'},
  LIL:{name:'Lille',crest:'https://upload.wikimedia.org/wikipedia/en/4/42/LOSC_Lille_logo.svg'},
  JUV:{name:'Juventus',crest:'https://upload.wikimedia.org/wikipedia/commons/1/15/Juventus_FC_2017_icon_%28black%29.svg'},
  INT:{name:'Inter Milan',crest:'https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg'},
  MIL:{name:'AC Milan',crest:'https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg'},
  NAP:{name:'Naples',crest:'https://upload.wikimedia.org/wikipedia/commons/2/2d/SSC_Napoli_2007.svg'},
  ATA:{name:'Atalanta',crest:'https://upload.wikimedia.org/wikipedia/en/6/66/Logo_Atalanta_orobica.svg'},
  SLB:{name:'Benfica',crest:'https://upload.wikimedia.org/wikipedia/en/a/a2/SL_Benfica_logo.svg'},
  SCP:{name:'Sporting CP',crest:'https://upload.wikimedia.org/wikipedia/en/f/f1/Sporting_CP_logo.svg'},
  FCP:{name:'Porto',crest:'https://upload.wikimedia.org/wikipedia/en/f/f1/FC_Porto.svg'},
  AJX:{name:'Ajax',crest:'https://upload.wikimedia.org/wikipedia/en/7/79/Ajax_Amsterdam.svg'},
  PSV:{name:'PSV Eindhoven',crest:'https://upload.wikimedia.org/wikipedia/en/0/05/PSV_Eindhoven.svg'},
  FEY:{name:'Feyenoord',crest:'https://upload.wikimedia.org/wikipedia/en/b/b1/Feyenoord_logo.svg'},
  CLB:{name:'Club Bruges',crest:'https://upload.wikimedia.org/wikipedia/en/b/b2/Club-bruges.svg'},
  CEL:{name:'Celtic',crest:'https://upload.wikimedia.org/wikipedia/en/3/35/Celtic_FC.svg'},
  STU:{name:'Stuttgart',crest:'https://upload.wikimedia.org/wikipedia/commons/b/bd/VfB_Stuttgart_1893_Logo.svg'},
  GIR:{name:'Gérone',crest:'https://upload.wikimedia.org/wikipedia/en/6/6e/Girona_FC_logo.svg'},
  SHK:{name:'Shakhtar',crest:'https://upload.wikimedia.org/wikipedia/en/a/ab/Shakhtar_Donetsk_logo.svg'},
  BRS:{name:'Brest',crest:'https://upload.wikimedia.org/wikipedia/en/0/0f/Stade_Brestois_29_logo.svg'},
  AVL:{name:'Aston Villa',crest:'https://upload.wikimedia.org/wikipedia/en/f/f9/Aston_Villa_FC_crest_%282016%29.svg'},
  SPO:{name:'Sporting',crest:'https://upload.wikimedia.org/wikipedia/en/f/f1/Sporting_CP_logo.svg'},
};
const teamName=code=>{const t=_state?.teams?.[code];return t?.name||LDC_CLUBS[code]?.name||code||'?';};
const teamCrest=code=>{const t=_state?.teams?.[code];return t?.crest||LDC_CLUBS[code]?.crest||null;};
function teamHtml(code,maxW=120){
  const name=teamName(code);const crest=teamCrest(code);
  return`<span class="team" style="max-width:${maxW}px">${crest?`<img src="${esc(crest)}" onerror="this.style.display='none'">`:''}
    <span title="${esc(name)}">${esc(name)}</span></span>`;
}

// ── Points ────────────────────────────────────────────────────────────────────
const PTS_EXACT=3,PTS_RESULT=1;
function calcPronoPoints(pronoA,pronoB,realA,realB){
  if(pronoA==null||pronoB==null||realA==null||realB==null)return 0;
  if(pronoA===realA&&pronoB===realB)return PTS_EXACT;
  const sign=n=>n>0?1:n<0?-1:0;
  if(sign(pronoA-pronoB)===sign(realA-realB))return PTS_RESULT;
  return 0;
}

// ── Classement phase championnat ──────────────────────────────────────────────
function buildLeagueTable(matches,scores){
  const t={};
  const init=c=>{if(!t[c])t[c]={code:c,j:0,g:0,n:0,p:0,bp:0,bc:0,pts:0};};
  matches.forEach(m=>{
    if(!m.teamA||!m.teamB)return;
    init(m.teamA);init(m.teamB);
    const s=scores[m.id];
    if(!s||s.scoreA==null||s.scoreB==null)return;
    const a=+s.scoreA,b=+s.scoreB;
    t[m.teamA].j++;t[m.teamB].j++;
    t[m.teamA].bp+=a;t[m.teamA].bc+=b;
    t[m.teamB].bp+=b;t[m.teamB].bc+=a;
    if(a>b){t[m.teamA].g++;t[m.teamA].pts+=3;t[m.teamB].p++;}
    else if(a<b){t[m.teamB].g++;t[m.teamB].pts+=3;t[m.teamA].p++;}
    else{t[m.teamA].n++;t[m.teamA].pts++;t[m.teamB].n++;t[m.teamB].pts++;}
  });
  return Object.values(t).sort((a,b)=>b.pts-a.pts||(b.bp-b.bc)-(a.bp-a.bc)||b.bp-a.bp);
}

// ── Etat global ───────────────────────────────────────────────────────────────
let _state=null,_sess=null,_poll=null,_lastData=null;

// ── INIT ──────────────────────────────────────────────────────────────────────
(async()=>{
  const sess=getSession();
  if(!sess){location.href='index.html';return;}
  _sess=sess;
  $('app').innerHTML='<div style="text-align:center;padding:80px;color:var(--muted)"><div style="font-size:36px;margin-bottom:12px">⭐</div>Chargement…</div>';

  // Vérif groupe d'accès pour les joueurs
  if(sess.role!=='admin'){
    const groups=getMyGroups(sess.pid);
    if(!groups.length){
      renderCodeGate();return;
    }
  }

  const data=await fbRoot();
  _state=data||{};
  render();
  startPoll();
})();

// ── Ecran code d'accès ────────────────────────────────────────────────────────
function renderCodeGate(){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:28px;padding-top:16px">
      <div style="font-size:52px;margin-bottom:10px">⭐</div>
      <div style="font-size:22px;font-weight:900">Ligue des Champions</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">Saisis le code d'accès fourni par l'admin</div>
    </div>
    <div class="card">
      <label>Code du groupe</label>
      <input id="gCode" placeholder="Ex: FAMILLE26" style="text-transform:uppercase;font-size:20px;font-weight:700;text-align:center;letter-spacing:3px;margin-top:4px" maxlength="10">
      <button class="btn btn-blue btn-full" id="gBtn" style="margin-top:12px">✅ Rejoindre</button>
      <div id="gErr" style="color:#ff6b6b;font-size:12px;text-align:center;margin-top:8px;display:none">Code introuvable</div>
    </div>`;
  async function tryJoin(){
    const code=($('gCode')?.value||'').trim().toUpperCase();
    if(!code)return;
    const btn=$('gBtn');btn.disabled=true;btn.textContent='⏳';
    const grp=await fbGet(`../ldcGroups/${code}`);
    if(!grp||!grp.name){
      const err=$('gErr');if(err)err.style.display='block';
      btn.disabled=false;btn.textContent='✅ Rejoindre';return;
    }
    const members=grp.members||[];
    if(!members.includes(_sess.pid)){
      await fetch(`${FB}/ldcGroups/${code}/members.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify([...members,_sess.pid])});
    }
    saveMyGroup(_sess.pid,code,grp.name);
    const data=await fbRoot();_state=data||{};
    render();startPoll();
  }
  $('gBtn').addEventListener('click',tryJoin);
  $('gCode').addEventListener('keydown',e=>{if(e.key==='Enter')tryJoin();});
}

// ── RENDER principal ──────────────────────────────────────────────────────────
function render(){
  if(!_state?.edition){
    _sess.role==='admin'?renderAdminSetup():renderNoEdition();return;
  }
  _sess.role==='admin'?renderAdmin():renderPlayer();
}

// ── PAS D'ÉDITION ─────────────────────────────────────────────────────────────
function renderNoEdition(){
  $('app').innerHTML=`
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:52px;margin-bottom:12px">⭐</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">Ligue des Champions</div>
      <div style="color:var(--muted)">Aucune édition en cours.</div>
    </div>`;
}

// ── SETUP ADMIN ───────────────────────────────────────────────────────────────
function renderAdminSetup(){
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:24px;padding-top:8px">
      <div style="font-size:44px;margin-bottom:8px">⭐</div>
      <div style="font-size:22px;font-weight:900">LDC — Administration</div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;font-weight:800;margin-bottom:16px">Créer une édition</h2>
      <div style="margin-bottom:12px"><label>Nom (ex: LDC 2025-26)</label><input id="edName" placeholder="LDC 2025-26"></div>
      <div style="margin-bottom:16px">
        <label>Barème des points</label>
        <div style="display:flex;gap:8px;margin-top:4px">
          <div style="flex:1"><label style="text-transform:none;font-size:12px">Score exact</label><input id="ptsExact" type="number" value="3" min="1" max="10"></div>
          <div style="flex:1"><label style="text-transform:none;font-size:12px">Bon résultat</label><input id="ptsResult" type="number" value="1" min="0" max="5"></div>
        </div>
      </div>
      <div style="margin-bottom:16px">
        <label>Importer les matchs — football-data.org</label>
        <div style="display:flex;gap:8px;margin-top:4px">
          <input id="fdKey" placeholder="Clé API" style="flex:1;font-size:13px">
          <a href="https://www.football-data.org/client/register" target="_blank" style="white-space:nowrap;background:rgba(26,115,232,.12);border:1px solid rgba(26,115,232,.3);color:#6ab4ff;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;text-decoration:none;display:flex;align-items:center">Clé gratuite →</a>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <select id="fdSeason" style="flex:1">
            ${Array.from({length:4},(_,i)=>{const y=new Date().getFullYear()-1+i;return`<option value="${y}" ${i===1?'selected':''}>${y}/${y+1}</option>`;}).join('')}
          </select>
          <button class="btn btn-blue" id="fdFetchBtn">🔄 Importer</button>
        </div>
        <div id="fdStatus" style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center"></div>
      </div>
      <button class="btn btn-blue btn-full" id="createBtn">⭐ Créer l'édition</button>
    </div>`;

  const savedKey=localStorage.getItem('fdApiKey');
  if(savedKey)$('fdKey').value=savedKey;

  let _importedMatches=null,_importedTeams={};

  $('fdFetchBtn').addEventListener('click',async()=>{
    const key=($('fdKey')?.value||'').trim();
    const season=$('fdSeason')?.value||new Date().getFullYear()-1;
    const status=$('fdStatus');const btn=$('fdFetchBtn');
    if(!key){if(status)status.textContent='❌ Clé API manquante';return;}
    btn.disabled=true;btn.textContent='⏳';
    if(status)status.textContent='Connexion…';
    try{
      const r=await fetch(`https://api.football-data.org/v4/competitions/CL/matches?season=${season}`,{headers:{'X-Auth-Token':key}});
      if(!r.ok){
        const msgs={403:'Clé invalide ou plan insuffisant',429:'Trop de requêtes — attends 1 min'};
        if(status)status.textContent='❌ '+(msgs[r.status]||'Erreur '+r.status);
        btn.disabled=false;btn.textContent='🔄 Importer';return;
      }
      const data=await r.json();
      const matches=data.matches||[];
      if(!matches.length){if(status)status.textContent='Aucun match trouvé';btn.disabled=false;btn.textContent='🔄 Importer';return;}
      _importedTeams={};
      _importedMatches=matches.map((m,i)=>{
        const tA=m.homeTeam?.tla||('H'+i);
        const tB=m.awayTeam?.tla||('A'+i);
        const tAName=m.homeTeam?.shortName||m.homeTeam?.name||tA;
        const tBName=m.awayTeam?.shortName||m.awayTeam?.name||tB;
        const tACrest=m.homeTeam?.crest||LDC_CLUBS[tA]?.crest||null;
        const tBCrest=m.awayTeam?.crest||LDC_CLUBS[tB]?.crest||null;
        _importedTeams[tA]={name:tAName,crest:tACrest};
        _importedTeams[tB]={name:tBName,crest:tBCrest};
        const dt=m.utcDate?new Date(m.utcDate):null;
        const matchday=m.matchday||0;
        const stage=m.stage||'LEAGUE_PHASE';
        return{
          id:String(m.id||i),fdId:m.id,
          matchday,stage,
          date:dt?dt.toISOString().slice(0,10):'',
          time:dt?dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}):'',
          teamA:tA,teamB:tB,
          scoreA:m.score?.fullTime?.home??null,
          scoreB:m.score?.fullTime?.away??null,
          status:m.status||'SCHEDULED',
        };
      });
      localStorage.setItem('fdApiKey',key);
      const leagueCount=_importedMatches.filter(m=>m.stage==='LEAGUE_PHASE').length;
      const koCount=_importedMatches.length-leagueCount;
      if(status)status.innerHTML=`<span style="color:#14c47d">✅ ${_importedMatches.length} matchs importés (${leagueCount} phase ligue + ${koCount} KO)</span>`;
      btn.textContent='✅ Importé';
    }catch(e){
      if(status)status.textContent='❌ '+e.message;
      btn.disabled=false;btn.textContent='🔄 Importer';
    }
  });

  $('createBtn').addEventListener('click',async()=>{
    const name=($('edName')?.value||'').trim();
    if(!name){toast('Donne un nom à l\'édition');return;}
    if(!_importedMatches?.length){toast('Importe les matchs d\'abord');return;}
    const ptsExact=+($('ptsExact')?.value||3);
    const ptsResult=+($('ptsResult')?.value||1);
    const edition={name,ptsExact,ptsResult,createdAt:Date.now(),phase:'league',season:+$('fdSeason').value};
    const ok=await fbSet('edition',edition);
    if(!ok){toast('❌ Erreur Firebase');return;}
    await fbSet('teams',_importedTeams);
    // Stocker les matchs par ID
    const matchesObj={};
    _importedMatches.forEach(m=>{matchesObj[m.id]=m;});
    await fbSet('matches',matchesObj);
    await fbSet('scores',{});
    await fbSet('pronos',{});
    toast('✅ Édition créée !');
    const data=await fbRoot();_state=data||{};render();
  });
}

async function loadPlayersAdmin(){
  const el=$('playersList');if(!el)return;
  const pronos=await fbGet('pronos')||{};
  const matches=Object.values(_state.matches||{});
  const scores=_state.scores||{};
  // Calculer points de chaque joueur
  const playerScores={};
  Object.entries(pronos).forEach(([pid,playerPronos])=>{
    let pts=0,exact=0,result=0,played=0;
    Object.entries(playerPronos).forEach(([mid,pr])=>{
      const s=scores[mid];if(!s||s.scoreA==null)return;
      played++;
      const p=calcPronoPoints(pr.scoreA,pr.scoreB,s.scoreA,s.scoreB);
      pts+=p;if(p===(_state.edition?.ptsExact||3))exact++;else if(p>0)result++;
    });
    playerScores[pid]={pid,pts,exact,result,played};
  });
  const sorted=Object.values(playerScores).sort((a,b)=>b.pts-a.pts);
  el.innerHTML=`<div style="font-weight:800;font-size:14px;margin-bottom:12px">🏆 Classement joueurs</div>`+
    (sorted.length?sorted.map((p,i)=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:18px">${['🥇','🥈','🥉'][i]||`${i+1}.`}</span>
          <div><div style="font-size:13px;font-weight:700">${esc(p.pid)}</div>
          <div style="font-size:11px;color:var(--muted)">${p.played} joués · ${p.exact} exacts · ${p.result} résultats</div></div>
        </div>
        <span style="font-size:18px;font-weight:900;color:var(--blue)">${p.pts}pts</span>
      </div>`).join(''):'<div style="color:var(--muted)">Aucun prono</div>');
}

    const stageLabel={BARRAGES:'Barrages',DIRECT_R16:'Qualifiés directs 8es',R16:'8es de finale',QF:'Quarts de finale',SF:'Demi-finales',FINAL_LDC:'Finale'};
    let lastStage2='';
    list.innerHTML=dayMatches.map(m=>{
      const s=scores[m.id]||{};
      const pr=myPronos[m.id]||{};
      const validated=s.scoreA!=null&&s.scoreB!=null;
      const hasProno=pr.scoreA!=null&&pr.scoreB!=null;
      let pts=null,ptsColor='var(--muted)';
      if(validated&&hasProno){
        pts=calcPronoPoints(pr.scoreA,pr.scoreB,s.scoreA,s.scoreB);
        ptsColor=pts===(ed.ptsExact||3)?'#14c47d':pts>0?'var(--gold)':'#ff6b6b';
      }
      const stageHeader=m.stage!==lastStage2?(lastStage2=m.stage,
        `<div style="font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px">${stageLabel[m.stage]||m.stage}</div>`):'';
      if(m.stage==='DIRECT_R16')return`${stageHeader}<div class="match-card validated">${teamHtml(m.teamA,160)}<span style="font-size:11px;color:#14c47d;font-weight:700">✅ Qualifié direct 8es</span></div>`;
      const legLabel=m.leg===1?'Aller':m.leg===2?'Retour':'';
      return`${stageHeader}<div class="match-card ${validated?'validated':''}" style="flex-wrap:wrap;gap:4px">
        <div style="font-size:10px;color:var(--muted);width:100%;display:flex;justify-content:space-between">
          <span>${m.round||''} ${legLabel?'— '+legLabel:''}</span>
          ${validated?`<span style="color:${ptsColor};font-weight:700">${pts!=null?(pts>0?'+'+pts+'pt'+(pts>1?'s':''):'0pt'):''}</span>`:''}
        </div>
        ${teamHtml(m.teamA,100)}
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0">
          ${validated?`<div style="font-size:13px;font-weight:900;color:var(--text)">${s.scoreA}-${s.scoreB}</div>`:''}
          <div style="display:flex;align-items:center;gap:3px">
            <input class="score-inp" type="number" min="0" id="pa_${m.id}" value="${pr.scoreA??''}" placeholder="-" inputmode="numeric">
            <span class="score-sep" style="font-size:13px">-</span>
            <input class="score-inp" type="number" min="0" id="pb_${m.id}" value="${pr.scoreB??''}" placeholder="-" inputmode="numeric">
          </div>
        </div>
        ${teamHtml(m.teamB,100)}
      </div>`;
    }).join('')||'<div style="color:var(--muted);text-align:center;padding:20px">Aucun match</div>';
  }

  renderDayMatches();
  $('daySelect')?.addEventListener('change',renderDayMatches);

  $('savePronosBtn')?.addEventListener('click',async()=>{
    const day=$('daySelect')?.value;
    const dayMatches=day==='KO'?koMatches:leagueMatches.filter(m=>String(m.matchday)===String(day));
    const updates={};
    dayMatches.forEach(m=>{
      const a=$('pa_'+m.id)?.value;const b=$('pb_'+m.id)?.value;
      if(a!==''&&b!=='')updates[m.id]={scoreA:+a,scoreB:+b,savedAt:Date.now()};
    });
    if(!Object.keys(updates).length){toast('Aucun prono à sauvegarder');return;}
    const newPronos={...myPronos,...updates};
    await fbSet(`pronos/${pid}`,newPronos);
    Object.assign(myPronos,updates);
    toast('✅ '+Object.keys(updates).length+' prono(s) enregistrés');
    renderDayMatches();
  });
}

// ── CLASSEMENT JOUEURS ────────────────────────────────────────────────────────
async function loadRanking(){
  const el=$('rankingContent');if(!el)return;
  const [pronos,scores]=await Promise.all([fbGet('pronos'),fbGet('scores')]);
  if(!pronos||!scores){el.innerHTML='<div style="color:var(--muted)">Aucun prono</div>';return;}
  const ed=_state.edition||{};
  const pid=_sess.pid;

  // Filtrer par groupe d'accès
  const myGroups=getMyGroups(pid);
  let allowedPids=null;
  if(myGroups.length){
    const groupData=await Promise.all(myGroups.map(g=>fetch(`${FB}/ldcGroups/${g.code}.json`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)));
    const members=new Set();groupData.forEach(g=>{if(g?.members)g.members.forEach(m=>members.add(m));});
    if(members.size)allowedPids=[...members];
  }

  const ranked=Object.entries(pronos)
    .filter(([p])=>!allowedPids||allowedPids.includes(p))
    .map(([p,playerPronos])=>{
      let pts=0,exact=0,good=0,played=0;
      Object.entries(playerPronos).forEach(([mid,pr])=>{
        const s=scores[mid];if(!s||s.scoreA==null)return;
        played++;const p2=calcPronoPoints(pr.scoreA,pr.scoreB,s.scoreA,s.scoreB);
        pts+=p2;if(p2===(ed.ptsExact||3))exact++;else if(p2>0)good++;
      });
      return{pid:p,pts,exact,good,played};
    }).sort((a,b)=>b.pts-a.pts||b.exact-a.exact);

  el.innerHTML=ranked.length?ranked.map((p,i)=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);${p.pid===pid?'background:rgba(26,115,232,.08);border-radius:8px;padding:8px':''}" >
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:18px">${['🥇','🥈','🥉'][i]||`${i+1}.`}</span>
        <div>
          <div style="font-size:13px;font-weight:700">${esc(p.pid)}${p.pid===pid?' 👤':''}</div>
          <div style="font-size:11px;color:var(--muted)">${p.exact} exacts · ${p.good} bons · ${p.played} joués</div>
        </div>
      </div>
      <span style="font-size:18px;font-weight:900;color:var(--blue)">${p.pts}pts</span>
    </div>`).join(''):'<div style="color:var(--muted)">Aucun prono</div>';
}

// ── GÉNÉRATION PHASE KO ───────────────────────────────────────────────────────

// Génère les matchs de barrages (9-24) et enregistre les slots 8es directs (1-8)
function generateKOMatches(table){
  const matches={};
  const now=Date.now();

  // Barrages : 9e vs 24e, 10e vs 23e, ..., 16e vs 17e
  // Le mieux classé = retour à domicile
  const playoffPairs=[[8,23],[9,22],[10,21],[11,20],[12,19],[13,18],[14,17],[15,16]]; // indices 0-based
  playoffPairs.forEach(([hi,lo],i)=>{
    const home=table[hi]?.code;  // mieux classé = retour dom
    const away=table[lo]?.code;
    if(!home||!away)return;
    // Match aller
    const id1=`playoff_${i}_leg1`;
    matches[id1]={id:id1,stage:'BARRAGES',round:`Barrage ${i+1}`,leg:1,
      teamA:away,teamB:home,  // aller : moins bon à domicile
      scoreA:null,scoreB:null,date:'',time:'',matchday:null,
      playoffSlot:i,paired:`playoff_${i}_leg2`};
    // Match retour
    const id2=`playoff_${i}_leg2`;
    matches[id2]={id:id2,stage:'BARRAGES',round:`Barrage ${i+1}`,leg:2,
      teamA:home,teamB:away,  // retour : mieux classé à domicile
      scoreA:null,scoreB:null,date:'',time:'',matchday:null,
      playoffSlot:i,paired:`playoff_${i}_leg1`};
  });

  // Top 8 → slots 8es directs (pas encore de matchs, juste mémoriser les équipes)
  // Ces slots se complèteront après les barrages
  for(let i=0;i<8;i++){
    const id=`direct_r16_slot_${i}`;
    matches[id]={id,stage:'DIRECT_R16',round:'Qualifié direct 8es',
      teamA:table[i]?.code,teamB:'TBD',
      scoreA:null,scoreB:null,date:'',time:'',matchday:null};
  }

  return matches;
}

// Détermine le vainqueur d'un barrage aller-retour
function playoffWinner(matches,scores,slot){
  const leg1=Object.values(matches).find(m=>m.stage==='BARRAGES'&&m.playoffSlot===slot&&m.leg===1);
  const leg2=Object.values(matches).find(m=>m.stage==='BARRAGES'&&m.playoffSlot===slot&&m.leg===2);
  if(!leg1||!leg2)return null;
  const s1=scores[leg1.id];const s2=scores[leg2.id];
  if(!s1||s1.scoreA==null||!s2||s2.scoreA==null)return null;
  // leg1 : away=better, home=worse → buts away team = leg1.scoreA (away joue à dom du "worse")
  // leg2 : home=better, away=worse
  // Total pour "mieux classé" (home leg2) : s2.scoreA + s1.scoreB
  // Total pour "moins classé" (away leg2) : s2.scoreB + s1.scoreA
  const betterTotal=s2.scoreA+s1.scoreB;
  const worseTotal=s2.scoreB+s1.scoreA;
  if(betterTotal>worseTotal)return leg2.teamA;  // mieux classé gagne
  if(worseTotal>betterTotal)return leg2.teamB;  // moins classé gagne
  // Égalité → règle du but à l'extérieur ou TAB — ici on retourne null pour que l'admin désigne
  return null;
}

// Génère les 8es complets après les barrages
function generateR16(matches,scores){
  // Vérifier que tous les barrages ont un vainqueur
  const winners=[];
  for(let i=0;i<8;i++){
    const w=playoffWinner(matches,scores,i);
    if(!w)return null; // barrage pas terminé
    winners.push(w);
  }
  // Top 8 qualifiés directs
  const directs=Object.values(matches).filter(m=>m.stage==='DIRECT_R16').map(m=>m.teamA).filter(Boolean);
  if(directs.length<8)return null;

  // Appariements 8es : 1-8 directs vs 8 vainqueurs barrages
  // En réalité tirage au sort UEFA mais ici on fait : direct[0] vs winner[7], direct[1] vs winner[6]...
  const r16={};
  for(let i=0;i<8;i++){
    const home=directs[i];   // mieux classé = retour à dom
    const away=winners[7-i]; // vainqueur barrage
    const id1=`r16_${i}_leg1`;const id2=`r16_${i}_leg2`;
    r16[id1]={id:id1,stage:'R16',round:`8e de finale ${i+1}`,leg:1,
      teamA:away,teamB:home,scoreA:null,scoreB:null,date:'',time:'',matchday:null,
      koSlot:i,paired:id2};
    r16[id2]={id:id2,stage:'R16',round:`8e de finale ${i+1}`,leg:2,
      teamA:home,teamB:away,scoreA:null,scoreB:null,date:'',time:'',matchday:null,
      koSlot:i,paired:id1};
  }
  return r16;
}

// Vainqueur d'un duel KO aller-retour
function koWinner(matches,scores,stage,slot){
  const legs=Object.values(matches).filter(m=>m.stage===stage&&m.koSlot===slot);
  if(legs.length<2)return null;
  const leg1=legs.find(m=>m.leg===1);const leg2=legs.find(m=>m.leg===2);
  if(!leg1||!leg2)return null;
  const s1=scores[leg1.id];const s2=scores[leg2.id];
  if(!s1||s1.scoreA==null||!s2||s2.scoreA==null)return null;
  const homeTotal=s2.scoreA+s1.scoreB; // home = leg2.teamA
  const awayTotal=s2.scoreB+s1.scoreA;
  if(homeTotal>awayTotal)return leg2.teamA;
  if(awayTotal>homeTotal)return leg2.teamB;
  return null; // égalité → admin doit désigner (TAB)
}

// Génère le tour suivant (QF après R16, SF après QF, Finale après SF)
function generateNextRound(matches,scores,currentStage,nextStage){
  const stageUpper=currentStage.toUpperCase();
  const slots=[...new Set(Object.values(matches).filter(m=>m.stage===stageUpper).map(m=>m.koSlot))].sort((a,b)=>a-b);
  const winners=slots.map(s=>koWinner(matches,scores,stageUpper,s));
  if(winners.some(w=>!w))return null;

  const nbNext=winners.length/2;
  const result={};
  for(let i=0;i<nbNext;i++){
    const home=winners[i*2];   // arbitraire
    const away=winners[i*2+1];
    const id1=`${nextStage}_${i}_leg1`;const id2=`${nextStage}_${i}_leg2`;
    const isFinal=nextStage==='final_ldc';
    if(isFinal){
      // Finale : match unique
      const id=`final_ldc_0`;
      result[id]={id,stage:'FINAL_LDC',round:'Finale',leg:1,
        teamA:home,teamB:away,scoreA:null,scoreB:null,date:'',time:'',matchday:null,koSlot:0};
    } else {
      result[id1]={id:id1,stage:nextStage.toUpperCase(),round:`${nextStage.toUpperCase()} ${i+1}`,leg:1,
        teamA:away,teamB:home,scoreA:null,scoreB:null,date:'',time:'',matchday:null,koSlot:i,paired:id2};
      result[id2]={id:id2,stage:nextStage.toUpperCase(),round:`${nextStage.toUpperCase()} ${i+1}`,leg:2,
        teamA:home,teamB:away,scoreA:null,scoreB:null,date:'',time:'',matchday:null,koSlot:i,paired:id1};
    }
  }
  return result;
}

// ── POLLING ───────────────────────────────────────────────────────────────────
let _lastInteraction=0;
function bump(){_lastInteraction=Date.now();}
document.addEventListener('click',bump);document.addEventListener('keydown',bump);

function startPoll(){
  stopPoll();
  _poll=setInterval(async()=>{
    const ae=document.activeElement;
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'))return;
    if(Date.now()-_lastInteraction<8000)return;
    const data=await fbRoot();
    if(JSON.stringify(data)!==JSON.stringify(_lastData)){
      _lastData=data;_state=data||{};
      const activeTab=$('app').querySelector('.tab.active')?.dataset?.tab;
      render();
      // Restaurer l'onglet actif
      if(activeTab){
        const t=$('app').querySelector(`.tab[data-tab="${activeTab}"]`);
        if(t){$('app').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
          ['pronos','scores','classement','classement','players','ranking','groups'].forEach(id=>{
            const el=$('tab-'+id);if(el)el.style.display=id===activeTab?'block':'none';
          });}
      }
    }
  },5000);
}
function stopPoll(){if(_poll){clearInterval(_poll);_poll=null;}}
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Jeux — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--card:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--text:#e8f0fe;--muted:#7a95b8;--gold:#f5c842;--red:#e53935;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(255,119,67,.1) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 40% at 80% 80%,rgba(245,200,66,.08) 0%,transparent 55%)}
    input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:10px;color:#fff;padding:9px 12px;font-size:16px;font-family:inherit;outline:none}
    input:focus{border-color:rgba(245,200,66,.4)}
    input[type=number]{text-align:center}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
    .btn{border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:10px 18px;transition:opacity .15s;font-family:inherit}
    .btn:active{opacity:.7}
    .btn-gold{background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a0e1a}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text)}
    .btn-danger{background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#ff6b6b}
    .btn-orange{background:rgba(255,119,67,.15);border:1px solid rgba(255,119,67,.3);color:#ff7743}
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
    /* Score table */
    .score-table{width:100%;border-collapse:collapse}
    .score-table th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:8px 6px;text-align:center;border-bottom:1px solid var(--border)}
    .score-table th.player-name{text-align:left;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .score-table td{padding:6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
    .score-table td.round-label{font-size:11px;color:var(--muted);font-weight:600;text-align:left}
    .score-table td.total{font-weight:900;font-size:15px}
    .score-table tr.total-row td{border-top:2px solid rgba(255,255,255,.15);font-weight:800;padding-top:10px}
    .score-table tr.current-row td{background:rgba(245,200,66,.06)}
    .score-input{width:60px!important;padding:6px 4px!important;font-size:15px!important;text-align:center;border-radius:8px}
    .loser{color:#ff6b6b}
    .winner{color:#14c47d}
    .distributor-badge{display:inline-block;background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.3);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--gold);margin-left:6px}
    @media(max-width:480px){
      .card{padding:12px}
      .score-table th,.score-table td{padding:5px 3px;font-size:12px}
      .score-input{width:50px!important;font-size:14px!important}
    }
  </style>
</head>
<body>
<button id="portalBtn" onclick="handleBack()">⬅ <span id="backLabel">Portail</span></button>
<div id="app" style="max-width:600px;margin:0 auto;padding:54px 14px 60px"></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const SK='zuc_jeux_v1';
const SK_PROFILE='zuc_jeux_profile'; // carnet perso de l'hôte

// ── Profil hôte ──
function loadProfile(){
  try{const d=localStorage.getItem(SK_PROFILE);return d?JSON.parse(d):{hostName:'',knownPlayers:[],archives:[]};}
  catch(e){return{hostName:'',knownPlayers:[],archives:[]};}
}
function saveProfile(p){localStorage.setItem(SK_PROFILE,JSON.stringify(p));}
let _profile=loadProfile();
let _t;const toast=m=>{const e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>e.classList.remove('show'),2600)};

// ── State ──
let state=null;

function save(){localStorage.setItem(SK,JSON.stringify(state));}
function load(){try{const d=localStorage.getItem(SK);return d?JSON.parse(d):null;}catch(e){return null;}}

// ── INIT ──
function handleBack(){
  if(!state||state.phase==='menu'){location.href='index.html';return;}
  if(confirm('Retourner au menu des jeux ? La partie en cours sera sauvegardée.')){
    renderMenu();
  }
}

function updateBackBtn(){
  const lbl=$('backLabel');
  if(!lbl)return;
  if(!state||state.phase==='menu')lbl.textContent='Portail';
  else lbl.textContent='Jeux';
}

(function(){
  state=load();
  render();
})();

function render(){
  if(!state||state.phase==='menu')renderMenu();
  else if(state.phase==='setup'){
    if(state.game==='molky'&&!state.molkyMode)renderMolkyModeChoice();
    else if(state.game==='molky')renderMolkySetup();
    else renderSetup();
  }
  else if(state.phase==='game'){
    if(state.game==='molky')renderMolkyGame();
    else renderGame();
  }
  else if(state.phase==='end'){
    if(state.game==='molky')renderMolkyEnd();
    else renderEnd();
  }
}

// ══════════════════════════════════════════════
// MENU — Choix du jeu
// ══════════════════════════════════════════════
function renderMenu(){
  updateBackBtn();
  state={phase:'menu'};
  save(); // Vider la partie en cours quand on retourne au menu
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:28px;padding-top:12px">
      <div style="font-size:48px;margin-bottom:8px">🎲</div>
      <div style="font-size:22px;font-weight:900">Jeux</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">Choisis un jeu pour commencer</div>
    </div>
    <div class="card" style="cursor:pointer;border-color:rgba(255,119,67,.3);transition:border-color .2s" id="ramiCard"
         onmouseenter="this.style.borderColor='rgba(255,119,67,.6)'" onmouseleave="this.style.borderColor='rgba(255,119,67,.3)'">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:36px">🃏</div>
        <div>
          <div style="font-size:16px;font-weight:800">Rami</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">2 à 20 joueurs · celui avec le plus de points perd</div>
        </div>
        <div style="margin-left:auto;font-size:20px;color:var(--muted)">›</div>
      </div>
    </div>
    <div class="card" style="cursor:pointer;border-color:rgba(100,160,255,.3);transition:border-color .2s" id="skyjoCard"
         onmouseenter="this.style.borderColor='rgba(100,160,255,.6)'" onmouseleave="this.style.borderColor='rgba(100,160,255,.3)'">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:36px">🌀</div>
        <div>
          <div style="font-size:16px;font-weight:800">Skyjo</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">2 à 8 joueurs · le moins de points gagne</div>
        </div>
        <div style="margin-left:auto;font-size:20px;color:var(--muted)">›</div>
      </div>
    </div>
    <div class="card" style="cursor:pointer;border-color:rgba(20,196,125,.3);transition:border-color .2s" id="papayooCard"
         onmouseenter="this.style.borderColor='rgba(20,196,125,.6)'" onmouseleave="this.style.borderColor='rgba(20,196,125,.3)'">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:36px">🎴</div>
        <div>
          <div style="font-size:16px;font-weight:800">Papayoo</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">3 à 8 joueurs · 250pts par manche · le moins de points gagne</div>
        </div>
        <div style="margin-left:auto;font-size:20px;color:var(--muted)">›</div>
      </div>
    </div>
    <div class="card" style="cursor:pointer;border-color:rgba(180,100,255,.3);transition:border-color .2s" id="cinqroisCard"
         onmouseenter="this.style.borderColor='rgba(180,100,255,.6)'" onmouseleave="this.style.borderColor='rgba(180,100,255,.3)'">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:36px">👑</div>
        <div>
          <div style="font-size:16px;font-weight:800">Cinq Rois</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">2 à 8 joueurs · 11 manches · le moins de points gagne</div>
        </div>
        <div style="margin-left:auto;font-size:20px;color:var(--muted)">›</div>
      </div>
    </div>
    <div class="card" style="cursor:pointer;border-color:rgba(255,80,120,.3);transition:border-color .2s" id="flip7Card"
         onmouseenter="this.style.borderColor='rgba(255,80,120,.6)'" onmouseleave="this.style.borderColor='rgba(255,80,120,.3)'">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:36px">🃏</div>
        <div>
          <div style="font-size:16px;font-weight:800">Flip 7</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">2 à 6 joueurs · premier à 200pts gagne</div>
        </div>
        <div style="margin-left:auto;font-size:20px;color:var(--muted)">›</div>
      </div>
    </div>
    <div class="card" style="cursor:pointer;border-color:rgba(255,200,0,.3);transition:border-color .2s" id="molkyCard"
         onmouseenter="this.style.borderColor='rgba(255,200,0,.6)'" onmouseleave="this.style.borderColor='rgba(255,200,0,.3)'">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:36px">🎯</div>
        <div>
          <div style="font-size:16px;font-weight:800">Molky</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Solo ou Duo · premier à 50pts pile gagne</div>
        </div>
        <div style="margin-left:auto;font-size:20px;color:var(--muted)">›</div>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-ghost" id="profileBtn" style="width:100%;font-size:13px;padding:11px">📊 Historique des parties</button>
    </div>`;

  $('ramiCard').onclick=()=>{state={phase:'setup',game:'rami'};render();};
  $('skyjoCard')?.addEventListener('click',()=>{state={phase:'setup',game:'skyjo'};render();});
  $('papayooCard')?.addEventListener('click',()=>{state={phase:'setup',game:'papayoo'};render();});
  $('cinqroisCard')?.addEventListener('click',()=>{state={phase:'setup',game:'cinqrois'};render();});
  $('flip7Card')?.addEventListener('click',()=>{state={phase:'setup',game:'flip7'};render();});
  $('molkyCard')?.addEventListener('click',()=>{state={phase:'setup',game:'molky'};renderMolkyModeChoice();});
  $('profileBtn')?.addEventListener('click',()=>renderProfile());
}

// ══════════════════════════════════════════════
// SETUP — Config de la partie
// ══════════════════════════════════════════════
function renderSetup(){
  updateBackBtn();
  const prev=state.prevPlayers||[];
  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:6px">${{rami:'🃏',skyjo:'🌀',papayoo:'🎴',cinqrois:'👑',molky:'🎯'}[state.game]||'🎮'}</div>
      <div style="font-size:20px;font-weight:900">${{rami:'Rami',skyjo:'Skyjo',papayoo:'Papayoo',cinqrois:'Cinq Rois',molky:'Molky'}[state.game]||state.game}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">
        ${{rami:'Rami — le plus de points perd',skyjo:'Skyjo — le moins de points gagne',papayoo:'Papayoo — 250pts par manche · le moins gagne',cinqrois:'Cinq Rois — 11 manches fixes · le moins gagne',flip7:'Flip 7 — premier à 200pts gagne'}[state.game]||state.game}
      </div>
    </div>
    <div class="card">
      ${state.game==='cinqrois'?`
      <div style="margin-bottom:14px;padding:12px;background:rgba(180,100,255,.08);border:1px solid rgba(180,100,255,.25);border-radius:10px">
        <div style="font-size:14px;font-weight:800;color:rgba(200,140,255,.9)">👑 11 manches fixes</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">Le nombre de manches est imposé par les règles du Cinq Rois</div>
      </div>`:state.game==='skyjo'?`
      <div style="margin-bottom:14px;padding:12px;background:rgba(100,160,255,.08);border:1px solid rgba(100,160,255,.2);border-radius:10px">
        <div style="font-size:14px;font-weight:800;color:rgba(120,180,255,.9)">🌀 Partie libre</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">On joue jusqu'à ce qu'un joueur atteigne 100pts</div>
      </div>`:`
      <div style="margin-bottom:14px">
        <label>Nombre de manches</label>
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
          <button class="btn btn-ghost" onclick="adjRounds(-1)" style="padding:8px 16px;font-size:18px;flex-shrink:0">−</button>
          <input type="number" id="cfgRounds" value="${state.rounds||4}" min="1" max="99" style="max-width:80px;margin:0 auto">
          <button class="btn btn-ghost" onclick="adjRounds(1)" style="padding:8px 16px;font-size:18px;flex-shrink:0">+</button>
        </div>
        ${state.game==='papayoo'?`<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">250pts distribués à chaque manche</div>`:''}
      </div>`}

      <div style="margin-bottom:14px">
        <label>Joueurs <span id="playerCount" style="color:var(--gold)">(${(state.playerNames||['']).length})</span></label>
        ${_profile.knownPlayers.length>0?`<div style="margin-bottom:8px;margin-top:6px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Joueurs récents :</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px" id="quickPlayers">
            ${_profile.knownPlayers.map((p,i)=>`
              <span style="display:inline-flex;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;overflow:hidden">
                <button onclick="quickAdd('${esc(p)}')" style="background:none;border:none;color:#fff;font-size:12px;font-weight:600;padding:5px 8px;cursor:pointer">${esc(p)}</button>
                <button onclick="removeKnown(${i})" style="background:none;border:none;border-left:1px solid rgba(255,255,255,.1);color:#ff6b6b;font-size:13px;padding:4px 7px;cursor:pointer;line-height:1">×</button>
              </span>`).join('')}
          </div>
        </div>`:''}
        <div id="playerInputs" style="margin-top:6px"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-ghost" onclick="addPlayer()" style="flex:1;font-size:12px">+ Ajouter un joueur</button>
          ${(state.playerNames||[]).length>2?`<button class="btn btn-ghost" onclick="removePlayer()" style="font-size:12px;padding:10px 14px">−</button>`:''}
        </div>
      </div>

      <button class="btn btn-gold" id="startBtn" style="width:100%;font-size:14px;padding:13px;margin-top:4px">${{rami:'🃏',skyjo:'🌀',papayoo:'🎴',cinqrois:'👑'}[state.game]||'🎮'} Lancer la partie</button>
      <button class="btn btn-ghost" onclick="renderMenu()" style="width:100%;margin-top:8px;font-size:12px">← Retour</button>
    </div>`;

  renderPlayerInputs();
  window.adjRounds=function(d){const inp=$('cfgRounds');if(inp){inp.value=Math.max(1,Math.min(20,(+inp.value||4)+d));}};
  window.addPlayer=function(){
    if(!state.playerNames)state.playerNames=['',''];
    const maxP={rami:20,skyjo:8,papayoo:8,cinqrois:8,flip7:6}[state.game]||20;
    if(state.playerNames.length>=maxP){toast('Maximum '+maxP+' joueurs');return;}
    state.playerNames.push('');renderSetup();
  };
  window.removePlayer=function(){
    if(!state.playerNames||state.playerNames.length<=2)return;
    state.playerNames.pop();renderSetup();
  };

  window.removeKnown=function(idx){
    _profile.knownPlayers.splice(idx,1);
    saveProfile(_profile);
    renderSetup();
  };

  window.quickAdd=function(name){
    if(!state.playerNames)state.playerNames=[];
    // Ne pas ajouter si déjà présent
    const inputs=[...$('playerInputs').querySelectorAll('input')];
    const existing=inputs.map(i=>i.value.trim());
    if(existing.includes(name)){toast(name+' est déjà dans la liste');return;}
    const maxP={rami:20,skyjo:8,papayoo:8,cinqrois:8,flip7:6}[state.game]||20;
    if(state.playerNames.length>=maxP){toast('Maximum '+maxP+' joueurs');return;}
    // Trouver un slot vide ou ajouter
    const emptyIdx=state.playerNames.findIndex(n=>!n);
    if(emptyIdx>=0)state.playerNames[emptyIdx]=name;
    else state.playerNames.push(name);
    renderSetup();
  };

  $('startBtn').onclick=()=>{
    const rounds=state.game==='cinqrois'?11:(state.game==='skyjo'||state.game==='flip7')?999:Math.max(1,+($('cfgRounds')?.value||4));
    const inputs=[...$('playerInputs').querySelectorAll('input')];
    const names=inputs.map(i=>i.value.trim()).filter(Boolean);
    const minP={rami:2,skyjo:2,papayoo:3,cinqrois:2}[state.game]||2;
    if(names.length<minP){toast(`Il faut au moins ${minP} joueurs pour ce jeu`);return;}
    const unique=[...new Set(names)];
    if(unique.length!==names.length){toast('Noms en doublon !');return;}
    // Tirage aléatoire du premier distributeur
    const firstDist=Math.floor(Math.random()*names.length);
    // Mémoriser les joueurs dans le profil
    const newKnown=[..._profile.knownPlayers];
    names.forEach(n=>{if(!newKnown.includes(n))newKnown.push(n);});
    _profile.knownPlayers=newKnown.slice(-30); // garder les 30 derniers
    saveProfile(_profile);

    state={
      phase:'game',game:state.game,
      players:names,
      rounds,
      // Papayoo/CinqRois : 1 manche = 1 saisie pour tous
      totalRounds:['papayoo','cinqrois'].includes(state.game)?rounds:rounds*names.length,
      currentManche:0, // 0-indexed
      distributor:firstDist, // index du distributeur actuel
      scores:names.map(()=>[]), // scores[joueurIdx][mancheIdx]
      stopped:false
    };
    save();render();
  };
}

function renderPlayerInputs(){
  if(!state.playerNames||!state.playerNames.length)state.playerNames=['',''];
  const container=$('playerInputs');if(!container)return;
  container.innerHTML=state.playerNames.map((n,i)=>`
    <div style="margin-bottom:8px">
      <input placeholder="Joueur ${i+1}" value="${esc(n)}" id="pn${i}" style="font-size:15px"
        oninput="state.playerNames[${i}]=this.value">
    </div>`).join('');
  const cnt=$('playerCount');if(cnt)cnt.textContent=`(${state.playerNames.length})`;
}

// ══════════════════════════════════════════════
// JEU — Saisie des points
// ══════════════════════════════════════════════
function renderGame(){
  updateBackBtn();
  const{players,rounds,totalRounds,currentManche,distributor,scores}=state;
  const manchesDone=currentManche; // manches terminées
  const tourActuel=Math.floor(currentManche/players.length)+1; // tour humain (1-based)
  const mancheDansLeTour=(currentManche%players.length)+1;
  const distName=players[distributor];
  const isLastManche=currentManche>=totalRounds-1;

  // Totaux par joueur
  const totals=players.map((_,pi)=>scores[pi].reduce((s,v)=>s+(+v||0),0));
  const maxTotal=Math.max(...totals);
  const minTotal=Math.min(...totals);

  // Historique des manches
  const histRows=[];
  for(let m=0;m<manchesDone;m++){
    const dist=(state.distributor-(manchesDone-m)+players.length*100)%players.length;
    // recalcule qui distribuait à la manche m
    const initialDist=state.firstDistributor??state.distributor;
    const distAtM=(state.firstDistributor!==undefined)
      ?(state.firstDistributor+m)%players.length
      :0;
    histRows.push({m,scores:players.map((_,pi)=>scores[pi][m]??'')});
  }
  // Plus simple : on stocke firstDistributor
  const fd=state.firstDistributor??distributor;

  $('app').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:11px;color:var(--muted)">${{rami:'🃏 Rami',skyjo:'🌀 Skyjo',papayoo:'🃟 Papayoo',cinqrois:'👑 Cinq Rois'}[state.game]||state.game}</div>
        <div style="font-size:18px;font-weight:900">Tour ${tourActuel} / ${rounds}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">Manche ${mancheDansLeTour} / ${players.length}</div>
      </div>
      <div>
        ${state.game==='flip7'?`<div style="font-size:11px;color:var(--gold);margin-top:4px">🏆 Objectif : 200pts · Max actuel : ${Math.max(...totals)}pts</div>`:''}

          </tr>
        </thead>
        <tbody>
          ${histRows.map((row,m)=>{
            const distIdx=(fd+m)%players.length;
            return`<tr>
              <td style="padding:4px 6px;cursor:pointer;user-select:none;white-space:nowrap" onclick="editManche(${m})">
                <span style="font-size:11px;color:var(--muted);font-weight:600">${state.game==='cinqrois'?m+3:m+1}</span>
                <span style="font-size:15px;margin-left:4px">✏️</span>
              </td>
              ${players.map((_,pi)=>`<td>${row.scores[pi]!==''?row.scores[pi]:'—'}</td>`).join('')}
            </tr>`;
          }).join('')}
          <!-- Ligne de saisie en cours -->
          ${!state.stopped?`<tr class="current-row">
            <td class="round-label" style="padding-left:8px">${state.game==='cinqrois'?manchesDone+3:manchesDone+1}</td>
            ${players.map((_,pi)=>state.game==='skyjo'?`
              <td>
                <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
                  <button onclick="adjScore(${pi},1)" style="width:34px;height:26px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;border-radius:7px;font-size:15px;cursor:pointer;line-height:1">+</button>
                  <input id="sc${pi}" type="number" data-val="0" value="0" inputmode="numeric" style="width:52px;text-align:center;font-size:15px;font-weight:800;padding:4px 2px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:var(--text)" oninput="syncSkyjoVal(${pi})">
                  <button onclick="adjScore(${pi},-1)" style="width:34px;height:26px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;border-radius:7px;font-size:15px;cursor:pointer;line-height:1">−</button>
                </div>
              </td>`:`<td><input class="score-input" type="number" min="0" id="sc${pi}" placeholder="0" inputmode="numeric"></td>`).join('')}
          </tr>`:''}
          <!-- Totaux -->
          <tr class="total-row">
            <td style="font-size:11px;color:var(--muted);text-align:left;padding-left:8px">TOTAL</td>
            ${players.map((p,i)=>{const cls=manchesDone>0?(totals[i]===maxTotal?'loser':totals[i]===minTotal?'winner':''):'';return'<td class="total '+cls+'">'+(totals[i])+'</td>';}).join('')}
          </tr>
        </tbody>
      </table>
    </div>

    ${!state.stopped?`
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-gold" id="valBtn" style="flex:1;font-size:14px;padding:12px">
        ${isLastManche?'🏆 Terminer la partie':'✓ Valider la manche'}
      </button>
    </div>
    <div style="font-size:11px;color:var(--muted);text-align:center">
      ${state.game==='papayoo'?'Total = 250pts · Le dernier champ se remplit automatiquement':
        state.game==='cinqrois'?'Manche '+(currentManche+1)+'/11 · '+(currentManche+3)+' cartes · Joker = les '+(currentManche+3)+'s' :
        state.game==='flip7'?'Note les points de chaque joueur à la fin de la manche · 0 si doublon':'Laisse vide ou mets 0 si un joueur a posé tout son jeu'}
    </div>
    `:`<div style="text-align:center;padding:16px;color:var(--muted);font-size:14px">Partie arrêtée</div>`}`;

  // Modifier une manche déjà validée
  window.editManche=function(m){
    const newVals=[];let valid=true;
    for(let pi=0;pi<players.length;pi++){
      const cur=state.scores[pi][m]??0;
      const v=prompt(players[pi]+' — Manche '+(state.game==='cinqrois'?m+3:m+1)+' (actuel : '+cur+' pts) :',cur);
      if(v===null){valid=false;break;}
      const n=+v;
      if(isNaN(n)||(state.game!=='skyjo'&&n<0)){toast('Score invalide');valid=false;break;}
      newVals.push(n);
    }
    if(!valid)return;
    // Validation Papayoo
    if(state.game==='papayoo'){
      const sum=newVals.reduce((s,v)=>s+v,0);
      if(sum!==250){toast('Total doit être 250pts (actuel : '+sum+'pts)');return;}
    }
    newVals.forEach((v,pi)=>{state.scores[pi][m]=v;});
    save();render();toast('✅ Manche '+(state.game==='cinqrois'?m+3:m+1)+' modifiée');
  };

  $('stopBtn')?.addEventListener('click',()=>{
    if(!confirm('Arrêter la partie en cours ?'))return;
    state.stopped=true;state.phase='end';save();render();
  });

  // Auto-complétion Papayoo (250pts total)
  if(state.game==='papayoo'){
    players.forEach((_,pi)=>{
      $(`sc${pi}`)?.addEventListener('input',()=>{
        const vals=players.map((_,i)=>$(`sc${i}`)?.value);
        const filledCount=vals.filter(v=>v!==''&&v!=null).length;
        if(filledCount===players.length-1){
          const sum=vals.reduce((s,v)=>s+(v!==''&&v!=null?+v:0),0);
          const emptyIdx=vals.findIndex(v=>v===''||v==null);
          if(emptyIdx>=0){
            const el=$(`sc${emptyIdx}`);
            if(el){el.value=Math.max(0,250-sum);el.style.color='var(--gold)';}
          }
        }
      });
    });
  }

  // +/− pour Skyjo
  window.adjScore=function(pi,d){
    const el=document.getElementById('sc'+pi);if(!el)return;
    const cur=parseInt(el.dataset.val||el.value||'0');
    const newVal=cur+d;
    el.dataset.val=newVal;
    el.value=newVal;
    el.style.color=newVal<0?'#14c47d':newVal>0?'rgba(255,100,100,.8)':'var(--text)';
  };
  window.syncSkyjoVal=function(pi){
    const el=document.getElementById('sc'+pi);if(!el)return;
    const v=parseInt(el.value)||0;
    el.dataset.val=v;
    el.style.color=v<0?'#14c47d':v>0?'rgba(255,100,100,.8)':'var(--text)';
  };

  $('valBtn')?.addEventListener('click',()=>{
    const mancheScores=players.map((_,pi)=>{
      if(state.game==='skyjo'){
        const el=document.getElementById('sc'+pi);
        return el?parseInt(el.dataset.val||'0'):0;
      }
      const val=document.getElementById('sc'+pi)?.value;
      return val!==''&&val!=null?+val:0;
    });

    // Validation 250pts pour Papayoo
    if(state.game==='papayoo'){
      const sum=mancheScores.reduce((s,v)=>s+v,0);
      if(sum!==250){toast(`Total : ${sum}pts — il faut exactement 250pts`);return;}
    }

    players.forEach((_,pi)=>{
      if(!state.scores[pi])state.scores[pi]=[];
      state.scores[pi][currentManche]=mancheScores[pi];
    });

    state.currentManche++;
    state.distributor=(distributor+1)%players.length;
    if(state.currentManche>=totalRounds)state.phase='end';
    save();render();
  });
}

        </div>
      </div>`:`
      <div style="margin-bottom:8px">
        <input placeholder="Joueur ${i+1}" value="${esc(tm.a||'')}" oninput="state.molkyTeams[${i}].a=this.value" style="font-size:14px">
      </div>`).join('');
  }

  if(!state.molkyTeams)state.molkyTeams=isDuo?[{a:'',b:''},{a:'',b:''}]:[{a:''},{a:''}];
  renderTeamInputs();

  window.addMolkyTeam=()=>{
    if(state.molkyTeams.length>=maxT){toast(`Maximum ${maxT} ${isDuo?'équipes':'joueurs'}`);return;}
    state.molkyTeams.push(isDuo?{a:'',b:''}:{a:''});
    renderMolkySetup();
  };
  window.removeMolkyTeam=()=>{
    if(state.molkyTeams.length<=2)return;
    state.molkyTeams.pop();renderMolkySetup();
  };

  $('molkyStartBtn').onclick=()=>{
    const teams=state.molkyTeams;
    if(isDuo){
      if(teams.some(t=>!t.a.trim()||!t.b.trim())){toast('Remplis tous les noms de joueurs');return;}
    } else {
      if(teams.some(t=>!t.a.trim())){toast('Remplis tous les noms');return;}
    }

    // Construire la structure de jeu
    // Chaque "slot" = un lancer. En duo : A de E1, A de E2... puis B de E1, B de E2...
    // On crée des équipes avec scores
    const gameTeams=teams.map((t,i)=>({
      id:i,
      label:isDuo?`Éq.${i+1}`:`${t.a}`,
      players:isDuo?[t.a.trim(),t.b.trim()]:[t.a.trim()],
      score:0,
      zeroStreak:0,
      eliminated:false,
      rank:null,
      // En duo : indice du joueur qui lance (0=A, 1=B, alterne chaque tour)
      currentPlayer:0,
    }));

    // Mémoriser joueurs dans profil
    const allNames=teams.flatMap(t=>isDuo?[t.a.trim(),t.b.trim()]:[t.a.trim()]);
    allNames.forEach(n=>{if(n&&!_profile.knownPlayers.includes(n))_profile.knownPlayers.push(n);});
    _profile.knownPlayers=_profile.knownPlayers.slice(-30);
    saveProfile(_profile);

    state={
      phase:'game',game:'molky',molkyMode:state.molkyMode,
      teams:gameTeams,
      currentTeamIdx:0, // quelle équipe joue
      turn:0,           // numéro de tour global
      ranked:[],        // équipes classées (top3)
      history:[],       // {teamId, score, total} par lancer
    };
    save();render();
  };
}

function renderMolkyGame(){
  const{teams,currentTeamIdx,ranked}=state;
  const activeTms=teams.filter(t=>!t.eliminated&&t.rank===null);
  const isDuo=state.molkyMode==='duo';
  const current=teams[currentTeamIdx];
  const launcher=isDuo?current.players[current.currentPlayer]:current.players[0];

  $('app').innerHTML=`
    <div style="margin-bottom:16px">
      <div style="font-size:11px;color:var(--muted)">🎯 Molky ${isDuo?'Duo':'Solo'}</div>
      <div style="font-size:18px;font-weight:900;margin-top:2px">
        ${ranked.length>0?`🏆 ${ranked.length} équipe${ranked.length>1?'s':''} classée${ranked.length>1?'s':''}`:'En cours'}
      </div>
    </div>

    <!-- Scores -->
    <div class="card" style="margin-bottom:12px;padding:12px">
      ${teams.map(t=>{
        const isCurrent=t.id===currentTeamIdx&&!t.eliminated&&t.rank===null;
        const pct=Math.min(100,(t.score/50)*100);
        return`<div style="margin-bottom:10px;${t.eliminated?'opacity:.4':''}">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <div style="font-size:13px;font-weight:${isCurrent?'900':'600'};color:${t.rank===1?'#f5c842':t.rank===2?'#aaa':t.rank===3?'#cd7f32':t.eliminated?'#ff6b6b':isCurrent?'#fff':'rgba(255,255,255,.7)'}">
              ${t.rank?['🥇','🥈','🥉'][t.rank-1]+' ':isCurrent?'👉 ':t.eliminated?'❌ ':''}
              ${isDuo?t.players.join(' + '):t.players[0]}
              ${t.zeroStreak>0&&!t.eliminated?`<span style="font-size:10px;color:#ff6b6b;margin-left:4px">(${t.zeroStreak}×0)</span>`:''}
            </div>
            <span style="font-size:16px;font-weight:900;color:${t.score===50?'#14c47d':t.score>40?'#f5c842':'var(--text)'}">${t.eliminated?'Éliminé':t.rank?t.score+'pts ✓':t.score+'pts'}</span>
          </div>
          <div style="height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${t.score>=45?'#f5c842':t.score>=30?'#14c47d':'rgba(100,160,255,.7)'};border-radius:3px;transition:width .3s"></div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Saisie du lancer -->
    ${current&&!current.eliminated&&current.rank===null?`
    <div class="card" style="border-color:rgba(245,200,66,.3)">
      <div style="font-size:13px;font-weight:800;margin-bottom:4px;color:var(--gold)">
        👉 ${isDuo?current.players.join(' + '):current.players[0]}
        ${isDuo?`<span style="font-size:11px;font-weight:400;color:var(--muted)"> · c'est ${launcher} qui lance</span>`:''}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Score actuel : <b style="color:#fff">${current.score} pts</b>${current.score>40?` · encore ${50-current.score}pts pour gagner !`:''}</div>
      <div>
        <label>Points marqués ce lancer</label>
        <input type="number" id="molkyScore" min="0" max="12" placeholder="0" inputmode="numeric"
          style="font-size:24px;text-align:center;padding:12px;margin-top:6px"
          onkeydown="if(event.key==='Enter')validateMolky()">
      </div>
      <button class="btn btn-gold" onclick="validateMolky()" style="width:100%;font-size:14px;padding:13px;margin-top:12px">✓ Valider</button>
    </div>`:''}

    <!-- Classement partiel -->
    ${ranked.length>0?`
    <div class="card">
      <div style="font-size:13px;font-weight:800;margin-bottom:10px">🏆 Classement</div>
      ${ranked.map((t,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)">
        <span>${['🥇','🥈','🥉'][i]} ${isDuo?t.players.join(' + '):t.players[0]}</span>
        <span style="font-weight:700;color:var(--gold)">${t.score}pts</span>
      </div>`).join('')}
    </div>`:''}

    <button class="btn btn-danger" onclick="stopMolky()" style="width:100%;margin-top:8px;font-size:12px;padding:8px">⏹ Arrêter la partie</button>`;

  $('molkyScore')?.focus();

  window.validateMolky=function(){
    const inp=$('molkyScore');
    if(!inp)return;
    const pts=+inp.value;
    if(isNaN(pts)||pts<0||pts>12){toast('Score entre 0 et 12');return;}
    inp.value='';

    const t=state.teams[currentTeamIdx];

    // Zéros consécutifs
    if(pts===0){
      t.zeroStreak++;
      if(t.zeroStreak>=3){
        t.eliminated=true;
        toast(`❌ ${isDuo?t.players.join(' + '):t.players[0]} éliminé${isDuo?'s':''} — 3 zéros consécutifs !`);
      }
    } else {
      t.zeroStreak=0;
      const newScore=t.score+pts;
      if(newScore===50){
        t.score=50;
        t.rank=state.ranked.length+1;
        state.ranked.push(t);
        toast(`${['🥇','🥈','🥉'][t.rank-1]} ${isDuo?t.players.join(' + '):t.players[0]} atteint 50 !`);
      } else if(newScore>50){
        t.score=25;
        toast(`💥 Dépassement ! Score retombe à 25pts`);
      } else {
        t.score=newScore;
      }
    }

    // En duo : alterner le lanceur dans l'équipe
    if(isDuo)t.currentPlayer=1-t.currentPlayer;

    // Historique
    state.history.push({teamId:t.id,pts,total:t.score});

    // Vérifier fin de partie (top 3 atteint ou tous éliminés sauf 0-2)
    const active=state.teams.filter(x=>!x.eliminated&&x.rank===null);
    if(state.ranked.length>=3||active.length===0){
      state.phase='end';save();render();return;
    }

    // Passer à l'équipe suivante (en sautant éliminés et classés)
    let next=(currentTeamIdx+1)%state.teams.length;
    let tries=0;
    while((state.teams[next].eliminated||state.teams[next].rank!==null)&&tries<state.teams.length){
      next=(next+1)%state.teams.length;tries++;
    }
    state.currentTeamIdx=next;
    save();render();
  };

  window.stopMolky=function(){
    if(!confirm('Arrêter la partie ?'))return;
    state.phase='end';save();render();
  };
}

function renderMolkyEnd(){
  const{teams,ranked,molkyMode}=state;
  const isDuo=molkyMode==='duo';

  // Trier le classement final : classés d'abord (par rank), puis les autres par score desc, éliminés en dernier
  const all=[
    ...ranked,
    ...teams.filter(t=>!t.rank&&!t.eliminated).sort((a,b)=>b.score-a.score),
    ...teams.filter(t=>t.eliminated),
  ];

  $('app').innerHTML=`
    <div style="text-align:center;margin-bottom:20px;padding-top:8px">
      <div style="font-size:48px;margin-bottom:8px">🎯</div>
      <div style="font-size:20px;font-weight:900">Fin de partie !</div>
      ${ranked.length>0?`<div style="font-size:14px;color:#14c47d;font-weight:700;margin-top:6px">🥇 ${isDuo?ranked[0].players.join(' + '):ranked[0].players[0]} gagne !</div>`:''}
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:800;margin-bottom:14px;color:var(--muted)">CLASSEMENT FINAL</div>
      ${all.map((t,i)=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:20px">${t.rank?['🥇','🥈','🥉'][t.rank-1]||i+1+'.':t.eliminated?'❌':`${i+1}.`}</span>
            <span style="font-size:14px;font-weight:700;color:${t.eliminated?'rgba(255,255,255,.4)':'var(--text)'}">${isDuo?t.players.join(' + '):t.players[0]}</span>
          </div>
          <span style="font-size:15px;font-weight:900;color:${t.eliminated?'#ff6b6b':t.rank===1?'#14c47d':'var(--gold)'}">
            ${t.eliminated?'Éliminé':t.score+'pts'}
          </span>
        </div>`).join('')}
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-gold" id="molkyReplayBtn" style="flex:1;font-size:13px;padding:11px">🔄 Rejouer</button>
      <button class="btn btn-orange" id="molkyEditBtn" style="flex:1;font-size:13px;padding:11px">✏️ Modifier</button>
    </div>
    <button class="btn btn-ghost" onclick="renderMenu()" style="width:100%;margin-top:8px;font-size:12px">← Menu</button>`;

  $('molkyReplayBtn')?.addEventListener('click',()=>{
    const teams=state.teams.map(t=>({...t,score:0,zeroStreak:0,eliminated:false,rank:null,currentPlayer:0}));
    state={phase:'game',game:'molky',molkyMode,teams,currentTeamIdx:0,turn:0,ranked:[],history:[]};
    save();render();
  });
  $('molkyEditBtn')?.addEventListener('click',()=>{
    state={phase:'setup',game:'molky',molkyMode,
      molkyTeams:state.teams.map(t=>isDuo?{a:t.players[0],b:t.players[1]}:{a:t.players[0]})};
    render();
  });
}

</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Suivi vignettes — Admin</title>
<style>
  body{background:#0a0e1a;margin:0;padding:0}
  #portalBtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(255,255,255,.1);
    backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;
    padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif}
  #stx-wrap{padding-top:60px;padding-bottom:30px}
  :root {
    --paper: #f1ead4;
    --paper-line: #d8cba8;
    --ink: #1c2a22;
    --pitch: #1f4a3d;
    --pitch-dark: #163a30;
    --manquant: #b3432b;
    --manquant-bg: #f6ddd4;
    --doublon: #2b5f9e;
    --doublon-bg: #dbe7f6;
  }

  * { box-sizing: border-box; }

  #stx-root {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(28,42,34,0.035) 28px);
    color: var(--ink);
    padding: 28px 24px 32px;
    border-radius: 10px;
    max-width: 760px;
    margin: 0 auto;
  }

  #stx-root h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 25px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  #stx-root .stx-tagline {
    font-size: 12.5px;
    color: #7c8878;
    margin: 0 0 18px;
  }

  .stx-step { display: none; }
  .stx-step.stx-active { display: block; }

  .stx-choice-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stx-choice-card {
    flex: 1 1 200px;
    text-align: left;
    background: #fffdf7;
    border: 1.5px solid #cabf99;
    border-radius: 8px;
    padding: 16px 16px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, transform 0.08s ease;
  }
  .stx-choice-card:hover { border-color: var(--pitch); }
  .stx-choice-card:active { transform: scale(0.98); }
  .stx-choice-card h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 16.5px;
    margin: 0 0 5px;
  }
  .stx-choice-card p { font-size: 12.5px; color: #5c6a58; margin: 0; line-height: 1.5; }
  .stx-choice-card.stx-choice-manquant h3 { color: var(--manquant); }
  .stx-choice-card.stx-choice-doublon h3 { color: var(--doublon); }

  .stx-back {
    background: none;
    border: none;
    color: #5c6a58;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
    margin-bottom: 14px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .stx-back:hover { color: var(--ink); text-decoration: underline; }

  .stx-mode-banner {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .stx-mode-banner.stx-banner-manquant { background: var(--manquant-bg); color: var(--manquant); }
  .stx-mode-banner.stx-banner-doublon { background: var(--doublon-bg); color: var(--doublon); }

  .stx-album-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .stx-album-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 7px;
    border: 1.5px solid #cabf99;
    background: #fffdf7;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
  }
  .stx-album-btn:hover { border-color: var(--pitch); background: #f7f1dd; }
  .stx-album-btn:active { transform: scale(0.97); }
  .stx-album-btn .stx-album-count { display: block; font-size: 11px; color: #7c8878; font-weight: 500; margin-top: 2px; }

  .stx-album-btn-add {
    border-style: dashed;
    color: var(--pitch);
    background: transparent;
  }
  .stx-album-btn-add:hover { background: #e6dcbd; }

  .stx-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .stx-field label { font-size: 12.5px; color: #5c6a58; }
  .stx-field input, .stx-field textarea {
    font-family: inherit;
    font-size: 13.5px;
    padding: 9px 10px;
    border: 1px solid #c4b790;
    border-radius: 6px;
    background: #fffdf7;
    color: var(--ink);
  }
  .stx-field textarea { min-height: 80px; line-height: 1.5; resize: vertical; }
  .stx-field input:focus, .stx-field textarea:focus { outline: 2px solid var(--pitch); outline-offset: 1px; }

  .stx-btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .stx-btn:active { transform: scale(0.97); }
  .stx-btn-primary { background: var(--pitch); color: #f1ead4; }
  .stx-btn-primary:hover { background: var(--pitch-dark); }
  .stx-btn-ghost { background: transparent; color: #5c6a58; border: 1px solid #c4b790; }
  .stx-btn-ghost:hover { background: #e6dcbd; }

  .stx-hint { font-size: 12px; color: #7c8878; margin-bottom: 14px; }

  .stx-note-box {
    background: #f7f1dd;
    border: 1px solid #cabf99;
    border-radius: 7px;
    padding: 10px 12px;
    font-size: 12px;
    color: #52604f;
    line-height: 1.55;
    margin-top: 6px;
  }

  .stx-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 5px;
    margin-bottom: 20px;
  }

  .stx-cell {
    position: relative;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 8px 4px;
    border-radius: 5px;
    border: 1px solid #cabf99;
    background: #fffdf7;
    color: #3c4a3a;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
  }
  .stx-cell:hover { border-color: var(--pitch); }
  .stx-cell:active { transform: scale(0.94); }
  .stx-cell.stx-on-manquant { background: var(--manquant-bg); border-color: var(--manquant); color: var(--manquant); font-weight: 700; }
  .stx-cell.stx-on-doublon { background: var(--doublon-bg); border-color: var(--doublon); color: var(--doublon); font-weight: 700; }
  .stx-cell .stx-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--doublon);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 4px;
    border-radius: 999px;
    min-width: 15px;
  }

  .stx-output-block {
    background: #fffdf7;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stx-output-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
  }
  .stx-output-head h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  .stx-output-head .stx-count { font-size: 11.5px; color: #7c8878; }
  .stx-output-text {
    font-size: 13px;
    line-height: 1.6;
    color: #3c4a3a;
    word-break: break-word;
    min-height: 20px;
    margin-bottom: 10px;
  }
  .stx-output-text.stx-empty { color: #a3ab98; font-style: italic; }

  .stx-copied { color: var(--pitch); }

  @media (max-width: 480px) {
    #stx-root { padding: 20px 16px 26px; }
    .stx-grid { grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); }
  }
</style>

// Outil personnel admin uniquement — un joueur qui tombe sur ce lien est
// simplement renvoyé au portail, sans aucun indice sur ce qu'il y a ici.
(function(){
  const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
  function getSession(){try{const d=JSON.parse(localStorage.getItem('cdm2026session'));if(!d)return null;if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}return d;}catch{return null;}}
  const sess=getSession();
  if(!sess||sess.role!=='admin'){location.href='index.html';}
})();

<button id="portalBtn" onclick="location.href='index.html'">⬅ Portail</button>
<div id="stx-wrap">
<div id="stx-root">
  <h1>Suivi vignettes</h1>
  <p class="stx-tagline">Panini &amp; co — manquants et doublons, prêts à coller sur LastSticker</p>

  <!-- Étape 1 : choix du type de liste -->
  <div class="stx-step stx-active" id="stx-step-choice">
    <div class="stx-choice-row">
      <button class="stx-choice-card stx-choice-manquant" id="stx-choose-manquant">
        <h3>Mes manquants</h3>
        <p>Coche les vignettes qu'il te manque, pour générer ta liste de manquants.</p>
      </button>
      <button class="stx-choice-card stx-choice-doublon" id="stx-choose-doublon">
        <h3>Mes doublons</h3>
        <p>Coche tes doublons (clique plusieurs fois pour les triplons), pour générer ta liste de doublons.</p>
      </button>
    </div>
  </div>

  <!-- Étape 2 : choix de l'album -->
  <div class="stx-step" id="stx-step-album">
    <button class="stx-back" id="stx-back-1">← Retour</button>
    <div class="stx-mode-banner" id="stx-album-banner"></div>

    <div class="stx-album-grid" id="stx-album-grid"></div>
  </div>

  <!-- Étape 2bis : ajouter un nouvel album -->
  <div class="stx-step" id="stx-step-add-album">
    <button class="stx-back" id="stx-back-add">← Retour aux albums</button>
    <div class="stx-mode-banner" id="stx-add-banner"></div>

    <div class="stx-field">
      <label for="stx-new-album-name">Nom de l'album</label>
      <input id="stx-new-album-name" type="text" placeholder="ex : Panini Ligue 1 2026/27">
    </div>
    <div class="stx-field">
      <label for="stx-new-album-list">Liste complète des codes, séparés par des virgules</label>
      <textarea id="stx-new-album-list" placeholder="1, 2, 3, ... ou KOR1, KOR2, POR1, POR2..."></textarea>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="stx-btn stx-btn-primary" id="stx-save-album">Enregistrer cet album</button>
      <button class="stx-btn stx-btn-ghost" id="stx-use-once">Utiliser sans enregistrer</button>
    </div>
    <div class="stx-note-box" id="stx-save-note" style="display:none;"></div>
  </div>

  <!-- Étape 3 : grille + liste résultat -->
  <div class="stx-step" id="stx-step-grid">
    <button class="stx-back" id="stx-back-2">← Retour</button>
    <div class="stx-mode-banner" id="stx-grid-banner"></div>
    <p class="stx-hint" id="stx-grid-hint"></p>

    <div class="stx-grid" id="stx-grid"></div>

    <div class="stx-output-block">
      <div class="stx-output-head">
        <h2 id="stx-output-title">Liste</h2>
        <span class="stx-count" id="stx-output-count">0</span>
      </div>
      <div class="stx-output-text stx-empty" id="stx-output-text">Aucun pour l'instant</div>
      <button class="stx-btn stx-btn-ghost" id="stx-copy">Copier la liste</button>
    </div>
  </div>
</div>
</div>

  function showStep(step) {
    [stepChoice, stepAlbum, stepAddAlbum, stepGrid].forEach(s => s.classList.remove('stx-active'));
    step.classList.add('stx-active');
  }

  function setBanner(el, label, isManquant) {
    el.textContent = label;
    el.className = 'stx-mode-banner ' + (isManquant ? 'stx-banner-manquant' : 'stx-banner-doublon');
  }

  function setMode(m) {
    mode = m;
    const isManquant = mode === 'manquant';
    const label = isManquant ? 'Manquants' : 'Doublons';

    setBanner(albumBanner, label, isManquant);
    setBanner(addBanner, label, isManquant);
    setBanner(gridBanner, label, isManquant);

    gridHint.textContent = isManquant
      ? "Clique sur une vignette pour la marquer manquante (reclique pour annuler)."
      : "Clique sur une vignette à chaque doublon que tu as (2 clics = 2 exemplaires, etc).";

    outputTitle.textContent = isManquant ? 'Liste des manquants' : 'Liste des doublons';

    codes = [];
    manquants = {};
    doublons = {};
  }

  function renderAlbumButtons() {
    albumGrid.innerHTML = '';
    Object.keys(ALBUMS).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'stx-album-btn';
      btn.innerHTML = name + '<span class="stx-album-count">' + ALBUMS[name].length + ' vignettes</span>';
      btn.addEventListener('click', () => {
        codes = ALBUMS[name].slice();
        manquants = {};
        doublons = {};
        buildGrid();
        showStep(stepGrid);

      albumGrid.appendChild(btn);

    albumGrid.appendChild(addBtn);

  function parseList(raw) {
    return raw.split(',').map(s => s.trim()).filter(s => s.length > 0);

      const cur = doublons[code] || 0;
      const next = cur >= MAX_DOUBLON ? 0 : cur + 1;
      if (next === 0) delete doublons[code]; else doublons[code] = next;
      cell.classList.toggle('stx-on-doublon', next > 0);
      const existingBadge = cell.querySelector('.stx-badge');
      if (existingBadge) existingBadge.remove();
      if (next > 0) {
        const badge = document.createElement('span');
        badge.className = 'stx-badge';
        badge.textContent = 'x' + next;
        cell.appendChild(badge);
      }
    }
    refreshOutput();
  }

  function refreshOutput() {
    let list;
    if (mode === 'manquant') {
      list = codes.filter(c => manquants[c]);
    } else {
      list = [];
      codes.forEach(c => {
        const n = doublons[c] || 0;
        for (let i = 0; i < n; i++) list.push(c);
      });
    }
    outputCount.textContent = list.length;
    if (list.length) {
      outputText.textContent = list.join(', ');
      outputText.classList.remove('stx-empty');
    } else {
      outputText.textContent = "Aucun pour l'instant";
      outputText.classList.add('stx-empty');
    }
  }

  copyBtn.addEventListener('click', () => {
    const text = outputText.textContent;
    if (!text || outputText.classList.contains('stx-empty')) return;
    navigator.clipboard.writeText(text).then(() => {
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copié !';
      copyBtn.classList.add('stx-copied');
      setTimeout(() => {
        copyBtn.textContent = original;
        copyBtn.classList.remove('stx-copied');
      }, 1200);
    });
  });

  // ============================================================
  // Export : régénère le fichier HTML complet avec les albums
  // actuels (y compris ceux ajoutés dans cette session) intégrés,
  // et déclenche un téléchargement.
  // ============================================================
  function exportUpdatedFile() {
    try {
      const scriptEl = document.currentScript || document.querySelector('script');
      const originalScriptText = scriptEl.textContent;

      const newAlbumsBlock = 'const ALBUMS = ' + JSON.stringify(ALBUMS, null, 2) + ';';
      const updatedScriptText = originalScriptText.replace(
        /const ALBUMS = \{[\s\S]*?\n  \};/,
        newAlbumsBlock
      );

      let fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      fullHtml = fullHtml.replace(
        /const ALBUMS = \{[\s\S]*?\n  \};/,
        newAlbumsBlock
      );

      const blob = new Blob([fullHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sticker-tracker.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert("Le téléchargement automatique n'a pas fonctionné. Renvoie-moi ta liste et je l'ajouterai au fichier directement.");
      console.error(e);
    }
  }
})();
</script>

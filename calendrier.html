<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>Calendrier — Le Super Site du Zuc</title>
  <style>
    :root{--bg:#0a0e1a;--card:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--text:#e8f0fe;--muted:#7a95b8;--green:#14c47d;--gold:#f5c842;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(245,200,66,.1) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 40% at 80% 80%,rgba(20,196,125,.08) 0%,transparent 55%)}
    input,textarea,select{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:10px;color:#fff;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
    input[type=color]{padding:3px;height:38px;cursor:pointer}
    input:focus,select:focus{border-color:rgba(245,200,66,.4)}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
    .btn{border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:9px 16px;transition:opacity .15s;font-family:inherit}
    .btn:hover{opacity:.85}

    .btn-gold{background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a0e1a}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text)}

    .btn-green{background:rgba(20,196,125,.15);border:1px solid rgba(20,196,125,.3);color:#14c47d}
    .btn-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    #portalBtn{position:fixed;top:10px;left:10px;z-index:999;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1e2d3d;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .28s;z-index:9999;max-width:90vw;text-align:center}

    .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .cal-nav{display:flex;align-items:center;gap:8px}

    .legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-bottom:12px;font-size:11px;color:var(--muted)}
    .legend-item{display:flex;align-items:center;gap:5px}

    .sb-fr{background:rgba(100,160,255,.22);color:#9cc0ff}
    .sb-de{background:rgba(255,160,60,.22);color:#ffc98a}
    .ev-block{border-radius:6px;padding:2px 6px;font-size:10.5px;font-weight:700;line-height:1.35;color:#fff;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.35)}

    .modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
    .field{margin-bottom:12px}
    .field-row{display:flex;gap:10px}

    .cat-check-row:hover{background:rgba(255,255,255,.04)}

    .cat-swatch{width:13px;height:13px;border-radius:4px;flex-shrink:0}

<script>
const FB='https://prono-2026-515b8-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let _t;const toast=m=>{const e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>e.classList.remove('show'),2800)};

function getSession(){
  try{
    const d=JSON.parse(localStorage.getItem('cdm2026session'));
    if(!d)return null;
    if(d._exp&&Date.now()>d._exp){localStorage.removeItem('cdm2026session');return null;}
    return d;
  }catch(e){return null;}
}

// ── Firebase (préfixe /calendar) ──
const fb=async(path,method='GET',body)=>{
  const r=await fetch(`${FB}/calendar/${path}.json`,{method,cache:'no-store',
    headers:body?{'Content-Type':'application/json'}:{},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
};
const fbGet=p=>fb(p);
const fbSet=(p,d)=>fb(p,'PUT',d);
const fbPatch=(p,d)=>fb(p,'PATCH',d);
const fbDel=p=>fb(p,'DELETE');

// ══════════════════════════════════════════════════════════════════════
// JOURS FÉRIÉS LÉGAUX LUXEMBOURGEOIS — calcul algorithmique (valable pour
// n'importe quelle année, y compris les fêtes mobiles basées sur Pâques).
// ══════════════════════════════════════════════════════════════════════
function easterSunday(year){
  // Algorithme de Meeus/Jones/Butcher (calendrier grégorien)
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function luxHolidays(year){
  const easter=easterSunday(year);
  const list=[
    {date:`${year}-01-01`,label:"Jour de l'An"},
    {date:toISO(addDays(easter,1)),label:'Lundi de Pâques'},
    {date:`${year}-05-01`,label:'Fête du Travail'},
    {date:toISO(addDays(easter,39)),label:'Ascension'},
    {date:toISO(addDays(easter,50)),label:'Lundi de Pentecôte'},
    {date:`${year}-06-23`,label:'Fête nationale'},
    {date:`${year}-08-15`,label:'Assomption'},
    {date:`${year}-11-01`,label:'Toussaint'},
    {date:`${year}-12-25`,label:'Noël'},
    {date:`${year}-12-26`,label:'Saint-Étienne'},
  ];
  const map={};list.forEach(h=>{map[h.date]=h.label;});
  return map;
}
const _holidayCache={};
function isHoliday(dateStr){
  const year=+dateStr.slice(0,4);
  if(!_holidayCache[year])_holidayCache[year]=luxHolidays(year);
  return _holidayCache[year][dateStr]||null;
}

function schoolBadgesFor(dateStr){
  const out=[];
  Object.entries(SCHOOL_HOLIDAYS).forEach(([src,ranges])=>{
    if(ranges.some(r=>dateStr>=r.start&&dateStr<=r.end))out.push(src);
  });
  return out;
}

// ── Dates utilitaires ──
function pad2(n){return String(n).padStart(2,'0');}
const MONTH_NAMES=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DOW_NAMES=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
// Numéro de semaine ISO-8601
function isoWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dayNum=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThu=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const firstDayNum=(firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-firstDayNum+3);
  return 1+Math.round((d-firstThu)/(7*86400000));
}
function fmtDateLong(dateStr){
  if(!dateStr)return'';
  const[y,m,d]=dateStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function fmtDateTime(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

// ── État global ──
let _sess=null,_categories={},_events={},_history={},_viewYear,_viewMonth,_editingEventId=null,_myName='';

(async()=>{
  const sess=getSession();
  if(!sess){location.href='index.html';return;}
  _sess=sess;
  _myName=sess.role==='admin'?'Antoine':(sess.name||sess.pid);
  $('app').innerHTML='<div style="text-align:center;padding:80px 20px;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px">📅</div>Chargement…</div>';
  const today=new Date();
  _viewYear=today.getFullYear();_viewMonth=today.getMonth();

  let cats=await fbGet('categories');
  if(!cats||!Object.keys(cats).length){
    await fbSet('categories',DEFAULT_CATEGORIES);
    cats=DEFAULT_CATEGORIES;
  }
  _categories=cats;
  _events=await fbGet('events')||{};
  render();
  setInterval(refreshData,15000);
})();

async function refreshData(){
  try{
    const[cats,events]=await Promise.all([fbGet('categories'),fbGet('events')]);
    _categories=cats||{};_events=events||{};
    if(!$('eventModal').classList.contains('active'))render();
  }catch(e){}
}

function personCategories(){
  return Object.entries(_categories).filter(([,c])=>c.person);
}

function render(){
  const isAdmin=_sess.role==='admin';
  $('app').innerHTML=`
    <div class="cal-head">
      <div class="cal-nav">
        <button class="btn-icon" id="prevMonthBtn">‹</button>
        <div class="cal-month-label">${MONTH_NAMES[_viewMonth]} ${_viewYear}</div>
        <button class="btn-icon" id="nextMonthBtn">›</button>
        <button class="btn btn-ghost" id="todayBtn" style="font-size:11px">Aujourd'hui</button>
      </div>
      <div class="cal-actions">
        <button class="btn btn-gold" id="addEventBtn">+ Évènement</button>
        <button class="btn btn-ghost" id="openHistBtn">📜 Historique</button>
        ${isAdmin?'<button class="btn btn-ghost" id="openCatBtn">⚙️ Catégories</button>':''}
      </div>
    </div>
    <div class="legend">
      ${Object.values(_categories).map(c=>`<div class="legend-item"><span class="legend-dot" style="background:${c.color}"></span>${esc(c.name)}</div>`).join('')}
      <div class="legend-item"><span class="holiday-pill">Férié</span></div>
      <div class="legend-item"><span class="school-badge sb-lu">LU</span><span class="school-badge sb-fr">FR</span><span class="school-badge sb-de">DE</span> vacances scolaires</div>
    </div>
    <div class="cal-scroll">
      <div class="cal-grid" id="calGrid"></div>
    </div>
  `;
  renderGrid();

  $('prevMonthBtn').onclick=()=>{_viewMonth--;if(_viewMonth<0){_viewMonth=11;_viewYear--;}renderGrid();updateMonthLabel();};
  $('nextMonthBtn').onclick=()=>{_viewMonth++;if(_viewMonth>11){_viewMonth=0;_viewYear++;}renderGrid();updateMonthLabel();};
  $('todayBtn').onclick=()=>{const t=new Date();_viewYear=t.getFullYear();_viewMonth=t.getMonth();renderGrid();updateMonthLabel();};
  $('addEventBtn').onclick=()=>openEventModal(null,toISO(new Date()));
  $('openHistBtn').onclick=openHistModal;
  $('openCatBtn')?.addEventListener('click',openCatModal);
}
function updateMonthLabel(){
  const lbl=document.querySelector('.cal-month-label');
  if(lbl)lbl.textContent=`${MONTH_NAMES[_viewMonth]} ${_viewYear}`;
}

function renderGrid(){
  const grid=$('calGrid');
  const todayISO=toISO(new Date());
  const firstOfMonth=new Date(_viewYear,_viewMonth,1);
  const firstWeekday=(firstOfMonth.getDay()+6)%7; // 0=lundi
  const startDate=addDays(firstOfMonth,-firstWeekday);
  const daysInMonth=new Date(_viewYear,_viewMonth+1,0).getDate();
  const totalCells=Math.ceil((firstWeekday+daysInMonth)/7)*7;

  let html='<div></div>';
  DOW_NAMES.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);

  for(let w=0;w<totalCells/7;w++){
    const weekFirstDate=addDays(startDate,w*7);
    html+=`<div class="cal-week-label">S${isoWeek(weekFirstDate)}</div>`;
    for(let d=0;d<7;d++){
      const cellDate=addDays(startDate,w*7+d);
      const dateStr=toISO(cellDate);
      const inMonth=cellDate.getMonth()===_viewMonth;
      const isToday=dateStr===todayISO;
      const hol=isHoliday(dateStr);
      const badges=schoolBadgesFor(dateStr);
      const dayEvents=Object.entries(_events).filter(([,e])=>dateStr>=e.dateStart&&dateStr<=(e.dateEnd||e.dateStart));
      const MAX_SHOW=4;
      const shown=dayEvents.slice(0,MAX_SHOW);
      const extra=dayEvents.length-shown.length;

      html+=`<div class="cal-day${inMonth?'':' other-month'}${isToday?' today':''}" data-date="${dateStr}">
        <div class="cal-day-num">
          <span>${cellDate.getDate()}</span>
          <div class="school-badges">${badges.map(b=>`<span class="school-badge sb-${b.toLowerCase()}">${b}</span>`).join('')}</div>
        </div>
        ${hol?`<div class="holiday-pill">🎉 ${esc(hol)}</div>`:''}
        ${shown.map(([id,e])=>{
          const primaryCat=(e.catIds||[]).map(cid=>_categories[cid]).find(Boolean);
          const color=primaryCat?primaryCat.color:'#546478';
          return `<div class="ev-block" style="background:${color}" data-event-id="${id}">${esc(e.title)}</div>`;
        }).join('')}
        ${extra>0?`<div class="ev-more">+${extra} autre${extra>1?'s':''}</div>`:''}
      </div>`;
    }
  }
  grid.innerHTML=html;

  grid.querySelectorAll('.cal-day').forEach(cell=>{
    cell.addEventListener('click',ev=>{
      const evBlock=ev.target.closest('.ev-block');
      if(evBlock){openEventModal(evBlock.dataset.eventId);return;}
      openEventModal(null,cell.dataset.date);
    });
  });
}

// ══════════════════════════════════════════════════════════════════════
// MODAL ÉVÈNEMENT
// ══════════════════════════════════════════════════════════════════════
function openEventModal(eventId,defaultDate){
  _editingEventId=eventId;
  const ev=eventId?_events[eventId]:null;
  $('eventModalTitle').textContent=eventId?'Modifier l\'évènement':'Nouvel évènement';
  $('evTitle').value=ev?ev.title:'';
  $('evDateStart').value=ev?ev.dateStart:defaultDate;
  $('evDateEnd').value=ev?(ev.dateEnd||ev.dateStart):defaultDate;
  const selectedCats=new Set(ev?(ev.catIds||[]):[]);
  $('evCatList').innerHTML=Object.entries(_categories).map(([id,c])=>`
    <label class="cat-check-row">
      <input type="checkbox" value="${id}" ${selectedCats.has(id)?'checked':''}>
      <span class="cat-swatch" style="background:${c.color}"></span>
      <span class="cname">${esc(c.name)}</span>
    </label>`).join('');
  $('evDeleteBtn').style.display=eventId?'block':'none';
  $('eventModal').classList.add('active');
}
function closeEventModal(){$('eventModal').classList.remove('active');_editingEventId=null;}
$('eventModalClose').onclick=closeEventModal;
$('eventModal').addEventListener('click',e=>{if(e.target.id==='eventModal')closeEventModal();});

async function logHistory(action,eventDate,eventDateEnd,concernedName){
  const id=Date.now()+'_'+Math.random().toString(36).slice(2,8);
  const entry={ts:Date.now(),actorName:_myName,actorPid:_sess.pid,action,eventDate,eventDateEnd:eventDateEnd||eventDate,concernedName};
  await fbSet(`history/${id}`,entry);
  _history[id]=entry;
}
function concernedNameFor(catIds,title){
  const names=(catIds||[]).map(cid=>_categories[cid]).filter(c=>c&&c.person).map(c=>c.name);
  return names.length?names.join(' et '):`« ${title} »`;
}

$('evSaveBtn').onclick=async()=>{
  const title=($('evTitle').value||'').trim();
  const dateStart=$('evDateStart').value;
  let dateEnd=$('evDateEnd').value||dateStart;
  if(!title){toast('⚠️ Entre un titre');return;}
  if(!dateStart){toast('⚠️ Choisis une date');return;}
  if(dateEnd<dateStart)dateEnd=dateStart;
  const catIds=[...$('evCatList').querySelectorAll('input:checked')].map(i=>i.value);

  $('evSaveBtn').disabled=true;
  const isNew=!_editingEventId;
  const id=_editingEventId||(Date.now()+'_'+Math.random().toString(36).slice(2,8));
  const payload={title,dateStart,dateEnd,catIds,
    createdByPid:isNew?_sess.pid:(_events[id]?.createdByPid||_sess.pid),
    createdByName:isNew?_myName:(_events[id]?.createdByName||_myName),
    updatedByName:_myName,updatedAt:Date.now()};
  if(isNew)payload.createdAt=Date.now();
  await fbSet(`events/${id}`,payload);
  _events[id]=payload;
  await logHistory(isNew?'ajouté':'modifié',dateStart,dateEnd,concernedNameFor(catIds,title));
  toast(isNew?'✅ Évènement ajouté':'✅ Évènement modifié');
  $('evSaveBtn').disabled=false;
  closeEventModal();
  render();
};

$('evDeleteBtn').onclick=async()=>{
  if(!_editingEventId)return;
  const ev=_events[_editingEventId];
  if(!confirm(`Supprimer "${ev.title}" ?`))return;
  await fbDel(`events/${_editingEventId}`);
  delete _events[_editingEventId];
  await logHistory('supprimé',ev.dateStart,ev.dateEnd,concernedNameFor(ev.catIds,ev.title));
  toast('✅ Évènement supprimé');
  closeEventModal();
  render();
};

// ══════════════════════════════════════════════════════════════════════
// MODAL HISTORIQUE
// ══════════════════════════════════════════════════════════════════════
async function openHistModal(){
  $('histModal').classList.add('active');
  $('histList').innerHTML='<div class="hist-empty">Chargement…</div>';
  _history=await fbGet('history')||{};
  const names=new Set(Object.values(_history).map(h=>h.actorName));
  $('histFilterName').innerHTML='<option value="">Tous</option>'+[...names].sort().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  renderHistList();
}
function closeHistModal(){$('histModal').classList.remove('active');}
$('histModalClose').onclick=closeHistModal;
$('histModal').addEventListener('click',e=>{if(e.target.id==='histModal')closeHistModal();});
$('histFilterDate').addEventListener('input',renderHistList);
$('histFilterName').addEventListener('change',renderHistList);
$('histFilterClear').addEventListener('click',()=>{$('histFilterDate').value='';$('histFilterName').value='';renderHistList();});

function renderHistList(){
  const fDate=$('histFilterDate').value;
  const fName=$('histFilterName').value;
  let entries=Object.values(_history);
  if(fDate)entries=entries.filter(h=>fDate>=h.eventDate&&fDate<=(h.eventDateEnd||h.eventDate));
  if(fName)entries=entries.filter(h=>h.actorName===fName);
  entries.sort((a,b)=>b.ts-a.ts);
  if(!entries.length){$('histList').innerHTML='<div class="hist-empty">Aucune modification trouvée.</div>';return;}
  $('histList').innerHTML=entries.map(h=>{
    const dateLabel=h.eventDateEnd&&h.eventDateEnd!==h.eventDate?`du ${fmtDateLong(h.eventDate)} au ${fmtDateLong(h.eventDateEnd)}`:fmtDateLong(h.eventDate);
    return `<div class="hist-entry">
      <span class="hist-ts">${fmtDateTime(h.ts)}</span>
      <b>${esc(h.actorName)}</b> a modifié le planning pour la date du ${dateLabel}, il/elle a <b>${h.action}</b> ${esc(h.concernedName)}
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════════════
// MODAL GESTION DES CATÉGORIES (admin uniquement)
// ══════════════════════════════════════════════════════════════════════
function openCatModal(){
  $('catModal').classList.add('active');
  renderCatManageList();
}
function closeCatModal(){$('catModal').classList.remove('active');}
$('catModalClose').onclick=closeCatModal;
$('catModal').addEventListener('click',e=>{if(e.target.id==='catModal')closeCatModal();});

function renderCatManageList(){
  $('catManageList').innerHTML=Object.entries(_categories).map(([id,c])=>`
    <div class="cat-manage-row">
      <input type="color" value="${c.color}" data-cat-color="${id}">
      <input type="text" value="${esc(c.name)}" data-cat-name="${id}">
      ${c.person?'<span class="pinned-tag">👤 personne</span>':''}
      <button class="btn-icon" data-cat-del="${id}" title="Supprimer" style="width:32px;height:32px;font-size:13px">🗑</button>
    </div>`).join('');

  $('catManageList').querySelectorAll('[data-cat-color]').forEach(inp=>{
    inp.addEventListener('change',async()=>{
      const id=inp.dataset.catColor;
      _categories[id].color=inp.value;
      await fbPatch(`categories/${id}`,{color:inp.value});
      toast('✅ Couleur mise à jour');
    });
  });
  $('catManageList').querySelectorAll('[data-cat-name]').forEach(inp=>{
    inp.addEventListener('change',async()=>{
      const id=inp.dataset.catName;
      const name=(inp.value||'').trim();
      if(!name){toast('⚠️ Le nom ne peut pas être vide');inp.value=_categories[id].name;return;}
      _categories[id].name=name;
      await fbPatch(`categories/${id}`,{name});
      toast('✅ Nom mis à jour');
    });
  });
  $('catManageList').querySelectorAll('[data-cat-del]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.catDel;
      const c=_categories[id];
      if(!confirm(`Supprimer la catégorie "${c.name}" ? Les évènements qui l'utilisent la perdront.`))return;
      delete _categories[id];
      await fbDel(`categories/${id}`);
      toast('✅ Catégorie supprimée');
      renderCatManageList();
    });
  });
}
$('catAddBtn').onclick=async()=>{
  const name=($('catNewName').value||'').trim();
  const color=$('catNewColor').value;
  if(!name){toast('⚠️ Entre un nom');return;}
  const id='c'+Date.now();
  const cat={name,color,person:false};
  _categories[id]=cat;
  await fbSet(`categories/${id}`,cat);
  $('catNewName').value='';
  toast('✅ Catégorie ajoutée');
  renderCatManageList();
};
</script>
